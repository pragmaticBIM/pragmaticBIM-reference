id: pragmaticbim:workflow/des-building-permit
code: DES-PERMIT
sort_order: 65
name:
  de: Baugesuch erstellen
  fr: Établir la demande de permis de construire
  it: Predisporre la domanda di costruzione
  en: Prepare the building permit application
description:
  de: |-
    Das Baugesuch aus dem abgestimmten Planungsstand zusammenstellen, damit Formulare, Nachweise und Bewilligungspläne vollständig und konsistent sind.

    **Ausgangslage**
    - Bewilligungsbehörden verlangen gewerkespezifische Pläne in einer festgelegten Darstellung.
    - Ohne Ableitung aus dem aktuellen Planungsstand weichen Gesuchsunterlagen vom Modell ab.
    - Zum Zeitpunkt des Baugesuchs ist das Architekturmodell oft noch nicht bis auf die Wände ausmodelliert.

    **Ziel & Nutzen**
    - Bewilligungspläne der Architektur aus Räumen, Fenstern, Türen und Geschossvolumen ableiten; zusammen mit schematischen Grundrissen genügt das ohne Wandmodellierung.
    - Bewilligungspläne Heizung, Kälte, Lüftung, Klima, Sanitär und Elektro aus den TGA-Modellen ableiten.
    - Formulare, Berichte, Konzepte, Nachweise und Pläne zu einer prüfbaren Gesuchsgrundlage zusammenführen.

    **Ablauf**
    1. Architekturmodell mit Räumen, Fenstern, Türen und Geschossvolumen bereitstellen – ohne schematische Grundrisse zusätzlich mit Wänden – sowie TGA-Modelle mit aktuellem Planungsstand.
    2. Bewilligungspläne je Gewerk in der von der Behörde geforderten Darstellung ableiten.
    3. Pläne, Formulare, Berichte, Konzepte und Nachweise abstimmen und zum vollständigen Baugenehmigungsdossier zusammenstellen.

    **Lieferergebnis**
    - Vollständiges Baugenehmigungsdossier gemäss Vorgaben der zuständigen Behörde
    - Bewilligungspläne der Architektur und TGA-Fachrichtungen gemäss behördlichen Vorgaben
    - Aktuelle, koordinierte Architektur- und TGA-Modelle als Grundlage der Planabgabe
  fr: |-
    Constituer la demande de permis de construire à partir de l'état de planification coordonné, afin que formulaires, justificatifs et plans de permis soient complets et cohérents.

    **Situation de départ**
    - Les autorités exigent des plans par corps de métier dans une représentation définie.
    - Sans obtention depuis l'état actuel de planification, les pièces de la demande divergent de la maquette.
    - Au moment de la demande de permis, la maquette architecture n'est souvent pas encore modélisée jusqu'aux murs.

    **Objectif et bénéfice**
    - Obtenir les plans de permis architecture à partir des locaux, fenêtres, portes et volumes d'étage ; avec des plans d'étages schématiques, cela suffit sans modélisation des murs.
    - Obtenir les plans de permis chauffage, froid, ventilation, climatisation, sanitaire et électricité depuis les maquettes CVC.
    - Réunir formulaires, rapports, concepts, justificatifs et plans en un dossier contrôlable.

    **Déroulement**
    1. Fournir la maquette architecture avec locaux, fenêtres, portes et volumes d'étage – sans plans d'étages schématiques, en plus avec les murs – ainsi que les maquettes CVC à l'état actuel de planification.
    2. Obtenir les plans de permis par corps de métier dans la représentation exigée par l'autorité.
    3. Coordonner plans, formulaires, rapports, concepts et justificatifs, puis constituer le dossier complet de demande de permis.

    **Livrable**
    - Dossier complet de demande de permis conforme aux exigences de l'autorité compétente
    - Plans de permis de l'architecture et des métiers CVC conformes aux exigences de l'autorité
    - Maquettes architecture et CVC actuelles et coordonnées comme base du dossier de plans
  it: |-
    Comporre la domanda di costruzione dallo stato di progettazione coordinato, affinché formulari, verifiche e piani di autorizzazione siano completi e coerenti.

    **Situazione di partenza**
    - Le autorità richiedono piani per mestiere in una rappresentazione definita.
    - Senza ricavarli dallo stato attuale di progettazione, gli atti della domanda divergono dal modello.
    - Al momento della domanda di costruzione, il modello di architettura spesso non è ancora modellato fino alle pareti.

    **Obiettivo e beneficio**
    - Ricavare i piani di autorizzazione dell'architettura da locali, finestre, porte e volumi di piano; insieme alle planimetrie schematiche ciò basta senza modellazione delle pareti.
    - Ricavare i piani di autorizzazione riscaldamento, raffrescamento, ventilazione, climatizzazione, sanitario ed elettrico dai modelli impianti.
    - Riunire formulari, rapporti, concetti, verifiche e piani in una domanda verificabile.

    **Svolgimento**
    1. Fornire il modello di architettura con locali, finestre, porte e volumi di piano – senza planimetrie schematiche, anche con le pareti – e i modelli impianti allo stato attuale di progettazione.
    2. Ricavare i piani di autorizzazione per mestiere nella rappresentazione richiesta dall'autorità.
    3. Coordinare piani, formulari, rapporti, concetti e verifiche e comporre il dossier completo della domanda di costruzione.

    **Risultato della fornitura**
    - Dossier completo della domanda di costruzione conforme alle prescrizioni dell'autorità competente
    - Piani di autorizzazione dell'architettura e degli impianti conformi alle prescrizioni dell'autorità
    - Modelli di architettura e impianti aggiornati e coordinati come base della consegna
  en: |-
    Compile the building permit application from the coordinated design state so that forms, evidence, and permit drawings are complete and consistent.

    **Starting point**
    - Authorities require trade-specific plans in a defined representation.
    - Without derivation from the current design state, application documents diverge from the model.
    - When the application is due, the architecture model is often not yet modelled down to the walls.

    **Goal & benefit**
    - Derive architecture permit plans from spaces, windows, doors, and storey volumes; together with schematic floor plans this is enough without wall modelling.
    - Derive permit plans for heating, cooling, ventilation, air conditioning, plumbing, and electrical from the MEP models.
    - Assemble forms, reports, concepts, evidence, and plans into one verifiable application.

    **Process**
    1. Provide the architecture model with spaces, windows, doors, and storey volumes – without schematic floor plans, also with walls – and the MEP models with the current design state.
    2. Derive permit plans per trade in the representation required by the authority.
    3. Coordinate plans, forms, reports, concepts, and evidence and assemble the complete building permit dossier.

    **Deliverable**
    - Complete building permit dossier meeting the requirements of the competent authority
    - Permit plans for architecture and MEP disciplines meeting authority requirements
    - Current, coordinated architecture and MEP models as the basis for submission
