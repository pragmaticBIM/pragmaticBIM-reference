comment: >-
  One use case with an umbrella building-permit dossier and seven permit-plan
  documents (BGA plus HKLKSE). No new IFC attributes. Architecture minimum:
  interior spaces, windows, doors, and gross storey volume (spaces-gross-volume);
  sufficient in combination with des-layout-planning (schematic floor plans, GRS).
  Without schematic floor plans, walls are needed as well; they are not linked
  as required attributes because they are only needed in that variant.
