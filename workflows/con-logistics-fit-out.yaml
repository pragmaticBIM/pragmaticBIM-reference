comment: >-
  Construction-phase (typically SIA 51–53). Lean fit-out checklist per room.
  QR encodes planning Name + LongName. The room labels are shared with
  CON-DEFECT-MGMT; this workflow uses them for fit-out status and releases,
  not for defects. Do not use SignageRoomNumber for this use case – that
  belongs to opr-signage-room-number.
