id: pragmaticbim:workflow/con-logistics-fit-out
code: CON-ROOM-LABEL
sort_order: 21
name:
  de: Ausbau raumweise mit Checkliste steuern
  fr: Piloter l'aménagement local par local avec une liste de contrôle
  it: Gestire la finitura locale per locale con una lista di controllo
  en: Manage fit-out room by room with a checklist
description:
  de: |-
    Ausbauschritte je Raum in einer gemeinsamen Checkliste führen, damit die Gewerke im Takt arbeiten und der Stand jedes Raums vor Ort sichtbar ist.

    **Ausgangslage**
    - Gewerke behindern sich im Ausbau, weil Vorleistungen fehlen oder unklar ist, welcher Raum freigegeben ist.
    - Terminpläne nach Geschoss zeigen den Stand einzelner Räume nicht; Nacharbeiten fallen erst bei der Abnahme auf.

    **Ziel & Nutzen**
    - Raumweise Checkliste mit Ausbauschritten, Reihenfolge und Freigabe je Gewerk aus der Raumliste des Modells ableiten.
    - Der Raum-QR-Code öffnet die Checkliste des Raums; Fertigmeldungen und Behinderungen sind sofort dem richtigen Raum zugeordnet.

    **Ablauf**
    1. Innenräume mit stabiler Planungsraumnummer (Name) und Raumnutzung (LongName) im Modell führen und die Raumliste ableiten.
    2. Ausbauschritte, Reihenfolge und Freigabekriterien je Raumtyp mit den Gewerken abstimmen und je Raum eine Checkliste anlegen.
    3. Raum-QR-Etiketten anbringen und Fertigmeldungen, Freigaben und Behinderungen vor Ort nachführen.

    **Lieferergebnis**
    - Abgestimmte raumweise Ausbau-Checkliste mit Schritten, Reihenfolge und Freigabekriterien.
    - QR-Etiketten je Raum mit modellkonformer Kennzeichnung und Link zur Checkliste.
  fr: |-
    Tenir les étapes d'aménagement de chaque local dans une liste de contrôle commune, afin que les corps de métier travaillent en cadence et que l'état de chaque local soit visible sur place.

    **Situation de départ**
    - Les corps de métier se gênent pendant l'aménagement, car des travaux préalables manquent ou l'on ignore quel local est libéré.
    - Les plannings par étage ne montrent pas l'état de chaque local ; les reprises n'apparaissent qu'à la réception.

    **Objectif et bénéfice**
    - Déduire de la liste des locaux de la maquette une liste de contrôle par local avec étapes d'aménagement, ordre et libération par corps de métier.
    - Le code QR du local ouvre sa liste de contrôle ; avis d'achèvement et empêchements sont aussitôt affectés au bon local.

    **Déroulement**
    1. Saisir dans la maquette les locaux intérieurs avec numéro de local stable (Name) et usage du local (LongName), puis extraire la liste des locaux.
    2. Convenir avec les corps de métier des étapes d'aménagement, de l'ordre et des critères de libération par type de local, puis créer une liste de contrôle par local.
    3. Poser les étiquettes QR et tenir à jour sur place les avis d'achèvement, les libérations et les empêchements.

    **Livrable**
    - Liste de contrôle d'aménagement par local, coordonnée, avec étapes, ordre et critères de libération.
    - Étiquettes QR par local avec identification conforme à la maquette et lien vers la liste de contrôle.
  it: |-
    Gestire le fasi di finitura di ogni locale in una lista di controllo comune, affinché le imprese lavorino in cadenza e lo stato di ogni locale sia visibile in cantiere.

    **Situazione di partenza**
    - Le imprese si ostacolano durante la finitura, perché mancano lavori preliminari o non è chiaro quale locale sia liberato.
    - I programmi lavori per piano non mostrano lo stato dei singoli locali; i rifacimenti emergono solo al collaudo.

    **Obiettivo e beneficio**
    - Ricavare dall'elenco locali del modello una lista di controllo per locale con fasi di finitura, sequenza e liberazione per impresa.
    - Il codice QR del locale apre la sua lista di controllo; avvisi di completamento e impedimenti sono subito assegnati al locale giusto.

    **Svolgimento**
    1. Gestire nel modello i locali interni con numero di locale stabile (Name) e uso del locale (LongName) e ricavare l'elenco locali.
    2. Concordare con le imprese fasi di finitura, sequenza e criteri di liberazione per tipo di locale e creare una lista di controllo per ogni locale.
    3. Affiggere le etichette QR e aggiornare in cantiere avvisi di completamento, liberazioni e impedimenti.

    **Risultato della fornitura**
    - Lista di controllo della finitura per locale, concordata, con fasi, sequenza e criteri di liberazione.
    - Etichette QR per ogni locale con identificazione conforme al modello e link alla lista di controllo.
  en: |-
    Keep the fit-out steps for each room in a shared checklist so that trades work to a takt and the status of every room is visible on site.

    **Starting point**
    - Trades get in each other's way during fit-out because preceding work is missing or it is unclear which room has been released.
    - Programmes by storey do not show the status of individual rooms; rework only surfaces at handover.

    **Goal & benefit**
    - Derive a room-by-room checklist with fit-out steps, sequence, and release per trade from the room list of the model.
    - The room QR code opens the room's checklist; completion notices and obstructions are assigned to the right room at once.

    **Process**
    1. Maintain interior spaces in the model with stable planning room number (Name) and room use (LongName) and extract the room list.
    2. Agree fit-out steps, sequence, and release criteria per room type with the trades and set up a checklist for each room.
    3. Affix room QR labels and update completion notices, releases, and obstructions on site.

    **Deliverable**
    - Coordinated room-by-room fit-out checklist with steps, sequence, and release criteria.
    - QR labels for each room with identification matching the model and a link to the checklist.
