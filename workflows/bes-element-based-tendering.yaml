id: pragmaticbim:workflow/bes-element-based-tendering
code: BES-ELEMENT-TENDER
sort_order: 14
name:
  de: Ausschreibung aus Bauteiltypen und Mengen erstellen
  fr: Établir l'appel d'offres à partir des types d'éléments et des quantités
  it: Elaborare la gara da tipi di componente e quantità
  en: Prepare the tender from component types and quantities
description:
  de: |-
    Die Bauherrschaft bestellt beim Planungsteam eine nach Gewerken gegliederte Ausschreibung, deren Positionen auf Bauteiltypen und Modellmengen zurückführbar sind, damit sie Angebote mit der Kostenberechnung vergleichen und die Nachkalkulation ohne erneute Mengenermittlung durchführen kann.

    **Ausgangslage**
    - Kostenberechnungen sind nach Elementen gegliedert, Leistungsverzeichnisse nach NPK, BKP oder Unternehmerlosen; ohne dokumentierte Zuordnung lassen sich Angebote nicht mit dem Kostenvoranschlag vergleichen.
    - Fasst das Leistungsverzeichnis Leistungen verschiedener Bauteile zusammen, gehen Typ- und Mengenbezüge verloren; Abweichungen und Nachträge sind dann schwer zu begründen.

    **Ziel & Nutzen**
    - Angebote positionsweise mit der Kostenberechnung vergleichen und Kostenabweichungen früh erkennen.
    - Unternehmen eine vollständige, kalkulierbare Grundlage geben und damit Risikozuschläge und Nachträge reduzieren.
    - Dieselbe Zuordnung für Vergabe, Nachkalkulation und Kostenkennwerte künftiger Projekte weiterverwenden.

    **Ablauf**
    1. Vergabepakete, Gliederung des Leistungsverzeichnisses und die geforderte Zuordnung zu Bauteiltypen und Modellmengen festlegen und mit dem Ausschreibungsauftrag bestellen.
    2. Leistungsverzeichnis, Ausschreibungspläne und Zuordnung einfordern und stichprobenweise prüfen, ob Positionen und Mengen auf Bauteiltypen im Modell zurückführbar sind und mit der Kostenberechnung übereinstimmen.
    3. Ausschreibung freigeben und die Zuordnung für Angebotsvergleich, Vergabe und Nachkalkulation weiterverwenden.

    **Lieferergebnis**
    - Nach Gewerken gegliedertes Leistungsverzeichnis mit nachvollziehbaren Modellmengen
    - Dokumentierte Zuordnung zwischen Bauteiltypen, LV-Positionen und Vergabepaketen
  fr: |-
    Le maître d'ouvrage commande à l'équipe de planification un appel d'offres structuré par corps de métier dont les articles renvoient aux types d'éléments et aux quantités de la maquette, afin de comparer les offres avec le calcul des coûts et d'effectuer l'après-calcul sans nouveau métré.

    **Situation de départ**
    - Les calculs de coûts sont structurés par éléments, les descriptifs selon le CAN, le CFC ou les lots d'entrepreneur ; sans affectation documentée, les offres ne peuvent pas être comparées au devis estimatif.
    - Lorsque le descriptif regroupe les prestations de plusieurs éléments, les références aux types et aux quantités se perdent ; les écarts et les avenants deviennent alors difficiles à justifier.

    **Objectif et bénéfice**
    - Comparer les offres article par article avec le calcul des coûts et détecter tôt les écarts.
    - Fournir aux entreprises une base complète et calculable afin de réduire les suppléments de risque et les avenants.
    - Réutiliser la même affectation pour l'adjudication, l'après-calcul et les valeurs de référence de projets futurs.

    **Déroulement**
    1. Définir les lots d'adjudication, la structure du descriptif et l'affectation requise aux types d'éléments et aux quantités de la maquette, puis les commander avec le mandat d'appel d'offres.
    2. Exiger le descriptif, les plans d'appel d'offres et l'affectation, puis vérifier par sondage que les articles et les quantités renvoient aux types d'éléments de la maquette et concordent avec le calcul des coûts.
    3. Valider l'appel d'offres et réutiliser l'affectation pour la comparaison des offres, l'adjudication et l'après-calcul.

    **Livrable**
    - Descriptif structuré par corps de métier avec quantités traçables issues de la maquette
    - Affectation documentée entre types d'éléments, articles du descriptif et lots d'adjudication
  it: |-
    La committenza ordina al gruppo di progettazione una gara strutturata per categorie di lavoro, le cui posizioni sono riconducibili ai tipi di componente e alle quantità del modello, per confrontare le offerte con il calcolo dei costi ed eseguire il consuntivo senza un nuovo computo.

    **Situazione di partenza**
    - I calcoli dei costi sono strutturati per componenti, i capitolati secondo CPN, CCC o lotti d'impresa; senza un'assegnazione documentata le offerte non possono essere confrontate con il preventivo.
    - Quando il capitolato raggruppa le prestazioni di diversi componenti, si perdono i riferimenti a tipi e quantità; scostamenti e varianti diventano quindi difficili da giustificare.

    **Obiettivo e beneficio**
    - Confrontare le offerte posizione per posizione con il calcolo dei costi e individuare tempestivamente gli scostamenti.
    - Fornire alle imprese una base completa e calcolabile, riducendo supplementi per rischi e varianti.
    - Riutilizzare la stessa assegnazione per aggiudicazione, consuntivo e valori di riferimento di progetti futuri.

    **Svolgimento**
    1. Definire i lotti di aggiudicazione, la struttura del capitolato e l'assegnazione richiesta ai tipi di componente e alle quantità del modello e ordinarli con il mandato di gara.
    2. Richiedere capitolato, piani di gara e assegnazione e verificare a campione che posizioni e quantità siano riconducibili ai tipi di componente del modello e concordino con il calcolo dei costi.
    3. Approvare la gara e riutilizzare l'assegnazione per il confronto delle offerte, l'aggiudicazione e il consuntivo.

    **Risultato della fornitura**
    - Capitolato strutturato per categorie di lavoro con quantità tracciabili dal modello
    - Assegnazione documentata tra tipi di componente, posizioni del capitolato e lotti di aggiudicazione
  en: |-
    The client orders from the design team a trade-structured tender whose items trace back to component types and model quantities, so that offers can be compared with the cost calculation and post-calculation needs no new quantity take-off.

    **Starting point**
    - Cost calculations are structured by element, specifications by NPK, BKP, or contractor package; without a documented mapping, offers cannot be compared with the cost estimate.
    - When the specification combines work from different components, type and quantity references are lost, and deviations and variations become hard to justify.

    **Goal & benefit**
    - Compare offers item by item with the cost calculation and spot cost deviations early.
    - Give contractors a complete, priceable basis and so reduce risk premiums and variations.
    - Reuse the same mapping for award, post-calculation, and cost benchmarks for future projects.

    **Process**
    1. Define procurement packages, the specification structure, and the required mapping to component types and model quantities, and order them with the tender commission.
    2. Request the specification, tender drawings, and mapping, and spot-check that items and quantities trace back to component types in the model and match the cost calculation.
    3. Approve the tender and reuse the mapping for offer comparison, award, and post-calculation.

    **Deliverable**
    - Trade-structured specification with traceable model quantities
    - Documented mapping between component types, specification items, and procurement packages
