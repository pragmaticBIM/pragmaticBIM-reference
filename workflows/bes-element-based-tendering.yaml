comment: >-
  Consumes ProductClass, CalculatedType, ReferenceQuantity, performance
  attributes, and AwardInterface from DES-ELEMENT-COST-LATE and the discipline
  models. The specification remains structured by trade/NPK/BKP; ProductClass
  and CalculatedType are traceable references and do not replace that
  breakdown. Mapping between component types and specification items may be
  many-to-many. The model supplements rather than replaces the written tender
  documents. Downstream: trade tender bases and BES-ELEMENT-COST-POSTCALC.
