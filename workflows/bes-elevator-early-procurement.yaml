id: pragmaticbim:workflow/bes-elevator-early-procurement
code: BES-ELEVATOR-EARLY
sort_order: 19
name:
  de: Aufzugsanlage vorgezogen ausschreiben
  fr: Mettre l'installation d'ascenseur en appel d'offres anticipé
  it: Mettere in gara anticipata l'impianto ascensore
  en: Tender the elevator installation early
description:
  de: |-
    Die Bauherrschaft schreibt die Aufzugsanlage nach erteilter Baugenehmigung vorgezogen aus und erhält so verbindliche Schacht- und Anlagenparameter, bevor Grundriss, Tragwerk und Fundamente weiter geplant werden, damit späte Umplanungen vermieden werden.

    **Ausgangslage**
    - Aufzugsanlagen werden häufig erst spät ausgeschrieben. Abweichende Schachtabmessungen, Schachtgruben und Schachtköpfe führen dann zu Fehlern und Umplanungen im Grundriss sowie bei Tragwerk und Fundamenten.

    **Ziel & Nutzen**
    - Anlagenspezifische Abmessungen und Planungsparameter rechtzeitig erhalten und späte Umplanungen von Schacht, angrenzenden Räumen und Fundamenten vermeiden.
    - Mit Rücktrittsrecht und Vergütung des Planungsaufwands das Risiko einer frühen Vergabe begrenzen, falls das Projekt nicht realisiert wird.

    **Ablauf**
    1. Aufzugsanlage nach erteilter Baugenehmigung mit einer vertraglichen Klausel zu Rücktrittsrecht und Vergütung des Planungsaufwands ausschreiben und vergeben.
    2. Schachtabmessungen, Schachtgrube, Schachtkopf, Öffnungen, Lasten und weitere Planungsparameter beim Aufzugsunternehmen einfordern und durch Architektur und Tragwerksplanung auf Übereinstimmung mit der Planung prüfen lassen.
    3. Abgestimmte Parameter freigeben und ihre Übernahme in Architektur- und Tragwerksmodell einfordern.

    **Lieferergebnis**
    - Koordinierte Architektur- und Tragwerksmodelle mit korrekter Schachtgeometrie und berücksichtigten Planungsparametern der vorgesehenen Aufzugsanlage.
  fr: |-
    Le maître d'ouvrage met l'installation d'ascenseur en appel d'offres anticipé dès l'obtention du permis de construire et obtient ainsi des paramètres contraignants pour la gaine et l'installation avant la poursuite des études des plans d'étage, de la structure et des fondations, afin d'éviter des reprises tardives.

    **Situation de départ**
    - Les installations d'ascenseur font souvent l'objet d'un appel d'offres tardif. Des dimensions divergentes de la gaine, de la fosse et de la tête de gaine entraînent alors des erreurs et des reprises dans les plans d'étage, la structure et les fondations.

    **Objectif et bénéfice**
    - Obtenir à temps les dimensions et paramètres de planification propres à l'installation et éviter des reprises tardives de la gaine, des locaux adjacents et des fondations.
    - Limiter le risque d'une adjudication anticipée par un droit de résiliation et la rémunération des prestations d'étude, au cas où le projet ne serait pas réalisé.

    **Déroulement**
    1. Mettre en appel d'offres et adjuger l'installation d'ascenseur après l'obtention du permis de construire, avec une clause contractuelle réglant le droit de résiliation et la rémunération des prestations d'étude.
    2. Exiger de l'entreprise d'ascenseurs les dimensions de la gaine, de la fosse et de la tête de gaine, les ouvertures, les charges et les autres paramètres de planification, puis les faire vérifier par l'architecture et l'ingénierie structure quant à leur concordance avec le projet.
    3. Valider les paramètres convenus et exiger leur intégration dans les maquettes d'architecture et de structure.

    **Livrable**
    - Maquettes d'architecture et de structure coordonnées avec une géométrie correcte de la gaine et les paramètres de planification de l'installation d'ascenseur pressentie.
  it: |-
    La committenza mette in gara anticipata l'impianto ascensore dopo il rilascio della licenza edilizia e ottiene così parametri vincolanti per vano e impianto prima di proseguire la progettazione di piante, struttura e fondazioni, evitando riprogettazioni tardive.

    **Situazione di partenza**
    - Gli impianti ascensore vengono spesso messi in gara troppo tardi. Dimensioni divergenti del vano, della fossa e della testata causano errori e riprogettazioni delle piante, della struttura e delle fondazioni.

    **Obiettivo e beneficio**
    - Ottenere tempestivamente le dimensioni e i parametri di progettazione specifici dell'impianto ed evitare riprogettazioni tardive del vano, degli spazi adiacenti e delle fondazioni.
    - Limitare il rischio di un'aggiudicazione anticipata con un diritto di recesso e la remunerazione delle prestazioni di progettazione, nel caso in cui il progetto non venga realizzato.

    **Svolgimento**
    1. Mettere in gara e aggiudicare l'impianto ascensore dopo il rilascio della licenza edilizia, prevedendo una clausola contrattuale sul diritto di recesso e sulla remunerazione delle prestazioni di progettazione.
    2. Richiedere all'impresa di ascensori le dimensioni del vano, della fossa e della testata, le aperture, i carichi e gli altri parametri di progettazione e farne verificare la concordanza con il progetto dalla progettazione architettonica e strutturale.
    3. Approvare i parametri concordati ed esigerne l'integrazione nei modelli di architettura e della struttura.

    **Risultato della fornitura**
    - Modelli di architettura e della struttura coordinati con la geometria corretta del vano e i parametri di progettazione dell'impianto ascensore previsto.
  en: |-
    The client tenders the elevator installation early, once the building permit has been granted, and so obtains binding shaft and installation parameters before floor plans, structure, and foundations are developed further, avoiding late redesign.

    **Starting point**
    - Elevator installations are often tendered too late. Different shaft, pit, and headroom dimensions then cause errors and redesign of floor plans, the structure, and foundations.

    **Goal & benefit**
    - Obtain installation-specific dimensions and design parameters in good time and avoid late redesign of the shaft, adjacent spaces, and foundations.
    - Limit the risk of an early award through a right of withdrawal and remuneration for design work in case the project does not go ahead.

    **Process**
    1. Tender and award the elevator installation once the building permit has been granted, including a contractual clause covering the right of withdrawal and remuneration for design work.
    2. Request shaft, pit, headroom, opening, load, and other design parameters from the elevator contractor and have the architecture and structural design teams check them against the design.
    3. Approve the agreed parameters and require their incorporation into the architecture and structural models.

    **Deliverable**
    - Coordinated architecture and structural models with correct shaft geometry and the design parameters of the intended elevator installation incorporated.
