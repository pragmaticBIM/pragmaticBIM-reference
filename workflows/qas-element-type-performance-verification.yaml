comment: Activated by PG-33 Erdbeben, PG-34 Energiestandard, PG-35 Treibhausgasziel and PG-38 Schallschutz. Goal levels preset target attributes on the building, walls, slabs and spaces via performance_targets (ePset_BuildingRequirement, ePset_WallRequirement, ePset_SlabRequirement, ePset_SpaceRequirement). The seismic structure class is a building property and sits on ePset_BuildingRequirement only. Each target attribute names its contract key in performance_property_key (resistance_rating, u_value, airborne_sound_rating_db, impact_sound_rating_db, seismic_structure_class, gwp_embodied) and the attribute with the delivered value (verified_by). Targets become PerformanceRequirement records; outcome is MatchChange met / unmet / unknown per element type. DES-WALL-REQUIREMENTS builds the wall requirement profiles; QAS-ACOUSTIC checks placed components for sound and thermal only. Airtightness n50 is a building-level key and has no element attribute yet.
