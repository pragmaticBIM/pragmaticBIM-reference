comment: Produces the fire protection requirements model from the approved BSK in place of a BSP. The manual process assigns compartments to rooms and derives wall fire resistance from the two adjacent rooms. With abstractBIM, walls are generated from rooms; each wall has a 1:2 space relationship used to enrich requirements by rule. The BSK remains the authoritative specialist document. QAS-FIRE compares the architecture model against this requirements model.
