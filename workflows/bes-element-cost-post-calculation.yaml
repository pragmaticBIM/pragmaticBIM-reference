id: pragmaticbim:workflow/bes-element-cost-post-calculation
code: BES-ELEMENT-COST-POSTCALC
sort_order: 21
name:
  de: Bauteilkosten nachkalkulieren und Einheitspreise zurückführen
  fr: Établir l'après-calcul des coûts d'éléments et réintégrer les prix unitaires
  it: Eseguire il consuntivo dei costi dei componenti e riprendere i prezzi unitari
  en: Post-calculate component costs and feed unit rates back
description:
  de: |-
    Vergabe- und Ist-Kosten aus der Gewerkegliederung auf Bauteiltypen zurückführen und als belastbare Einheitspreise für Folgeprojekte sichern.

    **Ausgangslage**
    - Leistungsverzeichnisse und Unternehmerabrechnungen fassen Leistungen verschiedener Bauteile zusammen; daraus lassen sich bauteilspezifische Kennwerte nicht direkt ablesen.
    - Ohne dokumentierte Zuordnung zu Produktklasse, Bauteiltyp und Referenzmenge bleiben Abweichungen zwischen Kostenberechnung, Angebot und Ausführung ungeklärt.

    **Ziel & Nutzen**
    - Offer-, Vergabe- und Ist-Kosten nachvollziehbar auf Bauteiltypen und Referenzmengen verteilen.
    - Planer-Einheitspreise mit den tatsächlich angebotenen und ausgeführten Kosten vergleichen.
    - Freigegebene Einheitspreise in der Kostendatenbank sichern und für frühe sowie detaillierte Kostenberechnungen wiederverwenden.

    **Ablauf**
    1. Freigegebene Zuordnungen zwischen LV-Positionen, Vergabepaketen, Produktklassen, Bauteiltypen und Referenzmengen zusammen mit Offer-, Vergabe- oder Ist-Kosten bereitstellen.
    2. Kosten anhand der dokumentierten Mengen- und Leistungsanteile auf die Bauteiltypen verteilen, Planer-, Offer- und Ist-Einheitspreise vergleichen und Abweichungen klären.
    3. Geprüfte Einheitspreise mit Kostenstand, enthaltenem Leistungsumfang und Herkunft freigeben und nach Produktklasse und Typ in die Kostendatenbank übernehmen.

    **Lieferergebnis**
    - Nachkalkulation mit rückverfolgbarer Verteilung der LV- und Ist-Kosten auf Bauteiltypen
    - Aktualisierte Kostendatenbank mit freigegebenen Einheitspreisen und dokumentiertem Leistungsumfang
  fr: |-
    Ramener les coûts d'adjudication et réels de la structure par corps de métier aux types d'éléments et les conserver comme prix unitaires fiables pour les projets suivants.

    **Situation de départ**
    - Les descriptifs et décomptes d'entreprises regroupent les prestations de plusieurs éléments ; les indicateurs propres aux éléments ne peuvent pas en être lus directement.
    - Sans affectation documentée à la classe de produit, au type d'élément et à la quantité de référence, les écarts entre calcul des coûts, offre et exécution restent inexpliqués.

    **Objectif et bénéfice**
    - Répartir de manière traçable les coûts d'offre, d'adjudication et réels sur les types d'éléments et les quantités de référence.
    - Comparer les prix unitaires du planificateur aux coûts effectivement offerts et exécutés.
    - Conserver les prix unitaires approuvés dans la base de données des coûts et les réutiliser pour les calculs initiaux et détaillés.

    **Déroulement**
    1. Fournir les affectations approuvées entre articles du descriptif, lots d'adjudication, classes de produits, types d'éléments et quantités de référence avec les coûts d'offre, d'adjudication ou réels.
    2. Répartir les coûts sur les types d'éléments selon les parts documentées de quantités et de prestations, comparer les prix unitaires du planificateur, de l'offre et réels, puis clarifier les écarts.
    3. Approuver les prix unitaires contrôlés avec état des prix, prestations comprises et provenance, puis les reprendre dans la base de données par classe de produit et type.

    **Livrable**
    - Après-calcul avec répartition traçable des coûts du descriptif et des coûts réels sur les types d'éléments
    - Base de données des coûts actualisée avec prix unitaires approuvés et prestations comprises documentées
  it: |-
    Ricondurre i costi di aggiudicazione ed effettivi dalla struttura per categorie di lavoro ai tipi di componente e conservarli come prezzi unitari affidabili per i progetti successivi.

    **Situazione di partenza**
    - Capitolati e conteggi delle imprese raggruppano prestazioni di diversi componenti; non è quindi possibile ricavarne direttamente indici specifici per componente.
    - Senza un'assegnazione documentata a classe di prodotto, tipo di componente e quantità di riferimento, gli scostamenti tra calcolo dei costi, offerta ed esecuzione restano inspiegati.

    **Obiettivo e beneficio**
    - Ripartire in modo tracciabile i costi di offerta, aggiudicazione ed effettivi sui tipi di componente e sulle quantità di riferimento.
    - Confrontare i prezzi unitari del progettista con i costi effettivamente offerti ed eseguiti.
    - Conservare i prezzi unitari approvati nella banca dati dei costi e riutilizzarli per i calcoli iniziali e dettagliati.

    **Svolgimento**
    1. Fornire le assegnazioni approvate tra posizioni del capitolato, lotti di aggiudicazione, classi di prodotto, tipi di componente e quantità di riferimento con i costi di offerta, aggiudicazione o effettivi.
    2. Ripartire i costi sui tipi di componente secondo le quote documentate di quantità e prestazioni, confrontare i prezzi unitari del progettista, di offerta ed effettivi e chiarire gli scostamenti.
    3. Approvare i prezzi unitari verificati con base prezzi, prestazioni comprese e provenienza e riprenderli nella banca dati per classe di prodotto e tipo.

    **Risultato della fornitura**
    - Consuntivo con ripartizione tracciabile dei costi del capitolato e dei costi effettivi sui tipi di componente
    - Banca dati dei costi aggiornata con prezzi unitari approvati e prestazioni comprese documentate
  en: |-
    Allocate award and actual costs from the trade breakdown back to component types and preserve them as reliable unit rates for future projects.

    **Starting point**
    - Specifications and contractor accounts combine work from different components, so component-specific benchmarks cannot be read from them directly.
    - Without a documented mapping to product class, component type, and reference quantity, variances between cost calculation, bid, and construction remain unexplained.

    **Goal & benefit**
    - Allocate bid, award, and actual costs traceably to component types and reference quantities.
    - Compare designer unit rates with the costs actually bid and constructed.
    - Store approved unit rates in the cost database and reuse them for early and detailed cost calculations.

    **Process**
    1. Provide approved mappings between specification items, procurement packages, product classes, component types, and reference quantities together with bid, award, or actual costs.
    2. Allocate costs to component types using the documented quantity and scope shares, compare designer, bid, and actual unit rates, and resolve variances.
    3. Approve checked unit rates with price basis, included scope, and provenance, then transfer them into the cost database by product class and type.

    **Deliverable**
    - Post-calculation with traceable allocation of specification and actual costs to component types
    - Updated cost database with approved unit rates and documented included scope
