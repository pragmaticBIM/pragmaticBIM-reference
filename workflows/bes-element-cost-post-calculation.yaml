comment: >-
  Upstream mapping is produced by BES-ELEMENT-TENDER. Keys:
  ePset_Cost.ProductClass, ePset_Cost.CalculatedType,
  ePset_Cost.ReferenceQuantity, and AwardInterface. The many-to-many mapping
  between specification items and component types, allocation shares, approved
  rates, price basis, included scope, and provenance live outside IFC in the
  tender/cost database. The project model carries ePset_Cost.UnitPrice.
  Produces office rates consumed by DES-ELEMENT-COST-EARLY,
  DES-ELEMENT-COST-LATE, and QAS-COST-PLAUS.
