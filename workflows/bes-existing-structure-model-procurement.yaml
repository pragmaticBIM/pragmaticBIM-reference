comment: >-
  Drittes Beschaffungspaket für Bestandsgrundlagen. Baut auf Lagebezug,
  Gelände und Gebäude-Punktwolke auf. Nachmodellierung erst nach Klärung der
  Konzeptrichtung und vorzugsweise durch das beauftragte Projektteam.
  Visible geometry is modelled from the georeferenced point cloud; existing
  drawings are checked against it; critical locations are measured locally
  and, where possible, opened up. Existing components carry a ProductClass so
  deconstruction, costs, and LCA share the key used for new construction.
  Attribute pack on Rohbau/Gebäudekörper elements: Status/ElementStatus,
  PredefinedType, LoadBearing (where defined), ProductClass (where defined),
  and the element reference BaseQuantity (or all Qto_ attrs when no
  ReferenceQuantity is defined).
