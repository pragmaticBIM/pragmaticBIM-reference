name:
  de: Bestellung
  fr: Commande
  it: Commessa
  en: Ordering
description:
  de: 'Das Bestellen gehört zu den Kernkompetenzen der Bauherrschaft, aber auch andere bestellen. Im Informationsmanagement wird jede Rolle zur bestellenden Instanz, sobald sie Daten anderer Beteiligter für ihre eigenen Prozesse benötigt. Hilfreicher als das hierarchische Bild einer zentral bestellenden Bauherrschaft ist daher die aus dem Lean Management bekannte Perspektive: Jeder nachgelagerte Prozess ist Kunde des vorgelagerten Prozesses und muss seinen Informationsbedarf klar formulieren – oder damit rechnen, erheblichen manuellen Aufwand in das Aufbereiten der Unterlagen stecken zu müssen.'
  fr: 'Commander fait partie des compétences clés du maître d’ouvrage, mais d’autres commandent aussi. Dans la gestion de l’information, chaque rôle devient une instance de commande dès qu’il a besoin des données d’autres intervenants pour ses propres processus. La perspective issue du Lean Management est donc plus utile que l’image hiérarchique d’un maître d’ouvrage qui commande seul : chaque processus en aval est client du processus en amont et doit formuler clairement ses besoins en information – ou s’attendre à consacrer un effort manuel considérable à la préparation des documents.'
  it: 'Ordinare è una delle competenze chiave della committenza, ma ordinano anche altri. Nella gestione delle informazioni ogni ruolo diventa committente non appena necessita dei dati di altri partecipanti per i propri processi. Più utile dell’immagine gerarchica di una committenza che ordina centralmente è quindi la prospettiva nota dal Lean Management: ogni processo a valle è cliente del processo a monte e deve formulare chiaramente il proprio fabbisogno di informazioni – oppure aspettarsi un notevole lavoro manuale per preparare la documentazione.'
  en: 'Ordering is one of the client’s core competencies, but others place orders too. In information management, every role becomes an ordering party as soon as it needs data from other participants for its own processes. The Lean Management perspective is therefore more helpful than the hierarchical image of a single commissioning client: every downstream process is the customer of the upstream process and must clearly state its information needs – or expect to spend considerable manual effort preparing the documents.'
