comment: >-
  Tender basis only, not a complete window specification. Technical mappings
  are defined on the window element attributes. Window type and opening
  dimensions are kept in the model; specialist information such as fire
  resistance and acoustic rating may instead be kept in a schedule linked by
  the window number (for example a shared spreadsheet). The schedule is grouped
  by calculated component type and dimensions.
