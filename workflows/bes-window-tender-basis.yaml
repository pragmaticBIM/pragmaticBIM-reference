id: pragmaticbim:workflow/bes-window-tender-basis
code: BES-WINDOW-TENDER
sort_order: 16
name:
  de: Grundlage für die Fensterausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des fenêtres
  it: Fornire la base per la gara delle finestre
  en: Provide the basis for the window tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine prüfbare Fensterliste aus dem Modell, damit die Fensterausschreibung vollständige Mengen und Anforderungen enthält und Rückfragen und Nachträge vermieden werden.

    **Ausgangslage**
    - Fenstertypen, Öffnungsmasse, Feuerwiderstand, Schalldämmung und Sonnenschutzart werden für die Ausschreibung oft manuell aus Plänen zusammengestellt.
    - Fehlende oder uneinheitliche Fensterangaben führen zu Rückfragen, falschen Mengen und Nachträgen.

    **Ziel & Nutzen**
    - Vollständige und eindeutige Fensterangaben ausschreiben und damit Risikozuschläge und Nachträge reduzieren.
    - Brand-, Schall- und Sonnenschutzanforderungen je Fenster vor der Vergabe prüfen statt erst bei der Abnahme.
    - Die Fensternummer als gemeinsamen Schlüssel für Ausschreibung, Werkplanung und Abnahme verwenden.

    **Ablauf**
    1. Erforderliche Fensterangaben, den führenden Ort der Daten (Modell oder über die Fensternummer verknüpfte Liste) und den Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Fensterliste einfordern und auf eindeutige Fensternummern, vollständige Angaben und Übereinstimmung mit Ausschreibungsplänen, Brandschutz-, Schallschutz- und Sonnenschutzkonzept prüfen.
    3. Fensterliste freigeben und als Grundlage für Leistungsverzeichnis, Angebotsvergleich und Werkplanung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell und über die Fensternummer verknüpfte Fensterliste mit den erforderlichen Grund- und Fachangaben.
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une liste de fenêtres vérifiable issue de la maquette, afin que l'appel d'offres des fenêtres contienne des quantités et des exigences complètes et que les questions et les avenants soient évités.

    **Situation de départ**
    - Les types de fenêtres, dimensions des ouvertures, résistances au feu, performances acoustiques et types de protection solaire sont souvent relevés manuellement sur les plans pour l'appel d'offres.
    - Des données manquantes ou incohérentes entraînent des questions, des quantités erronées et des avenants.

    **Objectif et bénéfice**
    - Mettre en soumission des données de fenêtres complètes et univoques afin de réduire les suppléments de risque et les avenants.
    - Contrôler les exigences incendie, acoustiques et de protection solaire de chaque fenêtre avant l'adjudication plutôt qu'à la réception.
    - Utiliser le numéro de fenêtre comme clé commune pour l'appel d'offres, les plans d'atelier et la réception.

    **Déroulement**
    1. Définir les données de fenêtres requises, l'emplacement de référence des données (maquette ou liste reliée par le numéro de fenêtre) et le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la liste de fenêtres et vérifier l'unicité des numéros, l'exhaustivité des données et la concordance avec les plans d'appel d'offres et les concepts de protection incendie, d'acoustique et de protection solaire.
    3. Valider la liste de fenêtres et la réutiliser comme base pour le descriptif, la comparaison des offres et les plans d'atelier.

    **Livrable**
    - Maquette d'architecture et liste de fenêtres reliée par le numéro de fenêtre avec les données de base et techniques requises.
  it: |-
    La committenza ordina allo studio di architettura un elenco finestre verificabile ricavato dal modello, affinché la gara delle finestre contenga quantità e requisiti completi ed evitare domande e varianti.

    **Situazione di partenza**
    - I tipi di finestra, le dimensioni delle aperture, la resistenza al fuoco, le prestazioni acustiche e il tipo di protezione solare vengono spesso ricavati manualmente dai piani per la gara.
    - Dati mancanti o incoerenti causano domande, quantità errate e varianti.

    **Obiettivo e beneficio**
    - Mettere a gara dati delle finestre completi e univoci, riducendo supplementi per rischi e varianti.
    - Verificare i requisiti antincendio, acustici e di protezione solare di ogni finestra prima dell'aggiudicazione anziché al collaudo.
    - Utilizzare il numero della finestra come chiave comune per gara, progettazione d'officina e collaudo.

    **Svolgimento**
    1. Definire i dati delle finestre richiesti, la sede di riferimento dei dati (modello o elenco collegato tramite il numero della finestra) e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere l'elenco finestre e verificare l'univocità dei numeri, la completezza dei dati e la concordanza con i piani di gara e i concetti antincendio, acustico e di protezione solare.
    3. Approvare l'elenco finestre e riutilizzarlo come base per capitolato, confronto delle offerte e progettazione d'officina.

    **Risultato della fornitura**
    - Modello di architettura ed elenco finestre collegato tramite il numero della finestra con i dati di base e specialistici necessari.
  en: |-
    The client orders from the architecture team a verifiable window schedule from the model so that the window tender contains complete quantities and requirements and queries and variations are avoided.

    **Starting point**
    - Window types, opening dimensions, fire resistance, acoustic ratings, and sun-protection type are often compiled manually from drawings for tendering.
    - Missing or inconsistent window information leads to queries, incorrect quantities, and variations.

    **Goal & benefit**
    - Tender complete and unambiguous window information and so reduce risk premiums and variations.
    - Check fire, acoustic, and sun-protection requirements for each window before award rather than at handover.
    - Use the window number as the shared key for tendering, shop drawings, and handover.

    **Process**
    1. Define the required window information, where the data is authoritative (model or a schedule linked by the window number), and the submission date, and order them from the architecture team.
    2. Request the window schedule and check for unique window numbers, complete information, and consistency with the tender drawings and the fire protection, acoustic, and sun-protection concepts.
    3. Approve the window schedule and reuse it as the basis for the specification, offer comparison, and shop drawings.

    **Deliverable**
    - Architecture model and window schedule linked by the window number with the required basic and specialist information.
