id: pragmaticbim:workflow/bes-painting-tender-basis
code: BES-PAINTING-TENDER
sort_order: 22
name:
  de: Grundlage für die Malerausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des travaux de peinture
  it: Fornire la base per la gara delle opere da pittore
  en: Provide the basis for the painting tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine raumweise Mengenübersicht der Malerflächen aus dem Modell, damit Ausschreibung und Rechnungsprüfung auf derselben nachvollziehbaren Mengenbasis beruhen.

    **Ausgangslage**
    - Malerflächen werden für Ausschreibung und Rechnungsprüfung häufig zweimal von Hand ausgemessen.
    - Abzüge für Türen und Fenster sowie wechselnde Oberflächenqualitäten führen dabei zu schwer nachvollziehbaren Abweichungen.

    **Ziel & Nutzen**
    - Malerflächen nur einmal ermitteln lassen und Abweichungen zwischen Ausschreibung und Abrechnung nachvollziehbar machen.
    - Die zulässige Mengentoleranz vorab vereinbaren und Abweichungen bei der Abrechnung daran messen.

    **Ablauf**
    1. Geforderte raumweise Angaben zu Wandoberfläche sowie Brutto- und Nettowandfläche, die zulässige Mengentoleranz sowie Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Mengenübersicht einfordern und auf vollständige Oberflächenzuordnung, plausible Öffnungsabzüge und Einhaltung der Toleranz in geometrisch anspruchsvollen Räumen prüfen.
    3. Übersicht freigeben und als gemeinsame Grundlage für Leistungsverzeichnis, Angebotsvergleich und Rechnungsprüfung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell mit raumbezogenen Wandoberflächen sowie prüfbaren Brutto- und Nettowandflächen
    - Mengenübersicht nach Oberflächenart und Raum als gemeinsame Grundlage für Malerausschreibung und Rechnungsprüfung
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une vue d'ensemble des surfaces à peindre par local issue de la maquette, afin que l'appel d'offres et le contrôle des factures reposent sur la même base de quantités traçable.

    **Situation de départ**
    - Les surfaces à peindre sont souvent mesurées deux fois à la main, pour l'appel d'offres puis pour le contrôle des factures.
    - Les déductions des portes et fenêtres ainsi que les changements de qualité de surface entraînent des écarts difficiles à retracer.

    **Objectif et bénéfice**
    - Ne faire établir les surfaces à peindre qu'une seule fois et rendre traçables les écarts entre appel d'offres et décompte.
    - Convenir à l'avance de la tolérance admise sur les quantités et mesurer les écarts au décompte par rapport à celle-ci.

    **Déroulement**
    1. Définir les données requises par local sur la finition murale et les surfaces murales brutes et nettes, la tolérance admise sur les quantités ainsi que le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la vue d'ensemble des quantités et vérifier l'attribution complète des finitions, la plausibilité des déductions d'ouvertures et le respect de la tolérance dans les locaux géométriquement complexes.
    3. Valider la vue d'ensemble et la réutiliser comme base commune pour le descriptif, la comparaison des offres et le contrôle des factures.

    **Livrable**
    - Maquette d'architecture avec finitions murales par local et surfaces murales brutes et nettes vérifiables
    - Vue d'ensemble des quantités par type de finition et local comme base commune pour l'appel d'offres des travaux de peinture et le contrôle des factures
  it: |-
    La committenza ordina allo studio di architettura un quadro delle superfici da pitturare per locale ricavato dal modello, affinché gara e controllo delle fatture si basino sulla stessa base di quantità tracciabile.

    **Situazione di partenza**
    - Le superfici da pitturare vengono spesso misurate due volte a mano, per la gara e per il controllo delle fatture.
    - Le deduzioni per porte e finestre e i cambiamenti di qualità superficiale causano scostamenti difficili da ricostruire.

    **Obiettivo e beneficio**
    - Far determinare le superfici da pitturare una sola volta e rendere tracciabili gli scostamenti tra gara e liquidazione.
    - Concordare in anticipo la tolleranza ammessa sulle quantità e misurare su di essa gli scostamenti in fase di liquidazione.

    **Svolgimento**
    1. Definire i dati richiesti per locale su finitura delle pareti e superfici lorde e nette, la tolleranza ammessa sulle quantità e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere il quadro delle quantità e verificare l'assegnazione completa delle finiture, la plausibilità delle deduzioni per aperture e il rispetto della tolleranza nei locali geometricamente complessi.
    3. Approvare il quadro e riutilizzarlo come base comune per capitolato, confronto delle offerte e controllo delle fatture.

    **Risultato della fornitura**
    - Modello di architettura con finiture delle pareti per locale e superfici lorde e nette verificabili
    - Quadro delle quantità per tipo di finitura e locale come base comune per la gara delle opere da pittore e il controllo delle fatture
  en: |-
    The client orders from the architecture team a room-by-room quantity overview of painting areas from the model, so that tendering and invoice checking rest on the same traceable quantity basis.

    **Starting point**
    - Painting areas are often measured manually twice, first for tendering and again for invoice checking.
    - Deductions for doors and windows and changes in surface quality lead to discrepancies that are difficult to trace.

    **Goal & benefit**
    - Have painting areas determined only once and make deviations between tender and final account traceable.
    - Agree the permitted quantity tolerance in advance and measure deviations at final account against it.

    **Process**
    1. Define the required room-by-room information on wall finish and gross and net wall areas, the permitted quantity tolerance, and the submission date, and order them from the architecture team.
    2. Request the quantity overview and check for complete finish assignment, plausible opening deductions, and compliance with the tolerance in geometrically complex rooms.
    3. Approve the overview and reuse it as the shared basis for the bill of quantities, offer comparison, and invoice checking.

    **Deliverable**
    - Architecture model with wall finishes by space and verifiable gross and net wall areas
    - Quantity overview by finish type and space as the shared basis for the painting tender and invoice checking
