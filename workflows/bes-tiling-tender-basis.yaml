id: pragmaticbim:workflow/bes-tiling-tender-basis
code: BES-TILING-TENDER
sort_order: 21
name:
  de: Grundlage für die Plattenausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des carrelages
  it: Fornire la base per la gara dei rivestimenti in piastrelle
  en: Provide the basis for the tiling tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine raumweise Mengenübersicht der Boden- und Wandplatten aus dem Modell, damit Ausschreibung und Rechnungsprüfung auf derselben nachvollziehbaren Mengenbasis beruhen.

    **Ausgangslage**
    - Boden- und Wandplatten werden für die Ausschreibung oft manuell aus Raumlisten und Plänen zusammengestellt.
    - Doppelte Mengenermittlungen für Ausschreibung und Rechnungsprüfung verursachen Aufwand und führen zu nicht nachvollziehbaren Abweichungen.

    **Ziel & Nutzen**
    - Doppelte Mengenermittlung für Ausschreibung und Rechnungsprüfung vermeiden.
    - Die zulässige Mengentoleranz vorab vereinbaren und Abweichungen bei der Abrechnung daran messen.

    **Ablauf**
    1. Geforderte raumweise Angaben zu Boden- und Wandbelag und Nettoflächen, die zulässige Mengentoleranz sowie Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Mengenübersicht einfordern und auf vollständige Belagszuordnung, plausible Öffnungsabzüge und Einhaltung der Toleranz in geometrisch anspruchsvollen Räumen prüfen.
    3. Übersicht freigeben und als gemeinsame Grundlage für Leistungsverzeichnis, Angebotsvergleich und Rechnungsprüfung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell mit raumbezogenen Boden- und Wandbelägen sowie prüfbaren Nettoflächen
    - Mengenübersicht nach Belagsart und Raum als Grundlage für Ausschreibung und Rechnungsprüfung
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une vue d'ensemble des quantités de carrelage de sols et de murs par local issue de la maquette, afin que l'appel d'offres et le contrôle des factures reposent sur la même base de quantités traçable.

    **Situation de départ**
    - Les carrelages de sols et de murs sont souvent rassemblés manuellement à partir des listes de locaux et des plans pour l'appel d'offres.
    - Des métrés distincts pour l'appel d'offres et le contrôle des factures génèrent du travail et des écarts difficiles à retracer.

    **Objectif et bénéfice**
    - Éviter des métrés à double pour l'appel d'offres et le contrôle des factures.
    - Convenir à l'avance de la tolérance admise sur les quantités et mesurer les écarts au décompte par rapport à celle-ci.

    **Déroulement**
    1. Définir les données requises par local sur les revêtements de sol et de mur et les surfaces nettes, la tolérance admise sur les quantités ainsi que le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la vue d'ensemble des quantités et vérifier l'attribution complète des revêtements, la plausibilité des déductions d'ouvertures et le respect de la tolérance dans les locaux géométriquement complexes.
    3. Valider la vue d'ensemble et la réutiliser comme base commune pour le descriptif, la comparaison des offres et le contrôle des factures.

    **Livrable**
    - Maquette d'architecture avec revêtements de sol et de mur par local et surfaces nettes vérifiables
    - Vue d'ensemble des quantités par type de revêtement et local comme base pour l'appel d'offres et le contrôle des factures
  it: |-
    La committenza ordina allo studio di architettura un quadro delle quantità delle piastrelle di pavimenti e pareti per locale ricavato dal modello, affinché gara e controllo delle fatture si basino sulla stessa base di quantità tracciabile.

    **Situazione di partenza**
    - I rivestimenti in piastrelle di pavimenti e pareti vengono spesso raccolti manualmente da elenchi locali e piani per la gara.
    - Computi separati per la gara e il controllo delle fatture generano lavoro e scostamenti difficili da ricostruire.

    **Obiettivo e beneficio**
    - Evitare computi doppi per la gara e il controllo delle fatture.
    - Concordare in anticipo la tolleranza ammessa sulle quantità e misurare su di essa gli scostamenti in fase di liquidazione.

    **Svolgimento**
    1. Definire i dati richiesti per locale su rivestimenti di pavimento e parete e superfici nette, la tolleranza ammessa sulle quantità e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere il quadro delle quantità e verificare l'assegnazione completa dei rivestimenti, la plausibilità delle deduzioni per aperture e il rispetto della tolleranza nei locali geometricamente complessi.
    3. Approvare il quadro e riutilizzarlo come base comune per capitolato, confronto delle offerte e controllo delle fatture.

    **Risultato della fornitura**
    - Modello di architettura con rivestimenti di pavimento e parete per locale e superfici nette verificabili
    - Quadro delle quantità per tipo di rivestimento e locale come base per la gara e il controllo delle fatture
  en: |-
    The client orders from the architecture team a room-by-room quantity overview of floor and wall tiling from the model, so that tendering and invoice checking rest on the same traceable quantity basis.

    **Starting point**
    - Floor and wall tiling is often compiled manually from room lists and drawings for tendering.
    - Separate quantity take-offs for tendering and invoice checking create extra work and discrepancies that are difficult to trace.

    **Goal & benefit**
    - Avoid separate quantity take-offs for tendering and invoice checking.
    - Agree the permitted quantity tolerance in advance and measure deviations at final account against it.

    **Process**
    1. Define the required room-by-room information on floor and wall finishes and net areas, the permitted quantity tolerance, and the submission date, and order them from the architecture team.
    2. Request the quantity overview and check for complete finish assignment, plausible opening deductions, and compliance with the tolerance in geometrically complex rooms.
    3. Approve the overview and reuse it as the shared basis for the bill of quantities, offer comparison, and invoice checking.

    **Deliverable**
    - Architecture model with floor and wall finishes by space and verifiable net areas
    - Quantity overview by finish type and space as the basis for tendering and invoice checking
