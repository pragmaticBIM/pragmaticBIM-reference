id: pragmaticbim:workflow/bes-steelwork-tender-basis
code: BES-STEELWORK-TENDER
sort_order: 20
name:
  de: Grundlage für die Stahlbauausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des travaux de construction métallique
  it: Fornire la base per la gara delle opere di carpenteria metallica
  en: Provide the basis for steelwork tendering
description:
  de: |-
    Die Bauherrschaft bestellt beim Planungsteam eine Stahlbauteilliste mit Lage und Hauptabmessungen aus dem Modell, damit die Stahlbauausschreibung prüfbare Mengen erhält, ohne dass die Werkstattplanung doppelt bezahlt wird.

    **Ausgangslage**
    - Angaben zu Stahlbauteilen werden für die Ausschreibung oft manuell aus Modellen, Plänen und Listen zusammengetragen.
    - Eine zu frühe Detailmodellierung von Geländern, Anschlüssen und Befestigungen verursacht Planungskosten, obwohl die genaue Konstruktion erst in Detail-, Werkstatt- oder Montageplänen festgelegt wird.

    **Ziel & Nutzen**
    - Nur die für Mengen und Ausschreibung nötige Detaillierung bestellen und doppelte Planungskosten vermeiden.
    - Positionen und Mengen im Leistungsverzeichnis über eindeutige Bezeichnungen auf das Modell zurückführen.

    **Ablauf**
    1. Umfang der Stahlbauteile, geforderte Bezeichnungen und Hauptabmessungen sowie Abgabetermin festlegen und bei Architektur und Tragwerksplanung bestellen.
    2. Modell und Bauteilliste einfordern und auf eindeutige Bezeichnungen, fehlende oder widersprüchliche Positionen und Übereinstimmung mit Ausschreibungs- und Detailplänen prüfen.
    3. Bauteilliste freigeben und als Grundlage für Leistungsverzeichnis und Angebotsvergleich weiterverwenden.

    **Lieferergebnis**
    - Abgestimmtes Modell und Bauteilliste als nachvollziehbare Grundlage für Mengen und Ausschreibung.
  fr: |-
    Le maître d'ouvrage commande à l'équipe de planification une liste des éléments métalliques avec leur emplacement et leurs dimensions principales issue de la maquette, afin que l'appel d'offres de la construction métallique dispose de quantités vérifiables sans payer deux fois les études d'atelier.

    **Situation de départ**
    - Les données relatives aux éléments métalliques sont souvent rassemblées manuellement depuis les maquettes, plans et listes pour l'appel d'offres.
    - Une modélisation détaillée trop précoce des garde-corps, raccords et fixations génère des coûts d'étude alors que la construction précise n'est définie que dans les plans de détail, d'atelier ou de montage.

    **Objectif et bénéfice**
    - Ne commander que le niveau de détail nécessaire aux quantités et à l'appel d'offres et éviter des coûts d'étude à double.
    - Rattacher les articles et quantités du descriptif à la maquette au moyen de désignations univoques.

    **Déroulement**
    1. Définir le périmètre des éléments métalliques, les désignations et dimensions principales requises ainsi que le délai de remise, puis les commander à l'architecture et à l'ingénierie structure.
    2. Exiger la maquette et la liste des éléments et vérifier l'univocité des désignations, les positions manquantes ou contradictoires et la concordance avec les plans d'appel d'offres et de détail.
    3. Valider la liste des éléments et la réutiliser comme base pour le descriptif et la comparaison des offres.

    **Livrable**
    - Maquette et liste d'éléments coordonnées comme base traçable pour les quantités et l'appel d'offres.
  it: |-
    La committenza ordina al gruppo di progettazione un elenco degli elementi in acciaio con posizione e dimensioni principali ricavato dal modello, affinché la gara della carpenteria metallica disponga di quantità verificabili senza pagare due volte la progettazione d'officina.

    **Situazione di partenza**
    - Per la gara, i dati degli elementi in acciaio vengono spesso raccolti manualmente da modelli, piani ed elenchi.
    - Una modellazione dettagliata troppo precoce di parapetti, raccordi e fissaggi genera costi di progettazione, anche se la costruzione precisa viene definita solo nei piani di dettaglio, d'officina o di montaggio.

    **Obiettivo e beneficio**
    - Ordinare solo il livello di dettaglio necessario per quantità e gara ed evitare costi di progettazione doppi.
    - Ricondurre posizioni e quantità del capitolato al modello tramite denominazioni univoche.

    **Svolgimento**
    1. Definire il perimetro degli elementi in acciaio, le denominazioni e le dimensioni principali richieste e il termine di consegna e ordinarli alla progettazione architettonica e strutturale.
    2. Richiedere modello ed elenco degli elementi e verificare l'univocità delle denominazioni, le posizioni mancanti o contraddittorie e la concordanza con i piani di gara e di dettaglio.
    3. Approvare l'elenco degli elementi e riutilizzarlo come base per capitolato e confronto delle offerte.

    **Risultato della fornitura**
    - Modello ed elenco degli elementi coordinati come base tracciabile per quantità e gara.
  en: |-
    The client orders from the design team a steelwork component schedule with locations and principal dimensions from the model, so that the steelwork tender has verifiable quantities without paying twice for shop design.

    **Starting point**
    - Steelwork information is often compiled manually from models, drawings, and schedules for tendering.
    - Detailing railings, connections, and fixings too early adds design cost even though the exact construction is only defined later in detail, shop, or installation drawings.

    **Goal & benefit**
    - Order only the level of detail needed for quantities and tendering and avoid paying twice for design.
    - Trace items and quantities in the bill of quantities back to the model through unique designations.

    **Process**
    1. Define the steelwork scope, the required designations and principal dimensions, and the submission date, and order them from the architecture and structural design teams.
    2. Request the model and component schedule and check for unique designations, missing or contradictory positions, and consistency with tender and detail drawings.
    3. Approve the component schedule and reuse it as the basis for the bill of quantities and offer comparison.

    **Deliverable**
    - Coordinated model and component schedule as a traceable basis for quantities and tendering.
