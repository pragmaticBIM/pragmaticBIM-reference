comment: >-
  Detailed stage from phase 32. Cost key:
  ePset_Cost.ProductClass + ePset_Cost.CalculatedType +
  ePset_Cost.ReferenceQuantity; project rate: ePset_Cost.UnitPrice.
  CalculatedType is derived here from cost-driving component properties and is
  the grouping token shared with BES-ELEMENT-TENDER and DES-LCA. Typing logic
  and DMN/FEEL tables live in book Anhang D (Bauteiltypisierung). Type tokens
  are German by design (Swiss LV/KVA), use metres as inputs, omit empty
  segments, and use underscore separators. Do not store the result in
  occurrence Name. Logic names: FundamentTypisierung, WandTypisierung,
  PlattenTypisierung, StuetzeTypisierung, TraegerTypisierung,
  TreppeTypisierung, TuerTypisierung, FensterTypisierung.
  Upstream: DES-ELEMENT-COST-EARLY. Downstream: BES-ELEMENT-TENDER,
  QAS-COST-PLAUS, DES-LCA.
