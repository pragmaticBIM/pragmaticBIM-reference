comment: The client is an IfcActor (element CLIENT) assigned to the IfcProject through IfcRelAssignsToActor with an IfcActorRole of Role CLIENT. TheActor is an IfcOrganization (or IfcPerson) whose Addresses hold the invoice address as an IfcPostalAddress with Purpose USERDEFINED and a localized UserDefinedPurpose (element CLIENT-INVOICE-ADDRESS). This is not IfcSite.SiteAddress or IfcBuilding.BuildingAddress. The cost target and milestone dates have no simple native IFC attribute and stay in ePset_ProjectRequirement. Room requirements reuse ePset_SpaceRequirement from BES-ROOM-PROGRAM.
