id: pragmaticbim:workflow/bes-concrete-tender-from-model
code: BES-CONCRETE-TENDER
sort_order: 11
name:
  de: Grundlage für die Betonausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des travaux en béton
  it: Fornire la base per la gara delle opere in calcestruzzo
  en: Provide the basis for the concrete tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Tragwerksplanungsteam ein Modell mit prüfbaren Betonmengen und den ausschreibungsrelevanten Angaben zu Betonsorte, Bewehrung und Oberfläche, damit das Leistungsverzeichnis der Beton- und Stahlbetonarbeiten auf denselben Mengen beruht wie die Planung.

    **Ausgangslage**
    - Betonmengen und Bauteilangaben werden für die Ausschreibung oft manuell aus Plänen übertragen; Übertragungsfehler führen zu falschen Mengen und Nachträgen.
    - Für die Beton- und Stahlbetonarbeiten (BKP 211.5) fehlen im Modell häufig Angaben zu Bewehrung, Oberfläche und Betonsorte, sodass sich die Mengen nicht nach Ausschreibungspositionen auswerten lassen.

    **Ziel & Nutzen**
    - Mengen im Leistungsverzeichnis gegen das Modell prüfen, statt sie erneut ausmessen zu lassen.
    - Kostentreiber wie Sichtbetonflächen und hohe Bewehrungsgehalte vor der Vergabe sichtbar machen.

    **Ablauf**
    1. Ausschreibungsumfang, geforderte Angaben zu Betonsorte, Bewehrungsgehalt und Oberfläche sowie Abgabetermin festlegen und beim Tragwerksplanungsteam bestellen.
    2. Modell und Mengenauszug einfordern und prüfen, ob alle Betonbauteile die geforderten Angaben enthalten und die Mengen mit Ausschreibungsplänen und Kostenvoranschlag übereinstimmen.
    3. Modell freigeben und die Mengen für Leistungsverzeichnis und Angebotsvergleich weiterverwenden.

    **Lieferergebnis**
    - Tragwerksmodell mit prüfbaren Mengen und ausschreibungsrelevanten Angaben zu Beton und Bewehrung.
    - Mengenauszug nach Betonsorte, Bewehrungsgehalt und Oberfläche als Grundlage für das Leistungsverzeichnis.
  fr: |-
    Le maître d'ouvrage commande à l'équipe de planification de la structure une maquette avec des quantités de béton vérifiables et les données utiles à l'appel d'offres sur la sorte de béton, l'armature et la surface, afin que le descriptif des travaux en béton et béton armé repose sur les mêmes quantités que le projet.

    **Situation de départ**
    - Les quantités de béton et les données des éléments sont souvent reprises manuellement depuis les plans ; les erreurs de report entraînent des quantités erronées et des avenants.
    - Pour les travaux en béton et béton armé (CFC 211.5), la maquette manque souvent des données sur l'armature, la surface et la sorte de béton, de sorte que les quantités ne peuvent pas être évaluées par article d'appel d'offres.

    **Objectif et bénéfice**
    - Contrôler les quantités du descriptif par rapport à la maquette au lieu de les faire mesurer à nouveau.
    - Rendre visibles avant l'adjudication les facteurs de coûts tels que les surfaces en béton apparent et les taux d'armature élevés.

    **Déroulement**
    1. Définir le périmètre de l'appel d'offres, les données requises sur la sorte de béton, le taux d'armature et la surface ainsi que le délai de remise, puis les commander à l'équipe de planification de la structure.
    2. Exiger la maquette et l'extrait des quantités, puis vérifier que tous les éléments en béton contiennent les données requises et que les quantités concordent avec les plans d'appel d'offres et le devis estimatif.
    3. Valider la maquette et réutiliser les quantités pour le descriptif et la comparaison des offres.

    **Livrable**
    - Maquette structure avec quantités vérifiables et données sur le béton et les armatures utiles à l'appel d'offres.
    - Extrait des quantités par sorte de béton, taux d'armature et surface comme base pour le descriptif.
  it: |-
    La committenza ordina al gruppo di progettazione strutturale un modello con quantità di calcestruzzo verificabili e i dati rilevanti per la gara su sorta di calcestruzzo, armatura e superficie, affinché il capitolato dei lavori in calcestruzzo e calcestruzzo armato si basi sulle stesse quantità del progetto.

    **Situazione di partenza**
    - Quantità di calcestruzzo e dati dei componenti vengono spesso trasferiti manualmente dai piani; gli errori di trascrizione causano quantità errate e varianti.
    - Per i lavori in calcestruzzo e calcestruzzo armato (CCC 211.5) nel modello mancano spesso i dati su armatura, superficie e sorta di calcestruzzo, per cui le quantità non possono essere valutate per posizione di gara.

    **Obiettivo e beneficio**
    - Verificare le quantità del capitolato rispetto al modello invece di farle misurare di nuovo.
    - Rendere visibili prima dell'aggiudicazione i fattori di costo come le superfici in calcestruzzo a vista e i tassi d'armatura elevati.

    **Svolgimento**
    1. Definire il perimetro della gara, i dati richiesti su sorta di calcestruzzo, tasso d'armatura e superficie e il termine di consegna e ordinarli al gruppo di progettazione strutturale.
    2. Richiedere il modello e l'estratto delle quantità e verificare che tutti gli elementi in calcestruzzo contengano i dati richiesti e che le quantità concordino con i piani di gara e il preventivo.
    3. Approvare il modello e riutilizzare le quantità per il capitolato e il confronto delle offerte.

    **Risultato della fornitura**
    - Modello strutturale con quantità verificabili e dati su calcestruzzo e armature rilevanti per la gara.
    - Estratto delle quantità per sorta di calcestruzzo, tasso d'armatura e superficie come base per il capitolato.
  en: |-
    The client orders from the structural design team a model with verifiable concrete quantities and the tender-relevant information on concrete grade, reinforcement, and surface, so that the specification for concrete and reinforced concrete works is based on the same quantities as the design.

    **Starting point**
    - Concrete quantities and component data are often transferred manually from drawings for tendering; transfer errors lead to incorrect quantities and variations.
    - For concrete and reinforced concrete works (BKP 211.5), the model often lacks information on reinforcement, surface, and concrete grade, so quantities cannot be evaluated by tender item.

    **Goal & benefit**
    - Check the quantities in the specification against the model instead of having them measured again.
    - Make cost drivers such as fair-faced concrete surfaces and high reinforcement ratios visible before award.

    **Process**
    1. Define the tender scope, the required information on concrete grade, reinforcement ratio, and surface, and the submission date, and order them from the structural design team.
    2. Request the model and quantity extract and check that every concrete component contains the required information and that quantities match the tender drawings and cost estimate.
    3. Approve the model and reuse the quantities for the specification and offer comparison.

    **Deliverable**
    - Structural model with verifiable quantities and tender-relevant concrete and reinforcement information.
    - Quantity extract by concrete grade, reinforcement ratio, and surface as the basis for the specification.
