id: pragmaticbim:workflow/bes-design-build-procurement
code: BES-DESIGN-BUILD
sort_order: 16
name:
  de: Design-Build-Leistung mit verbindlichem Preis beschaffen
  fr: Acquérir une prestation conception-réalisation avec une offre ferme
  it: Acquisire una prestazione di progettazione e costruzione con offerta vincolante
  en: Procure design-build services with a binding offer
description:
  de: |-
    Planung und Ausführung auf einer funktional geklärten Grundlage gemeinsam beschaffen und Lösung, Leistung sowie Angebotspreis vergleichbar beurteilen.

    **Ausgangslage**
    - Pauschale Bestellungen wie «ein Stück Krankenhaus» lassen Betrieb, Funktionen und Qualitätsanforderungen offen; Bietende kalkulieren unterschiedliche Annahmen oder beschränken ihre Leistung auf das vertragliche Minimum.
    - Ein für Wettbewerbe ausreichendes Raummodell bildet kosten- und leistungsbestimmende Bauteile nicht ab; bei einem verbindlichen Design-Build-Angebot führen solche Lücken zu unterschiedlichen Kalkulationsgrundlagen, Risikozuschlägen oder späteren Nachträgen.

    **Ziel & Nutzen**
    - Vergleichbare Lösungsvorschläge mit nachvollziehbarem Leistungsumfang und verbindlichem Angebotspreis erhalten.
    - Anforderungen und Richtmengen für die funktionale Ausschreibung aus einem schlanken Modell ableiten, ohne grossen Aufwand in die Modellierung der kostenbestimmenden Bauteile stecken zu müssen.

    **Ablauf**
    1. Freigegebene Betriebs- und Funktionsgrundlagen, Raumprogramm, Qualitätsanforderungen, Vertragsbedingungen und Kostenabgrenzung bereitstellen.
    2. Ein einfaches Modell für Richtmengen erstellen, das als Basis für Angebot und Vertrag dient. Weichen die Mengen später ab, ist nachvollziehbar, ob ein höherer oder tieferer Preis gerechtfertigt ist.
    3. Angebote mit verbindlichem Preis, Annahmen und Ausschlüssen einfordern und Funktionserfüllung, Mengen, Qualitäten sowie Angebotspreis nach denselben Kriterien prüfen.

    **Lieferergebnis**
    - Funktionale Ausschreibungsgrundlage mit Anforderungen und einfachem Richtmengenmodell als Basis für spätere Preisanpassungen.
    - Verbindliches Angebot mit Leistungsumfang, Preis, Terminen, Annahmen und Ausschlüssen.
    - Bewertete und vertraglich festgehaltene Design-Build-Lösung mit Abnahmekriterien und Änderungsregeln.

    **Hinweis**
    Mit abstractBIM lassen sich aus dem schlanken Raummodell Anforderungen und Richtmengen für die funktionale Ausschreibung ableiten.
  fr: |-
    Acquérir conjointement les études et la réalisation sur une base fonctionnelle clarifiée et évaluer de manière comparable la solution, les prestations et le prix offert.

    **Situation de départ**
    - Des commandes générales telles que «construire une partie d'hôpital» laissent ouverts l'exploitation, les fonctions et les exigences de qualité; les soumissionnaires chiffrent des hypothèses différentes ou limitent leur prestation au minimum contractuel.
    - Une maquette des locaux suffisante pour un concours ne représente pas les éléments déterminants pour les prestations et les coûts; dans une offre ferme de conception-réalisation, ces lacunes entraînent des bases de calcul différentes, des suppléments de risque ou des avenants ultérieurs.

    **Objectif et bénéfice**
    - Obtenir des propositions comparables avec une étendue des prestations traçable et un prix d'offre ferme.
    - Déduire les exigences et les quantités indicatives pour l'appel d'offres fonctionnel à partir d'une maquette légère, sans investir un effort important dans la modélisation des éléments déterminants pour les coûts.

    **Déroulement**
    1. Fournir les bases d'exploitation et fonctionnelles validées, le programme des locaux, les exigences de qualité, les conditions contractuelles et la délimitation du prix.
    2. Établir une maquette simple des quantités indicatives, qui sert de base à l'offre et au contrat. Si les quantités changent ensuite, on peut établir de manière traçable si un prix plus élevé ou plus bas est justifié.
    3. Exiger des offres avec prix ferme, hypothèses et exclusions, puis vérifier le respect des fonctions, les quantités, les qualités et le prix offert selon les mêmes critères.

    **Livrable**
    - Base d'appel d'offres fonctionnel avec exigences et maquette simple des quantités indicatives comme base pour des adaptations de prix ultérieures.
    - Offre ferme avec étendue des prestations, prix, délais, hypothèses et exclusions.
    - Solution conception-réalisation évaluée et contractualisée avec critères de réception et règles de modification.

    **Remarque**
    Avec abstractBIM, les exigences et les quantités indicatives pour l'appel d'offres fonctionnel peuvent être déduites de la maquette légère des locaux.
  it: |-
    Acquisire congiuntamente progettazione ed esecuzione su una base funzionale chiarita e valutare in modo comparabile soluzione, prestazioni e prezzo offerto.

    **Situazione di partenza**
    - Ordinazioni generiche come «costruire una parte di ospedale» lasciano aperti esercizio, funzioni e requisiti qualitativi; gli offerenti calcolano ipotesi diverse o limitano la prestazione al minimo contrattuale.
    - Un modello dei locali sufficiente per un concorso non rappresenta i componenti determinanti per le prestazioni e i costi; in un'offerta vincolante di progettazione e costruzione, queste lacune comportano basi di calcolo diverse, supplementi per i rischi o successive pretese aggiuntive.

    **Obiettivo e beneficio**
    - Ottenere proposte confrontabili con un'estensione delle prestazioni tracciabile e un prezzo d'offerta vincolante.
    - Ricavare requisiti e quantità indicative per l'appalto funzionale da un modello leggero, senza investire un notevole impegno nella modellazione dei componenti determinanti per i costi.

    **Svolgimento**
    1. Fornire le basi operative e funzionali approvate, il programma dei locali, i requisiti qualitativi, le condizioni contrattuali e la delimitazione del prezzo.
    2. Allestire un modello semplice delle quantità indicative, che funge da base per offerta e contratto. Se in seguito le quantità cambiano, è possibile verificare in modo tracciabile se un prezzo più alto o più basso è giustificato.
    3. Richiedere offerte con prezzo vincolante, ipotesi ed esclusioni e verificare l'adempimento funzionale, le quantità, le qualità e il prezzo offerto secondo gli stessi criteri.

    **Risultato della fornitura**
    - Base di appalto funzionale con requisiti e modello semplice delle quantità indicative come base per successivi adeguamenti del prezzo.
    - Offerta vincolante con estensione delle prestazioni, prezzo, termini, ipotesi ed esclusioni.
    - Soluzione di progettazione e costruzione valutata e contrattualizzata con criteri di collaudo e regole per le modifiche.

    **Nota**
    Con abstractBIM è possibile ricavare dal modello leggero dei locali i requisiti e le quantità indicative per l'appalto funzionale.
  en: |-
    Procure design and construction together on a functionally clarified basis and compare the proposed solution, scope, and offer price consistently.

    **Starting point**
    - Blanket orders such as “build part of a hospital” leave operations, functions, and quality requirements open; bidders price different assumptions or limit delivery to the contractual minimum.
    - A room model sufficient for a competition does not represent the elements that determine scope and cost; in a binding design-build bid, these gaps lead to different pricing bases, risk premiums, or later change claims.

    **Goal & benefit**
    - Obtain comparable proposals with a traceable scope and binding offer price.
    - Derive requirements and indicative quantities for the functional tender from a lean model, without investing heavy effort in modelling the cost-determining elements.

    **Process**
    1. Provide the approved operational and functional foundations, room programme, quality requirements, contract conditions, and price boundaries.
    2. Create a simple model of indicative quantities that serves as the baseline for the offer and contract. If quantities change later, it is traceable whether a higher or lower price is justified.
    3. Require bids with a binding price, assumptions, and exclusions, then check functional compliance, quantities, qualities, and offer price against the same criteria.

    **Deliverable**
    - Functional tender basis with requirements and a simple indicative-quantity model as the baseline for later price adjustments.
    - Binding offer stating scope, price, programme, assumptions, and exclusions.
    - Evaluated and contracted design-build solution with acceptance criteria and change rules.

    **Note**
    abstractBIM can derive requirements and indicative quantities for the functional tender from the lean room model.
