comment: >-
  Supplies the room-based inputs that DES-PHYSICS turns into the building
  physics requirements model; the acoustic consultant stays responsible for the
  values. Rooms carry NoiseLoad and NoiseSensitivity (ePset_Space)
  next to UsageUnitReference. Separating elements carry AirborneSoundInsulationMin
  (Di, De for exterior elements) and, for floor slabs, ImpactSoundLevelMax, each
  verified by AirborneSoundInsulation and ImpactSoundLevel. The derivation
  matrix (requirement per noise load, noise sensitivity and requirement level)
  is not part of the Reference yet: it has to be extracted from the licensed
  SIA 181 by a person. Rules SIA-181-001 to SIA-181-004 check what is checkable
  without it. QAS-ACOUSTIC keeps comparing the catalogue value AcousticRating
  (Rw).
