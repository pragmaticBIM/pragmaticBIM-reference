comment: >-
  Environmental LCA (Ökobilanz), not lifecycle costing. Material attribute and
  ePset_Cost.ProductClass required on governing building elements. Resolve
  KBOB / kbob_related from the product catalogue bridge (book product-
  classifications.yaml / schema.pragmaticbim.ch), not as a separate IFC attribute.
  Distinct from DES-MATERIAL-PASS: ePset_Circularity.MaterialOrProductId is a
  Madaster/baubook ID space, not schema ProductClass. ProductClass assignment
  upstream: DES-ELEMENT-COST-EARLY for ProductClass and
  DES-ELEMENT-COST-LATE for CalculatedType. Two stages: ProductClass alone in
  early phases (Vorprojekt as reasoned assumption); from Bauprojekt (32) also
  ePset_Cost.CalculatedType for layer build-up and thickness, on the elements
  that carry GlobalWarmingPotentialMax.
