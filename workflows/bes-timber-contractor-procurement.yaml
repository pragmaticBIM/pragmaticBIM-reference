id: pragmaticbim:workflow/bes-timber-contractor-procurement
code: BES-TIMBER-CONTRACTOR
sort_order: 18
name:
  de: Holzbauunternehmen vorgezogen beschaffen
  fr: Acquérir par anticipation une entreprise de construction bois
  it: Acquisire in anticipo un'impresa di costruzioni in legno
  en: Procure the timber contractor early
description:
  de: |-
    Die Bauherrschaft beschafft nach Studie oder Vorprojekt ein Holzbauunternehmen und bindet es in die Planung ein, damit die Konstruktion nur einmal und passend zu dessen Produktions- und Montagesystem geplant wird.

    **Ausgangslage**
    - Im Holzbau wird die Konstruktion häufig zweimal geplant: zunächst systemneutral durch das Planungsteam und nach der Vergabe nochmals durch das ausführende Unternehmen.
    - Die späte Systemwahl führt zu vermeidbarer Umplanung, widersprüchlichen Details und nicht optimalen Abläufen für Produktion und Montage.

    **Ziel & Nutzen**
    - Doppelplanung und späte Umplanung vermeiden.
    - System-, Produktions- und Montagewissen nutzen, solange Änderungen noch günstig sind.
    - Angebote anhand klarer Leistungsanforderungen, Hüllkörper und Schnittstellen vergleichen statt anhand einer systemneutralen Detailplanung.

    **Ablauf**
    1. Leistungsanforderungen, Zuständigkeiten und Beurteilungskriterien festlegen und beim Architekturteam ein Modell mit abgestimmten Hüllkörpern, Öffnungen und Schnittstellen als Beschaffungsgrundlage bestellen.
    2. Holzbauunternehmen auf dieser Grundlage evaluieren und den Systemvorschlag auf Einhaltung der Leistungsanforderungen und Schnittstellen prüfen.
    3. Systementscheid nach Abstimmung mit Architektur, Tragwerk, Bauphysik und Brandschutz freigeben und als Grundlage für die weitere Planung verwenden.

    **Hinweis:** Es ist möglich, das Holzbauunternehmen in zwei Stufen zu beauftragen und Planung von Ausführung zu trennen. Von einer neuen Ausschreibung nach der Unternehmerplanung soll abgesehen werden.

    **Lieferergebnis**
    - Architekturmodell mit prüfbaren Hüllkörpern, Öffnungen und Schnittstellen.
    - Beschaffungsunterlagen mit Leistungsanforderungen, Zuständigkeiten und Beurteilungskriterien.
    - Abgestimmtes Systemkonzept des Holzbauunternehmens mit Bauteilaufbauten sowie Produktions- und Montageprinzip.
  fr: |-
    Le maître d'ouvrage acquiert une entreprise de construction bois après l'étude ou l'avant-projet et l'associe aux études, afin que la construction ne soit étudiée qu'une seule fois et en fonction de son système de production et de montage.

    **Situation de départ**
    - Dans la construction bois, la structure est souvent étudiée deux fois : d'abord sans système spécifique par l'équipe de mandataires, puis une nouvelle fois par l'entreprise après l'adjudication.
    - Le choix tardif du système entraîne des reprises d'études évitables, des détails contradictoires et des processus de production et de montage peu optimisés.

    **Objectif et bénéfice**
    - Éviter les études à double et les reprises tardives.
    - Intégrer le savoir-faire relatif au système, à la production et au montage tant que les modifications restent peu coûteuses.
    - Comparer les offres sur la base d'exigences de performance, de volumes réservés et d'interfaces clairs plutôt que d'études de détail sans système spécifique.

    **Déroulement**
    1. Définir les exigences de performance, les responsabilités et les critères d'évaluation, puis commander à l'équipe d'architecture une maquette avec volumes réservés coordonnés, ouvertures et interfaces comme base d'acquisition.
    2. Évaluer les entreprises de construction bois sur cette base et vérifier que la proposition de système respecte les exigences de performance et les interfaces.
    3. Valider le choix du système après coordination avec l'architecture, la structure, la physique du bâtiment et la protection incendie et l'utiliser comme base pour la suite des études.

    **Remarque:** Il est possible de mandater l'entreprise de construction bois en deux étapes et de séparer études et réalisation. Il convient de renoncer à un nouvel appel d'offres après les études d'entreprise.

    **Livrable**
    - Maquette d'architecture avec volumes réservés, ouvertures et interfaces vérifiables.
    - Dossier d'acquisition avec exigences de performance, responsabilités et critères d'évaluation.
    - Concept de système coordonné de l'entreprise de construction bois avec compositions d'éléments et principes de production et de montage.
  it: |-
    La committenza acquisisce un'impresa di costruzioni in legno dopo lo studio o il progetto preliminare e la coinvolge nella progettazione, affinché la costruzione venga progettata una sola volta e in funzione del suo sistema di produzione e montaggio.

    **Situazione di partenza**
    - Nelle costruzioni in legno la struttura viene spesso progettata due volte: dapprima in modo indipendente dal sistema dal gruppo di progettazione e, dopo l'aggiudicazione, nuovamente dall'impresa esecutrice.
    - La scelta tardiva del sistema comporta riprogettazioni evitabili, dettagli contraddittori e processi di produzione e montaggio non ottimali.

    **Obiettivo e beneficio**
    - Evitare la doppia progettazione e le riprogettazioni tardive.
    - Integrare le conoscenze relative a sistema, produzione e montaggio finché le modifiche costano ancora poco.
    - Confrontare le offerte sulla base di requisiti prestazionali, volumi d'ingombro e interfacce chiari anziché di una progettazione di dettaglio indipendente dal sistema.

    **Svolgimento**
    1. Definire requisiti prestazionali, responsabilità e criteri di valutazione e ordinare allo studio di architettura un modello con volumi d'ingombro coordinati, aperture e interfacce come base di acquisizione.
    2. Valutare su questa base le imprese di costruzioni in legno e verificare che la proposta di sistema rispetti i requisiti prestazionali e le interfacce.
    3. Approvare la scelta del sistema dopo il coordinamento con architettura, struttura, fisica della costruzione e protezione antincendio e utilizzarla come base per la progettazione successiva.

    **Nota:** È possibile incaricare l'impresa di costruzioni in legno in due fasi e separare progettazione ed esecuzione. Si rinuncia a una nuova gara dopo la progettazione dell'impresa.

    **Risultato della fornitura**
    - Modello architettonico con volumi d'ingombro, aperture e interfacce verificabili.
    - Documentazione di acquisizione con requisiti prestazionali, responsabilità e criteri di valutazione.
    - Concetto di sistema coordinato dell'impresa di costruzioni in legno con stratigrafie degli elementi e principi di produzione e montaggio.
  en: |-
    The client procures a timber contractor after the study or preliminary design and involves it in the design, so that the construction is designed only once and to suit the contractor's production and assembly system.

    **Starting point**
    - Timber construction is often designed twice: first on a system-neutral basis by the design team and then again by the contractor after award.
    - Late system selection causes avoidable redesign, conflicting details, and production and assembly processes that are not fully optimized.

    **Goal & benefit**
    - Avoid duplicate design and late redesign.
    - Use system, production, and assembly expertise while changes are still cheap.
    - Compare offers against clear performance requirements, envelope volumes, and interfaces instead of a system-neutral detailed design.

    **Process**
    1. Define performance requirements, responsibilities, and evaluation criteria, and order from the architecture team a model with coordinated envelope volumes, openings, and interfaces as the procurement basis.
    2. Evaluate timber contractors on this basis and check that the proposed system meets the performance requirements and interfaces.
    3. Approve the system decision after coordination with architecture, structure, building physics, and fire safety, and use it as the basis for further design.

    **Note:** The timber contractor may be appointed in two stages, separating design from construction. A new tender after the contractor design should be avoided.

    **Deliverable**
    - Architecture model with verifiable envelope volumes, openings, and interfaces.
    - Procurement documents with performance requirements, responsibilities, and evaluation criteria.
    - Coordinated contractor system concept with component build-ups and production and assembly principles.
