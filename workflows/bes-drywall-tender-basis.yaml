id: pragmaticbim:workflow/bes-drywall-tender-basis
code: BES-DRYWALL-TENDER
sort_order: 18
name:
  de: Grundlage für die Trockenbauausschreibung liefern
  fr: Fournir la base pour l'appel d'offres de la construction à sec
  it: Fornire la base per la gara delle costruzioni a secco
  en: Provide the basis for the drywall tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine prüfbare Typen-, Mengen- und Verstärkungsübersicht der nichttragenden Innenwände, damit die Trockenbauausschreibung vollständige Mengen sowie Brand- und Schallschutzanforderungen enthält und Nachträge während der Ausführung vermieden werden.

    **Ausgangslage**
    - Wandtypen, Brand- und Schallschutzanforderungen sowie Verstärkungen werden für die Ausschreibung oft manuell aus Plänen, Konzepten und Listen zusammengetragen.
    - Fehlende oder widersprüchliche Angaben führen zu falschen Mengen, Rückfragen und Nachträgen während der Ausführung.

    **Ziel & Nutzen**
    - Wandflächen je Typ und Verstärkungsbereiche vollständig ausschreiben und damit Nachträge für vergessene Verstärkungen vermeiden.
    - Brand- und Schallschutzanforderungen vor der Vergabe mit den Fachkonzepten abgleichen.
    - Dieselbe Mengenbasis für Angebotsvergleich und Rechnungsprüfung verwenden.

    **Ablauf**
    1. Umfang der nichttragenden Innenwände, geforderte Typ-, Brand-, Schall- und Verstärkungsangaben sowie Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Übersicht einfordern und auf vollständige Verstärkungsbereiche, Widersprüche zu Brandschutz- und Schallschutzkonzept und Übereinstimmung mit den Ausschreibungsplänen prüfen.
    3. Übersicht freigeben und als Grundlage für Leistungsverzeichnis, Angebotsvergleich und Rechnungsprüfung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell mit freigegebenen Innenwandtypen, Brand- und Schallschutzangaben sowie eindeutig zugeordneten Verstärkungsbereichen
    - Prüfbare Typen-, Mengen- und Verstärkungsübersicht als Grundlage für die Trockenbauausschreibung
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une vue d'ensemble vérifiable des types, quantités et renforts des cloisons intérieures non porteuses, afin que l'appel d'offres de la construction à sec contienne des quantités et des exigences incendie et acoustiques complètes et que les avenants en cours d'exécution soient évités.

    **Situation de départ**
    - Les types de cloisons, les exigences incendie et acoustiques ainsi que les renforts sont souvent rassemblés manuellement à partir de plans, concepts et listes pour l'appel d'offres.
    - Des indications manquantes ou contradictoires entraînent des quantités erronées, des questions et des avenants pendant l'exécution.

    **Objectif et bénéfice**
    - Mettre en soumission la totalité des surfaces de cloisons par type et des zones de renfort afin d'éviter des avenants pour des renforts oubliés.
    - Comparer les exigences incendie et acoustiques avec les concepts spécialisés avant l'adjudication.
    - Utiliser la même base de quantités pour la comparaison des offres et le contrôle des factures.

    **Déroulement**
    1. Définir le périmètre des cloisons intérieures non porteuses, les données requises sur les types, la protection incendie, l'acoustique et les renforts ainsi que le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la vue d'ensemble et vérifier l'exhaustivité des zones de renfort, l'absence de contradictions avec les concepts de protection incendie et d'acoustique et la concordance avec les plans d'appel d'offres.
    3. Valider la vue d'ensemble et la réutiliser comme base pour le descriptif, la comparaison des offres et le contrôle des factures.

    **Livrable**
    - Maquette d'architecture avec types de cloisons validés, indications incendie et acoustiques ainsi que zones de renfort rattachées sans ambiguïté
    - Vue d'ensemble vérifiable des types, quantités et renforts comme base pour l'appel d'offres de la construction à sec
  it: |-
    La committenza ordina allo studio di architettura un quadro verificabile di tipi, quantità e rinforzi delle pareti interne non portanti, affinché la gara delle costruzioni a secco contenga quantità e requisiti antincendio e acustici completi ed evitare varianti durante l'esecuzione.

    **Situazione di partenza**
    - I tipi di parete, i requisiti antincendio e acustici e i rinforzi vengono spesso raccolti manualmente da piani, concetti ed elenchi per la gara.
    - Indicazioni mancanti o contraddittorie causano quantità errate, domande e varianti durante l'esecuzione.

    **Obiettivo e beneficio**
    - Mettere a gara tutte le superfici di parete per tipo e tutte le zone di rinforzo, evitando varianti per rinforzi dimenticati.
    - Confrontare i requisiti antincendio e acustici con i concetti specialistici prima dell'aggiudicazione.
    - Utilizzare la stessa base di quantità per il confronto delle offerte e il controllo delle fatture.

    **Svolgimento**
    1. Definire il perimetro delle pareti interne non portanti, i dati richiesti su tipi, protezione antincendio, acustica e rinforzi e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere il quadro e verificare la completezza delle zone di rinforzo, l'assenza di contraddizioni con i concetti antincendio e acustico e la concordanza con i piani di gara.
    3. Approvare il quadro e riutilizzarlo come base per capitolato, confronto delle offerte e controllo delle fatture.

    **Risultato della fornitura**
    - Modello di architettura con tipi di parete approvati, indicazioni antincendio e acustiche e zone di rinforzo associate in modo univoco
    - Quadro verificabile di tipi, quantità e rinforzi come base per la gara delle costruzioni a secco
  en: |-
    The client orders from the architecture team a verifiable overview of types, quantities, and reinforcements for non-load-bearing interior walls, so that the drywall tender contains complete quantities and fire and acoustic requirements and variations during construction are avoided.

    **Starting point**
    - Wall types, fire and acoustic requirements, and reinforcements are often compiled manually from drawings, concepts, and schedules for tendering.
    - Missing or contradictory information leads to incorrect quantities, queries, and variations during construction.

    **Goal & benefit**
    - Tender all wall areas by type and all reinforcement zones and so avoid variations for forgotten reinforcements.
    - Reconcile fire and acoustic requirements with the discipline concepts before award.
    - Use the same quantity basis for offer comparison and invoice checking.

    **Process**
    1. Define the scope of non-load-bearing interior walls, the required type, fire, acoustic, and reinforcement information, and the submission date, and order them from the architecture team.
    2. Request the overview and check for complete reinforcement zones, contradictions with the fire protection and acoustic concepts, and consistency with the tender drawings.
    3. Approve the overview and reuse it as the basis for the bill of quantities, offer comparison, and invoice checking.

    **Deliverable**
    - Architecture model with approved interior wall types, fire and acoustic information, and unambiguously assigned reinforcement zones
    - Verifiable overview of types, quantities, and reinforcements as the basis for the drywall tender
