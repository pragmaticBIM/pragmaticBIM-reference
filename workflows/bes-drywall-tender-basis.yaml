comment: >-
  Tender preparation in SIA phase 41, not a complete contractor specification.
  Upstream inputs are DES-DRYWALL-REINF, BES-ELEMENT-TENDER, QAS-FIRE, and
  QAS-ACOUSTIC. The contractor remains responsible for the detailed wall
  build-up, framing, board layers, and fixing capacity. Non-load-bearing
  interior walls are grouped by CalculatedType; reinforcement zones carry an
  unambiguous reference to the affected wall.
