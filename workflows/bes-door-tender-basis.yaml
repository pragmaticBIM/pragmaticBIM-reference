id: pragmaticbim:workflow/bes-door-tender-basis
code: BES-DOOR-TENDER
sort_order: 17
name:
  de: Grundlage für die Türausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des portes
  it: Fornire la base per la gara delle porte
  en: Provide the basis for the door tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine prüfbare Türliste aus dem Modell, damit die Türausschreibung vollständige Mengen und Anforderungen enthält und Rückfragen und Nachträge vermieden werden.

    **Ausgangslage**
    - Türtypen, Öffnungsmasse, Öffnungsarten, Feuerwiderstand und Schalldämmung werden für die Ausschreibung oft manuell aus Plänen und Türlisten zusammengetragen.
    - Fehlende oder uneinheitliche Türangaben führen zu Rückfragen, falschen Mengen und Nachträgen.

    **Ziel & Nutzen**
    - Vollständige und eindeutige Türangaben ausschreiben und damit Risikozuschläge und Nachträge reduzieren.
    - Brand- und Schallschutzanforderungen je Tür vor der Vergabe prüfen statt erst bei der Abnahme.
    - Die Türnummer als gemeinsamen Schlüssel für Ausschreibung, Werkplanung und Abnahme verwenden.

    **Ablauf**
    1. Erforderliche Türangaben, den führenden Ort der Daten (Modell oder über die Türnummer verknüpfte Liste) und den Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Türliste einfordern und auf eindeutige Türnummern, vollständige Angaben und Übereinstimmung mit Ausschreibungsplänen, Brandschutz- und Schallschutzkonzept prüfen.
    3. Türliste freigeben und als Grundlage für Leistungsverzeichnis, Angebotsvergleich und Werkplanung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell und über die Türnummer verknüpfte Türliste mit den erforderlichen Grund- und Fachangaben.
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une liste de portes vérifiable issue de la maquette, afin que l'appel d'offres des portes contienne des quantités et des exigences complètes et que les questions et les avenants soient évités.

    **Situation de départ**
    - Les types, dimensions d'ouverture, modes d'ouverture, résistances au feu et performances acoustiques sont souvent rassemblés manuellement depuis les plans et listes de portes.
    - Des données manquantes ou incohérentes entraînent des questions, des quantités erronées et des avenants.

    **Objectif et bénéfice**
    - Mettre en soumission des données de portes complètes et univoques afin de réduire les suppléments de risque et les avenants.
    - Contrôler les exigences incendie et acoustiques de chaque porte avant l'adjudication plutôt qu'à la réception.
    - Utiliser le numéro de porte comme clé commune pour l'appel d'offres, les plans d'atelier et la réception.

    **Déroulement**
    1. Définir les données de portes requises, l'emplacement de référence des données (maquette ou liste reliée par le numéro de porte) et le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la liste de portes et vérifier l'unicité des numéros, l'exhaustivité des données et la concordance avec les plans d'appel d'offres et les concepts de protection incendie et d'acoustique.
    3. Valider la liste de portes et la réutiliser comme base pour le descriptif, la comparaison des offres et les plans d'atelier.

    **Livrable**
    - Maquette d'architecture et liste de portes reliée par le numéro de porte avec les données de base et techniques requises.
  it: |-
    La committenza ordina allo studio di architettura un elenco porte verificabile ricavato dal modello, affinché la gara delle porte contenga quantità e requisiti completi ed evitare domande e varianti.

    **Situazione di partenza**
    - Tipi, dimensioni, modalità di apertura, resistenza al fuoco e prestazioni acustiche vengono spesso raccolti manualmente da piani ed elenchi porte per la gara.
    - Dati mancanti o incoerenti causano domande, quantità errate e varianti.

    **Obiettivo e beneficio**
    - Mettere a gara dati delle porte completi e univoci, riducendo supplementi per rischi e varianti.
    - Verificare i requisiti antincendio e acustici di ogni porta prima dell'aggiudicazione anziché al collaudo.
    - Utilizzare il numero della porta come chiave comune per gara, progettazione d'officina e collaudo.

    **Svolgimento**
    1. Definire i dati delle porte richiesti, la sede di riferimento dei dati (modello o elenco collegato tramite il numero della porta) e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere l'elenco porte e verificare l'univocità dei numeri, la completezza dei dati e la concordanza con i piani di gara e i concetti antincendio e acustico.
    3. Approvare l'elenco porte e riutilizzarlo come base per capitolato, confronto delle offerte e progettazione d'officina.

    **Risultato della fornitura**
    - Modello di architettura ed elenco porte collegato tramite il numero della porta con i dati di base e specialistici necessari.
  en: |-
    The client orders from the architecture team a verifiable door schedule from the model so that the door tender contains complete quantities and requirements and queries and variations are avoided.

    **Starting point**
    - Door types, opening dimensions, operation types, fire resistance, and acoustic ratings are often compiled manually from drawings and door schedules.
    - Missing or inconsistent door information leads to queries, incorrect quantities, and variations.

    **Goal & benefit**
    - Tender complete and unambiguous door information and so reduce risk premiums and variations.
    - Check fire and acoustic requirements for each door before award rather than at handover.
    - Use the door number as the shared key for tendering, shop drawings, and handover.

    **Process**
    1. Define the required door information, where the data is authoritative (model or a schedule linked by the door number), and the submission date, and order them from the architecture team.
    2. Request the door schedule and check for unique door numbers, complete information, and consistency with the tender drawings and the fire protection and acoustic concepts.
    3. Approve the door schedule and reuse it as the basis for the specification, offer comparison, and shop drawings.

    **Deliverable**
    - Architecture model and door schedule linked by the door number with the required basic and specialist information.
