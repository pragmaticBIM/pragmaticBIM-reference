comment: >-
  Tender basis only, not a complete door specification. Technical mappings are
  defined on the door element attributes. Door type and opening dimensions are
  kept in the model; specialist information such as operation type, fire
  resistance, and acoustic rating may instead be kept in a schedule linked by
  the door number (for example a shared spreadsheet). The schedule is grouped
  by calculated component type and dimensions.
