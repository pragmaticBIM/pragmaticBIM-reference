id: pragmaticbim:workflow/bes-flooring-tender-basis
code: BES-FLOORING-TENDER
sort_order: 12
name:
  de: Grundlage für die Bodenbelagsausschreibung liefern
  fr: Fournir la base pour l'appel d'offres des revêtements de sol
  it: Fornire la base per la gara dei rivestimenti di pavimento
  en: Provide the basis for the flooring tender
description:
  de: |-
    Die Bauherrschaft bestellt beim Architekturteam eine raumweise Bodenbelagsliste mit Belagstyp, Fläche und Umfang aus dem Modell, damit die Mengen im Leistungsverzeichnis zur Planung passen und nicht erneut aus Plänen ermittelt werden müssen.

    **Ausgangslage**
    - Bodenbelagsmengen und -typen werden für die Ausschreibung oft manuell aus Plänen und Raumlisten zusammengesucht.
    - Werden die Mengen für das Leistungsverzeichnis separat ermittelt, laufen Ausschreibung und Planung auseinander; Abweichungen fallen erst bei der Abrechnung auf.

    **Ziel & Nutzen**
    - Bodenbelags- und Sockelleistenmengen raumweise prüfen und auf die Planung zurückführen.
    - Dieselbe Mengenbasis für Ausschreibung, Angebotsvergleich und Rechnungsprüfung verwenden.

    **Ablauf**
    1. Geforderte raumweise Angaben zu Belagstyp, Nettofläche und Umfang sowie Abgabetermin festlegen und beim Architekturteam bestellen.
    2. Raumliste und Bodenbelagsübersicht einfordern und auf vollständige Belagszuordnung je Innenraum und Übereinstimmung mit den Ausschreibungsplänen prüfen.
    3. Übersicht freigeben und als Grundlage für Leistungsverzeichnis, Angebotsvergleich und Rechnungsprüfung weiterverwenden.

    **Lieferergebnis**
    - Architekturmodell mit vollständigen Raumangaben zu Nutzung, Bodenbelag, Fläche und Umfang.
    - Raumliste und Bodenbelagsübersicht als prüfbare Ausschreibungsgrundlage.
  fr: |-
    Le maître d'ouvrage commande à l'équipe d'architecture une liste des revêtements de sol par local, avec type de revêtement, surface et périmètre issus de la maquette, afin que les quantités du descriptif correspondent au projet et ne doivent pas être établies une nouvelle fois depuis les plans.

    **Situation de départ**
    - Les quantités et les types de revêtement pour l'appel d'offres sont souvent rassemblés à la main à partir des plans et des listes de locaux.
    - Lorsque les quantités du descriptif sont établies à part, l'appel d'offres et le projet divergent ; les écarts n'apparaissent qu'au décompte.

    **Objectif et bénéfice**
    - Contrôler les quantités de revêtements de sol et de plinthes local par local et les rattacher au projet.
    - Utiliser la même base de quantités pour l'appel d'offres, la comparaison des offres et le contrôle des factures.

    **Déroulement**
    1. Définir les données requises par local sur le type de revêtement, la surface nette et le périmètre ainsi que le délai de remise, puis les commander à l'équipe d'architecture.
    2. Exiger la liste des locaux et la vue d'ensemble des revêtements, puis vérifier l'attribution complète d'un revêtement à chaque local intérieur et la concordance avec les plans d'appel d'offres.
    3. Valider la vue d'ensemble et la réutiliser comme base pour le descriptif, la comparaison des offres et le contrôle des factures.

    **Livrable**
    - Maquette architecture avec données complètes sur l'usage, le revêtement, la surface et le périmètre.
    - Liste des locaux et vue d'ensemble des revêtements comme base vérifiable de l'appel d'offres.
  it: |-
    La committenza ordina allo studio di architettura un elenco delle pavimentazioni per locale con tipo, superficie e perimetro ricavati dal modello, affinché le quantità del capitolato corrispondano al progetto e non debbano essere determinate di nuovo dai piani.

    **Situazione di partenza**
    - Quantità e tipi di pavimentazione per la gara vengono spesso raccolti a mano da disegni ed elenchi dei locali.
    - Se le quantità del capitolato vengono determinate a parte, gara e progetto divergono; gli scostamenti emergono solo in fase di liquidazione.

    **Obiettivo e beneficio**
    - Verificare locale per locale le quantità di pavimentazione e battiscopa e ricondurle al progetto.
    - Utilizzare la stessa base di quantità per gara, confronto delle offerte e controllo delle fatture.

    **Svolgimento**
    1. Definire i dati richiesti per locale su tipo di pavimentazione, superficie netta e perimetro e il termine di consegna e ordinarli allo studio di architettura.
    2. Richiedere l'elenco dei locali e il quadro delle pavimentazioni e verificare l'assegnazione completa di una pavimentazione a ogni locale interno e la concordanza con i piani di gara.
    3. Approvare il quadro e riutilizzarlo come base per capitolato, confronto delle offerte e controllo delle fatture.

    **Risultato della fornitura**
    - Modello di architettura con dati completi su uso, pavimentazione, superficie e perimetro.
    - Elenco dei locali e quadro generale delle pavimentazioni come base di gara verificabile.
  en: |-
    The client orders from the architecture team a room-by-room flooring schedule with covering type, area, and perimeter from the model, so that quantities in the specification match the design and do not have to be determined again from drawings.

    **Starting point**
    - Flooring quantities and types for tendering are often assembled manually from drawings and room lists.
    - When quantities for the specification are determined separately, the tender and the design drift apart; deviations only surface at final account.

    **Goal & benefit**
    - Check flooring and skirting quantities room by room and trace them back to the design.
    - Use the same quantity basis for tendering, offer comparison, and invoice checking.

    **Process**
    1. Define the required room-by-room information on covering type, net area, and perimeter, and the submission date, and order them from the architecture team.
    2. Request the room list and flooring overview and check that every interior space has a covering assigned and that the data is consistent with the tender drawings.
    3. Approve the overview and reuse it as the basis for the specification, offer comparison, and invoice checking.

    **Deliverable**
    - Architecture model with complete space data on use, floor covering, area, and perimeter.
    - Space list and flooring overview as a verifiable tender basis.
