comment: >-
  Tender preparation (SIA phase 41). Uses space properties FloorCovering,
  NetFloorArea, and NetPerimeter (skirting) – no modelled IfcCovering FLOORING.
  A pivot table groups floor coverings by space into total quantities. For
  construction or particularly complex rooms, model a separate floor-covering
  element; for modelled floor build-up see des-flooring-planning.
