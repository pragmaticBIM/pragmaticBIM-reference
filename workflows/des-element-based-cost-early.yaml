comment: >-
  Early stage, typically phase 31. Cost key:
  ePset_Cost.ProductClass + ePset_Cost.ReferenceQuantity; project rate:
  ePset_Cost.UnitPrice. Component cost is the referenced model quantity times
  the unit rate. Rates and total costs remain in the cost calculation; the
  model carries the shared keys and project rate. ProductClass may be a
  reasoned assumption. abstractBIM can optionally calculate components from
  space relationships and provide that quantity model; it is a tool, not a
  separate workflow. Downstream: DES-ELEMENT-COST-LATE, QAS-COST-PLAUS, DES-LCA.
