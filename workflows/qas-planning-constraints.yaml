comment: Every planning constraint is one IfcBuildingElementProxy (USERDEFINED, ObjectType=Rahmenbedingung). Name is the kind from the value list (Bauenvelope, Flugschneise, Überschwemmungsgebiet, Eisenbahnkorridor, Explosionsschutzgebiet, Zone mit hoher Lärmbelastung, Grundwasserschutzzone, Gewässerraum, Freileitungskorridor, Naturgefahrenzone). Name=Bauenvelope follows Baugrenze, Bauflucht, and Abstaffelung. Complements baurechtliche Parzellen (DES-PARCELS) and surroundings context; not a legal boundary determination.
