id: pragmaticbim:solution-dimension/bauweise
code: SD-05
sort_order: 5
name:
  de: Bauweise
  fr: Mode constructif
  it: Sistema costruttivo
  en: Construction
description:
  de: Konstruktive Bauweise und typische Wandstärken für Achs- und Netzumrisse.
  fr: Mode constructif et épaisseurs de paroi typiques pour les contours d'axes et nets.
  it: Sistema costruttivo e spessori tipici di parete per contorni d'asse e netti.
  en: Construction method and typical wall thicknesses for axis and net outlines.
status: active
scope: building
step: grid
allows_multiple: false
comment: 'No exclusive None option: every building has a construction method.'
options:
- id: pragmaticbim:solution-option/bauweise-massivbau
  code: BW-01
  sort_order: 1
  name:
    de: Massivbau
    fr: Construction massive
    it: Costruzione massiccia
    en: Solid construction
  status: active
  description:
    de: Massive Wände und Decken, typisch Beton oder Mauerwerk.
    fr: Parois et planchers massifs, typiquement béton ou maçonnerie.
    it: Pareti e solai massicci, tipicamente calcestruzzo o muratura.
    en: Solid walls and slabs, typically concrete or masonry.
  parameters:
  - jurisdiction: general
    values:
      wall_exterior:
        value: 0.45
      wall_party_wall:
        value: 0.25
      wall_interior:
        value: 0.12
      wall_shaft:
        value: 0.15
  comment: Typical early-phase build-ups as assumption (exterior incl. insulation 0.45, party wall 0.25,
    interior 0.12, shaft 0.15).
