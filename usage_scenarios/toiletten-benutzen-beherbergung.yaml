id: pragmaticbim:usage-scenario/toiletten-benutzen-beherbergung
code: US-BH-07
sort_order: 7
name:
  de: Toiletten benutzen
  fr: Utiliser les toilettes
  it: Usare i servizi igienici
  en: Using the toilets
description:
  de: Gäste und Besuchende in den öffentlichen Bereichen brauchen während ihres Aufenthalts Toiletten,
    auch mit Rollstuhl. Die Aufteilung entscheidet über Anzahl, Fläche und wie flexibel die Toiletten
    belegt werden.
  fr: Les hôtes et visiteurs des espaces publics ont besoin de toilettes pendant leur séjour, y compris
    en fauteuil roulant. La répartition détermine le nombre, la surface et la flexibilité d'occupation.
  it: Ospiti e visitatori nelle aree pubbliche hanno bisogno di servizi igienici durante la permanenza,
    anche in sedia a rotelle. La suddivisione determina numero, superficie e flessibilità d'uso.
  en: Guests and visitors in the public areas need toilets during their stay, including wheelchair users.
    The split determines number, area, and how flexibly the toilets can be used.
uses:
- pragmaticbim:use/beherbergung
tags:
- sanitaer
status: active
jurisdiction:
- general
