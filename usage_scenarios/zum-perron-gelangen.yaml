id: pragmaticbim:usage-scenario/zum-perron-gelangen
code: US-VE-06
sort_order: 1
name:
  de: Zum Perron gelangen
  fr: Accéder au quai
  it: Raggiungere il marciapiede
  en: Reaching the platform
description:
  de: Reisende gelangen mit Gepäck, Kinderwagen oder Rollstuhl von der Halle zum Perron. Die Erschliessung
    entscheidet über Umsteigezeit, Hindernisfreiheit und Personenfluss.
  fr: Les voyageurs vont du hall au quai avec bagages, poussette ou fauteuil roulant. La desserte détermine
    le temps de correspondance, l'accès sans obstacle et les flux de personnes.
  it: I viaggiatori vanno dall'atrio al marciapiede con bagagli, passeggino o sedia a rotelle. L'accesso
    determina tempi di coincidenza, assenza di ostacoli e flussi di persone.
  en: Passengers travel from the hall to the platform with luggage, pushchairs, or wheelchairs. The access
    arrangement determines transfer time, step-free access, and passenger flow.
scope: use
uses:
- pragmaticbim:use/verkehr
tags:
- erschliessung
status: active
jurisdiction:
- general
