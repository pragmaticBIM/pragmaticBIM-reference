id: pragmaticbim:usage-scenario/verkaufte-waren-abholen
code: US-VK-05
sort_order: 6
name:
  de: Verkaufte Waren abholen
  fr: Retirer les marchandises achetées
  it: Ritirare la merce acquistata
  en: Collecting purchased goods
description:
  de: Kundschaft holt online bestellte oder grosse gekaufte Waren ab. Die Ausgabe entscheidet über Wartezeit,
    Nähe zum Lager und Zufahrt mit dem Auto.
  fr: La clientèle retire des marchandises commandées en ligne ou des achats volumineux. Le retrait détermine
    le temps d'attente, la proximité du stock et l'accès en voiture.
  it: La clientela ritira merci ordinate online o acquisti voluminosi. Il ritiro determina tempi di attesa,
    vicinanza al magazzino e accesso in auto.
  en: Customers collect goods ordered online or bulky purchases. Collection determines waiting time, proximity
    to stock, and car access.
scope: use
uses:
- pragmaticbim:use/verkauf
tags:
- abholung
status: active
jurisdiction:
- general
