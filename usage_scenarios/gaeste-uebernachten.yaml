id: pragmaticbim:usage-scenario/gaeste-uebernachten
code: US-WH-03
sort_order: 8
name:
  de: Gäste übernachten
  fr: Hôtes qui restent la nuit
  it: Ospiti che pernottano
  en: Overnight guests
description:
  de: Besuch übernachtet gelegentlich. Ein eigener Schlafplatz entscheidet, ob Gäste
    getrennt vom Haushalt schlafen.
  fr: Des visiteurs passent parfois la nuit. Un couchage à part décide si les hôtes
    dorment à l'écart du ménage.
  it: Ogni tanto gli ospiti pernottano. Un posto letto proprio decide se dormono separati
    dal nucleo domestico.
  en: Visitors stay overnight now and then. A bed of their own decides whether guests
    sleep apart from the household.
