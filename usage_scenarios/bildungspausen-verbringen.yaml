sort_order: 5
name:
  de: Pausen verbringen
  fr: Passer les pauses
  it: Trascorrere le pause
  en: Spending breaks
description:
  de: Lernende verbringen Pausen gemeinsam. Der Aufenthaltsort entscheidet über Aufsicht, Lärm und die
    Nutzung von Innen- und Aussenflächen.
  fr: Les apprenants passent les pauses ensemble. Le lieu de séjour détermine la surveillance, le bruit
    et l'usage des espaces intérieurs et extérieurs.
  it: I discenti trascorrono insieme le pause. Il luogo determina sorveglianza, rumore e uso degli spazi
    interni ed esterni.
  en: Learners spend breaks together. The location determines supervision, noise, and the use of indoor
    and outdoor areas.
