id: pragmaticbim:usage-scenario/bioabfall-entsorgen-wohnen
code: US-WH-21
sort_order: 19
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Bewohnende bringen Speise- und Grünabfälle regelmässig getrennt vom übrigen Abfall weg. Der
    Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Les habitants évacuent régulièrement les déchets alimentaires et verts, séparément des autres
    déchets. Le point de collecte détermine les odeurs, le refroidissement et le rythme
    d'enlèvement.
  it: Gli abitanti conferiscono regolarmente scarti alimentari e verdi, separati dagli altri rifiuti.
    Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Residents regularly take food and green waste away, separately from other waste. The collection
    point determines odour, cooling, and how often it is collected.
uses:
- pragmaticbim:use/wohnen
tags:
- entsorgung
status: active
jurisdiction:
- general
