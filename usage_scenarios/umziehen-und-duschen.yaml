name:
  de: Umziehen und duschen
  fr: Se changer et se doucher
  it: Cambiarsi e fare la doccia
  en: Changing and showering
description:
  de: Sporttreibende ziehen sich vor und nach dem Training um. Getrennte Garderoben entscheiden über Belegung,
    Geschlechtertrennung und Hygiene.
  fr: Les sportifs se changent avant et après l'entraînement. Des vestiaires séparés déterminent l'occupation,
    la séparation des sexes et l'hygiène.
  it: Gli sportivi si cambiano prima e dopo l'allenamento. Spogliatoi separati determinano occupazione,
    separazione per sesso e igiene.
  en: Athletes change before and after training. Separate changing rooms determine booking, gender separation,
    and hygiene.
