id: pragmaticbim:usage-scenario/kundschaft-beraten
code: US-VK-02
sort_order: 3
name:
  de: Kundschaft beraten
  fr: Conseiller la clientèle
  it: Consigliare la clientela
  en: Advising customers
description:
  de: Kundschaft braucht Beratung, Service oder eine Reklamation abseits der Kasse. Ein eigener Bereich
    entscheidet über Diskretion, Wartezeit und Fläche auf der Verkaufsfläche.
  fr: La clientèle a besoin de conseils, d'un service ou d'une réclamation à l'écart de la caisse. Un
    espace dédié détermine la discrétion, le temps d'attente et la surface de vente.
  it: La clientela necessita di consulenza, assistenza o un reclamo lontano dalla cassa. Un'area dedicata
    determina riservatezza, tempi di attesa e superficie di vendita.
  en: Customers need advice, service, or a complaint handled away from the checkout. A dedicated area
    determines discretion, waiting time, and sales floor area.
uses:
- pragmaticbim:use/verkauf
tags:
- beratung
status: active
jurisdiction:
- general
