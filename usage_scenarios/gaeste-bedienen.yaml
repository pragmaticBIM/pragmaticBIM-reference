sort_order: 2
name:
  de: Gäste bedienen
  fr: Servir les clients
  it: Servire gli ospiti
  en: Serving guests
description:
  de: Gäste bestellen und konsumieren Speisen und Getränke. Das Bedienkonzept entscheidet über Bewegung,
    Aufenthaltsdauer und Gastraumfläche.
  fr: Les clients commandent et consomment des mets et boissons. Le concept de service détermine les déplacements,
    la durée de séjour et la surface d'accueil.
  it: Gli ospiti ordinano e consumano cibi e bevande. Il concetto di servizio determina movimenti, permanenza
    e superficie per gli ospiti.
  en: Guests order and consume food and drink. The service concept determines movement, dwell time, and
    dining area.
