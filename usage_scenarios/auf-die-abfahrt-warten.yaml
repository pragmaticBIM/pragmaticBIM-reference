id: pragmaticbim:usage-scenario/auf-die-abfahrt-warten
code: US-VE-03
sort_order: 4
name:
  de: Auf die Abfahrt warten
  fr: Attendre le départ
  it: Attendere la partenza
  en: Waiting for departure
description:
  de: Reisende warten vor der Abfahrt, teils mit Gepäck oder Kindern. Geschützte Wartebereiche entscheiden
    über Komfort, Wetterschutz und Fläche.
  fr: Les voyageurs attendent avant le départ, parfois avec des bagages ou des enfants. Des zones d'attente
    abritées déterminent le confort, la protection contre les intempéries et la surface.
  it: I viaggiatori attendono prima della partenza, talvolta con bagagli o bambini. Zone di attesa riparate
    determinano comfort, protezione dalle intemperie e superficie.
  en: Passengers wait before departure, sometimes with luggage or children. Sheltered waiting areas determine
    comfort, weather protection, and area.
