id: pragmaticbim:usage-scenario/material-anliefern
code: US-PR-03
sort_order: 4
name:
  de: Material anliefern
  fr: Livrer les matériaux
  it: Consegnare i materiali
  en: Delivering materials
description:
  de: Rohmaterial und Halbfabrikate kommen per Lastwagen an. Die Anlieferung entscheidet über Hofflächen,
    Lagerbestand und Wege zur Fertigung.
  fr: Les matières premières et produits semi-finis arrivent par camion. La livraison détermine les surfaces
    de cour, les stocks et les chemins vers la fabrication.
  it: Materie prime e semilavorati arrivano su camion. La consegna determina superfici di piazzale, scorte
    e percorsi verso la produzione.
  en: Raw materials and semi-finished goods arrive by truck. Delivery determines yard area, stock levels,
    and routes to production.
uses:
- pragmaticbim:use/produktion
tags:
- logistik
status: active
jurisdiction:
