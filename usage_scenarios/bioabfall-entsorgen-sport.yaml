id: pragmaticbim:usage-scenario/bioabfall-entsorgen-sport
code: US-SP-09
sort_order: 9
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Vereine und Einzelne bringen Speise- und Grünabfälle nach dem Training getrennt vom übrigen
    Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Clubs et particuliers évacuent les déchets alimentaires et verts après l'entraînement,
    séparément des autres déchets. Le point de collecte détermine les odeurs, le refroidissement et
    le rythme d'enlèvement.
  it: Società e singoli conferiscono scarti alimentari e verdi dopo l'allenamento, separati dagli
    altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Clubs and individuals take food and green waste away after training, separately from other
    waste. The collection point determines odour, cooling, and how often it is collected.
scope: use
uses:
- pragmaticbim:use/sport
tags:
- entsorgung
status: active
jurisdiction:
- general
