id: pragmaticbim:usage-scenario/kommissionieren-und-verpacken
code: US-LO-03
sort_order: 4
name:
  de: Kommissionieren und verpacken
  fr: Préparer et emballer les commandes
  it: Preparare e imballare gli ordini
  en: Picking and packing
description:
  de: Bestellungen werden zusammengestellt und versandfertig gemacht. Die Kommissionierung entscheidet
    über Wege, Arbeitsplätze und Pufferflächen.
  fr: Les commandes sont préparées et conditionnées pour l'expédition. La préparation détermine les chemins,
    les postes de travail et les surfaces tampons.
  it: Gli ordini vengono preparati e resi pronti per la spedizione. La preparazione determina percorsi,
    postazioni e superfici di transito.
  en: Orders are picked and made ready for shipping. Picking determines routes, workstations, and buffer
    areas.
