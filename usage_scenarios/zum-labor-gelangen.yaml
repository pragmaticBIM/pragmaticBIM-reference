id: pragmaticbim:usage-scenario/zum-labor-gelangen
code: US-LA-06
sort_order: 1
name:
  de: Zum Labor gelangen
  fr: Accéder au laboratoire
  it: Raggiungere il laboratorio
  en: Reaching the laboratory
description:
  de: Forschende, Proben und Material gelangen auf die Laborgeschosse. Die Erschliessung entscheidet über
    Zutrittskontrolle, Gefahrstofftransport und die Trennung von Personen- und Materialwegen.
  fr: Chercheurs, échantillons et matériel rejoignent les étages de laboratoire. La desserte détermine
    le contrôle d'accès, le transport de matières dangereuses et la séparation des parcours personnes
    et matériel.
  it: Ricercatori, campioni e materiale raggiungono i piani di laboratorio. L'accesso determina controllo
    degli accessi, trasporto di sostanze pericolose e separazione dei percorsi persone e materiali.
  en: Researchers, samples, and supplies reach the laboratory floors. The access arrangement determines
    access control, hazardous goods transport, and separation of people and material routes.
uses:
- pragmaticbim:use/labor
tags:
- erschliessung
status: active
jurisdiction:
- general
