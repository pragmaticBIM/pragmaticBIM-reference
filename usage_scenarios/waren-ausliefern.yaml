name:
  de: Waren ausliefern
  fr: Livrer les marchandises
  it: Spedire le merci
  en: Dispatching goods
description:
  de: Lastwagen holen kommissionierte Ware ab und stehen bis zur Abfahrt bereit. Die Abstellplätze entscheiden
    über Hoffläche, Witterungsschutz und Lärm.
  fr: Les camions enlèvent les commandes préparées et attendent le départ. Les places de stationnement
    déterminent la surface de cour, la protection contre les intempéries et le bruit.
  it: I camion ritirano la merce preparata e attendono la partenza. I posteggi determinano superficie
    del piazzale, protezione dalle intemperie e rumore.
  en: Trucks collect picked goods and wait until departure. Truck bays determine yard area, weather protection,
    and noise.
