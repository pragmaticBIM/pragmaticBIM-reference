id: pragmaticbim:usage-scenario/qualitaet-pruefen
code: US-PR-02
sort_order: 3
name:
  de: Qualität prüfen
  fr: Contrôler la qualité
  it: Controllare la qualità
  en: Checking quality
description:
  de: Teile und Produkte werden vor der Auslieferung geprüft. Die Prüfumgebung entscheidet über Raumklima,
    Erschütterungsschutz und Nähe zur Fertigung.
  fr: Les pièces et produits sont contrôlés avant livraison. L'environnement de contrôle détermine le
    climat intérieur, la protection contre les vibrations et la proximité de la fabrication.
  it: Pezzi e prodotti vengono controllati prima della consegna. L'ambiente di prova determina clima interno,
    protezione dalle vibrazioni e vicinanza alla produzione.
  en: Parts and products are checked before delivery. The test environment determines indoor climate,
    vibration protection, and proximity to production.
use: pragmaticbim:use/produktion
tags:
- qualitaet
status: active
jurisdiction:
- general
