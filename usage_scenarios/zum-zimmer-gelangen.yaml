id: pragmaticbim:usage-scenario/zum-zimmer-gelangen
code: US-BH-06
sort_order: 1
name:
  de: Zum Zimmer gelangen
  fr: Accéder à la chambre
  it: Raggiungere la camera
  en: Reaching the room
description:
  de: Gäste gelangen mit Gepäck zu ihren Zimmern, Personal bewegt Wäsche und Material zwischen den Etagen.
    Die Erschliessung entscheidet über Hindernisfreiheit, Ruhe und die Trennung von Gäste- und Servicewegen.
  fr: Les clients rejoignent leur chambre avec leurs bagages, le personnel déplace linge et matériel entre
    les étages. La desserte détermine l'accès sans obstacle, le calme et la séparation des parcours clients
    et service.
  it: Gli ospiti raggiungono la camera con i bagagli, il personale sposta biancheria e materiale tra i
    piani. L'accesso determina assenza di ostacoli, quiete e separazione dei percorsi ospiti e servizio.
  en: Guests reach their rooms with luggage while staff move linen and supplies between floors. The access
    arrangement determines step-free access, quiet, and separation of guest and service routes.
use: pragmaticbim:use/beherbergung
tags:
- erschliessung
status: active
jurisdiction:
- general
