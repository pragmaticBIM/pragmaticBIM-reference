id: pragmaticbim:usage-scenario/wohnen-im-freien
code: US-WH-07
sort_order: 16
name:
  de: Wohnen im Freien
  fr: Habiter dehors
  it: Abitare all'aperto
  en: Living outdoors
description:
  de: Bewohnende halten sich draussen auf, ohne das Haus zu verlassen. Ein privater
    Aussenraum am Wohnzimmer entscheidet über den direkten Ausgang ins Freie.
  fr: Les habitants profitent du plein air sans quitter la maison. Un espace extérieur
    privé attenant au séjour décide d'une sortie directe dehors.
  it: Gli abitanti stanno all'aperto senza lasciare la casa. Uno spazio esterno privato
    accanto al soggiorno decide l'uscita diretta all'aperto.
  en: Residents spend time outdoors without leaving home. A private outdoor space
    by the living room decides direct access to the outside.
scope: unit
uses:
- pragmaticbim:use/wohnen
tags:
- aussenraum
status: active
