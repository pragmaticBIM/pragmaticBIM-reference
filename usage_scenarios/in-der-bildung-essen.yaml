sort_order: 6
name:
  de: Essen und trinken
  fr: Manger et boire
  it: Mangiare e bere
  en: Eating and drinking
description:
  de: Lernende und Mitarbeitende verpflegen sich während des Bildungstags. Das Angebot entscheidet über
    Wege, Aufenthaltsdauer und zusätzliche Fläche.
  fr: Les apprenants et le personnel se restaurent pendant la journée. L'offre détermine les trajets,
    la durée de séjour et la surface supplémentaire.
  it: Discenti e personale si ristorano durante la giornata. L'offerta determina percorsi, durata della
    permanenza e superficie aggiuntiva.
  en: Learners and staff eat during the education day. The provision determines travel, dwell time, and
    additional area.
