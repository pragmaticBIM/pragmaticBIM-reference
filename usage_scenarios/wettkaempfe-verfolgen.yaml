description:
  de: Zuschauende verfolgen Spiele und Wettkämpfe vor Ort. Eine Tribüne entscheidet über Zuschauerzahl,
    Fluchtwege und Hallenvolumen.
  fr: Les spectateurs suivent les matchs et compétitions sur place. Une tribune détermine le nombre de
    spectateurs, les voies d'évacuation et le volume de la salle.
  it: Gli spettatori seguono partite e gare sul posto. Una tribuna determina numero di spettatori, vie
    di fuga e volume della palestra.
  en: Spectators watch games and competitions on site. A stand determines spectator numbers, escape routes,
    and hall volume.
