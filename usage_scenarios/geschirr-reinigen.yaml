id: pragmaticbim:usage-scenario/geschirr-reinigen
code: US-GA-05
sort_order: 6
name:
  de: Geschirr reinigen
  fr: Nettoyer la vaisselle
  it: Lavare le stoviglie
  en: Washing dishes
description:
  de: Gebrauchtes Geschirr wird während des Betriebs zurückgebracht und gereinigt. Der Ort entscheidet
    über Rücklaufwege, Lärm und die Trennung von sauber und gebraucht.
  fr: La vaisselle utilisée est rapportée et nettoyée pendant le service. Le lieu détermine les circuits
    de retour, le bruit et la séparation du propre et du sale.
  it: Le stoviglie usate vengono riportate e lavate durante il servizio. Il luogo determina percorsi di
    ritorno, rumore e separazione tra pulito e sporco.
  en: Used dishes are returned and washed during service. The location determines return routes, noise,
    and separation of clean and used items.
