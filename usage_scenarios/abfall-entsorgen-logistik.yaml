id: pragmaticbim:usage-scenario/abfall-entsorgen-logistik
code: US-LO-07
sort_order: 7
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Der Betrieb bringt Verpackungs- und Restabfall regelmässig weg. Die getrennten Arten entscheiden
    über Fläche, Lüftung und Wege zur Sammelstelle.
  fr: L'exploitation évacue régulièrement les déchets d'emballage et les déchets résiduels. Les
    fractions séparées déterminent la surface, la ventilation et les chemins vers le point de
    collecte.
  it: L'esercizio conferisce regolarmente imballaggi e rifiuti residui. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: The operation regularly takes packaging and residual waste away. The separated fractions
    determine area, ventilation, and routes to the collection point.
scope: use
