id: pragmaticbim:usage-scenario/beobachten-und-pflegen
code: US-HE-05
sort_order: 6
name:
  de: Beobachten und pflegen
  fr: Observer et soigner
  it: Osservare e assistere
  en: Observing and caring
description:
  de: Patientinnen und Patienten bleiben nach einer Behandlung oder über Nacht unter Beobachtung. Die
    Aufenthaltsdauer entscheidet über Privatheit, Überwachung und Pflegewege.
  fr: Les patients restent sous observation après un traitement ou pendant la nuit. La durée détermine
    l'intimité, la surveillance et les parcours de soins.
  it: I pazienti restano in osservazione dopo un trattamento o durante la notte. La durata determina riservatezza,
    sorveglianza e percorsi assistenziali.
  en: Patients remain under observation after treatment or overnight. Length of stay determines privacy,
    monitoring, and care routes.
uses:
- pragmaticbim:use/gesundheit
tags:
- pflege
status: active
jurisdiction:
- general
