id: pragmaticbim:usage-scenario/veranstaltungen-besuchen
code: US-VS-01
sort_order: 2
name:
  de: Veranstaltungen besuchen
  fr: Assister à des manifestations
  it: Assistere a eventi
  en: Attending events
description:
  de: Publikum besucht Konzerte, Vorträge oder Versammlungen. Das Saalkonzept entscheidet über Sitzordnung,
    Flexibilität und Raumhöhe.
  fr: Le public assiste à des concerts, conférences ou assemblées. Le concept de salle détermine la disposition
    des sièges, la flexibilité et la hauteur.
  it: Il pubblico assiste a concerti, conferenze o assemblee. Il concetto di sala determina disposizione
    dei posti, flessibilità e altezza.
  en: Audiences attend concerts, lectures, or assemblies. The hall concept determines seating, flexibility,
    and room height.
uses:
- pragmaticbim:use/versammlung
tags:
- veranstaltung
status: active
jurisdiction:
- general
