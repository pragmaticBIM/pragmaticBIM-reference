id: pragmaticbim:usage-scenario/zum-unterricht-gelangen
code: US-BI-07
sort_order: 1
name:
  de: Zum Unterricht gelangen
  fr: Se rendre en cours
  it: Raggiungere le lezioni
  en: Getting to class
description:
  de: Lernende und Lehrpersonen wechseln zu Beginn und Ende der Pausen gleichzeitig die Räume. Die Erschliessung
    entscheidet über Gedränge, Hindernisfreiheit und Fluchtwege.
  fr: Élèves et enseignants changent de salle en même temps au début et à la fin des pauses. La desserte
    détermine l'affluence, l'accès sans obstacle et les voies d'évacuation.
  it: Allievi e docenti cambiano aula contemporaneamente all'inizio e alla fine delle pause. L'accesso
    determina affollamento, assenza di ostacoli e vie di fuga.
  en: Learners and teachers change rooms at the same time at the start and end of breaks. The access arrangement
    determines crowding, step-free access, and escape routes.
use: pragmaticbim:use/bildung
tags:
- erschliessung
status: active
jurisdiction:
- general
