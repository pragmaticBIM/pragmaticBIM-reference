code: US-GE-02
sort_order: 2
name:
  de: Toiletten benutzen
  fr: Utiliser les toilettes
  it: Usare i servizi igienici
  en: Using the toilets
description:
  de: Nutzende und Besuchende brauchen während ihres Aufenthalts Toiletten, auch mit Rollstuhl.
    Die Aufteilung entscheidet über Anzahl, Fläche und wie flexibel die Toiletten belegt werden.
  fr: Les usagers et les visiteurs ont besoin de toilettes pendant leur présence, y compris en
    fauteuil roulant. La répartition détermine le nombre, la surface et la flexibilité d'occupation.
  it: Utenti e visitatori hanno bisogno di servizi igienici durante la permanenza, anche in sedia a
    rotelle. La suddivisione determina numero, superficie e flessibilità d'uso.
  en: Users and visitors need toilets during their stay, including wheelchair users. The split
    determines number, area, and how flexibly the toilets can be used.
