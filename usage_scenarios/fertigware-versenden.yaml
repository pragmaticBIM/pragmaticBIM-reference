id: pragmaticbim:usage-scenario/fertigware-versenden
code: US-PR-04
sort_order: 5
name:
  de: Fertigware verpacken und versenden
  fr: Emballer et expédier les produits finis
  it: Imballare e spedire i prodotti finiti
  en: Packing and shipping finished goods
description:
  de: Fertige Produkte werden verpackt, bereitgestellt und abgeholt. Der Versand entscheidet über Pufferflächen
    und die Trennung von Anlieferung und Auslieferung.
  fr: Les produits finis sont emballés, préparés et enlevés. L'expédition détermine les surfaces tampons
    et la séparation entre réception et expédition.
  it: I prodotti finiti vengono imballati, preparati e ritirati. La spedizione determina superfici di
    transito e separazione tra arrivi e partenze.
  en: Finished products are packed, staged, and collected. Shipping determines buffer areas and the separation
    of inbound and outbound goods.
scope: use
uses:
- pragmaticbim:use/produktion
tags:
- versand
status: active
jurisdiction:
- general
