id: pragmaticbim:usage-scenario/zum-arbeitsplatz-gelangen
code: US-WR-08
sort_order: 1
name:
  de: Zum Arbeitsplatz gelangen
  fr: Accéder au poste de travail
  it: Raggiungere il posto di lavoro
  en: Reaching the workplace
description:
  de: Mitarbeitende und Besuchende gelangen vom Eingang zu den Arbeitsplätzen auf allen Geschossen. Die
    Erschliessung entscheidet über Wege, Hindernisfreiheit und Flächenbedarf.
  fr: Le personnel et les visiteurs vont de l'entrée aux postes de travail à tous les étages. La desserte
    détermine les parcours, l'accès sans obstacle et la surface nécessaire.
  it: Personale e visitatori vanno dall'ingresso alle postazioni su tutti i piani. L'accesso determina
    percorsi, assenza di ostacoli e fabbisogno di superficie.
  en: Staff and visitors travel from the entrance to workplaces on every floor. The access arrangement
    determines routes, step-free access, and area demand.
use: pragmaticbim:use/arbeit
tags:
- erschliessung
status: active
jurisdiction:
- general
