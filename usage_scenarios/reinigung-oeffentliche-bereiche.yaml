name:
  de: Reinigung von öffentlichen Bereichen
  fr: Nettoyage des parties communes
  it: Pulizia delle parti comuni
  en: Cleaning of common areas
description:
  de: Gemeinsame Räume werden regelmässig gereinigt. Die Wahl entscheidet, ob das
    Gebäude Raum für Reinigungsmaterial braucht.
  fr: Les parties communes sont nettoyées régulièrement. Le choix décide si le bâtiment
    a besoin d'un local pour le matériel de nettoyage.
  it: Le parti comuni vengono pulite regolarmente. La scelta decide se l'edificio
    necessita di un locale per il materiale di pulizia.
  en: Shared rooms are cleaned regularly. The choice decides whether the building
    needs space for cleaning supplies.
