id: pragmaticbim:usage-scenario/proben-und-material-lagern
code: US-LA-02
sort_order: 3
name:
  de: Proben und Material lagern
  fr: Stocker échantillons et matériel
  it: Conservare campioni e materiale
  en: Storing samples and supplies
description:
  de: Proben, Reagenzien und Verbrauchsmaterial werden bis zur Verwendung aufbewahrt. Die Lagerbedingungen
    entscheiden über Temperatur, Zugriff und Nachverfolgbarkeit.
  fr: Échantillons, réactifs et consommables sont conservés jusqu'à leur utilisation. Les conditions de
    stockage déterminent la température, l'accès et la traçabilité.
  it: Campioni, reagenti e materiale di consumo vengono conservati fino all'uso. Le condizioni di deposito
    determinano temperatura, accesso e tracciabilità.
  en: Samples, reagents, and consumables are kept until use. Storage conditions determine temperature,
    access, and traceability.
scope: use
uses:
- pragmaticbim:use/labor
tags:
- lagerung
status: active
jurisdiction:
- general
