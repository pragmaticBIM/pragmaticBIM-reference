id: pragmaticbim:usage-scenario/abfall-entsorgen-verkauf
code: US-VK-08
sort_order: 8
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Personal und Kundschaft bringen während der Öffnungszeit Abfall weg. Die getrennten Arten
    entscheiden über Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Le personnel et la clientèle évacuent les déchets pendant les heures d'ouverture. Les fractions
    séparées déterminent la surface, la ventilation et les chemins vers le point de collecte.
  it: Personale e clientela conferiscono i rifiuti durante l'orario di apertura. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Staff and customers take waste away during opening hours. The separated fractions determine
    area, ventilation, and routes to the collection point.
scope: use
uses:
- pragmaticbim:use/verkauf
tags:
- entsorgung
status: active
jurisdiction:
- general
allows_multiple: true
