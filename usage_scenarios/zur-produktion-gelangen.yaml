id: pragmaticbim:usage-scenario/zur-produktion-gelangen
code: US-PR-06
sort_order: 1
name:
  de: Zur Produktion gelangen
  fr: Accéder à la production
  it: Raggiungere la produzione
  en: Reaching production
description:
  de: Mitarbeitende und Material gelangen auf die Produktionsgeschosse. Die Erschliessung entscheidet
    über Lasten, Materialfluss und die Trennung von Personen- und Warenwegen.
  fr: Le personnel et les matériaux rejoignent les étages de production. La desserte détermine les charges,
    le flux de matières et la séparation des parcours personnes et marchandises.
  it: Personale e materiali raggiungono i piani produttivi. L'accesso determina carichi, flusso dei materiali
    e separazione dei percorsi persone e merci.
  en: Staff and materials reach the production floors. The access arrangement determines loads, material
    flow, and separation of people and goods routes.
uses:
- pragmaticbim:use/produktion
tags:
- erschliessung
status: active
jurisdiction:
- general
