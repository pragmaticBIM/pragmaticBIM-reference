sort_order: 2
name:
  de: Waren präsentieren und verkaufen
  fr: Présenter et vendre des marchandises
  it: Esporre e vendere merci
  en: Displaying and selling goods
description:
  de: Kundschaft sieht Waren, wählt aus und bezahlt. Das Verkaufskonzept entscheidet über Fläche, Warenpräsenz
    und Personalbedarf.
  fr: La clientèle découvre les marchandises, choisit et paie. Le concept de vente détermine la surface,
    la présentation des produits et les besoins en personnel.
  it: La clientela vede le merci, sceglie e paga. Il concetto di vendita determina superficie, esposizione
    delle merci e fabbisogno di personale.
  en: Customers browse goods, choose, and pay. The retail concept determines area, product display, and
    staffing.
