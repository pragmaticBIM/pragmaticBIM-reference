id: pragmaticbim:usage-scenario/abfall-entsorgen-verkehr
code: US-VE-08
sort_order: 8
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Reisende und der Betrieb bringen während des Aufenthalts Abfall weg. Die getrennten Arten
    entscheiden über Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Les voyageurs et l'exploitation évacuent les déchets pendant le séjour. Les fractions séparées
    déterminent la surface, la ventilation et les chemins vers le point de collecte.
  it: I viaggiatori e l'esercizio conferiscono i rifiuti durante la permanenza. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Passengers and the operation take waste away during the stay. The separated fractions determine
    area, ventilation, and routes to the collection point.
uses:
- pragmaticbim:use/verkehr
tags:
- entsorgung
status: active
jurisdiction:
- general
allows_multiple: true
