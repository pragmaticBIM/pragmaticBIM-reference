id: pragmaticbim:usage-scenario/server-unterbringen
code: US-WR-07
sort_order: 8
name:
  de: Server unterbringen
  fr: Héberger les serveurs
  it: Ospitare i server
  en: Housing servers
description:
  de: Das Unternehmen betreibt eigene Server und Netzwerktechnik. Der Standort der IT entscheidet über
    Technikfläche, Kühlung und Ausfallsicherheit.
  fr: L'entreprise exploite ses propres serveurs et équipements réseau. L'emplacement de l'informatique
    détermine la surface technique, le refroidissement et la disponibilité.
  it: L'azienda gestisce server e apparecchiature di rete propri. L'ubicazione dell'IT determina superficie
    tecnica, raffreddamento e disponibilità.
  en: The organization runs its own servers and network equipment. The location of IT determines plant
    area, cooling, and availability.
