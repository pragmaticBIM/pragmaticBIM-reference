id: pragmaticbim:usage-scenario/abstellen
code: US-WH-10
sort_order: 12
name:
  de: Abstellen
  fr: Ranger
  it: Riporre
  en: Storing household goods
description:
  de: Haushalte lagern Dinge, die sie selten brauchen. Der Ort entscheidet, was in
    der Wohnung Platz braucht und was ausserhalb liegt.
  fr: Les ménages rangent ce dont ils se servent rarement. L'emplacement décide de
    ce qui prend place dans le logement et de ce qui reste dehors.
  it: Le economie domestiche ripongono ciò che usano di rado. Il posto decide che
    cosa occupa spazio nell'alloggio e che cosa resta fuori.
  en: Households store things they rarely use. The place decides what takes space
    in the dwelling and what is kept outside it.
uses:
- pragmaticbim:use/wohnen
tags:
- haushalt
status: active
jurisdiction:
- general
allows_multiple: true
