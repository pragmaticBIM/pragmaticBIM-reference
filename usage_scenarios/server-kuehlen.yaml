id: pragmaticbim:usage-scenario/server-kuehlen
code: US-RZ-03
sort_order: 4
name:
  de: Server kühlen
  fr: Refroidir les serveurs
  it: Raffreddare i server
  en: Cooling servers
description:
  de: Die Server geben laufend Wärme ab. Das Kühlkonzept entscheidet über Kälteleistung, Abwärmenutzung
    und Technikfläche.
  fr: Les serveurs dégagent de la chaleur en continu. Le concept de refroidissement détermine la puissance
    frigorifique, la valorisation des rejets thermiques et la surface technique.
  it: I server producono calore in continuo. Il concetto di raffreddamento determina potenza frigorifera,
    recupero del calore e superficie tecnica.
  en: Servers give off heat continuously. The cooling concept determines cooling capacity, waste-heat
    use, and plant area.
