description:
  de: Kinder spielen draussen in der Nähe der Wohnung. Die Wahl entscheidet, ob das
    Grundstück dafür eine Spielfläche bietet.
  fr: Les enfants jouent dehors près du logement. Le choix décide si la parcelle offre
    une aire de jeux.
