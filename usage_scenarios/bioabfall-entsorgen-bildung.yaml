id: pragmaticbim:usage-scenario/bioabfall-entsorgen-bildung
code: US-BI-10
sort_order: 10
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Lernende und Lehrende bringen Speise- und Grünabfälle während des Aufenthalts getrennt vom
    übrigen Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Les apprenants et les enseignants évacuent les déchets alimentaires et verts pendant leur
    présence, séparément des autres déchets. Le point de collecte détermine les odeurs, le
    refroidissement et le rythme d'enlèvement.
  it: Discenti e docenti conferiscono scarti alimentari e verdi durante la permanenza, separati dagli
    altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Learners and teachers take food and green waste away during their stay, separately from other
    waste. The collection point determines odour, cooling, and how often it is collected.
use: pragmaticbim:use/bildung
tags:
- entsorgung
status: active
jurisdiction:
- general
