id: pragmaticbim:usage-scenario/zur-station-gelangen
code: US-HE-08
sort_order: 1
name:
  de: Zur Station gelangen
  fr: Accéder à l'unité de soins
  it: Raggiungere il reparto
  en: Reaching the ward
description:
  de: Patientinnen und Patienten werden liegend zwischen Station, Diagnostik und Operation transportiert,
    Besuchende und Material nutzen dieselben Geschosse. Die Erschliessung entscheidet über Bettentransport,
    Hygiene und die Trennung der Wege.
  fr: Les patients sont transportés alités entre l'unité, le diagnostic et le bloc, visiteurs et matériel
    utilisent les mêmes étages. La desserte détermine le transport des lits, l'hygiène et la séparation
    des parcours.
  it: I pazienti vengono trasportati a letto tra reparto, diagnostica e sala operatoria, visitatori e
    materiale usano gli stessi piani. L'accesso determina trasporto dei letti, igiene e separazione dei
    percorsi.
  en: Patients are moved in beds between ward, diagnostics, and surgery while visitors and supplies use
    the same floors. The access arrangement determines bed transport, hygiene, and separation of routes.
uses:
- pragmaticbim:use/gesundheit
tags:
- erschliessung
status: active
jurisdiction:
- general
