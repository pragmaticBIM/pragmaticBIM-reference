id: pragmaticbim:usage-scenario/praktisch-lernen
code: US-BI-03
sort_order: 4
name:
  de: Praktisch lernen
  fr: Apprendre par la pratique
  it: Apprendere con la pratica
  en: Practical learning
description:
  de: Lernende führen Versuche, gestalterische oder handwerkliche Arbeiten aus. Die Tätigkeit entscheidet
    über Ausstattung, Sicherheit und Flächenbedarf.
  fr: Les apprenants réalisent des expériences ou des travaux créatifs et manuels. L'activité détermine
    l'équipement, la sécurité et la surface nécessaire.
  it: I discenti svolgono esperimenti o lavori creativi e manuali. L'attività determina attrezzature,
    sicurezza e fabbisogno di superficie.
  en: Learners carry out experiments or creative and manual work. The activity determines equipment, safety,
    and area demand.
