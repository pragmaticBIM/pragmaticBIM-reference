name:
  de: Ergebnisse auswerten
  fr: Analyser les résultats
  it: Valutare i risultati
  en: Evaluating results
description:
  de: Forschende werten Daten aus und schreiben Berichte ausserhalb des Labors. Getrennte Schreibplätze
    entscheiden über Laborfläche, Sicherheit und Austausch im Team.
  fr: Les chercheurs analysent les données et rédigent des rapports hors du laboratoire. Des postes d'écriture
    séparés déterminent la surface de laboratoire, la sécurité et les échanges dans l'équipe.
  it: I ricercatori analizzano i dati e redigono rapporti fuori dal laboratorio. Postazioni di scrittura
    separate determinano superficie di laboratorio, sicurezza e scambio nel team.
  en: Researchers analyse data and write reports outside the lab. Separate write-up spaces determine lab
    area, safety, and team exchange.
