id: pragmaticbim:usage-scenario/paket-entgegennehmen
code: US-WH-14
sort_order: 15
name:
  de: Paket entgegennehmen
  fr: Réception d'un colis
  it: Ritiro di un pacco
  en: Receiving a parcel
description:
  de: Pakete kommen auch an, wenn niemand zu Hause ist. Der Übergabeort entscheidet,
    ob sie geschützt warten können.
  fr: Les colis arrivent aussi lorsque personne n'est à la maison. Le lieu de remise
    décide s'ils peuvent attendre à l'abri.
  it: I pacchi arrivano anche quando non c'è nessuno in casa. Il punto di consegna
    decide se possono attendere al riparo.
  en: Parcels arrive even when no one is home. The handover point decides whether
    they can wait in a safe place.
