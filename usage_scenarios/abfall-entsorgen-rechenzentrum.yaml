id: pragmaticbim:usage-scenario/abfall-entsorgen-rechenzentrum
code: US-RZ-07
sort_order: 8
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Mitarbeitende bringen Verpackungs- und Restabfall regelmässig weg. Die getrennten Arten
    entscheiden über Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Le personnel évacue régulièrement les déchets d'emballage et les déchets résiduels. Les
    fractions séparées déterminent la surface, la ventilation et les chemins vers le point de
    collecte.
  it: Il personale conferisce regolarmente imballaggi e rifiuti residui. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Staff regularly take packaging and residual waste away. The separated fractions determine area,
    ventilation, and routes to the collection point.
uses:
- pragmaticbim:use/rechenzentrum
tags:
- entsorgung
status: active
jurisdiction:
- general
allows_multiple: true
