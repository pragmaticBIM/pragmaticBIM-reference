id: pragmaticbim:usage-scenario/zur-einheit-gelangen
code: US-GE-01
sort_order: 1
name:
  de: Zur Einheit gelangen
  fr: Accéder à l'unité
  it: Raggiungere l'unità
  en: Reaching the unit
description:
  de: Nutzende gelangen vom Gebäudeeingang zu ihrer Einheit. Die Erschliessung
    entscheidet über Wege, Hindernisfreiheit und Flächenbedarf.
  fr: Les usagers vont de l'entrée du bâtiment à leur unité. La desserte détermine
    les parcours, l'accès sans obstacle et la surface nécessaire.
  it: Gli utenti vanno dall'ingresso dell'edificio alla propria unità. L'accesso
    determina percorsi, assenza di ostacoli e fabbisogno di superficie.
  en: Users travel from the building entrance to their unit. The access arrangement
    determines routes, step-free access, and area demand.
tags:
- ankommen
