id: pragmaticbim:usage-scenario/velo-abstellen
code: US-WH-12
sort_order: 3
name:
  de: Velo abstellen
  fr: Ranger le vélo
  it: Depositare la bici
  en: Parking the bicycle
description:
  de: Bewohnende stellen ihr Velo täglich ab. Der Ort entscheidet, ob Velos geschützt innen oder aussen
    stehen und wie weit der Weg zur Wohnung ist.
  fr: Les habitants rangent leur vélo chaque jour. L'emplacement décide si les vélos sont à l'abri à l'intérieur
    ou dehors, et de la distance jusqu'au logement.
  it: Gli abitanti depositano la bici ogni giorno. Il posto decide se le biciclette stanno al riparo all'interno
    o all'esterno e quanto dista l'alloggio.
  en: Residents park their bicycles every day. The place decides whether bicycles stand sheltered indoors
    or outdoors, and how far the dwelling is.
scope: use
uses:
- pragmaticbim:use/wohnen
tags:
- ankommen
status: active
jurisdiction:
- general
