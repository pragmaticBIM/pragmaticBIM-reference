id: pragmaticbim:usage-scenario/konzentriert-arbeiten
code: US-WR-01
sort_order: 2
name:
  de: Konzentriert arbeiten
  fr: Travailler avec concentration
  it: Lavorare con concentrazione
  en: Focused work
description:
  de: Mitarbeitende bearbeiten Aufgaben mit hohem Konzentrationsbedarf. Das Arbeitsplatzkonzept entscheidet
    über Ruhe, Privatheit und Flächenbedarf.
  fr: Le personnel accomplit des tâches exigeant une forte concentration. Le concept de poste de travail
    détermine le calme, l'intimité et la surface nécessaire.
  it: Il personale svolge compiti che richiedono elevata concentrazione. Il concetto di postazione determina
    tranquillità, riservatezza e fabbisogno di superficie.
  en: Staff perform tasks that require sustained concentration. The workplace concept determines quiet,
    privacy, and area demand.
scope: use
uses:
- pragmaticbim:use/arbeit
tags:
- arbeiten
status: active
jurisdiction:
- general
