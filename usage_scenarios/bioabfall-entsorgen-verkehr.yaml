id: pragmaticbim:usage-scenario/bioabfall-entsorgen-verkehr
code: US-VE-09
sort_order: 9
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Reisende und der Betrieb bringen Speise- und Grünabfälle während des Aufenthalts getrennt vom
    übrigen Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Les voyageurs et l'exploitation évacuent les déchets alimentaires et verts pendant le séjour,
    séparément des autres déchets. Le point de collecte détermine les odeurs, le refroidissement et
    le rythme d'enlèvement.
  it: I viaggiatori e l'esercizio conferiscono scarti alimentari e verdi durante la permanenza,
    separati dagli altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di
    ritiro.
  en: Passengers and the operation take food and green waste away during the stay, separately from
    other waste. The collection point determines odour, cooling, and how often it is collected.
use: pragmaticbim:use/verkehr
tags:
- entsorgung
status: active
jurisdiction:
- general
