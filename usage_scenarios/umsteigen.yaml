id: pragmaticbim:usage-scenario/umsteigen
code: US-VE-04
sort_order: 5
name:
  de: Umsteigen
  fr: Changer de ligne
  it: Cambiare linea
  en: Transferring
description:
  de: Reisende wechseln zwischen Linien und Verkehrsmitteln. Die Verbindungswege entscheiden über Umsteigezeit,
    Barrierefreiheit und Gedränge.
  fr: Les voyageurs passent d'une ligne ou d'un moyen de transport à l'autre. Les cheminements de liaison
    déterminent le temps de correspondance, l'accessibilité et l'affluence.
  it: I viaggiatori passano da una linea o da un mezzo all'altro. I percorsi di collegamento determinano
    tempi di coincidenza, accessibilità e affollamento.
  en: Passengers change between lines and modes. Connecting routes determine transfer time, accessibility,
    and crowding.
scope: use
