id: pragmaticbim:usage-scenario/sportgeraete-lagern
code: US-SP-04
sort_order: 5
name:
  de: Sportgeräte lagern
  fr: Ranger le matériel de sport
  it: Riporre gli attrezzi sportivi
  en: Storing sports equipment
description:
  de: Matten, Tore und Geräte werden nach dem Training versorgt. Der Ort des Lagers entscheidet über Rüstzeiten
    und nutzbare Hallenfläche.
  fr: Tapis, buts et engins sont rangés après l'entraînement. L'emplacement du dépôt détermine les temps
    de préparation et la surface utile de la salle.
  it: Materassi, porte e attrezzi vengono riposti dopo l'allenamento. La posizione del deposito determina
    tempi di allestimento e superficie utile della palestra.
  en: Mats, goals, and apparatus are put away after training. The location of the store determines set-up
    time and usable hall area.
