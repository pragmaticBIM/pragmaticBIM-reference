id: pragmaticbim:usage-scenario/abfall-entsorgen-sport
code: US-SP-08
sort_order: 8
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Vereine und Einzelne bringen nach dem Training Abfall weg. Die getrennten Arten entscheiden über
    Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Clubs et particuliers évacuent les déchets après l'entraînement. Les fractions séparées
    déterminent la surface, la ventilation et les chemins vers le point de collecte.
  it: Società e singoli conferiscono i rifiuti dopo l'allenamento. Le frazioni separate determinano
    superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Clubs and individuals take waste away after training. The separated fractions determine area,
    ventilation, and routes to the collection point.
scope: use
uses:
- pragmaticbim:use/sport
tags:
- entsorgung
status: active
jurisdiction:
