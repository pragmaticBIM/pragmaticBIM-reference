id: pragmaticbim:usage-scenario/chemie-abfall-entsorgen
code: US-LA-09
sort_order: 8
name:
  de: Sonderabfälle entsorgen
  fr: Évacuer les déchets spéciaux
  it: Conferire i rifiuti speciali
  en: Disposing of special waste
description:
  de: Forschende bringen gefährliche Laborabfälle getrennt vom übrigen Abfall weg. Die Art entscheidet
    über Lüftung, Abschirmung und den Weg aus dem Gebäude.
  fr: Les chercheurs évacuent les déchets dangereux de laboratoire séparément des autres déchets. Le
    type détermine la ventilation, le blindage et le chemin hors du bâtiment.
  it: I ricercatori conferiscono i rifiuti pericolosi di laboratorio separati dagli altri rifiuti. Il
    tipo determina ventilazione, schermatura e percorso fuori dall'edificio.
  en: Researchers take hazardous laboratory waste away separately from other waste. The kind determines
    ventilation, shielding, and the route out of the building.
scope: use
uses:
- pragmaticbim:use/labor
tags:
- entsorgung
status: active
jurisdiction:
- general
allows_multiple: true
