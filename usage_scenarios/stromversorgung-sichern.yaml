id: pragmaticbim:usage-scenario/stromversorgung-sichern
code: US-RZ-02
sort_order: 3
name:
  de: Stromversorgung sichern
  fr: Assurer l'alimentation électrique
  it: Garantire l'alimentazione elettrica
  en: Securing power supply
description:
  de: Die Server brauchen Strom ohne Unterbruch. Das Versorgungskonzept entscheidet über Redundanz, Technikfläche
    und Brandabschnitte.
  fr: Les serveurs ont besoin d'un courant sans interruption. Le concept d'alimentation détermine la redondance,
    la surface technique et les compartiments coupe-feu.
  it: I server necessitano di corrente senza interruzioni. Il concetto di alimentazione determina ridondanza,
    superficie tecnica e compartimenti antincendio.
  en: Servers need uninterrupted power. The supply concept determines redundancy, plant area, and fire
    compartments.
