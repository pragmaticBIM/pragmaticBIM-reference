id: pragmaticbim:usage-scenario/pausen-verbringen
code: US-WR-05
sort_order: 6
name:
  de: Pausen verbringen
  fr: Passer les pauses
  it: Trascorrere le pause
  en: Taking breaks
description:
  de: Mitarbeitende machen während des Arbeitstags Pausen und verpflegen sich. Das Angebot entscheidet
    über Begegnung, Wege und zusätzliche Fläche.
  fr: Le personnel fait des pauses et se restaure pendant la journée. L'offre détermine les rencontres,
    les trajets et la surface supplémentaire.
  it: Il personale fa pause e si ristora durante la giornata. L'offerta determina incontri, percorsi e
    superficie aggiuntiva.
  en: Staff take breaks and eat during the working day. The provision determines social contact, travel,
    and additional area.
scope: use
