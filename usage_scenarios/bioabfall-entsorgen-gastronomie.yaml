id: pragmaticbim:usage-scenario/bioabfall-entsorgen-gastronomie
code: US-GA-09
sort_order: 9
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Der Betrieb und die Gäste bringen Speiseabfälle regelmässig getrennt vom übrigen Abfall weg. Der
    Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: L'exploitation et les clients évacuent régulièrement les déchets alimentaires, séparément des
    autres déchets. Le point de collecte détermine les odeurs, le refroidissement et le rythme
    d'enlèvement.
  it: L'esercizio e gli ospiti conferiscono regolarmente gli scarti alimentari, separati dagli altri
    rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: The operation and the guests regularly take food waste away, separately from other waste. The
    collection point determines odour, cooling, and how often it is collected.
scope: use
uses:
- pragmaticbim:use/gastronomie
tags:
- entsorgung
status: active
jurisdiction:
- general
