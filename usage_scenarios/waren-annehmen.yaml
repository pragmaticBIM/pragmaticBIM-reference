id: pragmaticbim:usage-scenario/waren-annehmen
code: US-LO-01
sort_order: 2
name:
  de: Waren annehmen
  fr: Réceptionner les marchandises
  it: Ricevere le merci
  en: Receiving goods
description:
  de: Lastwagen liefern Waren in festen Zeitfenstern an. Die Zahl der Tore und die Annahmefläche entscheiden
    über Wartezeiten und Hofverkehr.
  fr: Les camions livrent les marchandises dans des créneaux fixes. Le nombre de portes et la surface
    de réception déterminent les temps d'attente et le trafic dans la cour.
  it: I camion consegnano le merci in fasce orarie fisse. Il numero di portoni e la superficie di ricezione
    determinano tempi di attesa e traffico nel piazzale.
  en: Trucks deliver goods in fixed time slots. The number of doors and the receiving area determine waiting
    times and yard traffic.
