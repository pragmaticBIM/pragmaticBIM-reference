name:
  de: Experimente durchführen
  fr: Mener des expériences
  it: Condurre esperimenti
  en: Running experiments
description:
  de: Forschende führen Versuche, Messungen und Analysen durch. Der Labortyp entscheidet über Lüftung,
    Medienversorgung und Sicherheitsstufe.
  fr: Les chercheurs réalisent des essais, mesures et analyses. Le type de laboratoire détermine la ventilation,
    l'alimentation en fluides et le niveau de sécurité.
  it: I ricercatori eseguono prove, misurazioni e analisi. Il tipo di laboratorio determina ventilazione,
    fornitura di fluidi e livello di sicurezza.
  en: Researchers carry out tests, measurements, and analyses. The laboratory type determines ventilation,
    media supply, and safety level.
