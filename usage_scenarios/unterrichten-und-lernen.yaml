sort_order: 2
name:
  de: Unterrichten und lernen
  fr: Enseigner et apprendre
  it: Insegnare e apprendere
  en: Teaching and learning
description:
  de: Lernende und Lehrende arbeiten regelmässig in Gruppen. Die Unterrichtsform entscheidet über Raumgrösse,
    Möblierung und Veränderbarkeit.
  fr: Les apprenants et les enseignants travaillent régulièrement en groupe. La forme d'enseignement détermine
    la taille, le mobilier et la flexibilité des locaux.
  it: Discenti e docenti lavorano regolarmente in gruppo. La forma didattica determina dimensioni, arredi
    e flessibilità dei locali.
  en: Learners and teachers regularly work in groups. The teaching format determines room size, furniture,
    and adaptability.
