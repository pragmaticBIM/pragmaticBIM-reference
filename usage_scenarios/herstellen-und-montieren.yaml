name:
  de: Herstellen und montieren
  fr: Fabriquer et assembler
  it: Produrre e assemblare
  en: Manufacturing and assembly
description:
  de: Produkte werden in Serie oder als Einzelstück gefertigt. Das Fertigungskonzept entscheidet über
    Hallengrösse, Kranbahnen und Materialfluss.
  fr: Les produits sont fabriqués en série ou à l'unité. Le concept de fabrication détermine la taille
    de la halle, les ponts roulants et le flux de matières.
  it: I prodotti vengono fabbricati in serie o come pezzi unici. Il concetto produttivo determina dimensione
    del capannone, carroponti e flusso dei materiali.
  en: Products are made in series or as one-offs. The manufacturing concept determines hall size, crane
    runways, and material flow.
