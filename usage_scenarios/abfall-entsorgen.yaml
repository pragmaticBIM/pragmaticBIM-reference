id: pragmaticbim:usage-scenario/abfall-entsorgen
code: US-WH-04
sort_order: 13
name:
  de: Abfall entsorgen
  fr: Évacuation des déchets
  it: Conferimento dei rifiuti
  en: Taking out waste
description:
  de: Bewohnende bringen ihren Abfall regelmässig weg. Der Sammelort entscheidet über
    die Weglänge.
  fr: Les habitants sortent régulièrement leurs déchets. Le point de collecte décide
    du trajet.
  it: Gli abitanti portano via regolarmente i rifiuti. Il punto di raccolta decide
    il percorso.
  en: Residents take out their waste regularly. The collection point decides the walking
    distance.
