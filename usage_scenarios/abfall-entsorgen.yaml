code: US-GE-03
sort_order: 3
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Nutzende und der Betrieb bringen ihren Abfall regelmässig weg. Der Sammelort und die
    getrennten Arten entscheiden über Weglänge, Fläche und Lüftung.
  fr: Les usagers et l'exploitation évacuent régulièrement leurs déchets. Le point de collecte et
    les fractions séparées déterminent la longueur du trajet, la surface et la ventilation.
  it: Gli utenti e l'esercizio conferiscono regolarmente i propri rifiuti. Il punto di raccolta e le
    frazioni separate determinano lunghezza del percorso, superficie e ventilazione.
  en: Users and the operation take their waste away regularly. The collection point and the
    separated fractions determine walking distance, area, and ventilation.
