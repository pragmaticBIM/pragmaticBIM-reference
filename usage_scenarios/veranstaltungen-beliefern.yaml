id: pragmaticbim:usage-scenario/veranstaltungen-beliefern
code: US-VS-07
sort_order: 8
name:
  de: Veranstaltungen beliefern
  fr: Approvisionner les manifestations
  it: Rifornire gli eventi
  en: Supplying events
description:
  de: Technik, Bühnenbau und Catering werden vor jeder Veranstaltung angeliefert und danach abgeholt.
    Die Anlieferung entscheidet über Aufbauzeiten, Wege hinter der Bühne und Hofflächen.
  fr: Technique, décors et traiteur sont livrés avant chaque manifestation et repris ensuite. La livraison
    détermine les temps de montage, les chemins en coulisse et les surfaces de cour.
  it: Tecnica, scenografie e catering vengono consegnati prima di ogni evento e ritirati dopo. La consegna
    determina tempi di montaggio, percorsi dietro le quinte e superfici del piazzale.
  en: Technical equipment, set construction, and catering are delivered before each event and collected
    afterwards. Delivery determines set-up time, backstage routes, and yard area.
uses:
- pragmaticbim:use/versammlung
tags:
- logistik
status: active
jurisdiction:
