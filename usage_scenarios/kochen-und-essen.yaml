id: pragmaticbim:usage-scenario/kochen-und-essen
code: US-WH-01
sort_order: 6
name:
  de: Kochen und Essen
  fr: Cuisiner et manger
  it: Cucinare e mangiare
  en: Cooking and eating
description:
  de: Bewohnende kochen und essen täglich zusammen. Ein eigener Raum oder ein Teil
    des Wohnzimmers ändert Zimmerzahl, Fläche und wie stark das Kochen den Wohnraum
    prägt.
  fr: Les habitants cuisinent et mangent ensemble chaque jour. Une pièce à part ou
    une partie du séjour change le nombre de pièces, la surface et la place de la
    cuisine dans le logement.
  it: Gli abitanti cucinano e mangiano insieme ogni giorno. Un locale proprio o una
    parte del soggiorno cambia il numero di locali, la superficie e quanto la cucina
    segna lo spazio abitativo.
  en: Residents cook and eat together every day. A room of its own or part of the
    living room changes the room count, the area, and how far cooking shapes the living
    space.
