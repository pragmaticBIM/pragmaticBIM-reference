id: pragmaticbim:usage-scenario/ware-fuer-den-verkauf-anliefern
code: US-VK-03
sort_order: 4
name:
  de: Ware für den Verkauf anliefern
  fr: Livrer la marchandise pour la vente
  it: Consegnare la merce per la vendita
  en: Delivering stock for sale
description:
  de: Ware kommt täglich oder wöchentlich an und wird bis zum Verkauf zwischengelagert. Die Anlieferung
    entscheidet über Lieferzeiten, Lagerfläche und die Trennung von Kundenwegen.
  fr: La marchandise arrive chaque jour ou chaque semaine et est stockée jusqu'à la vente. La livraison
    détermine les horaires, la surface de stockage et la séparation des parcours clients.
  it: La merce arriva ogni giorno o ogni settimana e viene stoccata fino alla vendita. La consegna determina
    orari, superficie di deposito e separazione dai percorsi dei clienti.
  en: Stock arrives daily or weekly and is held until sale. Delivery determines delivery times, storage
    area, and separation from customer routes.
scope: use
uses:
- pragmaticbim:use/verkauf
tags:
- logistik
status: active
jurisdiction:
- general
