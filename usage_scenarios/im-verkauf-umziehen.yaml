id: pragmaticbim:usage-scenario/im-verkauf-umziehen
code: US-VK-07
sort_order: 7
name:
  de: Im Verkauf umziehen
  fr: Se changer dans la vente
  it: Cambiarsi nella vendita
  en: Changing in retail
description:
  de: Verkaufspersonal zieht vor der Schicht Arbeitskleidung an und Privatkleidung aus, abseits der Kundschaft.
    Die Lage entscheidet über Wege in Arbeitskleidung und die Zahl der Umkleiden.
  fr: Le personnel de vente enfile sa tenue de travail et retire ses vêtements privés avant le service, à
    l'écart de la clientèle. L'emplacement détermine les parcours en tenue de travail et le nombre de
    vestiaires.
  it: Il personale di vendita indossa gli indumenti da lavoro e toglie gli abiti privati prima del turno,
    lontano dalla clientela. La posizione determina i percorsi in tenuta da lavoro e il numero di spogliatoi.
  en: Retail staff put on work clothes and take off private clothes before the shift, away from customers.
    The location determines routes in work clothes and the number of changing rooms.
scope: use
