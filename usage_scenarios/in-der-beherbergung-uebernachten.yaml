name:
  de: Übernachten
  fr: Passer la nuit
  it: Pernottare
  en: Staying overnight
description:
  de: Gäste schlafen und halten sich vorübergehend in der Unterkunft auf. Das Zimmerkonzept entscheidet
    über Privatheit, Ausstattung und Fläche.
  fr: Les hôtes dorment et séjournent temporairement dans l'hébergement. Le concept de chambre détermine
    l'intimité, l'équipement et la surface.
  it: Gli ospiti dormono e soggiornano temporaneamente nell'alloggio. Il concetto di camera determina
    riservatezza, dotazioni e superficie.
  en: Guests sleep and stay temporarily in the accommodation. The room concept determines privacy, equipment,
    and area.
