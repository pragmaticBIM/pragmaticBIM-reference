id: pragmaticbim:usage-scenario/abfall-entsorgen-arbeit
code: US-WR-09
sort_order: 9
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Mitarbeitende bringen während des Arbeitstags Abfall weg. Die getrennten Arten entscheiden über
    Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Le personnel évacue les déchets pendant la journée de travail. Les fractions séparées
    déterminent la surface, la ventilation et les chemins vers le point de collecte.
  it: Il personale conferisce i rifiuti durante la giornata lavorativa. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Staff take waste away during the working day. The separated fractions determine area,
    ventilation, and routes to the collection point.
uses:
- pragmaticbim:use/arbeit
tags:
- entsorgung
status: active
jurisdiction:
- general
allows_multiple: true
