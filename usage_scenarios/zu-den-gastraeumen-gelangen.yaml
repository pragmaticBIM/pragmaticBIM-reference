id: pragmaticbim:usage-scenario/zu-den-gastraeumen-gelangen
code: US-GA-06
sort_order: 1
name:
  de: Zu den Gasträumen gelangen
  fr: Accéder aux salles
  it: Raggiungere le sale
  en: Reaching the dining rooms
description:
  de: Gäste gelangen zu den Gasträumen, Speisen und Geschirr bewegen sich zwischen Küche und Service.
    Die Erschliessung entscheidet über Hindernisfreiheit und die Trennung von Gäste- und Servicewegen.
  fr: Les clients accèdent aux salles, plats et vaisselle circulent entre cuisine et service. La desserte
    détermine l'accès sans obstacle et la séparation des parcours clients et service.
  it: Gli ospiti raggiungono le sale, piatti e stoviglie si muovono tra cucina e servizio. L'accesso determina
    assenza di ostacoli e separazione dei percorsi ospiti e servizio.
  en: Guests reach the dining rooms while food and tableware move between kitchen and service. The access
    arrangement determines step-free access and separation of guest and service routes.
scope: use
uses:
- pragmaticbim:use/gastronomie
tags:
- erschliessung
status: active
jurisdiction:
- general
