name:
  de: Waren einlagern
  fr: Stocker les marchandises
  it: Immagazzinare le merci
  en: Storing goods
description:
  de: Waren bleiben Tage bis Monate am Lager. Die Lagerart entscheidet über Raumhöhe, Temperatur und Brandschutz.
  fr: Les marchandises restent en stock de quelques jours à plusieurs mois. Le type de stockage détermine
    la hauteur, la température et la protection incendie.
  it: Le merci restano in magazzino da giorni a mesi. Il tipo di deposito determina altezza, temperatura
    e protezione antincendio.
  en: Goods stay in stock for days to months. The storage type determines room height, temperature, and
    fire protection.
