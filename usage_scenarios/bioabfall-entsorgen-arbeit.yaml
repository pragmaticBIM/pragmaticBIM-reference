id: pragmaticbim:usage-scenario/bioabfall-entsorgen-arbeit
code: US-WR-10
sort_order: 10
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Mitarbeitende bringen Speise- und Grünabfälle während des Arbeitstags getrennt vom übrigen
    Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Le personnel évacue les déchets alimentaires et verts pendant la journée de travail, séparément
    des autres déchets. Le point de collecte détermine les odeurs, le refroidissement et le rythme
    d'enlèvement.
  it: Il personale conferisce scarti alimentari e verdi durante la giornata lavorativa, separati dagli
    altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Staff take food and green waste away during the working day, separately from other waste. The
    collection point determines odour, cooling, and how often it is collected.
scope: use
uses:
- pragmaticbim:use/arbeit
tags:
- entsorgung
status: active
jurisdiction:
- general
options:
