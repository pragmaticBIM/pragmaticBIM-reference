name:
  de: Einsteigen und aussteigen
  fr: Monter et descendre
  it: Salire e scendere
  en: Boarding and alighting
description:
  de: Reisende steigen in kurzen Abständen in Züge, Trams oder Busse ein und aus. Die Anordnung der Perrons
    entscheidet über Umsteigewege, Wartezonen und Personenfluss.
  fr: Les voyageurs montent et descendent des trains, trams ou bus à intervalles courts. La disposition
    des quais détermine les chemins de correspondance, les zones d'attente et les flux de personnes.
  it: I viaggiatori salgono e scendono da treni, tram o autobus a brevi intervalli. La disposizione dei
    marciapiedi determina percorsi di coincidenza, zone di attesa e flussi di persone.
  en: Passengers board and alight trains, trams, or buses at short intervals. The platform layout determines
    transfer routes, waiting zones, and passenger flow.
