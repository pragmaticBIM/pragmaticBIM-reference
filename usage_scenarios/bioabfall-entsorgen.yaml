code: US-GE-04
sort_order: 4
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Nutzende und der Betrieb bringen Speise- und Grünabfälle regelmässig getrennt vom übrigen
    Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Les usagers et l'exploitation évacuent régulièrement les déchets alimentaires et verts,
    séparément des autres déchets. Le point de collecte détermine les odeurs, le refroidissement et
    le rythme d'enlèvement.
  it: Gli utenti e l'esercizio conferiscono regolarmente scarti alimentari e verdi, separati dagli
    altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Users and the operation regularly take food and green waste away, separately from other waste.
    The collection point determines odour, cooling, and how often it is collected.
