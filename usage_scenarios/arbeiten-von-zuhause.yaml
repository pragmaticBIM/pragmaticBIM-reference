id: pragmaticbim:usage-scenario/arbeiten-von-zuhause
code: US-WH-02
sort_order: 7
name:
  de: Arbeiten von Zuhause
  fr: Travail à domicile
  it: Lavoro da casa
  en: Working from home
description:
  de: Bewohnende arbeiten zeitweise zu Hause. Ein eigener Raum entscheidet über Ruhe
    und Fläche und ob kleine Wohnungen dafür taugen.
  fr: Les habitants travaillent parfois à domicile. Une pièce à soi décide du calme,
    de la surface et de l'aptitude des petits logements.
  it: Gli abitanti lavorano a volte da casa. Un locale proprio decide quiete e superficie
    e se gli alloggi piccoli sono adatti.
  en: Residents sometimes work from home. A room of its own decides quiet and area,
    and whether small dwellings are suitable.
use: pragmaticbim:use/wohnen
