id: pragmaticbim:usage-scenario/waesche-waschen
code: US-WH-09
sort_order: 10
name:
  de: Wäsche waschen
  fr: Faire la lessive
  it: Fare il bucato
  en: Doing laundry
description:
  de: Haushalte waschen regelmässig Wäsche. Die Wahl entscheidet, ob jede Wohnung
    eigene Maschinen hat oder der Weg zu einer gemeinsamen Waschküche führt.
  fr: Les ménages font régulièrement la lessive. Le choix décide si chaque logement
    a ses propres machines ou si le chemin mène à une buanderie commune.
  it: Le economie domestiche fanno regolarmente il bucato. La scelta decide se ogni
    alloggio ha le proprie macchine o se si va in una lavanderia comune.
  en: Households do laundry regularly. The choice decides whether each dwelling has
    its own machines or the way leads to a communal laundry.
