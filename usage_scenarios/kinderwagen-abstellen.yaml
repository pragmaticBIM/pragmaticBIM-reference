id: pragmaticbim:usage-scenario/kinderwagen-abstellen
code: US-WH-20
sort_order: 4
name:
  de: Kinderwagen abstellen
  fr: Ranger la poussette
  it: Depositare il passeggino
  en: Storing the stroller
description:
  de: Haushalte stellen Kinderwagen und Mobilitätshilfen täglich ab. Der Ort entscheidet, ob sie Wohnung
    oder gemeinsame Wege blockieren.
  fr: Les ménages rangent chaque jour poussettes et aides à la mobilité. L'emplacement décide s'ils encombrent
    le logement ou les circulations communes.
  it: Le economie domestiche depositano ogni giorno passeggini e ausili alla mobilità. Il posto decide
    se ingombrano l'alloggio o i percorsi comuni.
  en: Households park strollers and mobility aids every day. The place decides whether they block the
    dwelling or shared circulation.
