  fr: Traiter
  it: Trattare
  en: Providing treatment
description:
  de: Patientinnen und Patienten erhalten medizinische Eingriffe unterschiedlicher Komplexität. Der Eingriff
    entscheidet über Raumtyp, Unterstützung und Sicherheitszonen.
  fr: Les patients reçoivent des interventions de complexité variable. L'intervention détermine le type
    de salle, le soutien et les zones de sécurité.
  it: I pazienti ricevono interventi di diversa complessità. L'intervento determina tipo di locale, supporto
    e zone di sicurezza.
  en: Patients receive procedures of varying complexity. The procedure determines room type, support,
    and safety zones.
