id: pragmaticbim:usage-scenario/im-foyer-verweilen
code: US-VS-03
sort_order: 4
name:
  de: Im Foyer verweilen
  fr: Séjourner au foyer
  it: Sostare nel foyer
  en: Spending time in the foyer
description:
  de: Publikum trifft sich vor Beginn und in der Pause. Das Foyerangebot entscheidet über Aufenthaltsqualität,
    Verpflegung und Fläche.
  fr: Le public se retrouve avant le début et pendant l'entracte. L'offre du foyer détermine la qualité
    de séjour, la restauration et la surface.
  it: Il pubblico si incontra prima dell'inizio e durante l'intervallo. L'offerta del foyer determina
    qualità di sosta, ristorazione e superficie.
  en: Audiences gather before the start and during the interval. The foyer offer determines dwell quality,
    catering, and area.
