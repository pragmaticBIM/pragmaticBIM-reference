id: pragmaticbim:usage-scenario/toiletten-benutzen-gesundheit
code: US-HE-09
sort_order: 9
name:
  de: Toiletten benutzen
  fr: Utiliser les toilettes
  it: Usare i servizi igienici
  en: Using the toilets
description:
  de: Patientinnen, Patienten und Besuchende brauchen während ihres Aufenthalts Toiletten, auch mit Rollstuhl.
    Die Aufteilung entscheidet über Anzahl, Fläche und wie flexibel die Toiletten belegt werden.
  fr: Les patients et visiteurs ont besoin de toilettes pendant leur séjour, y compris en fauteuil roulant.
    La répartition détermine le nombre, la surface et la flexibilité d'occupation.
  it: Pazienti e visitatori hanno bisogno di servizi igienici durante la permanenza, anche in sedia a
    rotelle. La suddivisione determina numero, superficie e flessibilità d'uso.
  en: Patients and visitors need toilets during their stay, including wheelchair users. The split determines
    number, area, and how flexibly the toilets can be used.
use: pragmaticbim:use/gesundheit
tags:
- sanitaer
