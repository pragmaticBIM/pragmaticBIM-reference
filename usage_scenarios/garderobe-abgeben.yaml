description:
  de: Besuchende legen Mäntel und Taschen vor der Veranstaltung ab. Die Art der Aufbewahrung entscheidet
    über Sicherheit, Personal und Warteschlangen im Foyer.
  fr: Les visiteurs déposent manteaux et sacs avant la manifestation. Le mode de dépôt détermine la sécurité,
    le personnel et les files d'attente au foyer.
