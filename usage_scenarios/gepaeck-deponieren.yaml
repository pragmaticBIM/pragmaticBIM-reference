name:
  de: Gepäck deponieren
  fr: Déposer ses bagages
  it: Depositare i bagagli
  en: Leaving luggage
description:
  de: Reisende lassen Gepäck für einige Stunden zurück. Das Aufbewahrungsangebot entscheidet über Sicherheit,
    Fläche und Personalbedarf.
  fr: Les voyageurs laissent leurs bagages pour quelques heures. L'offre de consigne détermine la sécurité,
    la surface et les besoins en personnel.
  it: I viaggiatori lasciano i bagagli per alcune ore. L'offerta di deposito determina sicurezza, superficie
    e fabbisogno di personale.
  en: Passengers leave luggage for a few hours. The storage offer determines security, area, and staffing.
