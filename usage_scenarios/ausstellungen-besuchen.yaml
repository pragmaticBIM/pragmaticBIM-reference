name:
  de: Ausstellungen besuchen
  fr: Visiter des expositions
  it: Visitare mostre
  en: Visiting exhibitions
description:
  de: Besuchende betrachten Objekte oder Werke über längere Zeit. Das Ausstellungskonzept entscheidet
    über Raumfolge, Licht und Sicherheit.
  fr: Les visiteurs observent des objets ou des œuvres pendant un certain temps. Le concept d'exposition
    détermine la séquence des salles, la lumière et la sécurité.
  it: I visitatori osservano oggetti o opere a lungo. Il concetto espositivo determina sequenza degli
    spazi, luce e sicurezza.
  en: Visitors view objects or works over a longer time. The exhibition concept determines room sequence,
    light, and security.
