id: pragmaticbim:usage-scenario/bioabfall-entsorgen-beherbergung
code: US-BH-09
sort_order: 9
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Gäste und der Betrieb bringen Speise- und Grünabfälle während des Aufenthalts getrennt vom
    übrigen Abfall weg. Der Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Les hôtes et l'exploitation évacuent les déchets alimentaires et verts pendant le séjour,
    séparément des autres déchets. Le point de collecte détermine les odeurs, le refroidissement et
    le rythme d'enlèvement.
  it: Gli ospiti e l'esercizio conferiscono scarti alimentari e verdi durante il soggiorno, separati
    dagli altri rifiuti. Il punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Guests and the operation take food and green waste away during the stay, separately from other
    waste. The collection point determines odour, cooling, and how often it is collected.
uses:
- pragmaticbim:use/beherbergung
tags:
- entsorgung
status: active
jurisdiction:
- general
options:
