id: pragmaticbim:usage-scenario/unterstuetzung-zu-hause
code: US-WH-06
sort_order: 9
name:
  de: Unterstützung zu Hause
  fr: Soutien à domicile
  it: Sostegno a domicilio
  en: Support at home
description:
  de: Bewohnende mit Unterstützungsbedarf leben selbständig und erhalten Besuch der
    ambulanten Pflege. Der hindernisfreie Weg entscheidet, ob alle die Wohnung und die nötigen
    Räume erreichen.
  fr: Les personnes ayant besoin de soutien vivent de façon autonome et reçoivent
    des soins à domicile. Un chemin sans obstacle décide si tous atteignent le logement
    et les pièces nécessaires.
  it: Chi ha bisogno di sostegno vive in modo autonomo e riceve le cure a domicilio.
    Un percorso senza ostacoli decide se tutti raggiungono l'alloggio e i locali necessari.
  en: Residents who need support live on their own and receive home-care visits. A
    step-free route decides whether both reach the dwelling and the rooms they need.
scope: unit
uses:
- pragmaticbim:use/wohnen
tags:
- wohnalltag
status: active
jurisdiction:
- general
allows_multiple: true
