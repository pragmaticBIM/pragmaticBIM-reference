id: pragmaticbim:usage-scenario/zu-den-it-raeumen-gelangen
code: US-RZ-06
sort_order: 1
name:
  de: Zu den IT-Räumen gelangen
  fr: Accéder aux salles informatiques
  it: Raggiungere le sale IT
  en: Reaching the IT rooms
description:
  de: Personal und Hardware gelangen kontrolliert zu den IT-Räumen. Die Erschliessung entscheidet über
    Zutrittskontrolle, Transportlasten und Sicherheitszonen.
  fr: Le personnel et le matériel accèdent de manière contrôlée aux salles informatiques. La desserte
    détermine le contrôle d'accès, les charges de transport et les zones de sécurité.
  it: Personale e hardware raggiungono le sale IT in modo controllato. L'accesso determina controllo degli
    accessi, carichi di trasporto e zone di sicurezza.
  en: Staff and hardware reach the IT rooms under control. The access arrangement determines access control,
    transport loads, and security zones.
uses:
- pragmaticbim:use/rechenzentrum
tags:
- erschliessung
status: active
jurisdiction:
- general
