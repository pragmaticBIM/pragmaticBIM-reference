id: pragmaticbim:usage-scenario/diagnostik-durchfuehren
code: US-HE-04
sort_order: 5
name:
  de: Diagnostik durchführen
  fr: Réaliser le diagnostic
  it: Eseguire la diagnostica
  en: Performing diagnostics
description:
  de: Fachpersonen gewinnen diagnostische Bilder oder analysieren Proben. Das Verfahren entscheidet über
    Spezialräume, Wege und technische Ausstattung.
  fr: Les professionnels produisent des images diagnostiques ou analysent des échantillons. La méthode
    détermine les locaux spécialisés, les trajets et l'équipement.
  it: I professionisti producono immagini diagnostiche o analizzano campioni. Il metodo determina locali
    specializzati, percorsi e attrezzature.
  en: Professionals produce diagnostic images or analyse samples. The method determines specialist rooms,
    travel, and technical equipment.
scope: use
