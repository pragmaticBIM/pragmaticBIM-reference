sort_order: 1
name:
  de: Ankommen
  fr: Arriver
  it: Arrivare
  en: Arriving home
description:
  de: Bewohnende und Besuch melden sich am Gebäudeeingang an. Die Art des Empfangs
    entscheidet über persönlichen Kontakt, Sichtverbindung und Zutrittskontrolle.
  fr: Les habitants et les visiteurs s'annoncent à l'entrée du bâtiment. Le type
    d'accueil détermine le contact personnel, le contrôle visuel et le contrôle d'accès.
  it: Abitanti e visitatori si annunciano all'ingresso dell'edificio. Il tipo di
    accoglienza determina contatto personale, controllo visivo e controllo degli accessi.
  en: Residents and visitors announce themselves at the building entrance. The reception
    method determines personal contact, visual confirmation, and access control.
scope: use
