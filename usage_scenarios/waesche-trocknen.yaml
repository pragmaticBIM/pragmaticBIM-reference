id: pragmaticbim:usage-scenario/waesche-trocknen
code: US-WH-19
sort_order: 11
name:
  de: Wäsche trocknen
  fr: Sécher le linge
  it: Asciugare il bucato
  en: Drying laundry
description:
  de: Haushalte trocknen regelmässig Wäsche. Der Ort entscheidet, wo Feuchtigkeit
    und Geräte liegen, in der Wohnung oder gemeinsam im Gebäude.
  fr: Les ménages sèchent régulièrement le linge. Le lieu décide où se trouvent humidité
    et appareils, dans le logement ou en commun dans le bâtiment.
  it: Le economie domestiche asciugano regolarmente il bucato. Il luogo decide dove
    stanno umidità e apparecchi, nell'alloggio o in comune nell'edificio.
  en: Households dry laundry regularly. The place decides where moisture and equipment
    sit, in the dwelling or shared in the building.
uses:
- pragmaticbim:use/wohnen
tags:
- haushalt
status: active
jurisdiction:
