id: pragmaticbim:usage-scenario/post-anlieferung
code: US-WH-05
sort_order: 14
name:
  de: Post anliefern
  fr: Distribuer le courrier
  it: Consegnare la posta
  en: Delivering mail
description:
  de: Post wird täglich zugestellt und abgeholt. Der Ort entscheidet, wo sie geschützt
    liegt und wie weit der Weg von der Wohnung ist.
  fr: Le courrier est distribué et relevé chaque jour. L'emplacement décide où il
    est à l'abri et de la distance depuis le logement.
  it: La posta viene consegnata e ritirata ogni giorno. Il posto decide dove resta
    al riparo e quanto dista dall'alloggio.
  en: Mail is delivered and collected daily. The place decides where it is kept safe
    and how far it is from the dwelling.
use: pragmaticbim:use/wohnen
