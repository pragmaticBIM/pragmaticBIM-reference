id: pragmaticbim:usage-scenario/toiletten-benutzen-bildung
code: US-BI-08
sort_order: 8
name:
  de: Toiletten benutzen
  fr: Utiliser les toilettes
  it: Usare i servizi igienici
  en: Using the toilets
description:
  de: Schülerinnen, Schüler und Lehrpersonen brauchen während ihres Aufenthalts Toiletten, auch mit Rollstuhl.
    Die Aufteilung entscheidet über Anzahl, Fläche und wie flexibel die Toiletten belegt werden.
  fr: Les élèves et enseignants ont besoin de toilettes pendant leur séjour, y compris en fauteuil roulant.
    La répartition détermine le nombre, la surface et la flexibilité d'occupation.
  it: Allievi e docenti hanno bisogno di servizi igienici durante la permanenza, anche in sedia a rotelle.
    La suddivisione determina numero, superficie e flessibilità d'uso.
  en: Pupils and teachers need toilets during their stay, including wheelchair users. The split determines
    number, area, and how flexibly the toilets can be used.
use: pragmaticbim:use/bildung
tags:
- sanitaer
status: active
jurisdiction:
- general
