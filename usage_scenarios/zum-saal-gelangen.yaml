id: pragmaticbim:usage-scenario/zum-saal-gelangen
code: US-VS-08
sort_order: 1
name:
  de: Zum Saal gelangen
  fr: Accéder à la salle
  it: Raggiungere la sala
  en: Reaching the hall
description:
  de: Publikum gelangt in kurzer Zeit zum Saal und verlässt ihn gleichzeitig, Bühnenmaterial muss auf
    andere Geschosse. Die Erschliessung entscheidet über Personenfluss, Fluchtwege und die Trennung von
    Publikum und Anlieferung.
  fr: Le public rejoint la salle en peu de temps et la quitte en même temps, le matériel de scène doit
    changer d'étage. La desserte détermine les flux, les voies d'évacuation et la séparation du public
    et des livraisons.
  it: Il pubblico raggiunge la sala in poco tempo e la lascia contemporaneamente, il materiale scenico
    deve cambiare piano. L'accesso determina flussi, vie di fuga e separazione tra pubblico e consegne.
  en: Audiences reach the hall within a short time and leave together, and stage equipment must reach
    other floors. The access arrangement determines crowd flow, escape routes, and separation of audience
    and deliveries.
scope: use
uses:
- pragmaticbim:use/versammlung
tags:
- erschliessung
status: active
jurisdiction:
- general
