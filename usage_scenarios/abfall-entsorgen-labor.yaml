id: pragmaticbim:usage-scenario/abfall-entsorgen-labor
code: US-LA-07
sort_order: 7
name:
  de: Abfall entsorgen
  fr: Évacuer les déchets
  it: Conferire i rifiuti
  en: Disposing of waste
description:
  de: Forschende bringen Rest- und Verpackungsabfall regelmässig weg. Die getrennten Arten entscheiden
    über Fläche, Lüftung und Wege zur Sammelstelle.
  fr: Les chercheurs évacuent régulièrement les déchets résiduels et d'emballage. Les fractions
    séparées déterminent la surface, la ventilation et les chemins vers le point de collecte.
  it: I ricercatori conferiscono regolarmente rifiuti residui e imballaggi. Le frazioni separate
    determinano superficie, ventilazione e percorsi verso il punto di raccolta.
  en: Researchers regularly take residual and packaging waste away. The separated fractions determine
    area, ventilation, and routes to the collection point.
uses:
- pragmaticbim:use/labor
tags:
- entsorgung
status: active
jurisdiction:
