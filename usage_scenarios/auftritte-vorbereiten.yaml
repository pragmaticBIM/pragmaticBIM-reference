id: pragmaticbim:usage-scenario/auftritte-vorbereiten
code: US-VS-05
sort_order: 6
name:
  de: Auftritte vorbereiten
  fr: Préparer les représentations
  it: Preparare le esibizioni
  en: Preparing performances
description:
  de: Mitwirkende ziehen sich um, waschen sich, proben und warten auf ihren Auftritt, getrennt vom Publikum.
    Die Hinterbühne entscheidet über Abläufe, Privatheit und Bühnenbetrieb.
  fr: Les artistes se changent, se lavent, répètent et attendent leur passage, à l'écart du public. L'arrière-scène
    détermine les déroulements, l'intimité et l'exploitation de la scène.
  it: Gli artisti si cambiano, si lavano, provano e attendono la loro esibizione, separati dal pubblico.
    Il retropalco determina flussi, riservatezza e gestione del palco.
  en: Performers change, wash, rehearse, and wait for their appearance, apart from the audience. The backstage
    determines workflows, privacy, and stage operation.
uses:
- pragmaticbim:use/versammlung
