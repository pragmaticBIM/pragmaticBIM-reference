id: pragmaticbim:usage-scenario/besprechungen-durchfuehren
code: US-WR-03
sort_order: 4
name:
  de: Besprechungen durchführen
  fr: Tenir des réunions
  it: Svolgere riunioni
  en: Holding meetings
description:
  de: Mitarbeitende und Gäste treffen sich zu geplanten Besprechungen. Die Gruppengrösse entscheidet über
    Art und Anzahl der Räume.
  fr: Le personnel et les visiteurs se réunissent pour des séances planifiées. La taille du groupe détermine
    le type et le nombre de salles.
  it: Il personale e gli ospiti si incontrano per riunioni programmate. La dimensione del gruppo determina
    il tipo e il numero dei locali.
  en: Staff and visitors meet for planned discussions. Group size determines the type and number of rooms.
scope: use
