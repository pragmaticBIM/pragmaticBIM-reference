id: pragmaticbim:usage-scenario/fahrzeuge-und-geraete-warten
code: US-LO-04
sort_order: 5
name:
  de: Fahrzeuge und Geräte warten
  fr: Entretenir véhicules et engins
  it: Manutenere veicoli e attrezzature
  en: Maintaining vehicles and equipment
description:
  de: Stapler und Lieferfahrzeuge werden geladen, gewartet und repariert. Eigene Wartungsflächen entscheiden
    über Ausfallzeiten und Werkstattbedarf.
  fr: Les chariots élévateurs et véhicules de livraison sont rechargés, entretenus et réparés. Des surfaces
    d'entretien propres déterminent les temps d'arrêt et le besoin d'atelier.
  it: Carrelli elevatori e veicoli di consegna vengono ricaricati, manutenuti e riparati. Superfici di
    manutenzione proprie determinano tempi di fermo e fabbisogno di officina.
  en: Forklifts and delivery vehicles are charged, serviced, and repaired. Dedicated maintenance areas
    determine downtime and workshop needs.
scope: use
