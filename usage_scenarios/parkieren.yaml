id: pragmaticbim:usage-scenario/parkieren
code: US-WH-13
sort_order: 2
name:
  de: Parkieren
  fr: Stationner
  it: Parcheggiare
  en: Parking the car
description:
  de: Bewohnende kommen mit dem Auto an. Der Parkplatz entscheidet über den Weg vom Auto zur Wohnung und
    ob das Grundstück Parkfläche braucht.
  fr: Les habitants arrivent en voiture. La place de stationnement décide du chemin entre la voiture et
    le logement et si la parcelle doit accueillir du stationnement.
  it: Gli abitanti arrivano in auto. Il posteggio decide il percorso dall'auto all'alloggio e se il fondo
    deve offrire superfici di parcheggio.
  en: Residents arrive by car. The parking place decides the route from the car to the dwelling and whether
    the site needs parking space.
scope: use
uses:
- pragmaticbim:use/wohnen
tags:
- ankommen
