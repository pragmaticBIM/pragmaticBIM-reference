id: pragmaticbim:usage-scenario/hardware-anliefern
code: US-RZ-05
sort_order: 7
name:
  de: Hardware anliefern
  fr: Livrer le matériel informatique
  it: Consegnare l'hardware
  en: Delivering hardware
description:
  de: Server und Ersatzteile werden angeliefert, ausgepackt und eingebaut. Die Anlieferung entscheidet
    über Transportwege, Torgrössen und Sicherheitszonen.
  fr: Serveurs et pièces de rechange sont livrés, déballés et installés. La livraison détermine les chemins
    de transport, la taille des portes et les zones de sécurité.
  it: Server e pezzi di ricambio vengono consegnati, disimballati e installati. La consegna determina
    percorsi di trasporto, dimensioni dei portoni e zone di sicurezza.
  en: Servers and spare parts are delivered, unpacked, and installed. Delivery determines transport routes,
    door sizes, and security zones.
scope: use
uses:
- pragmaticbim:use/rechenzentrum
tags:
- logistik
status: active
jurisdiction:
- general
