id: pragmaticbim:usage-scenario/unterricht-vorbereiten
code: US-BI-06
sort_order: 7
name:
  de: Unterricht vorbereiten
  fr: Préparer les cours
  it: Preparare le lezioni
  en: Preparing lessons
description:
  de: Lehrpersonen bereiten Unterricht vor, korrigieren und sprechen sich zwischen den Lektionen ab. Der
    Arbeitsort entscheidet über Ruhe, Austausch im Kollegium und Flächenbedarf.
  fr: Les enseignants préparent les cours, corrigent et se concertent entre les leçons. Le lieu de travail
    détermine le calme, les échanges entre collègues et la surface nécessaire.
  it: I docenti preparano le lezioni, correggono e si coordinano tra una lezione e l'altra. Il luogo di
    lavoro determina tranquillità, scambio tra colleghi e fabbisogno di superficie.
  en: Teachers prepare lessons, mark work, and coordinate between classes. The workplace determines quiet,
    exchange among staff, and area demand.
use: pragmaticbim:use/bildung
