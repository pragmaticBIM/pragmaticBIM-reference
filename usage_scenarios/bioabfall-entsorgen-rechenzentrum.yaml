id: pragmaticbim:usage-scenario/bioabfall-entsorgen-rechenzentrum
code: US-RZ-08
sort_order: 9
name:
  de: Bioabfall entsorgen
  fr: Évacuer les biodéchets
  it: Conferire i rifiuti organici
  en: Disposing of organic waste
description:
  de: Mitarbeitende bringen Speise- und Grünabfälle regelmässig getrennt vom übrigen Abfall weg. Der
    Sammelort entscheidet über Geruch, Kühlung und den Abholrhythmus.
  fr: Le personnel évacue régulièrement les déchets alimentaires et verts, séparément des autres
    déchets. Le point de collecte détermine les odeurs, le refroidissement et le rythme
    d'enlèvement.
  it: Il personale conferisce regolarmente scarti alimentari e verdi, separati dagli altri rifiuti. Il
    punto di raccolta determina odori, raffreddamento e ritmo di ritiro.
  en: Staff regularly take food and green waste away, separately from other waste. The collection
    point determines odour, cooling, and how often it is collected.
uses:
- pragmaticbim:use/rechenzentrum
tags:
- entsorgung
status: active
jurisdiction:
- general
