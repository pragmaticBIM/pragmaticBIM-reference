code: US-LA-07
sort_order: 5
name:
  de: Im Labor umziehen
  fr: Se changer au laboratoire
  it: Cambiarsi in laboratorio
  en: Changing in the laboratory
description:
  de: Mitarbeitende ziehen Schutzkleidung an, bevor sie die Laborzone betreten. Die Lage entscheidet über
    Kontaminationsschutz und die Wege in Laborkleidung.
  fr: Le personnel enfile une tenue de protection avant d'entrer dans la zone de laboratoire. L'emplacement
    détermine la protection contre la contamination et les parcours en tenue de laboratoire.
  it: Il personale indossa indumenti protettivi prima di entrare nella zona di laboratorio. La posizione
    determina la protezione dalla contaminazione e i percorsi in tenuta da laboratorio.
  en: Staff put on protective clothing before entering the laboratory zone. The location determines
    contamination protection and routes in laboratory clothing.
scope: use
uses:
- pragmaticbim:use/labor
tags:
- personal
status: active
jurisdiction:
- general
