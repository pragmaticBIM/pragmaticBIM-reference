name:
  de: Schwimmen
  fr: Nager
  it: Nuotare
  en: Swimming
description:
  de: Schwimmende trainieren, lernen schwimmen oder erholen sich im Wasser. Lage und Wassertiefe entscheiden
    über Hülle, Technikfläche und Aufsicht.
  fr: Les nageurs s'entraînent, apprennent à nager ou se détendent dans l'eau. L'emplacement et la profondeur
    de l'eau déterminent l'enveloppe, la surface technique et la surveillance.
  it: I nuotatori si allenano, imparano a nuotare o si rilassano in acqua. Posizione e profondità dell'acqua
    determinano involucro, superficie tecnica e sorveglianza.
  en: Swimmers train, learn to swim, or relax in the water. Location and water depth determine the enclosure,
    plant area, and supervision.
