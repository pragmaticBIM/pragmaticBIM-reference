description:
  de: Schwimmende trainieren, lernen schwimmen oder erholen sich im Wasser. Das Becken entscheidet über
    Technikflächen, Aufsicht und Garderoben.
  fr: Les nageurs s'entraînent, apprennent à nager ou se détendent dans l'eau. Le bassin détermine les
    surfaces techniques, la surveillance et les vestiaires.
  it: I nuotatori si allenano, imparano a nuotare o si rilassano in acqua. La vasca determina superfici
    tecniche, sorveglianza e spogliatoi.
  en: Swimmers train, learn to swim, or relax in the water. The pool determines plant area, supervision,
    and changing facilities.
