id: pragmaticbim:usage-scenario/zimmer-bewirtschaften
code: US-BH-05
sort_order: 6
name:
  de: Zimmer bewirtschaften
  fr: Entretenir les chambres
  it: Gestire le camere
  en: Servicing rooms
description:
  de: Zimmer werden regelmässig gereinigt und mit Verbrauchsmaterial versorgt. Der Stützpunkt entscheidet
    über Wege, Lagerfläche und Betriebsabläufe.
  fr: Les chambres sont régulièrement nettoyées et approvisionnées. Le point de service détermine les
    trajets, le stockage et l'exploitation.
  it: Le camere vengono pulite e rifornite regolarmente. Il punto di servizio determina percorsi, deposito
    e gestione.
  en: Rooms are regularly cleaned and supplied with consumables. The service point determines travel,
    storage, and operations.
