id: pragmaticbim:usage-scenario/zum-lager-gelangen
code: US-LO-06
sort_order: 1
name:
  de: Zum Lager gelangen
  fr: Accéder à l'entrepôt
  it: Raggiungere il magazzino
  en: Reaching the warehouse
description:
  de: Waren und Mitarbeitende bewegen sich zwischen Rampe und Lagergeschossen. Die Erschliessung entscheidet
    über Lasten, Umschlagzeiten und die Trennung von Personen- und Warenwegen.
  fr: Marchandises et personnel circulent entre le quai et les étages de stockage. La desserte détermine
    les charges, les temps de transbordement et la séparation des parcours personnes et marchandises.
  it: Merci e personale si muovono tra rampa e piani di deposito. L'accesso determina carichi, tempi di
    movimentazione e separazione dei percorsi persone e merci.
  en: Goods and staff move between the dock and storage floors. The access arrangement determines loads,
    handling time, and separation of people and goods routes.
scope: use
uses:
- pragmaticbim:use/logistik
tags:
- erschliessung
status: active
jurisdiction:
- general
