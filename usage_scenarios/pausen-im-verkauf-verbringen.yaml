name:
  de: Pausen im Verkauf verbringen
  fr: Prendre ses pauses dans la vente
  it: Fare pausa nella vendita
  en: Taking breaks in retail
description:
  de: Verkaufspersonal arbeitet in Schichten und braucht Pausen abseits der Kundschaft. Die Personalräume
    entscheiden über Erholung, Hygiene und Nebenflächen.
  fr: Le personnel de vente travaille en équipes et a besoin de pauses à l'écart de la clientèle. Les locaux
    du personnel déterminent le repos, l'hygiène et les surfaces annexes.
  it: Il personale di vendita lavora a turni e necessita di pause lontano dalla clientela. I locali del
    personale determinano riposo, igiene e superfici accessorie.
  en: Retail staff work in shifts and need breaks away from customers. Staff rooms determine rest, hygiene,
    and ancillary area.
