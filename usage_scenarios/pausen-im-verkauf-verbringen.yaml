id: pragmaticbim:usage-scenario/pausen-im-verkauf-verbringen
code: US-VK-04
sort_order: 5
name:
  de: Pausen im Verkauf verbringen
  fr: Prendre ses pauses dans la vente
  it: Fare pausa nella vendita
  en: Taking breaks in retail
description:
  de: Verkaufspersonal arbeitet in Schichten und braucht Pausen und Umkleiden abseits der Kundschaft.
    Die Personalräume entscheiden über Erholung, Hygiene und Nebenflächen.
  fr: Le personnel de vente travaille en équipes et a besoin de pauses et de vestiaires à l'écart de la
    clientèle. Les locaux du personnel déterminent le repos, l'hygiène et les surfaces annexes.
  it: Il personale di vendita lavora a turni e necessita di pause e spogliatoi lontano dalla clientela.
    I locali del personale determinano riposo, igiene e superfici accessorie.
  en: Retail staff work in shifts and need breaks and changing away from customers. Staff rooms determine
    rest, hygiene, and ancillary area.
scope: use
uses:
- pragmaticbim:use/verkauf
tags:
- personal
status: active
jurisdiction:
- general
