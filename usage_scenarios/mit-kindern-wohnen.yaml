id: pragmaticbim:usage-scenario/mit-kindern-wohnen
code: US-WH-23
sort_order: 8
name:
  de: Mit Kindern wohnen
  fr: Vivre avec des enfants
  it: Vivere con bambini
  en: Living with children
description:
  de: Kinder leben im Haushalt und brauchen Platz zum Schlafen, Spielen und Lernen.
    Ein eigener Rückzugsort entscheidet über Zimmerzahl, Fläche und wie ungestört
    Kinder und Erwachsene voneinander sind.
  fr: Des enfants vivent dans le ménage et ont besoin de place pour dormir, jouer et
    apprendre. Un espace à eux décide du nombre de pièces, de la surface et de la tranquillité
    entre enfants et adultes.
  it: Nel nucleo domestico vivono bambini che hanno bisogno di spazio per dormire, giocare
    e studiare. Un luogo proprio decide numero di locali, superficie e quanto bambini
    e adulti restano indisturbati gli uni dagli altri.
  en: Children live in the household and need space to sleep, play and study. A place
    of their own decides the room count, the area, and how undisturbed children and
    adults are by each other.
