id: pragmaticbim:value/fire-rating-rei
code: FIRE-RATING-REI
name:
  de: Feuerwiderstand REI (tragend und raumabschliessend)
  fr: Résistance au feu REI (porteur et compartimentant)
  it: Resistenza al fuoco REI (portante e di compartimentazione)
  en: Fire rating REI (load-bearing and separating)
description:
  de: Klassen REI 30 bis REI 240 für tragende Bauteile mit raumabschliessender Funktion und Wärmedämmung, insbesondere Wände,
    Decken und Dächer (VKF 13-15, Ziff. 3.1.8); die Zahl ist die Feuerwiderstandsdauer in Minuten. Erweitert die Liste `fire-rating-r-rei`,
    die nur REI 30 bis REI 90 enthält.
  fr: Classes REI 30 à REI 240 pour les éléments porteurs avec fonction de compartimentage et isolation thermique, notamment
    murs, planchers et toits (AEAI 13-15, ch. 3.1.8) ; le nombre est la durée de résistance au feu en minutes. Étend la liste
    `fire-rating-r-rei`, qui ne contient que REI 30 à REI 90.
  it: Classi da REI 30 a REI 240 per elementi portanti con funzione di compartimentazione e isolamento termico, in particolare
    pareti, solai e tetti (AICAA 13-15, cifra 3.1.8); il numero è la durata di resistenza al fuoco in minuti. Estende l'elenco
    `fire-rating-r-rei`, che contiene solo da REI 30 a REI 90.
  en: Classes REI 30 to REI 240 for load-bearing components with separating function and insulation, in particular walls,
    floors and roofs (VKF 13-15, Ziff. 3.1.8); the number is the fire resistance duration in minutes. Extends the list `fire-rating-r-rei`,
    which holds only REI 30 to REI 90.
year: 2026
