id: pragmaticbim:value/fire-criteria-additional
code: FIRE-CRITERIA-ADDITIONAL
name:
  de: Zusatzkriterien zum Feuerwiderstand
  fr: Critères supplémentaires de résistance au feu
  it: Criteri supplementari di resistenza al fuoco
  en: Additional fire resistance criteria
description:
  de: 'Zusatzkriterien W, M, C und S, mit denen die Klassifikation nach Tragfähigkeit (R), Raumabschluss (E) und Wärmedämmung
    (I) erweitert werden kann (VKF 13-15, Ziff. 3.1.2): W wenn die durchgehende Strahlung beurteilt wird, M bei besonderen
    mechanischen Einwirkungen, C für selbstschliessende bewegliche Brandschutzabschlüsse, S für besondere Begrenzung der Rauchdurchlässigkeit.'
  fr: 'Critères supplémentaires W, M, C et S qui peuvent compléter la classification selon la stabilité (R), l''étanchéité
    (E) et l''isolation thermique (I) (AEAI 13-15, ch. 3.1.2) : W lorsque le rayonnement continu est évalué, M pour des sollicitations
    mécaniques particulières, C pour les fermetures mobiles à fermeture automatique, S pour la limitation particulière de
    la perméabilité à la fumée.'
  it: 'Criteri supplementari W, M, C e S che possono estendere la classificazione secondo capacità portante (R), tenuta (E)
    e isolamento termico (I) (AICAA 13-15, cifra 3.1.2): W se viene valutato l''irraggiamento continuo, M per effetti meccanici
    particolari, C per serramenti antincendio mobili a chiusura automatica, S per la particolare limitazione della permeabilità
    al fumo.'
  en: 'Additional criteria W, M, C and S that can extend the classification by load-bearing capacity (R), integrity (E) and
    insulation (I) (VKF 13-15, Ziff. 3.1.2): W where continuous radiation is assessed, M for special mechanical actions, C
    for self-closing movable fire closures, S for special limitation of smoke leakage.'
year: 2026
