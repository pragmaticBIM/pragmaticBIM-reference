id: pragmaticbim:value/fire-rating-ei-extended
code: FIRE-RATING-EI-EXTENDED
name:
  de: Feuerwiderstand EI erweitert (Raumabschluss und Wärmedämmung)
  fr: Résistance au feu EI étendue (étanchéité et isolation)
  it: Resistenza al fuoco EI estesa (tenuta e isolamento)
  en: Fire rating EI extended (integrity and insulation)
description:
  de: Klassen EI 30 bis EI 240 für nichttragende, raumabschliessende Bauteile mit Wärmedämmung (VKF 13-15, Ziff. 3.1.10 Abs.
    2); die Zahl ist die Feuerwiderstandsdauer in Minuten. Erweitert die Liste `fire-rating-ei`, die nur EI 30, EI 60 und
    EI 90 enthält; deren Werte bleiben unverändert.
  fr: Classes EI 30 à EI 240 pour les éléments non porteurs avec fonction de compartimentage et isolation thermique (AEAI
    13-15, ch. 3.1.10 al. 2) ; le nombre est la durée de résistance au feu en minutes. Étend la liste `fire-rating-ei`, qui
    ne contient que EI 30, EI 60 et EI 90 ; ses valeurs restent inchangées.
  it: Classi da EI 30 a EI 240 per elementi non portanti con funzione di compartimentazione e isolamento termico (AICAA 13-15,
    cifra 3.1.10 cpv. 2); il numero è la durata di resistenza al fuoco in minuti. Estende l'elenco `fire-rating-ei`, che contiene
    solo EI 30, EI 60 ed EI 90; i suoi valori restano invariati.
  en: Classes EI 30 to EI 240 for non-load-bearing separating components with insulation (VKF 13-15, Ziff. 3.1.10 para. 2);
    the number is the fire resistance duration in minutes. Extends the list `fire-rating-ei`, which holds only EI 30, EI 60
    and EI 90; its values stay unchanged.
year: 2026
