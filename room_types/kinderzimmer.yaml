  equipment:
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-bett
    sort_order: 1
    function: sleeping
    components:
    - pragmaticbim:component/bett-einzel
    quantity: 1
    status: active
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-einbauschrank
    sort_order: 2
    function: wardrobe
    components:
    - pragmaticbim:component/einbauschrank
    quantity: 1
    params:
      width:
        default: 1.2
    status: active
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-schreibtisch
    sort_order: 3
    function: working
    components:
    - pragmaticbim:component/schreibtisch
    quantity: 1
    status: active
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-wendeflaeche
    sort_order: 4
    function: turning
    components:
    - pragmaticbim:component/wendeflaeche
    quantity: 1
    when:
      project_goal_levels:
      - pragmaticbim:project-goal-level/accessibility-wheelchair
    status: active
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-steckdose
    sort_order: 5
    function: power_outlet
    components:
    - pragmaticbim:component/steckdose
    quantity:
      min: 1
      per:
        quantity: net_floor_area
        divisor: 10
    comment: Anzahl aus der Raumfläche; Dichte als Planungswert vor Freigabe fachlich bestätigen.
    status: active
    placement_rules:
    - id: pragmaticbim:placement-rule/kinderzimmer-default-steckdose-hoehe
      relation: elevation
      value:
        min: 0.3
        max: 0.3
      severity: preferred
      source:
        kind: default
        note: Planungswert; vor Freigabe fachlich bestätigen
    - id: pragmaticbim:placement-rule/kinderzimmer-default-steckdose-tuer-frei
      relation: not_in_clearance_of
      target:
        opening_function: access
      severity: required
      source:
        kind: default
        note: Planungswert; vor Freigabe fachlich bestätigen
    - id: pragmaticbim:placement-rule/kinderzimmer-default-steckdose-sleeping
      relation: next_to
      target:
        equipment_function: sleeping
      distance:
        max: 0.3
      scope: each_target
      severity: preferred
      source:
        kind: default
        note: Planungswert; vor Freigabe fachlich bestätigen
  - id: pragmaticbim:room-type-equipment/kinderzimmer-default-lichtschalter
    sort_order: 6
    function: light_switch
    components:
    - pragmaticbim:component/lichtschalter
    quantity: 1
    status: active
    placement_rules:
    - id: pragmaticbim:placement-rule/kinderzimmer-default-lichtschalter-tuer
      relation: next_to
      target:
        opening_function: access
      side: latch_side
      distance:
        max: 0.3
      severity: required
      source:
        kind: default
        note: Planungswert; vor Freigabe fachlich bestätigen
      variants:
      - relation: next_to
        target:
          opening_function: access
        side: latch_side
        distance:
          max: 0.3
        room_side: outside
        comment: Schalter ausserhalb des Raums neben der Tür.
    - id: pragmaticbim:placement-rule/kinderzimmer-default-lichtschalter-hoehe
      relation: elevation
      value:
        min: 0.9
        max: 1.1
      severity: required
      source:
        kind: norm
        reference: SIA 500:2009, 7.4
        note: Höhe Bedienelemente
  openings:
  - id: pragmaticbim:room-type-opening/kinderzimmer-default-zugang
    sort_order: 1
    function: access
    components:
    - pragmaticbim:component/tuer-dreh-innen
    - pragmaticbim:component/tuer-schiebe-innen
    connects_to:
      relationships: incoming
    quantity: 1
    status: active
  - id: pragmaticbim:room-type-opening/kinderzimmer-default-fenster
    sort_order: 2
    function: daylight
    components:
    - pragmaticbim:component/fenster
    connects_to:
      exterior: true
    quantity:
      min: 1
      default: 1
    glazing_to_floor_ratio_min: 0.1
    comment: Mindestanteil Glasfläche nach kantonalem Recht, häufig 1/10 der Bodenfläche;
      projektbezogen prüfen.
    status: active
  status: active
