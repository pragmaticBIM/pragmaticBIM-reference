  fr: Tribune
  it: Tribuna
  en: Spectator stand
definition:
  de: Gestufte Sitz- oder Stehfläche für Zuschauende.
  fr: Gradins assis ou debout pour le public.
  it: Gradinata con posti a sedere o in piedi per il pubblico.
  en: Tiered seating or standing area for spectators.
room_type_kind: room
room_name: RN-07-40-02
activity: M-COM
default_scope: building
status: active
