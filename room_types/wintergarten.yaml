sort_order: 37
name:
  de: Wintergarten
  fr: Jardin d'hiver
  it: Giardino d'inverno
  en: Winter Garden
definition:
  de: Geschlossener verglaster Wohnraum, im Unterschied zu offenen Aussenplattformen
    wie Balkon, Terrasse und Innenhof.
  fr: Pièce de séjour fermée et vitrée, distincte des plateformes extérieures ouvertes
    telles que balcon, terrasse et cour.
  it: Locale di soggiorno chiuso e vetrato, distinto dalle piattaforme esterne aperte
    come balcone, terrazza e corte.
  en: Closed glazed living room, distinct from open outdoor platforms such as balcony,
    terrace, and patio.
