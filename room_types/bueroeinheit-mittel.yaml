name:
  de: Mittlere Büroeinheit
  fr: Suite de bureaux moyenne
  it: Suite di uffici media
  en: Medium office suite
definition:
  de: Bruttovolumen einer mittleren Büroeinheit, etwa für eine Abteilung bis dreissig Arbeitsplätze.
  fr: Volume brut d'une suite de bureaux moyenne, par exemple pour un service jusqu'à trente postes de travail.
  it: Volume lordo di una suite di uffici media, ad esempio per un reparto fino a trenta postazioni.
  en: Gross volume of a medium office suite, for example for a department of up to thirty workstations.
