id: pragmaticbim:room-type/radioaktivabfallraum
code: RT-LA-03
sort_order: 154
name:
  de: Radioaktivabfallraum
  fr: Local à déchets radioactifs
  it: Locale rifiuti radioattivi
  en: Radioactive waste room
definition:
  de: Raum für das Sammeln und Abklingenlassen von radioaktivem Laborabfall, getrennt vom übrigen 
    Abfall.
  fr: Local pour collecter les déchets radioactifs de laboratoire et les laisser décroître, séparés 
    des autres déchets.
  it: Locale per raccogliere i rifiuti radioattivi di laboratorio e lasciarli decadere, separati 
    dagli altri rifiuti.
  en: Room for collecting radioactive laboratory waste and letting it decay, separate from other 
    waste.
room_type_kind: room
room_name: RN-09-30-06
activity: S-TEC
default_scope: building
status: active
