- name: FireRating
  pset: Pset_DoorCommon
  definition:
    de: "Feuerwiderstandsklasse der nichttragenden Tür gemäss Brandschutzkonzept – Raumabschluss und Wärmedämmung (EI), ohne Tragfähigkeit.\n\n**Zulässige Werte**\n- `EI 30` — Raumabschluss und Wärmedämmung 30 min\n- `EI 60` — Raumabschluss und Wärmedämmung 60 min\n- `EI 90` — Raumabschluss und Wärmedämmung 90 min"
    fr: "Classe de résistance au feu de la porte non porteuse selon le concept de protection incendie – étanchéité au feu et isolation thermique (EI), sans stabilité.\n\n**Valeurs admises**\n- `EI 30` — étanchéité au feu et isolation thermique 30 min\n- `EI 60` — étanchéité au feu et isolation thermique 60 min\n- `EI 90` — étanchéité au feu et isolation thermique 90 min"
    it: "Classe di resistenza al fuoco della porta non portante secondo il concetto antincendio – tenuta al fuoco e isolamento termico (EI), senza capacità portante.\n\n**Valori ammessi**\n- `EI 30` — tenuta al fuoco e isolamento termico 30 min\n- `EI 60` — tenuta al fuoco e isolamento termico 60 min\n- `EI 90` — tenuta al fuoco e isolamento termico 90 min"
    en: "Fire resistance class of the non-load-bearing door according to the fire protection concept – integrity and insulation (EI), without load-bearing capacity.\n\n**Allowed values**\n- `EI 30` — integrity and insulation 30 min\n- `EI 60` — integrity and insulation 60 min\n- `EI 90` — integrity and insulation 90 min"
