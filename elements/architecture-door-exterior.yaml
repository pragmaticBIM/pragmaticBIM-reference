    en: "Type of hazardous material found by survey on the affected existing component.\n\n**Allowed values**\n- `Asbestos` — asbestos\n- `PCB` — PCB\n- `PAH` — PAH\n- `PCP` — PCP\n- `Lead` — lead\n- `None` — no hazardous material\n- `Unknown` — unknown / not investigated"
