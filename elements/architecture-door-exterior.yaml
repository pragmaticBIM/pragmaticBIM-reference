- name: OperationType
  pset: null
  definition:
    de: "Öffnungsart und -richtung der Tür.\n\n**Zulässige Werte**\n- `SINGLE_SWING_LEFT` — Einflügelig, Anschlag links\n- `SINGLE_SWING_RIGHT` — Einflügelig, Anschlag rechts\n- `DOUBLE_DOOR_SINGLE_SWING` — Doppeltür, gleiche Drehrichtung\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — Doppeltür, gegengleich, Anschlag links\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — Doppeltür, gegengleich, Anschlag rechts\n- `DOUBLE_SWING_LEFT` — Pendeltür, Anschlag links\n- `DOUBLE_SWING_RIGHT` — Pendeltür, Anschlag rechts\n- `DOUBLE_DOOR_DOUBLE_SWING` — Doppelte Pendeltür\n- `SLIDING_TO_LEFT` — Schiebetür nach links\n- `SLIDING_TO_RIGHT` — Schiebetür nach rechts\n- `DOUBLE_DOOR_SLIDING` — Doppeltür schiebend\n- `FOLDING_TO_LEFT` — Falttür nach links\n- `FOLDING_TO_RIGHT` — Falttür nach rechts\n- `DOUBLE_DOOR_FOLDING` — Doppeltür faltend\n- `REVOLVING` — Drehtür\n- `ROLLINGUP` — Rolltor\n- `SWING_FIXED_LEFT` — Drehflügel fest, links\n- `SWING_FIXED_RIGHT` — Drehflügel fest, rechts\n- `USERDEFINED` — Benutzerdefiniert\n\
      - `NOTDEFINED` — Nicht definiert"
    fr: "Type et sens d'ouverture de la porte.\n\n**Valeurs admises**\n- `SINGLE_SWING_LEFT` — simple battant, paumelles à gauche\n- `SINGLE_SWING_RIGHT` — simple battant, paumelles à droite\n- `DOUBLE_DOOR_SINGLE_SWING` — double porte, même sens\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — double porte, sens opposés, gauche\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — double porte, sens opposés, droite\n- `DOUBLE_SWING_LEFT` — porte battante, gauche\n- `DOUBLE_SWING_RIGHT` — porte battante, droite\n- `DOUBLE_DOOR_DOUBLE_SWING` — double porte battante\n- `SLIDING_TO_LEFT` — coulissante vers la gauche\n- `SLIDING_TO_RIGHT` — coulissante vers la droite\n- `DOUBLE_DOOR_SLIDING` — double porte coulissante\n- `FOLDING_TO_LEFT` — pliante vers la gauche\n- `FOLDING_TO_RIGHT` — pliante vers la droite\n- `DOUBLE_DOOR_FOLDING` — double porte pliante\n- `REVOLVING` — porte tournante\n- `ROLLINGUP` — porte à enroulement\n- `SWING_FIXED_LEFT` — battant fixe, gauche\n- `SWING_FIXED_RIGHT` — battant\
      \ fixe, droite\n- `USERDEFINED` — défini par l'utilisateur\n- `NOTDEFINED` — non défini"
    it: "Tipo e senso di apertura della porta.\n\n**Valori ammessi**\n- `SINGLE_SWING_LEFT` — anta singola, cerniere a sinistra\n- `SINGLE_SWING_RIGHT` — anta singola, cerniere a destra\n- `DOUBLE_DOOR_SINGLE_SWING` — porta doppia, stesso senso\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — porta doppia, sensi opposti, sinistra\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — porta doppia, sensi opposti, destra\n- `DOUBLE_SWING_LEFT` — porta a bilico, sinistra\n- `DOUBLE_SWING_RIGHT` — porta a bilico, destra\n- `DOUBLE_DOOR_DOUBLE_SWING` — porta doppia a bilico\n- `SLIDING_TO_LEFT` — scorrevole a sinistra\n- `SLIDING_TO_RIGHT` — scorrevole a destra\n- `DOUBLE_DOOR_SLIDING` — porta doppia scorrevole\n- `FOLDING_TO_LEFT` — a libro a sinistra\n- `FOLDING_TO_RIGHT` — a libro a destra\n- `DOUBLE_DOOR_FOLDING` — porta doppia a libro\n- `REVOLVING` — porta girevole\n- `ROLLINGUP` — serranda\n- `SWING_FIXED_LEFT` — anta fissa, sinistra\n- `SWING_FIXED_RIGHT` — anta fissa, destra\n- `USERDEFINED` —\
      \ definito dall'utente\n- `NOTDEFINED` — non definito"
    en: "Door opening type and direction.\n\n**Allowed values**\n- `SINGLE_SWING_LEFT` — single swing, hinge left\n- `SINGLE_SWING_RIGHT` — single swing, hinge right\n- `DOUBLE_DOOR_SINGLE_SWING` — double door, same swing\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT` — double door, opposite swing, left\n- `DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT` — double door, opposite swing, right\n- `DOUBLE_SWING_LEFT` — double swing, left\n- `DOUBLE_SWING_RIGHT` — double swing, right\n- `DOUBLE_DOOR_DOUBLE_SWING` — double door, double swing\n- `SLIDING_TO_LEFT` — sliding to left\n- `SLIDING_TO_RIGHT` — sliding to right\n- `DOUBLE_DOOR_SLIDING` — double sliding door\n- `FOLDING_TO_LEFT` — folding to left\n- `FOLDING_TO_RIGHT` — folding to right\n- `DOUBLE_DOOR_FOLDING` — double folding door\n- `REVOLVING` — revolving\n- `ROLLINGUP` — rolling shutter\n- `SWING_FIXED_LEFT` — swing fixed left\n- `SWING_FIXED_RIGHT` — swing fixed right\n- `USERDEFINED` — user-defined\n- `NOTDEFINED` — not defined"
