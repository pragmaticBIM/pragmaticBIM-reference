  definition:
    de: "Zugänglichkeit der Verbindung ohne Zerstörung von Bauteil oder Umgebung (Madaster).\n\n**Zulässige Werte**\n- `Accessible` — frei zugänglich ohne Zusatzmassnahmen\n- `PartialNoDamage` — zugänglich mit Massnahmen ohne Schaden\n- `PartialWithRepairableDamage` — zugänglich mit vollständig reparierbarem Schaden\n- `PartialWithDamage` — zugänglich mit teilweise reparierbarem Schaden\n- `NotAccessible` — nicht zugänglich, irreparabler Schaden"
    fr: "Accessibilité de la connexion sans destruction de l'élément ou de l'entourage (Madaster).\n\n**Valeurs admises**\n- `Accessible` — librement accessible sans actions supplémentaires\n- `PartialNoDamage` — accessible avec actions sans dommage\n- `PartialWithRepairableDamage` — accessible avec dommage entièrement réparable\n- `PartialWithDamage` — accessible avec dommage partiellement réparable\n- `NotAccessible` — non accessible, dommage irréparable"
    it: "Accessibilità della connessione senza distruggere il componente o l'intorno (Madaster).\n\n**Valori ammessi**\n- `Accessible` — liberamente accessibile senza azioni aggiuntive\n- `PartialNoDamage` — accessibile con azioni senza danno\n- `PartialWithRepairableDamage` — accessibile con danno interamente riparabile\n- `PartialWithDamage` — accessibile con danno parzialmente riparabile\n- `NotAccessible` — non accessibile, danno irreparabile"
