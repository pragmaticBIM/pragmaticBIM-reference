id: pragmaticbim:element/architecture-door-exterior
code: ARC-DOOR-EXT
sort_order: 41
status: active
name:
  de: Aussentür
  fr: Porte extérieure
  it: Porta esterna
  en: Exterior door
definition:
  de: "Sichert funktionsfähige Gebäudezugänge und schafft die Grundlage für Fluchtweg-, Fassaden- und Bauphysikplanung.\n\n**Beschreibung**\n- Aussentüren, Tore und Revisionsöffnungen zur Aussenluft.\n- Grundlage für Fassadenplanung, Bauphysik (U-Wert) und Ausschreibung.\n\n**Modellierungshinweis**\n- IsExternal=TRUE setzen.\n- Glasflächen mit transparentem Material.\n- Geeignetes Material im Autorensystem verwenden und exportieren."
  fr: "Garantit des accès fonctionnels au bâtiment et fournit la base pour l'étude des voies d'évacuation, de la façade et de la physique du bâtiment.\n\n**Description**\n- Portes extérieures, portails et trappes donnant sur l'extérieur.\n- Base pour la planification de façade, la physique du bâtiment (valeur U) et l'adjudication.\n\n**Directives de modélisation**\n- Définir IsExternal=TRUE.\n- Surfaces vitrées avec un matériau transparent.\n- Utiliser et exporter le matériau approprié depuis le logiciel auteur."
  it: "Garantisce accessi funzionali all’edificio e fornisce la base per la progettazione delle vie di fuga, della facciata e della fisica della costruzione.\n\n**Descrizione**\n- Porte esterne, portoni e aperture di ispezione verso l'esterno.\n- Base per pianificazione di facciata, fisica della costruzione (valore U) e appalto.\n\n**Direttive di modellazione**\n- Impostare IsExternal=TRUE.\n- Superfici vetrate con materiale trasparente.\n- Usare ed esportare il materiale appropriato dal software di modellazione."
  en: "Ensures functional building access and provides the basis for escape-route, facade, and building-physics design.\n\n**Description**\n- Exterior doors, gates, and inspection openings to the outside.\n- Basis for facade planning, building physics (U-value), and tendering.\n\n**Modelling guidelines**\n- Set IsExternal=TRUE.\n- Glazed areas with a transparent material.\n- Use and export the appropriate material from the authoring system."
needed_in_domain:
- pragmaticbim:domain/architecture
