    de: "Schadstoffart gemäss Gutachten am betroffenen Bestandsbauteil.\n\n**Zulässige Werte**\n- `Asbestos` — Asbest\n- `PCB` — PCB\n- `PAH` — PAK\n- `PCP` — PCP\n- `Lead` — Blei\n- `None` — kein Schadstoff\n- `Unknown` — unbekannt / nicht untersucht"
    fr: "Type de polluant selon l'expertise sur l'élément existant concerné.\n\n**Valeurs admises**\n- `Asbestos` — amiante\n- `PCB` — PCB\n- `PAH` — HAP\n- `PCP` — PCP\n- `Lead` — plomb\n- `None` — aucun polluant\n- `Unknown` — inconnu / non investigué"
