id: pragmaticbim:element/client-invoice-address
code: CLIENT-INVOICE-ADDRESS
sort_order: 7
status: active
name:
  de: Rechnungsadresse Bauherrschaft
  fr: Adresse de facturation du maître d'ouvrage
  it: Indirizzo di fatturazione del committente
  en: Client invoice address
definition:
  de: |-
    Hält die Adresse fest, an die Rechnungen für das Projekt gehen, damit Planende und Unternehmen sie nicht aus Verträgen abschreiben müssen.

    **Beschreibung**
    - Postadresse der Bauherrschaft für Rechnungen.
    - Nicht die Adresse des Grundstücks oder des Gebäudes.

    **Modellierungshinweis**
    - Genau eine Rechnungsadresse je Bauherrschaft.
    - Als Postadresse der Organisation oder Person der Bauherrschaft führen.
    - Adressart als benutzerdefiniert mit der Bezeichnung Rechnungsadresse setzen.
  fr: |-
    Établit l'adresse à laquelle sont envoyées les factures du projet, afin que mandataires et entreprises n'aient pas à la recopier des contrats.

    **Description**
    - Adresse postale du maître d'ouvrage pour les factures.
    - Pas l'adresse du terrain ni celle du bâtiment.

    **Directives de modélisation**
    - Exactement une adresse de facturation par maître d'ouvrage.
    - Saisir comme adresse postale de l'organisation ou de la personne du maître d'ouvrage.
    - Définir le type d'adresse comme défini par l'utilisateur avec la désignation Adresse de facturation.
  it: |-
    Stabilisce l'indirizzo a cui vanno le fatture del progetto, affinché progettisti e imprese non debbano ricopiarlo dai contratti.

    **Descrizione**
    - Indirizzo postale del committente per le fatture.
    - Non l'indirizzo del fondo né quello dell'edificio.

    **Direttive di modellazione**
    - Esattamente un indirizzo di fatturazione per committente.
    - Gestire come indirizzo postale dell'organizzazione o della persona del committente.
    - Impostare il tipo di indirizzo come definito dall'utente con la designazione Indirizzo di fatturazione.
  en: |-
    Records the address that project invoices go to so that designers and contractors do not have to copy it from contracts.

    **Description**
    - Postal address of the client for invoices.
    - Not the address of the site or the building.

    **Modelling guidelines**
    - Exactly one invoice address per client.
    - Keep it as the postal address of the client's organization or person.
    - Set the address type to user-defined with the designation Invoice address.
needed_in_domain:
  - pragmaticbim:domain/client
entity_ifc2x3: IfcPostalAddress
entity_ifc4: IfcPostalAddress
entity_ifc4_3: IfcPostalAddress
picture_link: null
model_link: null
applicability:
