  fr: (entity_ifc4=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Adresse de facturation") OR (entity_ifc2x3=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Adresse de facturation")
  it: (entity_ifc4=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Indirizzo di fatturazione") OR (entity_ifc2x3=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Indirizzo di fatturazione")
  en: (entity_ifc4=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Invoice address") OR (entity_ifc2x3=IfcPostalAddress AND Purpose=USERDEFINED AND UserDefinedPurpose="Invoice address")
