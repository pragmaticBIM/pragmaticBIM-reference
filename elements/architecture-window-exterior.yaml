    en: "Connection type for detachability (Madaster).\n\n**Allowed values**\n- `DryConnection` — dry connection\n- `AddedConnection` — connection using added parts\n- `DirectConnection` — direct integral connection\n- `SoftChemicalConnection` — soft chemical connection\n- `HardChemicalConnection` — hard chemical connection"
