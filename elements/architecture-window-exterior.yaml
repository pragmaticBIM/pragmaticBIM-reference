id: pragmaticbim:element/architecture-window-exterior
code: ARC-WINDOW-EXT
sort_order: 40
status: active
name:
  de: Aussenfenster
  fr: Fenêtre extérieure
  it: Finestra esterna
  en: Exterior window
definition:
  de: "Sichert Tageslicht, Lüftung und Sichtbezüge und schafft eine prüfbare Grundlage für Fassaden- und Bauphysikplanung.\n\n**Beschreibung**\n- Aussenfenster sowie Oberlichter in der Hülle.\n- Jedes Fenster ist einem Raum zugeordnet.\n- Grundlage für Fassadenplanung, Bauphysik (U-Wert) und Ausschreibung.\n\n**Modellierungshinweis**\n- IsExternal=TRUE setzen.\n- Glasanteil mit transparentem Material exportieren.\n- Jedes Fenster einem Raum zuordnen."
  fr: "Garantit l'éclairage naturel, la ventilation et les vues et fournit une base vérifiable pour l'étude de la façade et de la physique du bâtiment.\n\n**Description**\n- Fenêtres extérieures et lanterneaux dans l'enveloppe.\n- Chaque fenêtre est rattachée à un local.\n- Base pour la planification de façade, la physique du bâtiment (valeur U) et l'adjudication.\n\n**Directives de modélisation**\n- Définir IsExternal=TRUE.\n- Exporter le vitrage avec un matériau transparent.\n- Relier chaque fenêtre à un local."
  it: "Garantisce illuminazione naturale, ventilazione e visuali e fornisce una base verificabile per la progettazione della facciata e della fisica della costruzione.\n\n**Descrizione**\n- Finestre esterne e lucernari nell'involucro.\n- Ogni finestra è collegata a un locale.\n- Base per pianificazione di facciata, fisica della costruzione (valore U) e appalto.\n\n**Direttive di modellazione**\n- Impostare IsExternal=TRUE.\n- Esportare la parte vetrata con materiale trasparente.\n- Collegare ogni finestra a un locale."
  en: "Ensures daylight, ventilation, and views and provides a verifiable basis for facade and building-physics design.\n\n**Description**\n- Exterior windows and skylights in the envelope.\n- Each window is assigned to a space.\n- Basis for facade planning, building physics (U-value), and tendering.\n\n**Modelling guidelines**\n- Set IsExternal=TRUE.\n- Export glazing with a transparent material.\n- Relate each window to a space."
