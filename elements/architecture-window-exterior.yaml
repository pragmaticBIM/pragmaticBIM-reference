    de: "Feuerwiderstandsklasse des nichttragenden Fensters gemäss Brandschutzkonzept – Raumabschluss und Wärmedämmung (EI), ohne Tragfähigkeit.\n\n**Zulässige Werte**\n- `EI 30` — Raumabschluss und Wärmedämmung 30 min\n- `EI 60` — Raumabschluss und Wärmedämmung 60 min\n- `EI 90` — Raumabschluss und Wärmedämmung 90 min"
    fr: "Classe de résistance au feu de la fenêtre non porteuse selon le concept de protection incendie – étanchéité au feu et isolation thermique (EI), sans stabilité.\n\n**Valeurs admises**\n- `EI 30` — étanchéité au feu et isolation thermique 30 min\n- `EI 60` — étanchéité au feu et isolation thermique 60 min\n- `EI 90` — étanchéité au feu et isolation thermique 90 min"
