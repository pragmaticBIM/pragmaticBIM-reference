- name: SunProtection
  pset: ePset_SunProtection
  definition:
    de: |-
      Art des Sonnenschutzes am Aussenfenster, auch wenn das Gerät als eigenes Bauteil modelliert ist.

      **Zulässige Werte**
      - `NONE` — kein Sonnenschutz
      - `JALOUSIE` — Aussenlamelle / Raffstore
      - `SHUTTER` — Fensterladen
      - `AWNING` — Markise
      - `USERDEFINED` — anderer Sonnenschutz
    fr: |-
      Type de protection solaire de la fenêtre extérieure, même si le dispositif est modélisé comme élément distinct.

      **Valeurs admises**
      - `NONE` — aucune protection solaire
      - `JALOUSIE` — lame externe / store à lamelles
      - `SHUTTER` — volet
      - `AWNING` — store banne
      - `USERDEFINED` — autre protection solaire
    it: |-
      Tipo di protezione solare della finestra esterna, anche se il dispositivo è modellato come componente distinto.

      **Valori ammessi**
      - `NONE` — nessuna protezione solare
      - `JALOUSIE` — lamella esterna / frangisole
      - `SHUTTER` — persiana
      - `AWNING` — tenda da sole
      - `USERDEFINED` — altra protezione solare
    en: |-
      Sun-protection type of the exterior window, even when the device is modelled as a separate component.

      **Allowed values**
      - `NONE` — no sun protection
      - `JALOUSIE` — external slats / venetian blind
      - `SHUTTER` — shutter
      - `AWNING` — awning
      - `USERDEFINED` — other sun protection
  datatype: IfcLabel
