    en: "Fire resistance class of the non-load-bearing window according to the fire protection concept – integrity and insulation (EI), without load-bearing capacity.\n\n**Allowed values**\n- `EI 30` — integrity and insulation 30 min\n- `EI 60` — integrity and insulation 60 min\n- `EI 90` — integrity and insulation 90 min"
