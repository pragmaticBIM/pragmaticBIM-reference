- name: SecurityRating
  pset: Pset_WindowCommon
  definition:
    de: |-
      Einbruchwiderstandsklasse des Fensters gemäss Sicherheitskonzept und EN 1627.

      **Zulässige Werte**
      - `RC1` — Widerstandsklasse 1
      - `RC2` — Widerstandsklasse 2
      - `RC3` — Widerstandsklasse 3
      - `RC4` — Widerstandsklasse 4
      - `RC5` — Widerstandsklasse 5
      - `RC6` — Widerstandsklasse 6
    fr: |-
      Classe de résistance à l'effraction de la fenêtre selon le concept de sécurité et EN 1627.

      **Valeurs admises**
      - `RC1` — classe de résistance 1
      - `RC2` — classe de résistance 2
      - `RC3` — classe de résistance 3
      - `RC4` — classe de résistance 4
      - `RC5` — classe de résistance 5
      - `RC6` — classe de résistance 6
    it: |-
      Classe di resistenza all'effrazione della finestra secondo il concetto di sicurezza e la EN 1627.

      **Valori ammessi**
      - `RC1` — classe di resistenza 1
      - `RC2` — classe di resistenza 2
      - `RC3` — classe di resistenza 3
      - `RC4` — classe di resistenza 4
      - `RC5` — classe di resistenza 5
      - `RC6` — classe di resistenza 6
    en: |-
      Burglary resistance class of the window according to the security concept and EN 1627.

      **Allowed values**
      - `RC1` — resistance class 1
      - `RC2` — resistance class 2
      - `RC3` — resistance class 3
      - `RC4` — resistance class 4
      - `RC5` — resistance class 5
      - `RC6` — resistance class 6
  datatype: IfcLabel
