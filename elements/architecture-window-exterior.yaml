- name: Connection
  pset: ePset_Circularity
  definition:
    de: "Art der Verbindung für die Demontierbarkeit (Madaster).\n\n**Zulässige Werte**\n- `DryConnection` — trockene Verbindung\n- `AddedConnection` — Verbindung mit Zusatzteilen\n- `DirectConnection` — direkte integrale Verbindung\n- `SoftChemicalConnection` — weiche chemische Verbindung\n- `HardChemicalConnection` — harte chemische Verbindung"
