- name: eBKP
  pset: ePset_Cost
  definition:
    de: |-
      eBKP-H-Klassifizierung nach SN 506 511 – aus der Innen- oder Aussenlage des umgebenden Raums (`Pset_SpaceCommon.IsExternal`) sowie Terrainkontakt und geometrischer Lage ableitbar. Die Raumlage allein reicht für `C01.04` nicht aus.

      **Zulässige Werte**
      - `C01.04` — erdverbundene Treppe / Rampe
      - `C04.02` — innen liegende Treppe / Rampe
      - `C04.06` — aussen liegende Treppe / Rampe
    fr: |-
      Classification eBKP-H selon SN 506 511 – déductible de la situation intérieure ou extérieure du local environnant (`Pset_SpaceCommon.IsExternal`) ainsi que du contact avec le terrain et de la situation géométrique. La situation du local seule ne suffit pas pour `C01.04`.

      **Valeurs admises**
      - `C01.04` — escalier / rampe en contact avec le terrain
      - `C04.02` — escalier / rampe intérieur
      - `C04.06` — escalier / rampe extérieur
    it: |-
      Classificazione eBKP-H secondo SN 506 511 – ricavabile dalla posizione interna o esterna del locale circostante (`Pset_SpaceCommon.IsExternal`), dal contatto con il terreno e dalla posizione geometrica. La posizione del locale da sola non è sufficiente per `C01.04`.

      **Valori ammessi**
      - `C01.04` — scala / rampa a contatto con il terreno
      - `C04.02` — scala / rampa interna
      - `C04.06` — scala / rampa esterna
    en: |-
      eBKP-H classification according to SN 506 511 – derivable from the interior or exterior location of the surrounding space (`Pset_SpaceCommon.IsExternal`) together with terrain contact and geometric location. The space location alone is insufficient for `C01.04`.

      **Allowed values**
      - `C01.04` — ground-connected stair / ramp
      - `C04.02` — interior stair / ramp
      - `C04.06` — exterior stair / ramp
  datatype: IfcLabel
  allowed_values: pragmaticbim:value/ebkp-h-stair
  needed_in_phases: ['32', '33', '41', '51']
  ifc_versions: [ifc2x3, ifc4, ifc4x3]
  needed_for_workflows:
  - pragmaticbim:workflow/des-ebkp-h-classification
  is_applicability: false
  status: active
  sort_order: 8
- name: CalculatedType
