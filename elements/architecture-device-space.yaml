id: pragmaticbim:element/architecture-device-space
code: ARC-DEVICE-SPACE
sort_order: 111
status: active
name:
  de: Geräteplatz
  fr: Emplacement d'appareil
  it: Postazione apparecchio
  en: Device space
definition:
  de: |-
    Reserviert früh den Platz für Geräte, die Raumgrösse, Tragwerk oder Anschlüsse bestimmen, damit Spezialräume vor der Gerätewahl mit den Nutzenden abgestimmt werden können.

    **Beschreibung**
    - Platzhalter für Operationstisch, Bildgebungsgerät, Produktionsmaschine, Serverschrank und ähnliche Geräte.
    - Umfasst Gerät, Bedienzone und Wartungszone; ersetzt nicht die Geräteplanung.

    **Modellierungshinweis**
    - Als vereinfachten Proxy-Körper mit den Aussenmassen von Gerät und Wartungszone modellieren.
    - ObjectType = Geräteplatz; Name nach Werteliste Name Geräteplatz.
    - Dem zugehörigen Geschoss zuweisen; keine Geräteteile oder Anschlussdetails modellieren.
  fr: |-
    Réserve tôt la place des appareils qui déterminent la taille du local, la structure ou les raccordements, afin de concerter les locaux spéciaux avec les utilisateurs avant le choix des appareils.

    **Description**
    - Réservation pour table d'opération, appareil d'imagerie, machine de production, armoire serveur et appareils semblables.
    - Comprend l'appareil, la zone d'utilisation et la zone de maintenance; ne remplace pas la planification des appareils.

    **Directives de modélisation**
    - Modéliser un corps proxy simplifié aux dimensions extérieures de l'appareil et de sa zone de maintenance.
    - ObjectType = Emplacement d'appareil; Name selon la liste de valeurs Name emplacement d'appareil.
    - Rattacher à l'étage concerné; ne pas modéliser de pièces d'appareil ni de détails de raccordement.
  it: |-
    Riserva presto lo spazio per apparecchi che determinano la dimensione del locale, la struttura o gli allacciamenti, per concertare i locali speciali con gli utenti prima della scelta degli apparecchi.

    **Descrizione**
    - Riserva per tavolo operatorio, apparecchio di diagnostica per immagini, macchina di produzione, armadio server e apparecchi simili.
    - Comprende apparecchio, zona d'uso e zona di manutenzione; non sostituisce la pianificazione degli apparecchi.

    **Direttive di modellazione**
    - Modellare un corpo proxy semplificato con le dimensioni esterne di apparecchio e zona di manutenzione.
    - ObjectType = Postazione apparecchio; Name secondo l'elenco valori Name postazione apparecchio.
    - Assegnare al piano corrispondente; non modellare parti dell'apparecchio né dettagli di allacciamento.
  en: |-
    Reserves space early for devices that drive room size, structure or connections, so special rooms can be agreed with users before devices are chosen.

    **Description**
    - Placeholder for operating tables, imaging devices, production machines, server racks and similar devices.
    - Covers the device, its operating zone and its service zone; does not replace device planning.

    **Modelling guidelines**
    - Model as a simplified proxy body with the outer dimensions of device and service zone.
    - ObjectType = Device space; Name from the device space name value list.
    - Assign to the matching storey; do not model device parts or connection details.
