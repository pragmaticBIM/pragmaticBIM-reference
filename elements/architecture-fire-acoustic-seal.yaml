id: pragmaticbim:element/architecture-fire-acoustic-seal
code: ARC-FIRE-ACOUSTIC-SEAL
sort_order: 46
status: active
name:
  de: Brandschott / Schallschutzschott
  fr: Obturation coupe-feu / acoustique
  it: Sigillatura tagliafuoco / acustica
  en: Firestop / acoustic seal
definition:
  de: |-
    Trennt die ausgeführte Abschottung von der Aussparung und macht Typ, Leistung und Menge für Ausschreibung, Ausführung und Betrieb prüfbar.

    **Beschreibung**
    - Bauliche Abschottung einer Leitungsdurchführung gegen die Ausbreitung von Feuer, Rauch oder Schall.
    - Eigenständiges Bauteil innerhalb einer koordinierten Aussparung; die Aussparung bleibt als separates Öffnungselement erhalten.

    **Modellierungshinweis**
    - Als vereinfachten Proxy-Körper in der zugehörigen Aussparung modellieren; Abmessungen entsprechen der ausgefüllten Schottfläche.
    - Mit eigener Reference eindeutig kennzeichnen und über OpeningReference genau einer Aussparung zuordnen.
    - ObjectType = Brandschott oder Schallschutzschott setzen; kombinierte Anforderungen in einem Element führen und beide Leistungen angeben.
  fr: |-
    Sépare l'obturation exécutée du percement et rend son type, ses performances et sa quantité vérifiables pour l'appel d'offres, l'exécution et l'exploitation.

    **Description**
    - Obturation constructive d'une traversée de réseau contre la propagation du feu, de la fumée ou du bruit.
    - Élément autonome situé dans un percement coordonné; le percement reste un élément d'ouverture distinct.

    **Directives de modélisation**
    - Modéliser un corps proxy simplifié dans le percement correspondant; ses dimensions représentent la surface obturée.
    - L'identifier sans ambiguïté par sa propre Reference et l'attribuer à un seul percement au moyen de OpeningReference.
    - Définir ObjectType = Obturation coupe-feu ou Obturation acoustique; saisir les exigences combinées dans un même élément et indiquer les deux performances.
  it: |-
    Separa la sigillatura eseguita dal foro e rende verificabili tipo, prestazioni e quantità per gara, esecuzione ed esercizio.

    **Descrizione**
    - Sigillatura costruttiva di un attraversamento impiantistico contro la propagazione di fuoco, fumo o rumore.
    - Componente autonomo all'interno di un foro coordinato; il foro rimane un elemento di apertura separato.

    **Direttive di modellazione**
    - Modellare un corpo proxy semplificato nel foro corrispondente; le dimensioni rappresentano la superficie sigillata.
    - Identificarlo in modo univoco con una propria Reference e assegnarlo a un solo foro mediante OpeningReference.
    - Impostare ObjectType = Sigillatura tagliafuoco o Sigillatura acustica; gestire i requisiti combinati in un unico componente e indicare entrambe le prestazioni.
  en: |-
    Separates the installed seal from the opening and makes its type, performance, and quantity verifiable for tendering, construction, and operation.

    **Description**
    - Construction seal around a service penetration that resists the spread of fire, smoke, or sound.
    - Standalone component within a coordinated opening; the opening remains a separate opening element.

    **Modelling guidelines**
    - Model as a simplified proxy body within the associated opening; its dimensions represent the sealed area.
    - Identify it unambiguously with its own Reference and assign it to exactly one opening through OpeningReference.
    - Set ObjectType = Firestop or Acoustic seal; carry combined requirements in one element and state both performance ratings.
