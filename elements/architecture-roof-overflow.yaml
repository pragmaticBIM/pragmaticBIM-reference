id: pragmaticbim:element/architecture-roof-overflow
code: ARC-ROOF-OVERFLOW
sort_order: 54
status: active
name:
  de: Notüberlauf
  fr: Trop-plein de secours
  it: Scarico di emergenza
  en: Emergency overflow
definition:
  de: |-
    Zeigt früh, wo und auf welcher Höhe Wasser bei verstopften Abläufen das Dach verlässt, damit Attika, Fassade, Abdichtungshochzug und Lastannahme für das Tragwerk abgestimmt sind.

    **Beschreibung**
    - Öffnung oder Speier in Attika, Brüstung oder Fassade, über die Wasser abfliesst, wenn die Dachabläufe verstopft sind.
    - Wird oft bewusst über oder nahe bei Eingängen angeordnet, damit ein Problem bei der Dachentwässerung sofort bemerkt wird.
    - Dient der Abstimmung von Lage und Überlaufhöhe zwischen Architektur, Sanitärplanung und Tragwerk.

    **Modellierungshinweis**
    - Je Dach in Abstimmung mit der Sanitärplanung modellieren; die Bemessung erfolgt durch die Sanitärplanung.
    - Lage und Überlaufhöhe modellieren, keine Produkt- oder Bemessungsdetails.
  fr: |-
    Indique tôt où et à quelle hauteur l’eau quitte la toiture lorsque les évacuations sont obstruées, afin de coordonner l’acrotère, la façade, le relevé d’étanchéité et les hypothèses de charge de la structure.

    **Description**
    - Ouverture ou gargouille dans l’acrotère, le parapet ou la façade par laquelle l’eau s’écoule lorsque les évacuations de toiture sont obstruées.
    - Est souvent placée volontairement au-dessus ou à proximité des entrées afin qu’un problème d’évacuation de toiture soit immédiatement remarqué.
    - Sert à coordonner la position et la hauteur de déversement entre l’architecture, la planification sanitaire et la structure.

    **Directives de modélisation**
    - Modéliser un trop-plein pour chaque toiture en coordination avec la planification sanitaire ; le dimensionnement relève de cette dernière.
    - Modéliser la position et la hauteur de déversement, sans détails de produit ni de dimensionnement.
  it: |-
    Mostra tempestivamente dove e a quale quota l’acqua lascia il tetto quando gli scarichi sono ostruiti, affinché parapetto, facciata, risvolto dell’impermeabilizzazione e ipotesi di carico della struttura siano coordinati.

    **Descrizione**
    - Apertura o doccione nel parapetto, nella balaustra o nella facciata attraverso il quale defluisce l’acqua quando gli scarichi del tetto sono ostruiti.
    - Viene spesso collocato intenzionalmente sopra o vicino agli ingressi, affinché un problema di drenaggio del tetto sia subito visibile.
    - Serve a coordinare posizione e quota di sfioro tra architettura, progettazione sanitaria e struttura.

    **Direttive di modellazione**
    - Modellare uno scarico per ogni tetto in coordinamento con la progettazione sanitaria; il dimensionamento compete a quest’ultima.
    - Modellare posizione e quota di sfioro, senza dettagli di prodotto o dimensionamento.
  en: |-
    Shows early where and at what level water leaves the roof when outlets are blocked, so the parapet, facade, waterproofing upstand, and structural load assumptions can be coordinated.

    **Description**
    - Opening or spout in a parapet or facade through which water drains when the roof outlets are blocked.
    - Often deliberately positioned above or near entrances so a roof drainage problem is noticed immediately.
    - Used to coordinate the position and overflow level between architecture, sanitary design, and structural design.

    **Modelling guidelines**
    - Model one for each roof in coordination with the sanitary designer; the sanitary designer is responsible for sizing.
    - Model the position and overflow level, without product or sizing details.
