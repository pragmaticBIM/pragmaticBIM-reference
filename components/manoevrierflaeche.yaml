definition:
  de: Freizuhaltende Fläche für Richtungswechsel über 45° im Rollstuhl, etwa vor Türen und Apparaten.
  fr: Surface à maintenir libre pour un changement de direction de plus de 45° en fauteuil roulant, par
    exemple devant les portes et les appareils.
  it: Superficie da mantenere libera per cambi di direzione superiori a 45° in sedia a rotelle, ad esempio
    davanti a porte e apparecchi.
  en: Area kept clear for changes of direction over 45° in a wheelchair, for example in front of doors
    and fixtures.
