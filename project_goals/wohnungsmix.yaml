id: pragmaticbim:project-goal/wohnungsmix
sort_order: 1011
group: rahmenbedingungen
code: PG-13
name:
  de: Wohnungsmix
  fr: Répartition des logements
  it: Composizione degli alloggi
  en: Dwelling mix
tag:
  de: Mix
  fr: Mix
  it: Mix
  en: Mix
description:
  de: |-
    Die angebotenen Zimmerzahlen entscheiden, welche Haushaltsgrössen das Gebäude aufnehmen kann. Die Anzahl je Wohnungstyp folgt im Raumprogramm. Aus dem Wohnungsmix folgen die Wohnungsgrössen und die Nebenräume.
  fr: |-
    Les nombres de pièces proposés décident quelles tailles de ménage le bâtiment peut accueillir. Le nombre par type de logement suit dans le programme des locaux. Les tailles de logement et les locaux annexes découlent du mix de logements.
  it: |-
    I numeri di locali offerti decidono quali grandezze di nucleo domestico l'edificio può accogliere. Il numero per tipo di alloggio segue nel programma dei locali. Dal mix di alloggi derivano le dimensioni degli alloggi e i locali accessori.
  en: |-
    The room counts on offer decide which household sizes the building can house. The number per dwelling type follows in the room programme. Dwelling sizes and ancillary rooms follow from the dwelling mix.
status: active
uses:
- pragmaticbim:use/wohnen
is_boundary_condition: true
comment: ''
