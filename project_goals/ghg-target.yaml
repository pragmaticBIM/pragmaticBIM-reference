- id: pragmaticbim:project-goal-level/ghg-target-sia-390-1
  code: THG-02
  sort_order: 2
  name:
    de: Richtwert SIA 390/1
    fr: Valeur indicative SIA 390/1
    it: Valore indicativo SIA 390/1
    en: SIA 390/1 guide value
  description:
    de: Die Treibhausgasemissionen der Erstellung halten den Richtwert des Klimapfads nach SIA 390/1 ein. Konstruktionsvolumen und Ökobilanz werden aus dem Modell berechnet.
    fr: Les émissions de gaz à effet de serre de la construction respectent la valeur indicative de la voie climatique selon SIA 390/1. Le volume de construction et l'écobilan sont calculés à partir de la maquette.
    it: Le emissioni di gas serra della costruzione rispettano il valore indicativo del percorso climatico secondo SIA 390/1. Volume di costruzione e bilancio ecologico vengono calcolati dal modello.
    en: Greenhouse gas emissions from construction stay within the climate path guide value under SIA 390/1. Construction volume and life-cycle assessment are calculated from the model.
  status: active
