  name:
    de: Verschärfter Zielwert
    fr: Valeur cible renforcée
    it: Valore obiettivo inasprito
    en: Tightened target
  description:
    de: Die Bauherrschaft setzt einen Grenzwert unter dem Richtwert. Jeder Bauteiltyp erhält einen Zielwert für graue Energie und Treibhausgase.
    fr: Le maître d'ouvrage fixe une valeur limite inférieure à la valeur indicative. Chaque type d'élément reçoit une valeur cible pour l'énergie grise et les gaz à effet de serre.
    it: Il committente fissa un valore limite inferiore al valore indicativo. Ogni tipo di elemento riceve un valore obiettivo per energia grigia e gas serra.
    en: The client sets a limit below the guide value. Every component type gets a target for grey energy and greenhouse gases.
