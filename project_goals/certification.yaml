id: pragmaticbim:project-goal/certification
sort_order: 60
group: rahmenbedingungen
code: PG-36
name:
  de: Zertifizierung
  fr: Certification
  it: Certificazione
  en: Certification
tag:
  de: Zertifizierung
  fr: Certification
  it: Certificazione
  en: Certification
description:
  de: |-
    Festgelegt wird, ob das Gebäude ein Label wie Minergie-ECO, SNBS Hochbau oder DGNB/SGNI erhält. Das Label setzt Mindeststufen für Energiestandard, Treibhausgasziel und Schallschutz. Diese Stufen lassen sich erhöhen, aber nicht unterschreiten.

    Ohne diese Festlegung werden Energie-, Material- und Schallschutzziele einzeln vereinbart. Erst bei der Zertifizierung zeigt sich, dass eines davon die Labelanforderung nicht erfüllt.
  fr: |-
    Cette condition-cadre détermine si le bâtiment obtient un label tel que Minergie-ECO, SNBS Bâtiment ou DGNB/SGNI. Le label fixe des niveaux minimaux pour le standard énergétique, l'objectif de gaz à effet de serre et l'isolation acoustique. Ces niveaux peuvent être relevés, mais pas abaissés.

    Sans cette définition, les objectifs d'énergie, de matériaux et d'isolation acoustique sont convenus séparément. Ce n'est qu'à la certification qu'il apparaît que l'un d'eux ne satisfait pas l'exigence du label.
  it: |-
    Questa condizione quadro stabilisce se l'edificio ottiene un label come Minergie-ECO, SNBS Edilizia o DGNB/SGNI. Il label fissa livelli minimi per standard energetico, obiettivo di gas serra e isolamento acustico. Questi livelli si possono alzare, ma non abbassare.

    Senza questa definizione, gli obiettivi di energia, materiali e isolamento acustico vengono concordati separatamente. Solo alla certificazione emerge che uno di essi non soddisfa il requisito del label.
  en: |-
    This framework condition sets whether the building receives a label such as Minergie-ECO, SNBS Building Construction, or DGNB/SGNI. The label sets minimum levels for the energy standard, the greenhouse gas target, and sound insulation. These levels can be raised but not lowered.

    Without it, energy, material, and sound insulation targets are agreed one by one. Only at certification does it turn out that one of them misses the label requirement.
status: active
is_boundary_condition: true
allows_multiple: true
comment: 'Keine eigenen Anwendungsfälle; wirkt über implied_levels auf PG-34, PG-35 und PG-38. Kein Einfluss auf Anwendungsfälle der Nutzung oder Raumtypen. Mindeststufen je Label vor Freigabe fachlich bestätigen.'
