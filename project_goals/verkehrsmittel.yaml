description:
  de: |-
    Das Verkehrsmittel und die Reisenden in der Spitzenstunde bestimmen Perronlängen, Wartebereiche, Personenflüsse, Zugänge und Fluchtwege.
  fr: |-
    Le moyen de transport et les voyageurs à l'heure de pointe déterminent la longueur des quais, les zones d'attente, les flux de personnes, les accès et les voies d'évacuation.
  it: |-
    Il mezzo di trasporto e i viaggiatori nell'ora di punta determinano lunghezza dei marciapiedi, zone d'attesa, flussi di persone, accessi e vie di fuga.
  en: |-
    The mode of transport and peak-hour passengers determine platform lengths, waiting areas, passenger flows, access, and escape routes.
