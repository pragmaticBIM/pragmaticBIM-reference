description:
  de: |-
    Das Arbeitsplatzmodell und die Zahl der Arbeitsplätze bestimmen die Bürofläche, die Desk-Sharing-Quote und den Bedarf an Rückzugs- und Besprechungsräumen.
  fr: |-
    Le modèle de poste de travail et le nombre de postes déterminent la surface de bureau, le taux de desk sharing et le besoin en espaces de retrait et de réunion.
  it: |-
    Il modello di postazione e il numero di postazioni determinano la superficie d'ufficio, la quota di desk sharing e il fabbisogno di spazi di concentrazione e riunione.
  en: |-
    The workplace model and the number of workstations determine the office area, the desk-sharing ratio, and the need for retreat and meeting rooms.
