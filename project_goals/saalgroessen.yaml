name:
  de: Saalgrössen
  fr: Tailles de salle
  it: Dimensioni delle sale
  en: Hall sizes
tag:
  de: Saal
  fr: Salle
  it: Sala
  en: Hall
description:
  de: |-
    Die Saalgrössen und die Zahl der Besucherplätze bestimmen Foyer, Fluchtwege, Toiletten und Garderobe.

    Ohne diese Festlegung bleiben Foyer, Toiletten und Garderobe unbestimmt. Parallelveranstaltungen und die Teilung des Saals lassen sich dann nicht bestellen.
  fr: |-
    Les tailles de salle et le nombre de places pour le public déterminent le foyer, les voies d'évacuation, les toilettes et le vestiaire.

    Sans cette décision, foyer, toilettes et vestiaire restent indéterminés. Les manifestations en parallèle et la division de la salle ne peuvent alors pas être commandées.
  it: |-
    Le dimensioni delle sale e il numero di posti per il pubblico determinano foyer, vie di fuga, servizi igienici e guardaroba.

    Senza questa decisione foyer, servizi igienici e guardaroba restano indeterminati. Eventi in parallelo e suddivisione della sala non possono allora essere commissionati.
  en: |-
    Hall sizes and the number of audience places determine foyer, escape routes, toilets, and cloakroom.

    Without this decision foyer, toilets, and cloakroom stay undefined. Parallel events and splitting the hall then cannot be ordered.
status: active
