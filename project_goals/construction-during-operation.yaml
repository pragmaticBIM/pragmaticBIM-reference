    fr: Le bâtiment ou le terrain n'est pas utilisé pendant les travaux. La logistique de chantier suit uniquement le déroulement des travaux.
    it: L'edificio o il fondo non è utilizzato durante i lavori. La logistica di cantiere segue solo lo svolgimento dei lavori.
    en: The building or site is not in use during construction. Site logistics follow the construction sequence alone.
  status: active
  activated_workflows: []
  comment: ''
- id: pragmaticbim:project-goal-level/construction-during-operation-partial
  code: BUB-02
  sort_order: 2
  name:
    de: Teilbetrieb mit Etappen
    fr: Exploitation partielle par étapes
    it: Esercizio parziale a tappe
    en: Partly in use with phasing
  description:
    de: Teile des Gebäudes bleiben in Betrieb, während andere Etappen umgebaut werden. Etappen, Ersatzflächen und Baustellenzugänge werden im Modell geplant und geprüft.
    fr: Certaines parties du bâtiment restent en exploitation pendant que d'autres étapes sont transformées. Étapes, surfaces de remplacement et accès au chantier sont planifiés et contrôlés dans la maquette.
    it: Parti dell'edificio restano in esercizio mentre altre tappe vengono trasformate. Tappe, superfici sostitutive e accessi al cantiere vengono pianificati e verificati nel modello.
    en: Parts of the building stay in operation while other phases are refurbished. Phases, decant space, and site access are planned and checked in the model.
