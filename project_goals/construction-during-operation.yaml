- id: pragmaticbim:project-goal-level/construction-during-operation-full
  code: BUB-03
  sort_order: 3
  name:
    de: Vollbetrieb
    fr: Exploitation complète
    it: Esercizio completo
    en: Fully in use
  description:
    de: Der Betrieb läuft während der gesamten Bauzeit uneingeschränkt weiter. Lärm, Staub, Fluchtwege und Anlieferung werden je Etappe mit dem Betrieb abgestimmt.
    fr: L'exploitation se poursuit sans restriction pendant toute la durée des travaux. Bruit, poussière, voies d'évacuation et livraisons sont coordonnés avec l'exploitation pour chaque étape.
    it: L'esercizio prosegue senza restrizioni per tutta la durata dei lavori. Rumore, polvere, vie di fuga e forniture vengono coordinati con l'esercizio per ogni tappa.
    en: Operation continues without restriction for the whole construction period. Noise, dust, escape routes, and deliveries are agreed with operations for each phase.
  status: active
  activated_workflows:
