id: pragmaticbim:project-goal/construction-during-operation
sort_order: 140
group: rahmenbedingungen
code: PG-41
name:
  de: Bauen unter Betrieb
  fr: Construire en exploitation
  it: Costruire in esercizio
  en: Construction during operation
tag:
  de: Betrieb
  fr: Exploitation
  it: Esercizio
  en: Operation
description:
  de: |-
    Festgelegt wird, ob das Gebäude während der Bauarbeiten genutzt wird. Die Festlegung bestimmt Etappierung, Provisorien und Baulogistik. Bei der Erneuerung von Schulen, Spitälern und Bürobauten ist sie entscheidend.

    Ohne diese Festlegung wird das Projekt für eine leere Baustelle geplant. Etappen, Ersatzflächen und getrennte Wege für Betrieb und Baustelle kommen dann erst bei der Ausführung dazu.
  fr: |-
    Cette condition-cadre détermine si le bâtiment est utilisé pendant les travaux. Elle détermine l'étapage, les installations provisoires et la logistique de chantier. Elle est décisive pour la rénovation d'écoles, d'hôpitaux et d'immeubles de bureaux.

    Sans cette définition, le projet est planifié pour un chantier vide. Étapes, surfaces de remplacement et cheminements séparés pour l'exploitation et le chantier ne s'ajoutent alors qu'à la réalisation.
  it: |-
    Questa condizione quadro stabilisce se l'edificio viene utilizzato durante i lavori. Determina tappe, provvisori e logistica di cantiere. È decisiva per il rinnovo di scuole, ospedali ed edifici per uffici.

    Senza questa definizione, il progetto viene pianificato per un cantiere vuoto. Tappe, superfici sostitutive e percorsi separati per esercizio e cantiere si aggiungono allora solo in fase di esecuzione.
  en: |-
    This framework condition sets whether the building stays in use during construction. It drives phasing, temporary measures, and site logistics. It is decisive when renovating schools, hospitals, and offices.

    Without it, the project is planned for an empty site. Phases, decant space, and separate routes for operation and construction are then added only during construction.
status: active
is_boundary_condition: true
comment: 'Kumulativ. Kein Einfluss auf Raumtypen; Provisorien und Etappierung sind die Wirkung, nicht neue Räume. Vor allem bei Umbauten relevant (PG-06 Arbeiten im Bestand).'
levels:
