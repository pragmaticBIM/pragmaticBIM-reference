    fr: Sur l'année, le bâtiment produit au moins autant d'énergie qu'il en consomme. Toiture et façade sont en outre planifiées pour la production d'électricité.
    it: Nell'arco dell'anno l'edificio produce almeno tanta energia quanta ne consuma. Tetto e facciata vengono inoltre progettati per la produzione di elettricità.
    en: Over the year, the building generates at least as much energy as it uses. Roof and facade are also designed for electricity generation.
