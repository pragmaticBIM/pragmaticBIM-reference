    de: Sehr tiefer Heizwärmebedarf mit besonders dichter Hülle. Wärmebrücken und Luftdichtheit werden an jedem Hüllbauteil nachgewiesen.
    fr: Besoins de chaleur pour le chauffage très faibles avec une enveloppe particulièrement étanche. Ponts thermiques et étanchéité à l'air sont justifiés pour chaque élément d'enveloppe.
    it: Fabbisogno termico per il riscaldamento molto basso con involucro particolarmente ermetico. Ponti termici e tenuta all'aria vengono verificati per ogni elemento d'involucro.
    en: Very low heating demand with a particularly airtight envelope. Thermal bridges and airtightness are verified for every envelope component.
