    de: Minergie
    fr: Minergie
    it: Minergie
    en: Minergie
  description:
    de: Gut gedämmte Hülle, kontrollierter Luftwechsel und erneuerbare Wärmeerzeugung. Die Kennwerte der Hüllbauteile werden mit einem Bauphysikkonzept festgelegt und geprüft.
    fr: Enveloppe bien isolée, renouvellement d'air contrôlé et production de chaleur renouvelable. Les valeurs des éléments d'enveloppe sont fixées et contrôlées dans un concept de physique du bâtiment.
    it: Involucro ben isolato, ricambio d'aria controllato e produzione di calore rinnovabile. I valori degli elementi d'involucro vengono fissati e verificati in un concetto di fisica della costruzione.
    en: A well-insulated envelope, controlled air exchange, and renewable heat generation. The values of envelope components are set and checked in a building physics concept.
