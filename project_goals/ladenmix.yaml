id: pragmaticbim:project-goal/ladenmix
sort_order: 1042
group: rahmenbedingungen
code: PG-44
name:
  de: Ladenmix
  fr: Répartition des locaux commerciaux
  it: Composizione dei locali di vendita
  en: Shop mix
tag:
  de: Mix
  fr: Mix
  it: Mix
  en: Mix
description:
  de: |-
    Die Grösse der Ladenlokale entscheidet, welche Geschäfte das Gebäude aufnehmen kann. Die Anzahl je Ladentyp folgt im Raumprogramm. Aus dem Ladenmix folgen die Schaufensterfront, die Anlieferung und die Lagerflächen.
  fr: |-
    La taille des locaux commerciaux décide quels commerces le bâtiment peut accueillir. Le nombre par type de local suit dans le programme des locaux. La vitrine, la livraison et les surfaces de stockage découlent de la répartition des locaux commerciaux.
  it: |-
    La grandezza dei locali di vendita decide quali negozi l'edificio può accogliere. Il numero per tipo di locale segue nel programma dei locali. Dalla composizione dei locali di vendita derivano il fronte vetrine, la fornitura e le superfici di deposito.
  en: |-
    The size of the shops decides which businesses the building can house. The number per shop type follows in the room programme. The shopfront, deliveries, and storage areas follow from the shop mix.
status: active
uses:
- pragmaticbim:use/verkauf
is_boundary_condition: true
