id: pragmaticbim:project-goal/bueroeinheitenmix
sort_order: 1022
group: rahmenbedingungen
code: PG-43
name:
  de: Büroeinheitenmix
  fr: Répartition des suites de bureaux
  it: Composizione delle suite di uffici
  en: Office suite mix
tag:
  de: Mix
  fr: Mix
  it: Mix
  en: Mix
description:
  de: |-
    Die Grösse der Büroeinheiten entscheidet, welche Mietparteien das Gebäude aufnehmen kann. Die Anzahl je Einheitstyp folgt im Raumprogramm. Aus dem Büroeinheitenmix folgen die Teilung der Geschosse und die gemeinsam genutzten Räume.
  fr: |-
    La taille des suites de bureaux décide quels locataires le bâtiment peut accueillir. Le nombre par type d'unité suit dans le programme des locaux. La division des étages et les locaux communs découlent de la répartition des suites de bureaux.
  it: |-
    La grandezza delle suite di uffici decide quali conduttori l'edificio può accogliere. Il numero per tipo di unità segue nel programma dei locali. Dalla composizione delle suite di uffici derivano la suddivisione dei piani e i locali in comune.
  en: |-
    The size of the office suites decides which tenants the building can house. The number per unit type follows in the room programme. The division of the storeys and the shared rooms follow from the office suite mix.
status: active
uses:
- pragmaticbim:use/arbeit
is_boundary_condition: true
comment: ''
