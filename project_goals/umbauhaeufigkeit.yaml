id: pragmaticbim:project-goal/umbauhaeufigkeit
sort_order: 1901
group: rahmenbedingungen
code: PG-15
name:
  de: Umbauhäufigkeit
  fr: Fréquence des transformations
  it: Frequenza delle trasformazioni
  en: Refit frequency
tag:
  de: Umbau
  fr: Transformation
  it: Trasformazione
  en: Refit
description:
  de: |-
    Wie oft Räume, Geräte und Installationen umgebaut werden, entscheidet, wie aktuell die Bestandsdaten im Betrieb sein müssen. Je häufiger umgebaut wird, desto mehr Anwendungsfälle der Bewirtschaftung sind vorgewählt.

    Ohne diese Festlegung bleibt offen, wie aktuell die Bestandsdaten im Betrieb sein müssen.
  fr: |-
    La fréquence à laquelle les locaux, appareils et installations sont transformés détermine l'actualité requise des données d'état en exploitation. Plus les transformations sont fréquentes, plus de cas d'utilisation de la gestion immobilière sont présélectionnés.

    Sans cette décision, il reste ouvert à quel point les données d'état doivent être à jour en exploitation.
  it: |-
    La frequenza con cui locali, apparecchi e impianti vengono trasformati determina quanto aggiornati devono essere i dati dell'esistente in esercizio. Più frequenti sono le trasformazioni, più casi d'uso della gestione immobiliare sono preselezionati.

    Senza questa decisione resta aperto quanto aggiornati devono essere i dati dell'esistente in esercizio.
  en: |-
    How often spaces, equipment, and installations are refitted decides how current the as-built data must be in operation. The more often the building is refitted, the more facility management use cases are preselected.

    Without this decision it stays open how current the as-built data must be in operation.
status: active
uses:
- pragmaticbim:use/gesundheit
- pragmaticbim:use/produktion
- pragmaticbim:use/labor
- pragmaticbim:use/rechenzentrum
is_boundary_condition: true
comment: ''
