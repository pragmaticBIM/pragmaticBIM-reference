  name:
    de: Selten
    fr: Rarement
    it: Raramente
    en: Rarely
  description:
    de: Raumaufteilung und Installationen bleiben über Jahrzehnte weitgehend gleich. Listen genügen für
      den Betrieb.
    fr: La répartition des locaux et les installations restent largement inchangées pendant des décennies.
      Des listes suffisent pour l'exploitation.
    it: La suddivisione dei locali e gli impianti restano in gran parte invariati per decenni. Gli elenchi
      bastano per l'esercizio.
    en: Layout and installations stay largely the same for decades. Lists are enough for operation.
  status: active
