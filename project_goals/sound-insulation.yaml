    fr: Exigences minimales SIA 181
    it: Requisiti minimi SIA 181
    en: SIA 181 minimum requirements
  description:
    de: Luft- und Trittschalldämmung erfüllen die Mindestanforderungen nach SIA 181 für die jeweilige Lärmempfindlichkeit.
    fr: L'isolation aux bruits aériens et aux bruits de choc respecte les exigences minimales selon SIA 181 pour la sensibilité au bruit concernée.
    it: L'isolamento dai rumori aerei e da calpestio rispetta i requisiti minimi secondo SIA 181 per la relativa sensibilità al rumore.
    en: Airborne and impact sound insulation meet the SIA 181 minimum requirements for the relevant noise sensitivity.
