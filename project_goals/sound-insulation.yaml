    it: Requisiti elevati SIA 181
    en: SIA 181 increased requirements
  description:
    de: Die erhöhten Anforderungen nach SIA 181 gelten, wie im Stockwerkeigentum üblich. Jede Wand und Decke zwischen Einheiten erhält ein Anforderungsprofil.
    fr: Les exigences accrues selon SIA 181 s'appliquent, comme d'usage en propriété par étages. Chaque mur et chaque dalle entre unités reçoit un profil d'exigences.
    it: Valgono i requisiti elevati secondo SIA 181, come d'uso nella proprietà per piani. Ogni parete e soletta tra unità riceve un profilo dei requisiti.
    en: The increased SIA 181 requirements apply, as is usual for condominiums. Every wall and slab between units gets a requirement profile.
