- id: pragmaticbim:project-goal-level/sound-insulation-special
  code: SLS-03
  sort_order: 3
  name:
    de: Besondere Anforderungen
    fr: Exigences particulières
    it: Requisiti particolari
    en: Special requirements
  description:
    de: Einzelne Räume brauchen mehr als die erhöhten Anforderungen, etwa Hotelzimmer, Behandlungsräume oder Studios. Die Werte legt die Bauakustik je Raumpaar fest.
    fr: Certains locaux exigent davantage que les exigences accrues, par exemple chambres d'hôtel, salles de traitement ou studios. L'acousticien fixe les valeurs pour chaque paire de locaux.
    it: Singoli locali richiedono più dei requisiti elevati, ad esempio camere d'albergo, sale di trattamento o studi. L'acustica edilizia fissa i valori per ogni coppia di locali.
    en: Individual spaces need more than the increased requirements, such as hotel rooms, treatment rooms, or studios. The acoustic consultant sets the values for each pair of spaces.
