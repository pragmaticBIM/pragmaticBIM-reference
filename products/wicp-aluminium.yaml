tender_text:
  de: 'Fenstereinheit mit thermisch getrennten Aluminiumprofilen für Rahmen und Flügel und einer Isolierverglasung, die eine Fassadenöffnung verschliesst. Die Profile werden im Werk zugeschnitten, gefügt und verglast, danach in die Laibung eingesetzt, am Rohbau verankert und an die angrenzende Konstruktion abgedichtet. Geeignet für grossformatige und stark genutzte Fassadenöffnungen mit dauerhaft beschichteten Oberflächen und geringem Unterhaltsaufwand auf der Wetterseite. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Window unit with thermally separated aluminium frame and sash profiles and an insulating glazing infill, closing a facade opening. Profiles are cut, joined, and glazed in the factory, then set into the reveal, anchored to the structure and sealed against the adjoining construction. Suitable for large-format and heavily used facade openings, with durable coated surfaces and low maintenance effort on the weather side. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
