  de: Ueberdachter Gang entlang der oeffentlichen Seite der Baustelle, mit einer Decke, die herabfallende Teile auffaengt, und einem freien Durchgang darunter. Kein Arbeitsgeruest und kein Bauzaun. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
