tender_text:
  de: 'Nichttragende oder gering belastete Wand aus gerahmter oder panelisierter Leichtbaukonstruktion mit Dämmung und ein- oder beidseitiger Beplankung, die über eine übliche Trockenbau-Trennwand hinausgeht. Vor Ort aus Einzelteilen oder vorgefertigten Paneelen aufgebaut, nicht monolithisch. Geeignet für leichte Aussenwandaufbauten, Aufstockungen und Innenwände mit erhöhten Anforderungen an Belastbarkeit, Schall- oder Brandschutz; übliche Trennwände aus Ständern und Gipsplatten sind Ständerwände in Trockenbau. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Anschlüsse an Boden, Decke und Wände mit Trenn- und Dämmstreifen, Verstärkungen und Traversen für Wandlasten wie Sanitärapparate, Hängeschränke und Handläufe, Öffnungen mit Laibungsausbildung und Zargenanschluss, Aussparungen für Installationen sowie brand- und schallschutztechnische Abschottungen von Durchdringungen.'
  en: 'Non-load-bearing or lightly loaded wall from a framed or panelised lightweight structure with insulation and sheathing on one or both sides, going beyond a standard drywall partition. Built up on site from individual parts or prefabricated panels rather than monolithically. Suitable for light exterior wall build-ups, storey extensions, and interior walls with increased requirements on robustness, acoustics, or fire protection; standard partitions of studs and gypsum boards are stud drywall partitions. Included are all works required to meet the specified requirements. Included in particular: connections to floor, ceiling, and walls with separation and insulation strips, reinforcements and cross members for wall loads such as sanitary fixtures, wall cabinets, and handrails, openings with reveals and frame connections, cut-outs for services, and fire and acoustic sealing of penetrations.'
