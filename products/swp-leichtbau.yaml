tender_text:
  de: 'Nichttragende oder gering belastete Wand aus gerahmter oder panelisierter Leichtbaukonstruktion mit Dämmung und ein- oder beidseitiger Beplankung. Vor Ort aus Einzelteilen aufgebaut, nicht monolithisch. Geeignet für Innenwände und leichte Aussenwandaufbauten mit Anforderungen an Schall- und Brandschutz. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Anschlüsse an Boden, Decke und Wände mit Trenn- und Dämmstreifen, Verstärkungen und Traversen für Wandlasten wie Sanitärapparate, Hängeschränke und Handläufe, Öffnungen mit Laibungsausbildung und Zargenanschluss, Aussparungen für Installationen sowie brand- und schallschutztechnische Abschottungen von Durchdringungen.'
  en: 'Non-load-bearing or lightly loaded wall from a framed or panelised lightweight structure with insulation and sheathing on one or both sides. Built up on site from individual parts rather than monolithically. Suitable for interior walls and light exterior wall build-ups with acoustic and fire protection requirements. Included are all works required to meet the specified requirements. Included in particular: connections to floor, ceiling, and walls with separation and insulation strips, reinforcements and cross members for wall loads such as sanitary fixtures, wall cabinets, and handrails, openings with reveals and frame connections, cut-outs for services, and fire and acoustic sealing of penetrations.'
