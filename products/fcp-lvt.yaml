tender_text:
  de: Elastische Nutzschicht aus Vinylbahnen oder -platten auf vorbereitetem Unterlagsboden, die eine strapazierfähige und leicht zu reinigende Gehfläche bildet. Vollflächig verklebt oder als Klicksystem schwimmend auf dem ausgeglichenen Untergrund verlegt, mit verschweissten oder versiegelten Nähten, wo Wasserdichtheit gefordert ist. Geeignet für stark genutzte Räume und feucht zu reinigende Bereiche, auch in Kombination mit Bodenheizung.
  en: Resilient wearing surface from vinyl sheet or tile on a prepared screed, delivering a hard-wearing and easily cleaned walking surface. Laid fully adhered or as a click system floating on the levelled substrate, with seams welded or sealed where watertightness is required. Suitable for heavily used rooms and wet-cleaned areas, including in combination with floor heating.
