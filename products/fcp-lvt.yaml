tender_text:
  de: 'Elastische Nutzschicht aus Vinylbahnen oder -platten auf vorbereitetem Unterlagsboden, die eine strapazierfähige und leicht zu reinigende Gehfläche bildet. Vollflächig verklebt oder als Klicksystem schwimmend auf dem ausgeglichenen Untergrund verlegt, mit verschweissten oder versiegelten Nähten, wo Wasserdichtheit gefordert ist. Geeignet für stark genutzte Räume und feucht zu reinigende Bereiche, auch in Kombination mit Bodenheizung. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Resilient wearing surface from vinyl sheet or tile on a prepared screed, delivering a hard-wearing and easily cleaned walking surface. Laid fully adhered or as a click system floating on the levelled substrate, with seams welded or sealed where watertightness is required. Suitable for heavily used rooms and wet-cleaned areas, including in combination with floor heating. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
