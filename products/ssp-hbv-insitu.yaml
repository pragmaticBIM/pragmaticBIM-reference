tender_text:
  de: Tragendes horizontales Bauteil aus Holzbalken oder Holzplatten, auf die eine Betonschicht vor Ort schubfest aufbetoniert wird. Das Holztragwerk wird verlegt, mit Kerven, Schrauben oder Verbindern versehen, bewehrt und betoniert, mit Abstützung bis zum Erhärten. Geeignet für Neubau und Sanierung von Holzbalkendecken mit Anforderungen an Steifigkeit, Schallschutz und Brandwiderstand. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Load-bearing horizontal element of timber beams or panels onto which a concrete layer is cast on site with shear connection. The timber structure is laid, fitted with notches, screws, or connectors, reinforced, and cast, with propping until the concrete has hardened. Suitable for new and refurbished timber floors with stiffness, acoustic, and fire-resistance requirements. Included are all works required to meet the specified requirements.
