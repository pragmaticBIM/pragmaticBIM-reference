tender_text:
  de: 'Nichttragendes, geklebtes Aussendämm- und Putzsystem, direkt auf der tragenden Aussenwand ohne Hinterlüftungsraum. Die Dämmplatten werden auf den Untergrund geklebt und mechanisch verdübelt und anschliessend mit bewehrtem Unterputz mit eingelegtem Armierungsgewebe und Deckputz überzogen. Geeignet für Neubau und energetische Sanierung massiver Wände mit Verdickung des Wandaufbaus von aussen; Ebenheit, Dübeltragfähigkeit und Feuchtezustand des Untergrunds sind zu prüfen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing bonded external insulation and render system applied directly onto the load-bearing exterior wall without a ventilated cavity. Insulation boards are adhesive-bonded and mechanically anchored to the substrate and then covered with a reinforced base coat with embedded mesh and a finishing render. Suitable for new build and for energy retrofit of solid walls where the wall is thickened from outside; flatness, anchor capacity, and moisture condition of the substrate must be verified. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
