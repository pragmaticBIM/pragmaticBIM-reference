tender_text:
  de: 'Grossformatiger Abschluss einer Fahrzeug- oder Warenöffnung mit einem oder mehreren Flügeln, die auf Lauf- und Führungsschienen seitlich vor der Wand verschoben werden. Schienen, Flügel und gegebenenfalls Antrieb werden montiert, ausgerichtet und mit Endanschlägen und Sicherheitseinrichtungen in Betrieb genommen. Geeignet für Hallen und Werkstätten mit grossen Öffnungen und ausreichend freier Wandfläche neben der Öffnung. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung und Anschlussfuge, luft- und schlagregendichter Anschluss an der Gebäudehülle, Beschläge, Dichtungen, Schwellen- und Bodenanschluss, Einstellen und Funktionsprüfung sowie Übergabe mit Schlüsseln, Kennzeichnung und Wartungsunterlagen.'
  en: 'Large-format closure of a vehicle or goods opening with one or more leaves that slide sideways along the wall on running and guide tracks. Tracks, leaves, and drive where present are installed, aligned, and commissioned with end stops and safety devices. Suitable for halls and workshops with large openings and enough free wall beside the opening. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing and connection joint, airtight and rainproof connection in the building envelope, hardware, seals, threshold and floor connection, adjustment and function test, and handover with keys, marking, and maintenance documents.'
