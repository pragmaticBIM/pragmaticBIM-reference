tender_text:
  de: Nichttragende mineralische Plattenbekleidung aus Faserzement- oder verstärkten Zementplatten vor der gedämmten Aussenwand. Die Platten werden zugeschnitten und genietet, geschraubt oder verdeckt auf einer Metall- oder Holz-Unterkonstruktion mit Hinterlüftungsraum und definiertem Fugenbild befestigt. Geeignet für Neubau und Sanierung, wenn eine dauerhafte, unterhaltsarme und formstabile mineralische Oberfläche gefordert ist; Kantenschutz und sorgfältige Handhabung der spröden Platten sind zu berücksichtigen.
  en: Non-load-bearing mineral board cladding of fibre-cement or reinforced cement panels in front of the insulated exterior wall. The boards are cut to size and riveted, screwed, or concealed-fixed to a metal or timber sub-frame with a ventilated cavity and a defined joint pattern. Suitable for new build and retrofit where a durable, low-maintenance, dimensionally stable mineral surface is required; edge protection and careful handling of the brittle boards are to be considered.
