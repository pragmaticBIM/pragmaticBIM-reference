tender_text:
  de: Robuste Innenwandverkleidung aus Kunststoff-, Laminat- oder Verbundplatten mit geschlossener, stossfester Oberfläche. Auf ausgeglichenem Untergrund verklebt oder mechanisch auf Unterkonstruktion befestigt, mit dichten oder profilierten Fugen und schützenden Kanten- und Eckausbildungen. Geeignet für Sanitär-, Küchen-, Labor- und Pflegeräume mit Anforderungen an Stossfestigkeit, Feuchtebeständigkeit und desinfizierbare Oberflächen.
  en: Robust interior wall cladding from plastic, laminate, or composite panels with a closed, impact-resistant surface. Adhered to a levelled substrate or mechanically fixed on a substructure, with sealed or profiled joints and protective edge and corner details. Suitable for sanitary rooms, kitchens, laboratories, and healthcare rooms with requirements on impact resistance, moisture resistance, and disinfectable surfaces.
