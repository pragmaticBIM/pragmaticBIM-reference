tender_text:
  de: 'Robuste Innenwandverkleidung aus Kunststoff-, Laminat- oder Verbundplatten mit geschlossener, stossfester Oberfläche. Auf ausgeglichenem Untergrund verklebt oder mechanisch auf Unterkonstruktion befestigt, mit dichten oder profilierten Fugen und schützenden Kanten- und Eckausbildungen. Geeignet für Sanitär-, Küchen-, Labor- und Pflegeräume mit Anforderungen an Stossfestigkeit, Feuchtebeständigkeit und desinfizierbare Oberflächen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Robust interior wall cladding from plastic, laminate, or composite panels with a closed, impact-resistant surface. Adhered to a levelled substrate or mechanically fixed on a substructure, with sealed or profiled joints and protective edge and corner details. Suitable for sanitary rooms, kitchens, laboratories, and healthcare rooms with requirements on impact resistance, moisture resistance, and disinfectable surfaces. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
