tender_text:
  de: 'Repräsentative Innenwandbekleidung aus grossformatigen, schweren Natursteinplatten, die mit Abstand vor der Wand verankert werden. Platten werden mit Mörtel- oder Metallankern oder auf einer Unterkonstruktion befestigt, mit Fugenbild, Kanten und Ausschnitten nach Verlegeplan. Geeignet für Eingangshallen und repräsentative Räume, in denen grosse Formate und ein Hohlraum für Installationen gefragt sind. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Representative interior wall cladding of large, heavy natural stone slabs anchored at a distance from the wall. Slabs are fixed with mortar or metal anchors or onto a substructure, with joint pattern, edges, and cut-outs according to a laying plan. Suitable for entrance halls and representative rooms where large formats and a cavity for services are required. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
