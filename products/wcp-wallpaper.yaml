tender_text:
  de: 'Dünne dekorative Innenwandbekleidung aus Papier-, Vlies- oder Vinylrollenware auf glattem, verspachteltem Untergrund. Bahnenweise vollflächig verklebt mit Stoss- oder Überlappungsfugen, einschliesslich Untergrundvorbereitung und bei Bedarf Makulatur. Geeignet für Büro-, Erschliessungs- und Aufenthaltsräume mit Farb- oder Musteranforderung und geringer mechanischer Beanspruchung. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Thin decorative interior wall covering from paper, non-woven, or vinyl roll goods on a smooth, filled substrate. Adhered over the full surface in strips with butt or overlapping joints, including substrate preparation and lining paper where required. Suitable for offices, circulation areas, and rooms where a colour or pattern finish with limited mechanical loading is required. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
