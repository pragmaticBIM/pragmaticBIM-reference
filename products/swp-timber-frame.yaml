tender_text:
  de: Tragende oder nichttragende Wand aus Holzständern, Schwellen und Rähmen mit beidseitiger Beplankung und Dämmung im Gefach. Als Wandelement im Werk vorgefertigt oder auf der Baustelle abgebunden, versetzt und mit Stahlverbindern angeschlossen. Geeignet für Aussen- und Innenwände mit geringem Eigengewicht, hoher Dämmwirkung und hohem Vorfertigungsgrad. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Load-bearing or non-load-bearing wall of timber studs, sole and head plates with sheathing on both faces and insulation between the studs. Prefabricated as wall elements in the factory or framed on site, set, and connected with steel fasteners. Suitable for exterior and interior walls with low dead load, high insulation, and a high degree of prefabrication. Included are all works required to meet the specified requirements.
