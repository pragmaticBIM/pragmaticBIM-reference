tender_text:
  de: 'Innenwandbekleidung aus grossformatigen Kunst- oder Agglomeratsteinplatten, die mechanisch auf einer Unterkonstruktion befestigt werden. Unterkonstruktion an der Wand verankert, Platten mit sichtbaren oder verdeckten Haltern montiert, mit vorgefertigten Ausschnitten und Kantenprofilen. Geeignet für Eingangs- und Repräsentationsbereiche mit grossen Formaten und einem Hohlraum für Installationen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Interior wall cladding of large engineered or agglomerate stone slabs mechanically fixed on a substructure. The substructure is anchored to the wall and the slabs mounted with visible or concealed holders, with prefabricated cut-outs and edge profiles. Suitable for entrance and representative areas with large formats and a cavity for services. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
