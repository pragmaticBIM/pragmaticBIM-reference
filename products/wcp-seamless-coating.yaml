tender_text:
  de: 'Sichtbare Innenwandoberfläche aus fugenloser mineralischer oder synthetischer Beschichtung auf vorbereitetem Untergrund aus Verputz, Beton oder Platten. Nass in einer oder mehreren Lagen aufgebracht und auf die geforderte Oberflächenqualität gezogen oder gespritzt, einschliesslich Grundierung und Ausgleichsschichten. Geeignet für Räume mit Anforderung an eine durchgehende, fugenlose Fläche, auch in Feuchträumen bei passendem Dichtungsaufbau. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Visible interior wall finish from a jointless mineral or synthetic coating on a prepared substrate of plaster, concrete, or board. Applied wet in one or more coats and troweled or sprayed to the required surface quality, including primer and levelling layers. Suitable for rooms where a continuous surface without joints is required, including moist areas when a matching sealing build-up is used. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
