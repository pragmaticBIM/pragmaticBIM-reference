tender_text:
  de: 'Nutzschicht aus Plattenelementen mit bedruckter, harzimprägnierter Dekorschicht auf einem Holzwerkstoffkern. Schwimmend mit Klickverbindung auf einer Trittschall- und Trennunterlage über dem Unterlagsboden verlegt, mit Randdehnfugen und Sockelleisten. Geeignet für Räume mit geringer bis mittlerer Beanspruchung in trockener Nutzung, wenn eine rasche und kostengünstige Verlegung gefordert ist; die Nutzschicht ist nicht nachschleifbar. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Wearing surface from board elements with a printed, resin-impregnated decorative top layer on a wood-based core. Laid floating with click joints on an impact-sound and separation underlay over the screed, with perimeter expansion gaps and skirtings. Suitable for rooms with low to moderate traffic in dry use where fast and low-cost installation is required; the wear layer cannot be re-sanded. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
