tender_text:
  de: 'Dünnschichtige, sichtbare Innenwandoberfläche aus Anstrich oder Beschichtung auf Verputz-, Platten- oder Betonuntergrund. Nass mit Pinsel, Rolle oder Spritzverfahren in Grund- und Deckanstrich aufgetragen, einschliesslich Untergrundvorbereitung, Spachtelung und Schliff auf die vereinbarte Oberflächenqualität. Geeignet als Standardoberfläche in allen Raumtypen, wobei Glanzgrad, Nassabriebbeständigkeit und Emissionsanforderungen je Raumnutzung festzulegen sind. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Thin-layer visible interior wall finish from paint or coating on plaster, board, or concrete substrates. Applied wet by brush, roller, or spray in primer and finish coats, including substrate preparation, filling, and sanding to the agreed surface quality. Suitable as a standard finish in all room types, with degree of gloss, wet abrasion resistance, and emission requirements to be specified per room use. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
