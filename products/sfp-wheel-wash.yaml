  de: Anlage, die Reifen und Fahrwerk reinigt, bevor Fahrzeuge die Baustelle verlassen, damit oeffentliche Strassen frei von Schlamm bleiben. Umfasst Becken oder Spruehportal, Wasserzufuhr und Schlammfang am Ausgang.
