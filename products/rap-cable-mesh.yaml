name:
  de: Drahtseil- oder Netzgeländer
  en: Cable or mesh infill railing
product_classification:
  classification_scheme: RailingProduct
  classification_code: RAP-CABLE-MESH
tender_text:
  de: Absturzsicherung mit gespannten Edelstahlseilen oder Netzfüllung zwischen den Pfosten. Die Pfosten werden an der Struktur befestigt und die Füllung vor Ort gegen sie gespannt, weshalb die Pfosten für die Spannkräfte auszulegen sind. Geeignet für äussere Laubengänge und industrielle Bereiche; Netzfüllungen dort, wo Überklettern verhindert werden muss.
  en: Fall protection with tensioned stainless steel cables or woven mesh infill spanning between posts. Posts are anchored to the structure and the infill is tensioned against them on site, so the posts must be designed for the tension forces. Suitable for external walkways and industrial areas; mesh infill is used where climbing must be prevented.
