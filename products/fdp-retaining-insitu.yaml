tender_text:
  de: Erdberührte Wand aus Stahlbeton, die Gebäudelasten trägt und zugleich Erd- und Wasserdruck aufnimmt, vor Ort hergestellt. Geschalt, bewehrt und betoniert, erdseitig mit Abdichtung, Dämmung, Schutz- und Drainageschicht ergänzt. Geeignet für Untergeschosse, Stützbauwerke an Geländesprüngen und erdberührte Teile der Gebäudehülle. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Below-grade wall of reinforced concrete that carries building loads and resists earth and water pressure, produced on site. Formed, reinforced, and cast, then completed on the earth side with sealing, insulation, protection, and drainage layers. Suitable for basements, retaining structures at level changes, and buried parts of the building envelope. Included are all works required to meet the specified requirements.
