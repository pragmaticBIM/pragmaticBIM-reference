tender_text:
  de: Stellt eine dauerhaft gefüllte Wasserentnahmestelle mit Schlauch und Strahlrohr bereit, damit Nutzende oder die Feuerwehr einen Brand von Hand bekämpfen können. Wird als Einbau- oder Aufbauschrank in der Wand installiert und über ein Absperrventil an das Löschwassernetz angeschlossen, wobei der Schlauch einsatzbereit auf einer Haspel liegt. Geeignet für Korridore, Treppenhauspodeste und grosse offene Bereiche, so angeordnet, dass der Schlauch jeden Punkt des zugeordneten Bereichs erreicht, und dauerhaft freigehalten, gekennzeichnet und ohne Werkzeug zu öffnen.
  en: Provides a permanently charged water draw-off point with hose and nozzle so that occupants or the fire brigade can fight a fire by hand. Installed as a recessed or surface cabinet in the wall and connected to the fire water pipework through a shut-off valve, with the hose held on a reel ready for immediate use. Suitable for corridors, stairwell landings, and large open areas, positioned so that the hose reaches every point of the assigned area, and kept unobstructed, marked, and openable without tools.
