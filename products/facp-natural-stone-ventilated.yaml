tender_text:
  de: 'Nichttragende Bekleidung aus Natursteinplatten oder steinkaschierten Kassetten vor der tragenden Aussenwand. Die Platten werden mit Hinterschnitt- oder Dornankern auf einer justierbaren, thermisch getrennten Metall-Unterkonstruktion gehalten; Dämmung und Hinterlüftungsraum liegen dahinter. Geeignet für repräsentative Neubauten und Fassadenerneuerungen mit langer Nutzungsdauer, wenn schwere Formate und ein zusätzlicher Lastzuschlag akzeptiert werden. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing cladding of natural stone slabs or stone-faced cassettes carried in front of the load-bearing exterior wall. The slabs are held by undercut or dowel anchors on an adjustable, thermally separated metal sub-frame, with insulation and ventilated cavity behind the stone. Suitable for representative new build and facade renewal with long service life, provided that heavy formats and an additional dead-load allowance are accepted. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
