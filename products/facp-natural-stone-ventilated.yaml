tender_text:
  de: Nichttragende Bekleidung aus Natursteinplatten oder steinkaschierten Kassetten vor der tragenden Aussenwand. Die Platten werden mit Hinterschnitt- oder Dornankern auf einer justierbaren, thermisch getrennten Metall-Unterkonstruktion gehalten; Dämmung und Hinterlüftungsraum liegen dahinter. Geeignet für repräsentative Neubauten und Fassadenerneuerungen mit langer Nutzungsdauer, wenn schwere Formate und ein zusätzlicher Lastzuschlag akzeptiert werden.
  en: Non-load-bearing cladding of natural stone slabs or stone-faced cassettes carried in front of the load-bearing exterior wall. The slabs are held by undercut or dowel anchors on an adjustable, thermally separated metal sub-frame, with insulation and ventilated cavity behind the stone. Suitable for representative new build and facade renewal with long service life, provided that heavy formats and an additional dead-load allowance are accepted.
