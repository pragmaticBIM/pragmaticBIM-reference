tender_text:
  de: 'Nichttragende Metallhaut aus Profilblech oder Stehfalzbahnen in Aluminium, Stahl, Kupfer oder Zink vor der Aussenwand. Die Bahnen werden auf einer hinterlüfteten Holz- oder Metall-Unterkonstruktion gefalzt oder geklipst, mit Schiebehaftern für die thermische Längenänderung. Geeignet für Neubau und leichte Sanierungsüberkleidungen an exponierten und geometrisch anspruchsvollen Fassaden mit hoher Anforderung an Wasserdichtigkeit bei geringem Zusatzgewicht. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing metal skin of profiled sheet or standing-seam bands in aluminium, steel, copper, or zinc in front of the exterior wall. The bands are seamed or clipped onto a ventilated timber or metal sub-frame using sliding clips that accommodate thermal movement. Suitable for new build and lightweight retrofit overlays on exposed and geometrically demanding facades where high watertightness is required at low added dead load. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
