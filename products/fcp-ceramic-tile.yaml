tender_text:
  de: 'Nutzschicht aus gebrannten Keramikfliesen auf vorbereitetem Untergrund, die eine harte, wasser- und abriebfeste Gehfläche bildet. Im Dünnbettkleber auf dem Unterlagsboden verlegt, mit verfugten Stössen, Bewegungsfugen und in Nassbereichen mit einer Verbundabdichtung. Geeignet für Bäder, Küchen und stark genutzte Verkehrsflächen mit Anforderungen an Trittsicherheit und Feuchtebeanspruchung. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Wearing surface from fired ceramic tiles on a prepared substrate, delivering a hard, water-resistant, and abrasion-resistant walking surface. Set in thin-bed adhesive on the screed, with grouted joints, movement joints, and a bonded waterproofing layer in wet areas. Suitable for bathrooms, kitchens, and heavily used circulation areas with demands on slip resistance and moisture exposure. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
