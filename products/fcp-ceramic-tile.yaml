tender_text:
  de: Nutzschicht aus gebrannten Keramikfliesen auf vorbereitetem Untergrund, die eine harte, wasser- und abriebfeste Gehfläche bildet. Im Dünnbettkleber auf dem Unterlagsboden verlegt, mit verfugten Stössen, Bewegungsfugen und in Nassbereichen mit einer Verbundabdichtung. Geeignet für Bäder, Küchen und stark genutzte Verkehrsflächen mit Anforderungen an Trittsicherheit und Feuchtebeanspruchung.
  en: Wearing surface from fired ceramic tiles on a prepared substrate, delivering a hard, water-resistant, and abrasion-resistant walking surface. Set in thin-bed adhesive on the screed, with grouted joints, movement joints, and a bonded waterproofing layer in wet areas. Suitable for bathrooms, kitchens, and heavily used circulation areas with demands on slip resistance and moisture exposure.
