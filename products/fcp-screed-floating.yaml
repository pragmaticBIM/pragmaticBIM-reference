tender_text:
  de: 'Lastverteilende und ausgleichende Schicht, die auf einer Trittschall- und Wärmedämmschicht liegt und von Rohdecke und Wänden getrennt ist. Dämmschichten, Trennlage und Randdämmstreifen werden verlegt, danach wird der Unterlagsboden eingebracht, abgezogen und bis zur Belegreife ausgehärtet. Geeignet für Wohn-, Büro- und Schulräume mit Anforderungen an den Trittschallschutz und für die Führung von Installationen in der Dämmebene. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Reinigung der Rohdecke, Trenn- und Dämmschichten sowie Randdämmstreifen nach Aufbau, Fugen nach Fugenplan mit Fugenprofilen, Anschlüsse an Abläufe und Bodendosen, Höhenkontrolle, Restfeuchtemessung bis zur Belegreife sowie Schutz bis zur Übergabe an den Bodenbelag.'
  en: 'Load-distributing and levelling layer on impact-sound and thermal insulation, separated from slab and walls. Insulation, separation layer, and edge insulation strips are laid, then the screed is placed, levelled, and cured until ready to receive the covering. Suitable for residential, office, and school rooms with impact-sound requirements and for service runs in the insulation layer. Included are all works required to meet the specified requirements. Included in particular: cleaning the structural slab, separation and insulation layers and edge insulation strips according to the build-up, joints according to the joint plan with joint profiles, connections to drains and floor boxes, level control, residual moisture measurement until ready for covering, and protection until handover to the floor covering.'
