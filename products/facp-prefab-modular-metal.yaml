tender_text:
  de: 'Nichttragendes Fassadenmodul, werkseitig aus Metallrahmen mit integrierter Dämmung und fertiger Bekleidungsschale montiert. Die Elemente werden geschosshoch vor das Primärtragwerk gesetzt und an Konsolen verankert, die Justierung und thermische Trennung erlauben; die Modulfugen werden mit Dichtprofilen oder Versiegelung geschlossen. Geeignet für Neubau und späteren teilweisen Austausch an hohen Gewerbe-, Industrie- und Technikgebäuden mit Anforderungen an Montagegeschwindigkeit, Masshaltigkeit und wiederholbare Details. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing facade module assembled in the factory from metal frames with integrated insulation and a finished cladding face. The units are set storey-high in front of the primary structure and anchored on brackets that allow adjustment and thermal separation, with gasketed or sealed joints between modules. Suitable for new build and later partial replacement on tall commercial, industrial, and technical buildings requiring erection speed, dimensional accuracy, and repeatable details. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
