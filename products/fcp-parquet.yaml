tender_text:
  de: 'Nutzschicht aus Vollholz- oder Mehrschichtholzelementen auf vorbereitetem Untergrund, die eine warme Gehfläche mit erneuerbarer Nutzschicht bildet. Vollflächig verklebt, genagelt oder schwimmend auf dem Unterlagsboden verlegt und vor Ort geschliffen und versiegelt oder geölt. Geeignet für Wohn-, Büro- und Versammlungsräume mit mittlerer Beanspruchung und stabilem Raumklima und mehrfach nachschleifbar. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Wearing surface from solid or multi-layer timber elements on a prepared substrate, delivering a warm walking surface with a renewable wear layer. Laid fully adhered, nailed, or floating on the screed, then sanded and sealed or oiled on site. Suitable for residential, office, and assembly rooms with moderate traffic and a stable indoor climate, and can be re-sanded several times. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
