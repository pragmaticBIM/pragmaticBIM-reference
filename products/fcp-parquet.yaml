tender_text:
  de: Nutzschicht aus Vollholz- oder Mehrschichtholzelementen auf vorbereitetem Untergrund, die eine warme Gehfläche mit erneuerbarer Nutzschicht bildet. Vollflächig verklebt, genagelt oder schwimmend auf dem Unterlagsboden verlegt und vor Ort geschliffen und versiegelt oder geölt. Geeignet für Wohn-, Büro- und Versammlungsräume mit mittlerer Beanspruchung und stabilem Raumklima und mehrfach nachschleifbar.
  en: Wearing surface from solid or multi-layer timber elements on a prepared substrate, delivering a warm walking surface with a renewable wear layer. Laid fully adhered, nailed, or floating on the screed, then sanded and sealed or oiled on site. Suitable for residential, office, and assembly rooms with moderate traffic and a stable indoor climate, and can be re-sanded several times.
