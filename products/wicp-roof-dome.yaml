tender_text:
  de: 'Einzelnes Oberlicht im Flachdach aus Kunststoff- oder Glaskuppel auf einem gedämmten Aufsetzkranz, fest oder zum Lüften und Entrauchen öffenbar. Der Aufsetzkranz wird auf der Tragkonstruktion befestigt, in Abdichtung und Dampfbremse eingebunden und die Kuppel mit Öffner aufgesetzt. Geeignet für die Belichtung innenliegender Räume und als Rauch- und Wärmeabzug; Durchsturzsicherheit ist sicherzustellen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Single rooflight in a flat roof of plastic or glass dome on an insulated upstand kerb, fixed or openable for ventilation and smoke extraction. The kerb is fixed to the structure, tied into waterproofing and vapour barrier, and the dome fitted with its opener. Suitable for daylighting internal rooms and as smoke and heat vent; fall-through protection must be ensured. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
