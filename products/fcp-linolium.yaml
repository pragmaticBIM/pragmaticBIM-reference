tender_text:
  de: Elastische Nutzschicht aus Linoleum auf vorbereitetem Unterlagsboden, die eine strapazierfähige Gehfläche aus weitgehend erneuerbaren Rohstoffen bildet. Als Bahnen- oder Plattenbelag vollflächig auf dem ausgeglichenen Untergrund verklebt, mit verschweissten oder versiegelten Nähten und passender Sockelausbildung. Geeignet für Schulen, Gesundheitsbauten und Büros mit hoher Beanspruchung und Anforderungen an Reinigbarkeit und Dauerhaftigkeit.
  en: Resilient wearing surface from linoleum on a prepared screed, delivering a hard-wearing walking surface from largely renewable raw materials. Laid as sheet or tile fully adhered onto the levelled substrate, with welded or sealed seams and matching skirting details. Suitable for schools, healthcare buildings, and offices with high traffic and demands on cleanability and durability.
