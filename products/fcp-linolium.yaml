tender_text:
  de: 'Elastische Nutzschicht aus Linoleum auf vorbereitetem Unterlagsboden, die eine strapazierfähige Gehfläche aus weitgehend erneuerbaren Rohstoffen bildet. Als Bahnen- oder Plattenbelag vollflächig auf dem ausgeglichenen Untergrund verklebt, mit verschweissten oder versiegelten Nähten und passender Sockelausbildung. Geeignet für Schulen, Gesundheitsbauten und Büros mit hoher Beanspruchung und Anforderungen an Reinigbarkeit und Dauerhaftigkeit. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Resilient wearing surface from linoleum on a prepared screed, delivering a hard-wearing walking surface from largely renewable raw materials. Laid as sheet or tile fully adhered onto the levelled substrate, with welded or sealed seams and matching skirting details. Suitable for schools, healthcare buildings, and offices with high traffic and demands on cleanability and durability. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
