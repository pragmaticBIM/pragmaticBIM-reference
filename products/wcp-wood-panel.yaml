tender_text:
  de: 'Innenwandverkleidung aus Vollholz oder Holzwerkstoffen als Platten, Bretter oder Lamellen vor der tragenden Wand. Mechanisch auf Lattung oder Unterkonstruktion befestigt, mit Hohlraum für Dämmung, Akustikvlies oder Installationen und mit sichtbarer oder verdeckter Befestigung. Geeignet für Sitzungs-, Saal- und Schulungsräume mit akustischen Anforderungen, wobei Oberflächenbehandlung und Brandverhalten des Holzes gesondert festzulegen sind. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung und Vorbereitung des Untergrunds, Grundierung, Kanten-, Eck- und Abschlussprofile, elastische Anschlussfugen, Ausschnitte für Schalter, Steckdosen und Installationen sowie in Nassbereichen die Verbundabdichtung, wo der Aufbau sie verlangt.'
  en: 'Interior wall cladding from solid wood or wood-based panels, boards, or slats in front of the load-bearing wall. Mechanically fixed on battens or a substructure, with a cavity for insulation, acoustic backing, or services, and with visible or concealed fastenings. Suitable for meeting rooms, halls, and educational rooms with acoustic requirements, where surface treatment and fire behaviour of the wood are specified separately. Included are all works required to meet the specified requirements. Included in particular: checking and preparing the substrate, priming, edge, corner, and end profiles, elastic connection joints, cut-outs for switches, sockets, and services, and in wet areas the bonded waterproofing where the build-up requires it.'
