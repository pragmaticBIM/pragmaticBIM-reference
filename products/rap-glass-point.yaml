tender_text:
  de: Absturzsicherung als Ganzglasgeländer, bei dem die Verbundsicherheitsglasscheiben selbst das tragende Element bilden, ohne vertikale Pfosten. Die Scheiben werden auf Punkthalter gesetzt oder in ein am Deckenrand befestigtes Klemmprofil eingespannt, bei Bedarf mit oberem Abschlussprofil. Geeignet für repräsentative Bereiche mit maximaler Transparenz; die Scheiben müssen nach Bruch einer Lage in Lage bleiben.
  en: Fall protection as an all-glass balustrade in which the laminated safety glass panes are themselves the load-bearing element, without vertical posts. Panes are set on point fixings or clamped in a base channel anchored to the slab edge, with a top rail where required. Suitable for representative areas with maximum transparency; the panes must remain in place after one ply breaks.
