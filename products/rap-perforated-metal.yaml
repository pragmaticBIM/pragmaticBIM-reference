name:
  de: Lochblech- oder Streckmetallgeländer
  en: Perforated or expanded metal railing
product_classification:
  classification_scheme: RailingProduct
  classification_code: RAP-PERFORATED-METAL
tender_text:
  de: Absturzsicherung mit Lochblech- oder Streckmetallfüllung in Metallrahmen. Die vorgefertigten Füllelemente werden in den Rahmen eingesetzt, der am Deckenrand oder auf der Brüstung befestigt und anschliessend verzinkt oder beschichtet wird. Geeignet, wo eine halbtransparente, robuste und nicht überkletterbare Füllung mit Winddurchlässigkeit gefordert ist.
  en: Fall protection with perforated sheet or expanded metal infill panels in a metal frame. The prefabricated panels are set into the frame, which is anchored to the slab edge or parapet and then galvanized or coated. Suitable where a semi-transparent, robust, non-climbable infill with wind permeability is wanted.
