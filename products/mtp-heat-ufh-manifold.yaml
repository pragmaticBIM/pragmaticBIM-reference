tender_text:
  de: Verteilt Heizwasser auf die einzelnen Kreise einer Flächenheizung und führt es zur Verteilung zurück, sodass jeder Kreis einzeln abgesperrt und einreguliert werden kann. Wird in einem Einbau- oder Aufbauschrank im versorgten Geschoss installiert und an die Heizhauptleitung angeschlossen, mit Kreisventilen, Durchflussmessern und Stellantrieben für die raumweise Regelung. Geeignet für Wohn- und Bürobereiche mit Flächenheizung, so angeordnet, dass die Kreislängen im zulässigen Bereich bleiben, und mit dauerhaft zugänglichem Schrank für Einregulierung, Entlüftung und Kennzeichnung der Kreise.
  en: Distributes heating water to the individual loops of a surface heating system and returns it to the distribution, so that every loop can be shut off and balanced separately. Installed in a recessed or surface cabinet in the served storey and connected to the main heating pipework, with loop valves, flow meters, and actuators for room-wise control. Suitable for dwellings and offices with surface heating, positioned so that loop lengths stay within limits and with the cabinet permanently accessible for balancing, venting, and identification of the loops.
