tender_text:
  de: 'Nichttragende Wetterschutzschicht aus Keramik-, Feinsteinzeug- oder Steingutplatten vor der tragenden Aussenwand. Die Platten werden sichtbar oder verdeckt auf einer Metall-Unterkonstruktion befestigt, sodass zwischen Dämmung und Bekleidung ein durchgehender Hinterlüftungsraum bleibt. Geeignet für Neubau und Sanierung an exponierten Fassaden mit hohen Anforderungen an Schlagregenschutz, Farbstabilität und geringen Unterhalt. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing weather protection layer of ceramic, porcelain, or stoneware tiles and panels set in front of the load-bearing exterior wall. The units are fixed visibly or concealed onto a metal sub-frame so that a continuous ventilated cavity remains between insulation and cladding. Suitable for new build and retrofit on exposed facades with high requirements for driving-rain protection, colour stability, and low maintenance. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
