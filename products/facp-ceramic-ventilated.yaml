tender_text:
  de: Nichttragende Wetterschutzschicht aus Keramik-, Feinsteinzeug- oder Steingutplatten vor der tragenden Aussenwand. Die Platten werden sichtbar oder verdeckt auf einer Metall-Unterkonstruktion befestigt, sodass zwischen Dämmung und Bekleidung ein durchgehender Hinterlüftungsraum bleibt. Geeignet für Neubau und Sanierung an exponierten Fassaden mit hohen Anforderungen an Schlagregenschutz, Farbstabilität und geringen Unterhalt.
  en: Non-load-bearing weather protection layer of ceramic, porcelain, or stoneware tiles and panels set in front of the load-bearing exterior wall. The units are fixed visibly or concealed onto a metal sub-frame so that a continuous ventilated cavity remains between insulation and cladding. Suitable for new build and retrofit on exposed facades with high requirements for driving-rain protection, colour stability, and low maintenance.
