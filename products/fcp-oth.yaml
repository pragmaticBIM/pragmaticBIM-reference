  de: Platzhalter für Bodenbelagsprodukte, deren Systemtyp zum Zeitpunkt der Ausschreibung noch nicht festgelegt oder nicht klassifiziert ist. Funktionale Anforderungen wie Nutzungsklasse, Trittsicherheit, Trittschallminderung, Feuchtebeanspruchung und Reinigbarkeit sind gesondert zu beschreiben. Nur in frühen Planungsphasen oder bei unvollständiger Datenlage verwenden.
  en: Placeholder for floor covering products whose system type is not yet fixed or not classified at tender stage. Functional requirements such as wear class, slip resistance, impact-sound reduction, moisture exposure, and cleanability must be stated separately. Use only in early design stages or where data is incomplete.
