tender_text:
  de: 'Nichttragende hinterlüftete Bekleidung aus Kompaktplatten in Hochdrucklaminat vor der gedämmten Aussenwand. Die Platten werden mit sichtbaren Nieten oder Schrauben oder mit verdeckter Rückseitenbefestigung auf einer Metall- oder Holz-Unterkonstruktion befestigt, die einen offenen Hinterlüftungsraum und die Plattenbewegung zulässt. Geeignet für Neubau und Sanierung an Gewerbe- und Institutionsfassaden mit Bedarf an robusten, leicht reinigbaren Oberflächen, auch in stoss- und graffitibelasteten Sockelbereichen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing rainscreen cladding of compact high-pressure laminate boards in front of the insulated exterior wall. The boards are fixed with visible rivets or screws, or with concealed rear fixings, to a metal or timber sub-frame that keeps an open ventilated cavity and permits panel movement. Suitable for new build and retrofit on commercial and institutional facades needing a hard-wearing, easily cleaned surface, including plinth areas exposed to impact and graffiti. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
