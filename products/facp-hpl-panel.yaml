tender_text:
  de: Nichttragende hinterlüftete Bekleidung aus Kompaktplatten in Hochdrucklaminat vor der gedämmten Aussenwand. Die Platten werden mit sichtbaren Nieten oder Schrauben oder mit verdeckter Rückseitenbefestigung auf einer Metall- oder Holz-Unterkonstruktion befestigt, die einen offenen Hinterlüftungsraum und die Plattenbewegung zulässt. Geeignet für Neubau und Sanierung an Gewerbe- und Institutionsfassaden mit Bedarf an robusten, leicht reinigbaren Oberflächen, auch in stoss- und graffitibelasteten Sockelbereichen.
  en: Non-load-bearing rainscreen cladding of compact high-pressure laminate boards in front of the insulated exterior wall. The boards are fixed with visible rivets or screws, or with concealed rear fixings, to a metal or timber sub-frame that keeps an open ventilated cavity and permits panel movement. Suitable for new build and retrofit on commercial and institutional facades needing a hard-wearing, easily cleaned surface, including plinth areas exposed to impact and graffiti.
