tender_text:
  de: 'Nichttragende Holzbekleidung aus Brettern, Lamellen oder Holzwerkstoffplatten vor der gedämmten Aussenwand. Die Befestigung erfolgt mit sichtbaren oder verdeckten Verbindungsmitteln auf einer Lattung, die allseitige Hinterlüftung und Abtrocknung der Bekleidung sicherstellt. Geeignet für Neubau und Sanierung bei geringem Zusatzgewicht; Oberflächenbehandlung, Hirnholzausbildung und zulässiger Vergrauungsgrad sind festzulegen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing timber cladding of boards, slats, or wood-based panels mounted in front of the insulated exterior wall. Fixing is by visible or concealed fasteners onto a battened sub-frame that ensures rear ventilation and all-round drying of the cladding. Suitable for new build and retrofit at low added dead load; surface treatment, end-grain detailing, and the accepted degree of weathering are to be specified. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
