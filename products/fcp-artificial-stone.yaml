tender_text:
  de: Nutzschicht aus gegossenen oder Agglomerat-Steinplatten und -fliesen auf vorbereitetem Untergrund, die eine steinartige Gehfläche mit gleichmässigem Format und Erscheinungsbild bildet. Im Mörtelbett oder Dünnbettkleber verlegt, verfugt und bei Bedarf vor Ort geschliffen oder imprägniert. Geeignet für Verkehrs- und Nebenflächen mit hoher Beanspruchung, wenn einheitliche Oberflächen und grosse Wiederholmengen gefordert sind.
  en: Wearing surface from cast or agglomerate stone slabs and tiles on a prepared substrate, delivering a stone-like walking surface with consistent format and appearance. Laid in a mortar bed or thin-bed adhesive, jointed, and ground or sealed on site where required. Suitable for circulation and utility areas with heavy traffic where uniform surfaces and large repeat quantities are required.
