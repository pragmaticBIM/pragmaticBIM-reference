tender_text:
  de: 'Nutzschicht aus gegossenen oder Agglomerat-Steinplatten und -fliesen auf vorbereitetem Untergrund, die eine steinartige Gehfläche mit gleichmässigem Format und Erscheinungsbild bildet. Im Mörtelbett oder Dünnbettkleber verlegt, verfugt und bei Bedarf vor Ort geschliffen oder imprägniert. Geeignet für Verkehrs- und Nebenflächen mit hoher Beanspruchung, wenn einheitliche Oberflächen und grosse Wiederholmengen gefordert sind. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Wearing surface from cast or agglomerate stone slabs and tiles on a prepared substrate, delivering a stone-like walking surface with consistent format and appearance. Laid in a mortar bed or thin-bed adhesive, jointed, and ground or sealed on site where required. Suitable for circulation and utility areas with heavy traffic where uniform surfaces and large repeat quantities are required. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
