tender_text:
  de: Stellt einen festen Anschlusspunkt für die Stromversorgung von Geräten am Nutzungsort bereit. Wird auf oder unter Putz in Wand, Boden oder Möbel montiert und an einen Endstromkreis der Elektroverteilung angeschlossen, wobei Erdung und Überstromschutz über die speisende Verteilung erfolgen. Geeignet für alle Raumtypen, wobei Lage, Anzahl und Gruppierung auf die Raumnutzung abgestimmt sind und nach dem Ausbau zugänglich bleiben.
  en: Provides a fixed connection point for supplying electrical power to appliances and equipment at the point of use. Mounted surface or flush in wall, floor, or furniture and connected to a final circuit of the electrical distribution, with earthing and overcurrent protection provided by the supplying board. Suitable for all room types, with position, quantity, and grouping matched to the intended use of the space and remaining accessible after fit-out.
