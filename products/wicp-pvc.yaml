tender_text:
  de: 'Fenstereinheit mit Mehrkammer-Kunststoffprofilen für Rahmen und Flügel und einer Isolierverglasung, die eine Wandöffnung verschliesst. Die Profile werden im Werk verschweisst und innen armiert, verglast und mit Beschlägen versehen, anschliessend in die Laibung eingesetzt, verankert und beidseitig abgedichtet. Geeignet für Fassadenöffnungen mit Anforderungen an Wärme- und Schalltrennung, wenn eine wartungsarme, abwaschbare Oberfläche ohne Anstricherneuerung gefordert ist. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Window unit with multi-chamber plastic frame and sash profiles and an insulating glazing infill, closing a wall opening. Profiles are welded and internally reinforced in the factory, glazed and fitted with hardware, then set into the reveal, anchored and sealed on both faces. Suitable for facade openings with thermal and acoustic separation duty where a low-maintenance, washable surface without coating renewal is required. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
