tender_text:
  de: 'Verglasungsfeld eines Fassadensystems, das die Fensteröffnung bildet, mit Festverglasungen und integrierten Öffnungsflügeln oder Lüftungsklappen im Pfosten-Riegel- oder Elementraster. Wird als komplettes Glaselement vorgefertigt, eingehoben, an Konsolen am Tragwerk befestigt und oben, unten und seitlich in das Fassadenraster eingedichtet. Geeignet für vollflächig verglaste Fassaden, bei denen Öffnungsfunktion, Wärme- und Schalltrennung sowie späteres Reinigen und Ersetzen von Scheiben innerhalb des Fassadensystems gelöst werden müssen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Glazed field of a facade system that acts as the window opening, with fixed panes and integrated opening lights or ventilation flaps within a mullion-transom or unitised grid. Prefabricated as a complete glazed element, lifted into position, fixed to brackets on the load-bearing structure and sealed into the facade grid at head, sill, and jambs. Suitable for fully glazed facades where opening function, thermal and acoustic separation, and later cleaning and pane replacement have to be resolved inside the facade system. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
