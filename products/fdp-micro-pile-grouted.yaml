tender_text:
  de: Pfahl kleinen Durchmessers, der Lasten über ein verpresstes Stahltragglied in tragfähigen Baugrund ableitet. Mit kleinen Bohrgeräten abgeteuft, das Tragglied eingestellt und unter Druck verpresst, bei Bedarf aus bestehenden Gebäuden heraus. Geeignet für Unterfangungen, Verstärkungen im Bestand und enge Baustellen, auf denen keine grossen Pfahlgeräte arbeiten können. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Small-diameter pile that transfers loads through a grouted steel tendon into load-bearing ground. Sunk with small drilling rigs, the tendon set and pressure-grouted, where required from inside existing buildings. Suitable for underpinning, strengthening of existing structures, and tight sites where large piling rigs cannot operate. Included are all works required to meet the specified requirements.
