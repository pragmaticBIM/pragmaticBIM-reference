tender_text:
  de: 'Fenstereinheit mit Holzrahmen auf der Raumseite und Metallschale auf der Wetterseite, die eine Fassadenöffnung mit einer Isolierverglasung verschliesst. Rahmen- und Deckschalenprofile werden im Werk zusammengefügt und verglast, anschliessend in die Laibung eingesetzt, verankert und an die angrenzende Konstruktion abgedichtet. Geeignet für stark bewitterte Fassadenöffnungen, bei denen innen eine Holzoberfläche gewünscht und aussen ein wetterfester, wartungsarmer Abschluss gefordert ist. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Window unit with a timber frame on the room side and a metal cover shell on the weather side, closing a facade opening with an insulating glazing infill. Frame and cover profiles are combined and glazed in the factory, then set into the reveal, anchored and sealed against the adjoining construction. Suitable for exposed facade openings where a timber interior surface is wanted and the exterior face has to stay weather-resistant and low-maintenance. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
