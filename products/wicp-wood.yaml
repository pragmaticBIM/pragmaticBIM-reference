tender_text:
  de: 'Fenstereinheit mit Rahmen und Flügel aus Vollholz oder verleimtem Holz, die eine Wand- oder Dachöffnung mit einer Isolierverglasung verschliesst. Wird als werkseitig verglaste und oberflächenbehandelte Einheit geliefert, in die Laibung eingesetzt, befestigt und innen wie aussen an die angrenzende Konstruktion abgedichtet. Geeignet für Fassadenöffnungen mit Anforderungen an Wärme- und Schalltrennung, mit öffenbaren oder festen Flügeln und regelmässiger Pflege der bewitterten Holzoberflächen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Window unit with frame and sash from solid or laminated timber, closing a wall or roof opening with an insulating glazing infill. Delivered as a factory-glazed and pre-finished unit, set into the reveal, fixed and sealed against the adjoining construction on the inside and the outside. Suitable for facade openings with thermal and acoustic separation duty, with operable or fixed sashes and periodic surface maintenance of the weather-exposed timber. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
