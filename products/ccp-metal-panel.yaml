tender_text:
  de: 'Deckensystem aus linearen Metallpaneelen oder Lamellen unter der tragenden Decke, mit glatten oder perforierten Sichtflächen und offenen oder geschlossenen Fugen. Auf Tragschienen einer abgehängten Unterkonstruktion eingeklipst, einzeln demontierbar, bei Bedarf mit Akustikvlies und Dämmung im Hohlraum. Geeignet für Erschliessungsflächen, Bahnhof- und Industriebereiche sowie Vordächer mit Anforderungen an Robustheit, Reinigbarkeit und schnelle Zugänglichkeit der Installationen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Abhänger und Befestigungen nach Aufbau, Rand- und Anschlussprofile, Schattenfugen, Ausschnitte und Auswechslungen für Leuchten, Luftauslässe, Sprinkler und Melder, Revisionsöffnungen, Einlagen und Dämmung nach Aufbau sowie Abschottungen im Deckenhohlraum nach Brandschutzkonzept.'
  en: 'Ceiling system from linear metal panels or lamellas below the load-bearing slab, with plain or perforated faces and open or closed joints. Clipped onto carrier rails of a suspended substructure, individually demountable, with acoustic fleece and insulation in the cavity where required. Suitable for circulation areas, station-type and industrial spaces, and canopies with requirements on robustness, cleanability, and quick access to services. Included are all works required to meet the specified requirements. Included in particular: substructure, hangers, and fixings according to the build-up, edge and connection profiles, shadow gaps, cut-outs and trimmers for luminaires, air outlets, sprinklers, and detectors, access panels, inlays and insulation according to the build-up, and fire barriers in the ceiling void according to the fire safety concept.'
