tender_text:
  de: 'Textile Nutzschicht auf vorbereitetem Unterlagsboden, die eine weiche, schallabsorbierende Gehfläche bildet. Als Bahnenware oder Platten geliefert und vollflächig verklebt, fixiert oder lose auf dem ausgeglichenen Untergrund verlegt, mit geschlossenen Nähten und Randprofilen. Geeignet für Büros, Besprechungsräume und Wohnbereiche mit mittlerer Beanspruchung und Anforderungen an Raumakustik und Gehkomfort. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Textile wearing surface on a prepared screed or subfloor, delivering a soft, sound-absorbing walking surface. Supplied as broadloom or tiles and fully adhered, tackified, or loose-laid on the levelled substrate, with seams and edge profiles closed. Suitable for offices, meeting rooms, and residential areas with moderate traffic and demands on room acoustics and walking comfort. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
