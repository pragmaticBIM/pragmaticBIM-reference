tender_text:
  de: Absturzsicherung als massive Beton- oder Mauerwerksbrüstung mit Abdeckung, welche die Schutzfunktion ohne separates Geländer übernimmt. Zusammen mit der umgebenden Struktur als Ortbeton, Fertigteil oder Mauerwerk erstellt und oben mit einer wasserableitenden Abdeckung geschlossen. Geeignet für Dachränder, Balkone und Loggien mit geschlossenem, undurchsichtigem Abschluss und geringem Unterhalt.
  en: Fall protection formed by a solid concrete or masonry parapet with a coping, taking over the guarding function without a separate railing. Built together with the surrounding structure as cast-in-place concrete, precast element, or masonry, and closed on top by a coping that sheds water. Suitable for roof edges, balconies, and loggias where a closed, opaque edge with low maintenance is wanted.
