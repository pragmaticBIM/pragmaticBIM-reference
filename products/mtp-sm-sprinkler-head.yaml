tender_text:
  de: Erkennt Wärme im Deckenbereich, öffnet selbsttätig und gibt Löschwasser über die geschützte Bodenfläche ab, sodass ein Brand am Entstehungsort begrenzt wird. Wird in der Decke, darunter hängend oder an der Wand als Hänge-, Steh- oder Wandausführung eingebaut und an das Sprinklerrohrnetz angeschlossen, mit auf den Deckenaufbau abgestimmter Rosette oder Abdeckung. Geeignet für alle zu schützenden Bereiche, wobei die Geräteabstände aus der erforderlichen Flächenabdeckung je Kopf und den vorhandenen Einbauten abgeleitet werden und jeder Kopf frei von Farbe, Bekleidung und Lagergut bleibt.
  en: Detects heat at ceiling level, opens automatically, and discharges extinguishing water over the protected floor area so that a fire is controlled at its origin. Fitted into the ceiling, suspended below it, or on the wall as a pendent, upright, or sidewall unit and connected to the sprinkler pipework, with an escutcheon or cover matched to the ceiling build-up. Suitable for all areas to be protected, with unit spacing derived from the required coverage per head and the obstructions present, and with each head kept free of paint, cladding, and stored goods.
