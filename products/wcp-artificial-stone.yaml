tender_text:
  de: Innenwandverkleidung aus Kunst- oder Agglomersteinplatten mit industriell hergestelltem, gleichmässigem Erscheinungsbild. Auf ausgeglichenem Untergrund verklebt oder bei grossen Formaten mechanisch befestigt, mit schmalen Fugen sowie werkseitigen Ausschnitten und Kantenprofilen. Geeignet für Sanitär-, Küchen- und Repräsentationsbereiche mit Anforderung an eine einheitliche, porenarme und einfach zu reinigende Oberfläche.
  en: Interior wall cladding from engineered or agglomerate stone slabs with an industrially produced, uniform appearance. Adhered to a levelled substrate or mechanically fixed for large formats, with narrow joints and prefabricated cut-outs and edge profiles. Suitable for sanitary rooms, kitchens, and representative areas where a consistent surface with low porosity and simple cleaning is required.
