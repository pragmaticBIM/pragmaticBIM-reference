tender_text:
  de: 'Türkonstruktion mit Rahmen- und Blattprofilen aus Kunststoff, üblicherweise Mehrkammerprofile mit innerer Armierung und Paneel- oder Glasfüllung, die eine Zugangsöffnung verschliesst. Die Profile werden im Werk verschweisst und mit Dichtungen und Beschlägen ausgerüstet, der Rahmen wird in die Öffnung eingesetzt, verankert und abgedichtet und das Blatt auf umlaufend dichten Anschlag eingestellt. Geeignet für Nebeneingänge, Feuchträume und Öffnungen, bei denen eine abwaschbare, korrosionsfreie Oberfläche ohne Anstricherneuerung gefordert ist. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung und Anschlussfuge, luft- und schlagregendichter Anschluss an der Gebäudehülle, Beschläge, Dichtungen, Schwellen- und Bodenanschluss, Einstellen und Funktionsprüfung sowie Übergabe mit Schlüsseln, Kennzeichnung und Wartungsunterlagen.'
  en: 'Door assembly with plastic frame and leaf profiles, usually multi-chamber sections with internal reinforcement and a panel or glazed infill, closing an access opening. Profiles are welded and fitted with gaskets and hardware in the factory, the frame is set into the opening, anchored and sealed, and the leaf is adjusted to close tight all round. Suitable for secondary entrances, wet rooms, and openings where a washable, corrosion-free surface without coating renewal is required. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing and connection joint, airtight and rainproof connection in the building envelope, hardware, seals, threshold and floor connection, adjustment and function test, and handover with keys, marking, and maintenance documents.'
