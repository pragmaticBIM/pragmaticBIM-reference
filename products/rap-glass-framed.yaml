tender_text:
  de: Absturzsicherung mit Verbundsicherheitsglas-Füllung in Metallrahmen oder Klemmprofil. Die werkseitig zugeschnittenen Scheiben werden in den Rahmen eingeglast, der am Deckenrand oder auf der Brüstung befestigt wird. Geeignet, wo Transparenz und freie Sicht gefordert sind und der Rahmen die Horizontallasten übernimmt.
  en: Fall protection with laminated safety glass infill held in a metal frame or clamping channel. Panes are cut to size in the factory and glazed into the frame, which is anchored to the slab edge or parapet. Suitable where transparency and an unobstructed view are wanted while the frame carries the horizontal loads.
