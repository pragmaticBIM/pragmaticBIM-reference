tender_text:
  de: Festgelegter Umschlagpunkt zum Abladen, Umladen und kurzen Abstellen zwischen Transport und Einbauort. Umfasst den Platz der Umschlaggeraete, nicht die Lagerflaeche selbst. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Designated handling point for unloading, reloading, and short-term set-down between transport and the place of use. Includes the space the handling equipment needs, not the storage yard itself. Included are all works required to meet the specified requirements.
