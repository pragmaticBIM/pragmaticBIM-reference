tender_text:
  de: Platzhalter für Dachbekleidungsprodukte, deren Systemtyp zum Zeitpunkt der Ausschreibung noch nicht festgelegt oder nicht klassifiziert ist. Funktionale Anforderungen wie Wasserdichtheit, zulässige Dachneigung, Wärmeschutz, Begehbarkeit und Brandverhalten sind gesondert zu beschreiben. Nur in frühen Planungsphasen oder bei unvollständiger Datenlage verwenden.
  en: Placeholder for roof covering products whose system type is not yet fixed or not classified at tender stage. Functional requirements such as watertightness, admissible roof pitch, thermal performance, walkability, and fire behaviour must be stated separately. Use only in early design stages or where data is incomplete.
