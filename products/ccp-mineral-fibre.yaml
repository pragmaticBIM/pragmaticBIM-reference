tender_text:
  de: Schallabsorbierende Deckenbekleidung aus Mineralfaserplatten oder -paneelen unter der tragenden Decke. Als demontierbare Platten in abgehängte Raster- oder Schienenunterkonstruktion eingelegt oder eingeklipst, mit Randprofilen und Ausschnitten für Leuchten und Luftdurchlässe. Geeignet für Büro-, Schul- und Pflegeräume mit hohen raumakustischen Anforderungen und Bedarf an vollflächiger Zugänglichkeit der Installationen im Deckenhohlraum.
  en: Sound-absorbing ceiling lining from mineral-fibre tiles or boards below the load-bearing slab. Laid into or clipped onto a suspended grid or rail substructure as demountable panels, with edge profiles and cut-outs for luminaires and air outlets. Suitable for offices, schools, and healthcare rooms with high room-acoustic requirements and the need for full access to services in the ceiling void.
