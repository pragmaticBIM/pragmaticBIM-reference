tender_text:
  de: 'Schallabsorbierende Deckenbekleidung aus Mineralfaserplatten oder -paneelen unter der tragenden Decke. Als demontierbare Platten in abgehängte Raster- oder Schienenunterkonstruktion eingelegt oder eingeklipst, mit Randprofilen und Ausschnitten für Leuchten und Luftdurchlässe. Geeignet für Büro-, Schul- und Pflegeräume mit hohen raumakustischen Anforderungen und Bedarf an vollflächiger Zugänglichkeit der Installationen im Deckenhohlraum. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Abhänger und Befestigungen nach Aufbau, Rand- und Anschlussprofile, Schattenfugen, Ausschnitte und Auswechslungen für Leuchten, Luftauslässe, Sprinkler und Melder, Revisionsöffnungen, Einlagen und Dämmung nach Aufbau sowie Abschottungen im Deckenhohlraum nach Brandschutzkonzept.'
  en: 'Sound-absorbing ceiling lining from mineral-fibre tiles or boards below the load-bearing slab. Laid into or clipped onto a suspended grid or rail substructure as demountable panels, with edge profiles and cut-outs for luminaires and air outlets. Suitable for offices, schools, and healthcare rooms with high room-acoustic requirements and the need for full access to services in the ceiling void. Included are all works required to meet the specified requirements. Included in particular: substructure, hangers, and fixings according to the build-up, edge and connection profiles, shadow gaps, cut-outs and trimmers for luminaires, air outlets, sprinklers, and detectors, access panels, inlays and insulation according to the build-up, and fire barriers in the ceiling void according to the fire safety concept.'
