tender_text:
  de: Begrünter Deckaufbau über einer abgedichteten Flach- oder flach geneigten Decke, bei dem eine dünne Substratschicht trockenheitsverträgliche Bepflanzung trägt. Wurzelschutz, Drän- und Filterschicht, Substrat und Vegetation werden lose auf der Abdichtung verlegt und wirken gleichzeitig als deren Schutz und Ballast. Geeignet für nicht regelmässig begangene Dächer mit begrenzter zusätzlicher Auflast, wenn Regenwasserrückhalt und Schutz der Abdichtung gefordert sind.
  en: Vegetated covering build-up above a waterproofed flat or low-slope deck, in which a thin substrate layer carries drought-tolerant planting. Root barrier, drainage and filter layers, substrate, and vegetation are laid loose on the membrane and act at the same time as its protection and ballast. Suitable for roofs that are not regularly walked on, with limited additional dead load, where rainwater retention and protection of the waterproofing are required.
