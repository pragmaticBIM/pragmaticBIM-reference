tender_text:
  de: 'Nichttragendes Fassadenmodul, werkseitig als Holzrahmenelement mit Dämmung, Luftdichtungsschicht, Bekleidung und häufig bereits eingebauten Fenstern gefertigt. Die Module werden geschosshoch angeliefert, eingehoben und punktweise am bestehenden oder neuen Tragwerk verankert; Fugen werden abgedichtet und Installationen vor Ort angeschlossen. Geeignet für Neubau und Sanierung im bewohnten Zustand, wenn Bauzeit und Störung gering bleiben müssen und die Bestandsgeometrie der Fassade vermessen vorliegt. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing facade module manufactured in the factory as a timber-framed element with insulation, air-tight layer, cladding, and often windows already fitted. The modules are delivered storey-high, lifted into place, and anchored at discrete points to the existing or new load-bearing structure, with joints sealed and services connected on site. Suitable for new build and for retrofit of occupied buildings where site time and disruption must stay minimal and the existing facade geometry has been surveyed. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
