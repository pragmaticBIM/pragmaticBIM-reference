tender_text:
  de: 'Sichtbare Deckenbekleidung aus Metallblechen oder -streifen unter der tragenden Decke, mit glatter oder perforierter Oberfläche. Auf abgehängter Metallunterkonstruktion eingeklipst oder verschraubt, bei Bedarf mit Akustikvlies und Dämmung im Hohlraum. Geeignet für Erschliessungs-, Sanitär- und Technikräume mit Anforderungen an Reinigbarkeit, nichtbrennbare Oberflächen und teilweise Zugänglichkeit der Installationen im Deckenhohlraum. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Abhänger und Befestigungen nach Aufbau, Rand- und Anschlussprofile, Schattenfugen, Ausschnitte und Auswechslungen für Leuchten, Luftauslässe, Sprinkler und Melder, Revisionsöffnungen, Einlagen und Dämmung nach Aufbau sowie Abschottungen im Deckenhohlraum nach Brandschutzkonzept.'
  en: 'Visible ceiling lining from metal sheets or strips below the load-bearing slab, with a plain or perforated surface. Clipped or screwed onto a suspended metal substructure, with acoustic fleece and insulation laid in the cavity where required. Suitable for circulation areas, sanitary rooms, and technical rooms with requirements on cleanability, non-combustible surfaces, and partial access to services in the ceiling void. Included are all works required to meet the specified requirements. Included in particular: substructure, hangers, and fixings according to the build-up, edge and connection profiles, shadow gaps, cut-outs and trimmers for luminaires, air outlets, sprinklers, and detectors, access panels, inlays and insulation according to the build-up, and fire barriers in the ceiling void according to the fire safety concept.'
