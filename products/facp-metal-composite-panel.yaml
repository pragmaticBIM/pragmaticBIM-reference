tender_text:
  de: 'Nichttragende Fassadenhaut aus werkseitig gefertigten Sandwichpaneelen mit Metalldeckschichten und verklebtem Kern, vorgehängt vor der gedämmten Aussenwand. Die Paneele werden zu Kassetten oder Schalen gekantet und mechanisch auf einer ausgerichteten Metall-Unterkonstruktion befestigt, mit definierten Fugen und Hinterlüftung. Geeignet für Neubau und rasche Sanierung grosser ebener Flächen; der Kern ist als nichtbrennbar nachzuweisen, wenn Gebäudehöhe oder Nutzung dies verlangen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Verankerungen und Dämmung nach Aufbau, Anschlüsse an Fenster, Türen, Laibungen, Stürze und Brüstungen, Ecken, Sockel- und Dachrandabschlüsse, Lüftungsöffnungen mit Insektenschutz, Brandsperren nach Brandschutzkonzept sowie Durchdringungen und Befestigungspunkte für Leuchten, Storen und Beschriftungen.'
  en: 'Non-load-bearing facade skin of factory-made sandwich panels with metal faces and a bonded core, hung in front of the insulated exterior wall. The panels are folded into cassettes or trays and mechanically fixed to an aligned metal sub-frame, with defined joints and cavity ventilation. Suitable for new build and fast retrofit of large flat surfaces; the core must be declared non-combustible where building height or use demands it. Included are all works required to meet the specified requirements. Included in particular: substructure, anchors, and insulation according to the build-up, connections to windows, doors, reveals, lintels, and sills, corners, base and roof-edge terminations, ventilation openings with insect mesh, fire barriers according to the fire safety concept, and penetrations and fixing points for luminaires, blinds, and signage.'
