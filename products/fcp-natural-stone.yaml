tender_text:
  de: 'Nutzschicht aus Natursteinplatten oder -fliesen auf vorbereitetem Untergrund, die eine schwere und sehr dauerhafte Gehfläche bildet. Im Mörtelbett oder Dünnbettkleber auf dem Unterlagsboden verlegt, verfugt und durch Schleifen, Polieren oder Imprägnieren fertiggestellt. Geeignet für Eingänge, Verkehrsflächen und repräsentative Räume mit hoher Beanspruchung und erhöht das Eigengewicht des Bodenaufbaus. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Prüfung von Ebenheit und Restfeuchte des Untergrunds, Grundierung und Ausgleichsspachtelung, Sockelleisten oder Hohlkehlen, Anschluss-, Übergangs- und Schwellenprofile, Bewegungsfugen über den Fugen des Unterlagsbodens, Aussparungen für Bodendosen, Rinnen und Abläufe sowie der Schutz des fertigen Belags bis zur Übergabe.'
  en: 'Wearing surface from quarried stone slabs or tiles on a prepared substrate, delivering a heavy and highly durable walking surface. Laid in a mortar bed or thin-bed adhesive on the screed, jointed, and finished by grinding, honing, or sealing. Suitable for entrances, circulation areas, and representative rooms with heavy traffic, and increases the dead load of the floor build-up. Included are all works required to meet the specified requirements. Included in particular: checking flatness and residual moisture of the substrate, priming and levelling compound, skirtings or coved upstands, connection, transition, and threshold profiles, movement joints above the screed joints, cut-outs for floor boxes, channels, and drains, and protection of the finished floor until handover.'
