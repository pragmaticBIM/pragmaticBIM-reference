tender_text:
  de: Nichttragende Innenwand aus Trockenbau-, Ständer- oder modularen Elementsystemen mit Metall- oder Holzständerwerk und Plattenbeplankung. Vor Ort aus vorgefertigten Teilen montiert, mit Hohlraumdämmung und bei Bedarf integrierten Installationen. Geeignet für Trenn-, Schacht- und Vorsatzwände, insbesondere bei späterem Umbau- oder Rückbaubedarf.
  en: Non-load-bearing interior wall from drywall, stud-framed, or modular element systems with metal or timber studs and board sheathing. Assembled on site from prefabricated parts, with cavity insulation and integrated services where required. Suitable for partitions, shaft walls, and lining walls, in particular where later reconfiguration or removal is expected.
