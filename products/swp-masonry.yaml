tender_text:
  de: Tragende oder nichttragende Wand aus vor Ort vermauerten Ziegel-, Block- oder Natursteinen im Mörtelverband. Einschliesslich monolithischer Dämm-Blocksysteme, die Tragfunktion und Wärmedämmung in einer Schicht vereinen. Geeignet für Aussen- und Innenwände in kleinteiliger, handwerklicher Ausführung.
  en: Load-bearing or non-load-bearing wall laid on site from brick, block, or natural stone units in mortar. Includes monolithic insulating block systems that combine structure and thermal insulation in a single layer. Suitable for exterior and interior walls built unit by unit in traditional trade work.
