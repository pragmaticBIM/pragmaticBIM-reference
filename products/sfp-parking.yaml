  de: Markierte Flaeche, auf der Personenwagen, Lieferwagen und Baustellenfahrzeuge stehen, solange sie nicht laden oder wenden. Unterscheidet sich von Baustrasse, Wendeflaeche und Umschlagplatz. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
