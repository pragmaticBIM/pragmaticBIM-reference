tender_text:
  de: Ortbeton- oder Fertigteilsockel, der einen Turmdrehkran haelt, mit Ankern oder Zentralballast. Wird nach dem Rueckbaukonzept entfernt oder belassen. Unterscheidet sich von der Kranstellflaeche. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind.
  en: Cast or precast base that holds a tower crane, with anchors or a central ballast block. Removed or left according to the dismantling concept. Distinct from a mobile-crane pad. Included are all works required to meet the specified requirements.
