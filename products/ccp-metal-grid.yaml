tender_text:
  de: 'Abgehängte Decke aus sichtbarem Metallraster mit abnehmbaren Einlegeplatten oder offenen Rasterzellen unter der tragenden Decke. Rasterprofile werden mit verstellbaren Abhängern an der Rohdecke aufgehängt, die Platten ohne Befestigung eingelegt, sodass jedes Feld einzeln entnommen werden kann. Geeignet für Büro-, Labor- und Technikbereiche mit dichten Installationen im Deckenhohlraum, die vollflächig und wiederholt zugänglich sein müssen, wobei Akustik und Brandverhalten von der gewählten Einlage abhängen. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Abhänger und Befestigungen nach Aufbau, Rand- und Anschlussprofile, Schattenfugen, Ausschnitte und Auswechslungen für Leuchten, Luftauslässe, Sprinkler und Melder, Revisionsöffnungen, Einlagen und Dämmung nach Aufbau sowie Abschottungen im Deckenhohlraum nach Brandschutzkonzept.'
  en: 'Suspended ceiling from a visible metal grid with removable lay-in tiles or open grid cells below the load-bearing slab. Grid profiles are hung from the slab on adjustable hangers, and tiles are laid in without fixings so that every field can be removed individually. Suitable for offices, laboratories, and technical areas with dense services in the ceiling void that require full and repeated access, with acoustic and fire behaviour determined by the chosen infill. Included are all works required to meet the specified requirements. Included in particular: substructure, hangers, and fixings according to the build-up, edge and connection profiles, shadow gaps, cut-outs and trimmers for luminaires, air outlets, sprinklers, and detectors, access panels, inlays and insulation according to the build-up, and fire barriers in the ceiling void according to the fire safety concept.'
