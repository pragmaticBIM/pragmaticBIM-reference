tender_text:
  de: Nimmt Wasser von der Bodenfläche auf und leitet es in die Abwasserleitung ab, sodass der Boden frei von stehendem Wasser bleibt. Wird bündig mit der Fertigoberfläche in den Bodenaufbau eingesetzt und mit Geruchverschluss und dichtem Anschluss an die Bodenabdichtung an den Abwasserstrang angeschlossen. Geeignet für Sanitär- und Technikräume, Küchen und Waschbereiche, angeordnet am Tiefpunkt des Bodengefälles, mit herausnehmbarem Rost und Geruchverschlusseinsatz, damit der Ablauf gereinigt und das Sperrwasser ergänzt werden kann.
  en: Collects water from the floor surface and discharges it into the waste water pipework, so that the floor stays free of standing water. Set into the floor build-up flush with the finished surface and connected to the waste branch with a water trap and a sealed connection to the floor waterproofing. Suitable for sanitary and technical rooms, kitchens, and washing areas, positioned at the low point of the floor slope, with a removable grating and trap insert so that the drain can be cleaned and the water seal refilled.
