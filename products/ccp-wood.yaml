tender_text:
  de: 'Sichtbare Deckenbekleidung aus Vollholz oder Holzwerkstoffen als Platten, Bretter oder Lamellen unter der tragenden Decke. Mechanisch auf Lattung oder abgehängter Unterkonstruktion befestigt, mit sichtbarer oder verdeckter Befestigung und Akustikvlies hinter perforierten oder gelamellten Flächen. Geeignet für Saal-, Sitzungs- und Schulungsräume mit akustischen und gestalterischen Anforderungen, wobei Brandverhalten und Oberflächenbehandlung des Holzes gesondert festzulegen sind. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Unterkonstruktion, Abhänger und Befestigungen nach Aufbau, Rand- und Anschlussprofile, Schattenfugen, Ausschnitte und Auswechslungen für Leuchten, Luftauslässe, Sprinkler und Melder, Revisionsöffnungen, Einlagen und Dämmung nach Aufbau sowie Abschottungen im Deckenhohlraum nach Brandschutzkonzept.'
  en: 'Visible ceiling lining from solid wood or wood-based panels, boards, or slats below the load-bearing slab. Mechanically fixed on battens or a suspended substructure, with visible or concealed fastenings and acoustic fleece behind perforated or slatted surfaces. Suitable for halls, meeting rooms, and educational rooms with acoustic and appearance requirements, where fire behaviour and surface treatment of the wood are specified separately. Included are all works required to meet the specified requirements. Included in particular: substructure, hangers, and fixings according to the build-up, edge and connection profiles, shadow gaps, cut-outs and trimmers for luminaires, air outlets, sprinklers, and detectors, access panels, inlays and insulation according to the build-up, and fire barriers in the ceiling void according to the fire safety concept.'
