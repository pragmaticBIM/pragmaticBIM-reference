tender_text:
  de: Horizontales Tragglied aus Stahlbeton als Unterzug oder Überzug innerhalb einer Betondeckenkonstruktion. Vor Ort mit Schalung und Bewehrung betoniert oder als Fertigteil versetzt und monolithisch angeschlossen. Geeignet für hohe Lasten, monolithischen Anschluss an Decken und inhärenten Feuerwiderstand.
  en: Horizontal load-bearing member of reinforced concrete acting as downstand or upstand beam within a concrete floor structure. Cast in place with formwork and reinforcement, or set as a precast element and connected monolithically. Suitable for high loads, monolithic connection to slabs, and inherent fire resistance.
