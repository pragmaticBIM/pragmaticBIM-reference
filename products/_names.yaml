    ifc_class: IfcPump
  - code: MUP-FW-WATER-HEATER
    iri: https://example.org/abstract/mep-unit-product/MUP-FW-WATER-HEATER
    top: true
    label:
      de: Warmwasserbereiter
      en: Water heater / DHW boiler
    definition:
      de: Warmwasserbereiter oder Brauchwassererwaermer.
      en: Domestic hot water heater or boiler (Warmwasserbereiter).
    ifc_class: IfcBoiler
  - code: MUP-WW-LIFTING-STATION
    iri: https://example.org/abstract/mep-unit-product/MUP-WW-LIFTING-STATION
    top: true
    label:
      de: Hebeanlage
      en: Lifting station
    definition:
      de: Abwasser-Hebeanlage oder Foerderstation.
      en: Wastewater lifting or pumping station (Hebeanlage).
    ifc_class: IfcPump
  - code: MUP-WW-GREASE-SEPARATOR
    iri: https://example.org/abstract/mep-unit-product/MUP-WW-GREASE-SEPARATOR
    top: true
    label:
      de: Fettabscheider
