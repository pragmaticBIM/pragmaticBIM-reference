      en: Prefabricated modular timber facade system
    definition:
      de: Fabrikmässig gefertigtes modulares holzbasiertes Fassadensystem oder Umhüllung. Typischerweise mit Holztragrahmen, integrierter Isolation, Belüftungshohlraum, Fertigungsschicht (Holz, Putz oder Verbundstoff) und vorintegrierten TGA-Rohbauten (Fenster, Lüftung, Solaranlagen).
      en: Factory-manufactured modular timber-based facade exoskeleton or wrapper system. Typically includes structural timber frame, integrated insulation, ventilated cavity, finishing layer (wood, plaster, or composite), and pre-integrated MEP rough-ins (windows, ventilation, solar fittings).
    ifc_class: IfcCovering
  - code: FaCP-PREFAB-MODULAR-METAL
    iri: https://example.org/abstract/facade-covering-product/FaCP-PREFAB-MODULAR-METAL
    top: true
    label:
      de: Vorgefertigtes modulares Metallfassaden-System
      en: Prefabricated modular metal facade system
    definition:
      de: Werkseitig montiertes modulares Fassadensystem mit Aluminium-, Stahl- oder Verbundmetallrahmen, integrierten Isolationsschichten, Verkleidungspaneelen (Metallverbund, Natursteinfurnier oder Keramikoberfläche) und mechanisch befestigter Unterkonstruktion.
      en: Factory-assembled modular facade system using aluminium, steel, or composite metal frames with integrated insulation layers, cladding panels (metal composite, natural stone veneer, or ceramic facing), and mechanically-fixed sub-structure.
    ifc_class: IfcCovering
  - code: FaCP-EXTERIOR-PAINT-COATING
    iri: https://example.org/abstract/facade-covering-product/FaCP-EXTERIOR-PAINT-COATING
    top: true
    label:
      de: Aussenanstrich / Schutzanstrichsystem
      en: Exterior paint / protective coating finish
    definition:
      de: Aufgetragener Aussenanstrich, Beschichtung oder Oberflächenschicht auf Fassadenflaechen (Minerallack, Silikatfarbe, Acryl, Polyurethan oder Epoxid). Kann primäre Fertigungsschicht oder sekundäre Schutzschicht über Untergrund sein.
      en: Applied exterior paint, coating, or finish layer on facade surfaces (mineral paint, silicate paint, acrylic, polyurethane, or epoxy). Can be primary finish or secondary protective layer over substrate.
    ifc_class: IfcCovering
  - code: FaCP-RETROFIT-OVERCLADDING
    iri: https://example.org/abstract/facade-covering-product/FaCP-RETROFIT-OVERCLADDING
    top: true
    label:
      de: Sanierungsüberkleidungssystem (Verbund)
      en: Retrofit overcladding system (composite)
    definition:
      de: 'Nicht-tragende Fassadenüberlagerung oder Umhüllung über bestehende Fassade bei Sanierungs-/Renovierungsprojekten. Kombiniert Verkleidungsschicht (typischerweise ETICS, Lüftungspaneel oder Fertigmodul) mit mechanischen Befestigungen und/oder Klebstoff auf bestehendem Untergrund. Primäre Anwendung: EU Fit-for-55-Tiefensanierungen im Wohn-/Gewerbebebestand.'
      en: 'Non-structural facade overlay or wrapper applied over existing facade on retrofit/renovation projects. Combines cladding layer (typically ETICS, ventilated panel, or prefab module) anchored to existing substrate with mechanical fixings and/or adhesive. Primary application: EU Fit-for-55 deep energy retrofits on residential/commercial stock.'
    ifc_class: IfcCovering
  - code: FaCP-HPL-PANEL
    iri: https://example.org/abstract/facade-covering-product/FaCP-HPL-PANEL
    top: true
    label:
      de: HPL- / Kompaktplatten-Fassade
      en: HPL / compact laminate facade panel
    definition:
      de: Hochdrucklaminat- (HPL) oder Kompaktplatten-System als vorgehängte hinterlüftete Fassade mit Unterkonstruktion und mechanischer Befestigung.
      en: High-pressure laminate (HPL) or compact laminate ventilated rainscreen panel system with subframe and mechanical fixings.
    ifc_class: IfcCovering
  - code: FaCP-BRICK-SLIP
    iri: https://example.org/abstract/facade-covering-product/FaCP-BRICK-SLIP
    top: true
    label:
      de: Ziegelriemchen- / Klinker-Vorhangfassade
      en: Brick slip / tile-hung ventilated facade
    definition:
      de: Dünne Ziegelriemchen-, Fliesen- oder Mauersteinbekleidung als vorgehängte hinterlüftete Fassade auf Unterkonstruktion, einschliesslich Sanierungs-Klinkerfassaden über Daemmung.
      en: Thin brick slip, tile, or masonry-unit ventilated rainscreen cladding on subframe, including retrofit tile-hung systems over insulation.
    ifc_class: IfcCovering
  - code: FaCP-OTHER
    iri: https://example.org/abstract/facade-covering-product/FaCP-OTHER
    top: true
    label:
      de: Sonstige / unbekannte Fassadenbekleidung
      en: Other / unknown facade covering
    definition:
      de: Fassadenbekleidungsprodukt nicht klassifiziert oder noch unbekannt; neuartige Materialien oder Versuchssysteme nicht in primärer Taxonomie aufgeführt.
      en: Facade covering product not classified or not yet known; emerging materials or experimental systems not listed in primary taxonomy.
    ifc_class: IfcCovering
