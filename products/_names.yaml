    ifc_class: IfcCoolingTower
  - code: MUP-FW-PRESSURE-BOOSTER
    iri: https://example.org/abstract/mep-unit-product/MUP-FW-PRESSURE-BOOSTER
    top: true
    label:
      de: Druckerhoehungsanlage
      en: Pressure booster
    definition:
      de: Trinkwasser-Druckerhoehungsanlage.
