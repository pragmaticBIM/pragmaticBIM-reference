- scheme: SiteFacilityProduct
  path: abstract-site-setup-classification/site-setup-products.skos.ttl
  docs: https://schema.pragmaticbim.ch/classification/site-facility-product.html
  title:
    de: Abstrakte Baustelleneinrichtungsprodukte
    en: Abstract site facility products
  sheets: true
  concepts:
  - code: SFP-CRANE
    iri: https://example.org/abstract/site-facility-product/SFP-CRANE
    top: true
    label:
      de: Kran
      en: Crane
    definition:
      de: 'Der Kran als Maschine: Turmdrehkran, Mobilkran oder Raupenkran auf der Baustelle.'
      en: 'The crane as a machine: tower crane, mobile crane, or crawler crane stationed on site.'
  - code: SFP-CRANE-SWING
    iri: https://example.org/abstract/site-facility-product/SFP-CRANE-SWING
    top: true
    label:
      de: Schwenkbereich
      en: Crane swing envelope
    definition:
      de: Der Raum, den der Kran in Grundriss und Hoehe erreicht, fuer Kollision, Ueberschwenken und Lastwege.
      en: The volume the crane can reach in plan and height, used to check collisions, oversailing, and load paths.
  - code: SFP-CRANE-PAD
    iri: https://example.org/abstract/site-facility-product/SFP-CRANE-PAD
    top: true
    label:
      de: Kranstellfläche
      en: Crane set-up pad
    definition:
      de: Vorbereiteter Untergrund, Lastverteilplatten und Abstuetzpositionen fuer einen Mobilkran.
      en: Prepared ground, bearing mats, and outrigger positions for a mobile crane.
  - code: SFP-CRANE-FOUNDATION
    iri: https://example.org/abstract/site-facility-product/SFP-CRANE-FOUNDATION
    top: true
    label:
      de: Kranfundament
      en: Crane foundation
    definition:
      de: Festes Fundament fuer einen Turmdrehkran, einschliesslich Sockel, Verankerung und Ballast fuer die Einsatzdauer.
      en: Fixed foundation for a tower crane, including the base, anchors, and ballast that stay in place for the crane's service.
  - code: SFP-CONTAINER
    iri: https://example.org/abstract/site-facility-product/SFP-CONTAINER
    top: true
    label:
      de: Container
      en: Site container
    definition:
      de: Allgemeiner Baustellencontainer als versetzbare Einheit, ohne genauer bestimmte Aufenthalts- oder Lagerfunktion.
      en: Generic site container used as a relocatable unit, without a more specific accommodation or storage function.
  - code: SFP-WHEEL-WASH
    iri: https://example.org/abstract/site-facility-product/SFP-WHEEL-WASH
    top: true
    label:
      de: Reifenwaschanlage
      en: Wheel wash
    definition:
      de: Reifenwasch- oder Durchfahrtsreinigungsanlage am Baustellenausgang.
      en: Wheel-wash or drive-through cleaning plant at the site exit.
  - code: SFP-FENCE
    iri: https://example.org/abstract/site-facility-product/SFP-FENCE
    top: true
    label:
      de: Zaun
      en: Site fence
    definition:
      de: Temporaerer Bauzaun, der die Baustelle umschliesst und vom oeffentlichen Raum trennt.
      en: Temporary site fence that encloses the works and separates them from the public.
  - code: SFP-GATE
    iri: https://example.org/abstract/site-facility-product/SFP-GATE
    top: true
    label:
      de: Tor
      en: Gate
    definition:
      de: Fahrzeug- oder Personentor im Bauzaun.
      en: Vehicle or pedestrian gate in the site fence.
  - code: SFP-CANOPY
    iri: https://example.org/abstract/site-facility-product/SFP-CANOPY
    top: true
    label:
      de: Schutzdach
      en: Protective canopy
    definition:
      de: Temporaeres Dach ueber oeffentlichem Gehweg oder Nachbarzugang, das Fussgaenger vor herabfallenden Teilen schuetzt.
      en: Temporary roof over a public footway or neighbouring access, protecting pedestrians from falling objects.
  - code: SFP-STORAGE
    iri: https://example.org/abstract/site-facility-product/SFP-STORAGE
    top: true
    label:
      de: Lagerfläche
      en: Storage area
    definition:
      de: Offene Flaeche auf der Baustelle fuer Material, das nicht in einem abschliessbaren Magazin liegt.
      en: Open area on site for storing materials that are not kept in a lockable store.
  - code: SFP-STORE
    iri: https://example.org/abstract/site-facility-product/SFP-STORE
    top: true
    label:
      de: Magazin
      en: Site store
    definition:
      de: Abschliessbares Magazin fuer Werkzeug, Kleinmaterial und Geraete, die gesichert werden muessen.
      en: Lockable store for tools, small materials, and equipment that must be secured.
  - code: SFP-TRANSFER
    iri: https://example.org/abstract/site-facility-product/SFP-TRANSFER
    top: true
    label:
      de: Umschlagplatz
      en: Transfer area
    definition:
      de: Flaeche, auf der Material zwischen Lieferfahrzeugen, Baustellengeraeten und Lager umgeschlagen wird.
      en: Area where materials are transferred between delivery vehicles, site plant, and storage.
  - code: SFP-BUFFER
    iri: https://example.org/abstract/site-facility-product/SFP-BUFFER
    top: true
    label:
      de: Zwischenlager
      en: Intermediate storage
    definition:
      de: Temporaere Flaeche fuer Material zwischen Anlieferung und Einbau oder Weitertransport.
      en: Temporary holding area for material between delivery and installation or onward transport.
  - code: SFP-OFFICE
    iri: https://example.org/abstract/site-facility-product/SFP-OFFICE
    top: true
    label:
      de: Baubüro
      en: Site office
    definition:
      de: Temporaeres Buero fuer Bauleitung, Planung und Besprechungen.
      en: Temporary office for site management, planning, and meetings.
  - code: SFP-BREAK-ROOM
    iri: https://example.org/abstract/site-facility-product/SFP-BREAK-ROOM
    top: true
    label:
      de: Aufenthaltsraum
      en: Break room
    definition:
      de: Temporaerer Raum, in dem Baustellenpersonal isst und pausiert.
      en: Temporary room where site personnel eat and rest.
  - code: SFP-SANITARY
    iri: https://example.org/abstract/site-facility-product/SFP-SANITARY
    top: true
    label:
      de: Sanitäranlage
      en: Sanitary facility
    definition:
      de: Temporaere Toiletten, Waschraeume und Duschen fuer die Baustelle.
      en: Temporary toilets, washrooms, and showers for the site.
  - code: SFP-HAUL-ROAD
    iri: https://example.org/abstract/site-facility-product/SFP-HAUL-ROAD
    top: true
    label:
      de: Baustraße
      en: Haul road
    definition:
      de: Temporaere Strasse auf der Baustelle fuer den Baustellenverkehr.
      en: Temporary road on site for construction traffic.
  - code: SFP-RAMP
    iri: https://example.org/abstract/site-facility-product/SFP-RAMP
    top: true
    label:
      de: Rampe
      en: Ramp
    definition:
      de: Temporaere Rampe, die einen Hoehenunterschied fuer Fahrzeuge oder Personen auf der Baustelle ueberbrueckt.
      en: Temporary ramp that bridges a level difference for vehicles or pedestrians on site.
  - code: SFP-TURNING
    iri: https://example.org/abstract/site-facility-product/SFP-TURNING
    top: true
    label:
      de: Wendefläche
      en: Turning area
    definition:
      de: Flaeche, die so bemessen ist, dass Lastwagen auf der Baustelle wenden koennen.
      en: Area sized for trucks to turn on site.
  - code: SFP-PARKING
    iri: https://example.org/abstract/site-facility-product/SFP-PARKING
    top: true
    label:
      de: Parkplatz
      en: Parking area
    definition:
      de: Temporaerer Parkplatz fuer Baustellenfahrzeuge und Personal.
      en: Temporary parking for site vehicles and personnel.
  - code: SFP-SKIP-BAY
    iri: https://example.org/abstract/site-facility-product/SFP-SKIP-BAY
    top: true
    label:
      de: Muldenplatz
      en: Skip bay
    definition:
      de: Abstellplatz fuer Abfallmulden, die per Lastwagen getauscht werden.
      en: Set-down place for waste skips that are exchanged by truck.
  - code: SFP-SILO
    iri: https://example.org/abstract/site-facility-product/SFP-SILO
    top: true
    label:
      de: Silo
      en: Silo
    definition:
      de: Temporaeres Silo fuer Schuettgut wie Zement, Kalk oder Gips.
      en: Temporary silo for bulk material such as cement, lime, or plaster.
  - code: SFP-BATCH-PLANT
    iri: https://example.org/abstract/site-facility-product/SFP-BATCH-PLANT
    top: true
    label:
      de: Betonmischanlage
      en: Concrete batching plant
    definition:
      de: Anlage auf der Baustelle, die Beton dosiert und mischt.
      en: On-site plant that batches and mixes concrete.
  - code: SFP-PUMP
    iri: https://example.org/abstract/site-facility-product/SFP-PUMP
    top: true
    label:
      de: Betonpumpe
      en: Concrete pump
    definition:
      de: Standort und Ausleger einer Betonpumpe, einschliesslich des vom Ausleger ueberstrichenen Raums.
      en: Position and boom of a concrete pump, including the space the boom sweeps.
  - code: SFP-HOIST
    iri: https://example.org/abstract/site-facility-product/SFP-HOIST
    top: true
    label:
      de: Bauaufzug
      en: Construction hoist
    definition:
      de: Temporaerer Aufzug fuer Personal oder Material an der Gebaeudefassade.
      en: Temporary hoist for personnel or materials on the building face.
  - code: SFP-SCAFFOLD
    iri: https://example.org/abstract/site-facility-product/SFP-SCAFFOLD
    top: true
    label:
      de: Gerüst
      en: Scaffold
    definition:
      de: Temporaeres Geruest mit Arbeitsbuehnen und Zugang in der Hoehe.
      en: Temporary scaffold providing work platforms and access at height.
  - code: SFP-POWER-DIST
    iri: https://example.org/abstract/site-facility-product/SFP-POWER-DIST
    top: true
    label:
      de: Baustromverteiler
      en: Site power distribution board
    definition:
      de: Temporaerer Elektroverteiler, der die Baustelle ab dem Stromanschluss versorgt.
      en: Temporary electrical distribution board that supplies the site from the power connection.
  - code: SFP-WATER-CONN
    iri: https://example.org/abstract/site-facility-product/SFP-WATER-CONN
    top: true
    label:
      de: Bauwasseranschluss
      en: Site water connection
    definition:
      de: Temporaerer Wasseranschluss und die Verteilung, die die Baustelle versorgt.
      en: Temporary water connection and distribution that supplies the site.
  - code: SFP-OTH
    iri: https://example.org/abstract/site-facility-product/SFP-OTH
    top: true
    label:
      de: Sonstige / unbekannte Baustelleneinrichtung
      en: Other / unknown site facility
    definition:
      de: Baustelleneinrichtung nicht klassifiziert oder noch unbekannt.
      en: Site facility not classified or not yet known.
