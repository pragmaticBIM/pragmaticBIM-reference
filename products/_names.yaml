    ifc_class: IfcUnitaryEquipment
  - code: MUP-HEAT-DISTRICT-HEAT-SUBSTATION
    iri: https://example.org/abstract/mep-unit-product/MUP-HEAT-DISTRICT-HEAT-SUBSTATION
