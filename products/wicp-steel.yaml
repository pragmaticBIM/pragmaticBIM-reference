tender_text:
  de: 'Fenstereinheit mit schlanken Stahlprofilen für Rahmen und Flügel und verglaster Füllung, die eine Öffnung in einer Wand oder Trennwand verschliesst. Die Profile werden in der Werkstatt geschweisst oder verschraubt, beschichtet, verglast und mit Beschlägen versehen, danach in der Öffnung verankert und an die angrenzende Konstruktion abgedichtet. Geeignet für Öffnungen mit schmalen Ansichtsbreiten, hoher mechanischer Beanspruchung oder Aufgaben im Brandabschnitts- und Sicherheitsbereich, einschliesslich Ersatzeinheiten in bestehenden Industrie- und Baudenkmalbauten. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Window unit with slender steel frame and sash profiles and a glazed infill, closing an opening in a wall or partition. Profiles are welded or screwed into frames in the workshop, coated, glazed and fitted with hardware, then anchored in the opening and sealed against the adjoining construction. Suitable for openings with narrow sight lines, high mechanical loading, or fire compartmentation and security duty, including replacement units in existing industrial and heritage buildings. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
