tender_text:
  de: Tragende oder nichttragende Wand mit primärer Stahlkonstruktion aus Profilen oder Ständern und Ausfachungs- oder Bekleidungsschichten. Vorgefertigte Rahmen werden vor Ort montiert, Dämmung und Bekleidung schichtweise ergänzt. Geeignet für Aussen- und Innenwände mit geringem Eigengewicht und hoher Ausbauflexibilität.
  en: Load-bearing or non-load-bearing wall with a primary steel structure of sections or studs and sheathing or infill layers. Prefabricated frames are erected on site, with insulation and lining added layer by layer. Suitable for exterior and interior walls with low dead load and high fit-out flexibility.
