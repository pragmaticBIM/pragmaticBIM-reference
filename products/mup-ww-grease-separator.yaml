tender_text:
  de: Hält in Küchen- oder Prozessabwasser mitgeführte Fette und Öle zurück, bevor dieses in die öffentliche Kanalisation gelangt, und schützt damit nachgeschaltete Leitungen und Anlagen vor Ablagerungen. Lieferung als werkseitig gefertigter Behälter, Aufstellung freistehend im Raum oder erdverlegt im Aussenbereich mit befahrbarer Abdeckung, Anschluss an Zu- und Ablauf mit erforderlichem Gefälle sowie bei entsprechender Ausrüstung an die Stromversorgung für Entsorgungs- und Warneinrichtungen, Füllstands- und Alarmmeldungen für die Gebäudeautomation verfügbar. Geeignet für Gastronomie- und Lebensmittelbereiche; erfordert einen zugänglichen Aufstellort mit Entwässerung und Belüftung, freie Zufahrt und Anschlussstelle für die Entleerung per Saugfahrzeug sowie regelmässige Entleerung und Reinigung im Betrieb.
  en: Retains grease and oil carried in kitchen or process wastewater before discharge into the public sewer and thereby protects downstream pipes and plant from deposits. Delivered as a factory-made tank, installed free-standing in a room or buried outside with a trafficable cover, connected to inflow and outflow at the required gradient and, where so equipped, to power supply for disposal and warning devices, with filling level and alarm signals available to building automation. Suitable for catering and food-processing areas; requires an accessible location with drainage and ventilation, a clear access route and connection point for emptying by tanker, and regular emptying and cleaning during operation.
