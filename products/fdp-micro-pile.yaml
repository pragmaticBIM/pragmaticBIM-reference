tender_text:
  de: Kleindurchmesser-Pfahl oder Bodenbehandlung, die die Tragfähigkeit des Baugrunds erhöht oder Lasten auf beengten Baustellen abträgt. Mit kleinen Bohrgeräten über verpresste Stahltragglieder, Injektionen oder Bodenaustausch eingebracht, bei Bedarf auch aus bestehenden Gebäuden heraus. Geeignet für Unterfangungen, nachträgliche Verstärkungen und enge innerstädtische Lagen, in denen konventionelle Pfahlgeräte nicht einsetzbar sind.
  en: Small-diameter pile or soil treatment that raises the bearing capacity of the ground or transfers loads on sites with restricted access. Installed with small drilling rigs using grouted steel tendons, injections, or soil replacement, where necessary working from inside existing buildings. Suitable for underpinning, retrofit strengthening, and tight urban sites where conventional piling equipment cannot operate.
