  en: Special transparent opening
product_classification:
  classification_scheme: AbstractWindowConnectorProduct
  classification_code: WICP-SPECIAL
tender_text:
  de: 'Lichtdurchlässiges Öffnungsprodukt, das eine Öffnung ohne herkömmlichen Rahmen und Flügel verschliesst, zum Beispiel als Glasbausteinfeld, transluzentes Paneelfeld, Festverglasung oder verglaste Klappe. Wird als Sonderelement gefertigt oder vor Ort aufgebaut und über einen tragenden Blindrahmen, Bettung und umlaufende Abdichtung an die umgebende Konstruktion angeschlossen. Geeignet, wo Tageslicht ohne öffenbaren Flügel gefordert ist; Anforderungen an Öffnungsverhalten, Stossfestigkeit und Reinigungszugang sind je Fall zu beschreiben. Inbegriffen sind alle Leistungen, die für das Erreichen der Vorgaben erforderlich sind. Inbegriffen sind insbesondere: Montage in der vorbereiteten Öffnung mit Befestigung, luft- und schlagregendichter Anschluss an Wand oder Dach, Anschlüsse an Fensterbänke, Bleche und Sonnenschutz, Beschläge und Dichtungen, Einstellen und Funktionsprüfung sowie Übergabe mit Wartungsunterlagen.'
  en: 'Light-transmitting opening product that closes an opening without a conventional frame and sash, for example a glass block field, a translucent panel field, a fixed light, or a glazed hatch. Fabricated as a purpose-made element or built up on site and connected to the surrounding construction with a supporting subframe, bedding, and perimeter seal. Suitable where daylight is required without an operable sash; the requirements for opening behaviour, impact resistance, and cleaning access have to be stated per case. Included are all works required to meet the specified requirements. Included in particular: installation in the prepared opening with fixing, airtight and rainproof connection to wall or roof, connections to sills, flashings, and sun shading, hardware and seals, adjustment and function test, and handover with maintenance documents.'
