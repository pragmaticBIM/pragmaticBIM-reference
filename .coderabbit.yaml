# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for the pragmaticBIM Reference.
# Merge policy (who merges, auto-merge criteria, escalation): see MERGE_POLICY.md.
#
# CodeRabbit is the first reviewer on every PR. Its result feeds the merge gate:
#   - the "CodeRabbit" commit status is a required check on main
#   - unresolved CodeRabbit threads block merging (conversation resolution is required)
#   - a "changes requested" review from CodeRabbit stops auto-merge
#   - two "changes requested" rounds on the same PR escalate to the maintainer

language: en-US
tone_instructions: "Reviewer of a BIM requirements standard. Be brief and concrete. Flag real problems, not taste. Quote the YAML path of each finding."
early_access: false

reviews:
  profile: chill                  # nitpicks would block auto-merge via unresolved threads
  request_changes_workflow: true  # request changes on findings, approve once all are resolved
  high_level_summary: true
  review_status: true
  commit_status: true             # posts the "CodeRabbit" status that main requires
  fail_commit_status: true        # if CodeRabbit cannot review, the PR goes to a human
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false         # labels are set by the merge gate
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords: ["WIP", "DO NOT MERGE"]

  path_filters:
    - "!media/**"
    - "!**/*.png"
    - "!**/*.tif"
    - "!**/*.ifc"

  path_instructions:
    - path: "{elements,values,workflows,project_goals,domains,models,documents,uses,usage_scenarios,room_types,components,phases}/**/*.yaml"
      instructions: |
        Requirements data. Check:
        1. `id` and `code` are unchanged on existing entries. A changed or removed id, code, attribute name, allowed value or IFC mapping is a BREAKING change: request changes and say so.
        2. Every translated field has all four languages (de, fr, it, en) and they say the same thing. A text edit in one language without the other three is a finding.
        3. German uses Swiss spelling (ss, no ß).
        4. Follow the structure rules in .cursor/rules/ for the matching file type.
        5. Lean requirements: a new attribute or element must name the workflow that needs it. No requirement without a benefit.
        Do not comment on wording style unless it changes meaning.
    - path: "values/**/*.yaml"
      instructions: "Allowed values must be identical across languages when they are codes (e.g. eBKP-H, IFC enums). Check norm_reference and year when codes change."
    - path: "phases/**/*.yaml"
      instructions: "Phase catalogues map to SIA, HOAI, RIBA. Any change to a phase code or mapping is normative: request changes unless the PR description cites the norm."
    - path: "{schema,catalog,generators,render}/**"
      instructions: "Code and schemas consumed by the web app and IFC generation. Check backwards compatibility of JSON Schema changes and that tests cover new behaviour."
    - path: "tests/**"
      instructions: "Flag any weakened, skipped or deleted assertion. Tests protect the data contract."
    - path: ".github/**"
      instructions: "CI and merge governance. Flag any change that widens permissions, uses pull_request_target with a checkout of PR code, or loosens the merge gate."

  tools:
    languagetool:
      enabled: false   # four-language content produces false positives
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: "Imperative, under 72 characters, says what changes."
    description:
      mode: "warning"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "No breaking data change"
        mode: "error"
        instructions: |
          Fail if the PR removes or renames an existing `id`, `code`, attribute name, allowed value, value list entry, IFC entity or property set mapping, or changes the meaning of an existing attribute, in any YAML under elements, values, workflows, project_goals, room_types, components, phases. Adding new entries is fine. Deprecating via `status` is fine. Pass otherwise.
      - name: "Four-language parity"
        mode: "error"
        instructions: |
          Fail if any added or edited `name`, `definition` or `description` block is missing one of de, fr, it, en, or if one language was changed in meaning while the others were not updated. Pure typo fixes in one language pass.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".cursor/rules/*.mdc"
      - "CONTRIBUTING.md"
      - "MERGE_POLICY.md"

chat:
  auto_reply: true
