definition:
  de: Liefergegenstände der Bauherrschaft. Das Bestellmodell hält Bauherrschaft, Rechnungsadresse, Kostenziel, Termine und Raumprogramm als Sollwerte fest, an denen alle Fachmodelle gemessen werden.
  fr: Livrables du maître d'ouvrage. La maquette de commande fixe le maître d'ouvrage, l'adresse de facturation, l'objectif de coûts, les échéances et le programme des locaux comme valeurs prescrites, auxquelles toutes les maquettes métiers sont comparées.
  it: Consegne del committente. Il modello di commessa fissa committente, indirizzo di fatturazione, obiettivo di costo, scadenze e programma dei locali come valori prescritti, con cui si confrontano tutti i modelli disciplinari.
  en: Client deliverables. The order model records the client, invoice address, cost target, milestones, and room programme as target values that all discipline models are measured against.
