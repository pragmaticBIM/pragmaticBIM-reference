name: Merge gate

# Classifies each PR as auto-merge, wait, back-to-author or escalate.
# Rules: MERGE_POLICY.md. Logic: .github/scripts/merge_gate.py
#
# Security: pull_request_target and status run the workflow from main with
# write access. The job checks out main only and never runs PR code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]
  status: # CodeRabbit finished (or re-finished) its review

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.context == 'CodeRabbit' && github.event.state != 'pending')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS_SHA: ${{ github.event.sha }}
        run: python .github/scripts/merge_gate.py
