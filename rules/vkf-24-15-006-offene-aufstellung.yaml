id: pragmaticbim:rule/vkf-24-15-006-offene-aufstellung
code: VKF-24-15-006
sort_order: 171
name:
  de: Offene Aufstellung in eingeschossigen Hallen und Gewerbebauten bei kleiner Brandbelastung
  en: Open installation in single-storey halls and commercial buildings with low fire load
  fr: Installation ouverte dans les halles à un niveau et bâtiments artisanaux à faible charge calorifique
  it: Installazione aperta in capannoni a un piano ed edifici artigianali con basso carico d'incendio
description:
  de: 'In eingeschossigen Hallen und mehrgeschossigen Industrie- und Gewerbebauten mit nutzungsbezogenen Brandabschnitten
    dürfen Feuerungsaggregate beliebiger Leistung offen stehen, sofern der Betrieb es erfordert, die Sicherheitsabstände eingehalten
    sind und die Brandbelastung im Raum klein ist.'
  en: 'In single-storey halls and multi-storey industrial and commercial buildings with use-related compartments, firing units
    of any output may stand openly if operation requires it, the clearances are kept and the fire load in the room is low.'
  fr: 'Dans les halles à un niveau et les bâtiments industriels et artisanaux à plusieurs niveaux avec compartiments liés
    à l''affectation, des foyers de toute puissance peuvent être installés ouvertement si l''exploitation l''exige, que les
    distances de sécurité sont respectées et que la charge calorifique du local est faible.'
  it: 'In capannoni a un piano ed edifici industriali e artigianali a più piani con compartimenti legati all''utilizzo, focolari
    di qualsiasi potenza possono stare a vista se l''esercizio lo richiede, le distanze di sicurezza sono rispettate e il
    carico d''incendio nel locale è basso.'
rule_status: reviewed
severity: violation
