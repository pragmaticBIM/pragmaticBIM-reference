id: pragmaticbim:rule/vkf-21-15-015-lufttechnische-anlagen-mitbenutzung
code: VKF-21-15-015
sort_order: 121
name:
  de: Mitbenutzung lufttechnischer Anlagen nur bei erfüllten RWA-Anforderungen
  en: Use of ventilation systems for smoke extraction only if RWA requirements are met
  fr: Utilisation d'installations de ventilation seulement si les exigences RWA sont remplies
  it: Uso di impianti di ventilazione solo se i requisiti RWA sono soddisfatti
description:
  de: 'Lüftungs- und Klimaanlagen dürfen für den Rauch- und Wärmeabzug nur mitbenutzt werden, wenn die betroffenen Anlageteile
    die Anforderungen an Rauch- und Wärmeabzugsanlagen erfüllen.'
  en: 'Ventilation and air-conditioning systems may be used for smoke and heat extraction only if the affected plant parts
    meet the requirements for smoke and heat exhaust systems.'
  fr: 'Les installations de ventilation et de climatisation ne peuvent servir à l''évacuation de fumée et de chaleur que si
    les éléments concernés remplissent les exigences applicables à ces installations.'
  it: 'Gli impianti di ventilazione e climatizzazione possono servire all''evacuazione di fumo e calore solo se le parti interessate
    soddisfano i requisiti per tali impianti.'
rule_status: reviewed
severity: violation
