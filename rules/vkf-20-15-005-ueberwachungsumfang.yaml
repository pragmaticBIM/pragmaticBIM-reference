id: pragmaticbim:rule/vkf-20-15-005-ueberwachungsumfang
code: VKF-20-15-005
sort_order: 142
name:
  de: 'Überwachungsumfang: Vollüberwachung, Teilüberwachung über ganze Brandabschnitte'
  en: 'Monitoring extent: full monitoring, partial monitoring over whole fire compartments'
  fr: 'Étendue de surveillance : surveillance totale, surveillance partielle sur des compartiments entiers'
  it: 'Estensione della sorveglianza: sorveglianza totale, parziale su interi compartimenti'
description:
  de: 'Brandmeldeanlagen sollen als Vollüberwachung ausgelegt werden und erfassen dann die gesamten Bauten und Anlagen, ausser
    ausdrücklich befreiten, feuerwiderstandsfähig abgetrennten Räumen. Eine Teilüberwachung erfasst mindestens die Fluchtwege
    und Räume mit erhöhtem Brandrisiko und erstreckt sich immer über einen ganzen Brandabschnitt; die Brandschutzbehörde kann
    sie auf weitere Brandabschnitte ausdehnen.'
  en: 'Fire alarm systems should be designed as full monitoring and then cover entire buildings and installations, except
    expressly exempted rooms separated with fire resistance. Partial monitoring covers at least the escape routes and rooms
    with increased fire risk and always extends over a whole fire compartment; the fire protection authority can extend it
    to further compartments.'
  fr: 'Les installations de détection incendie doivent être conçues en surveillance totale et couvrent alors tout le bâtiment,
    sauf les locaux expressément exemptés et séparés par des éléments résistant au feu. Une surveillance partielle couvre
    au moins les voies d''évacuation et les locaux à risque accru et s''étend toujours sur un compartiment entier ; l''autorité
    de protection incendie peut l''étendre à d''autres compartiments.'
  it: 'Gli impianti di rivelazione incendio vanno concepiti con sorveglianza totale e coprono allora l''intero edificio, salvo
    i locali espressamente esentati e separati con resistenza al fuoco. Una sorveglianza parziale copre almeno le vie di fuga
    e i locali a rischio accresciuto e si estende sempre su un intero compartimento; l''autorità di protezione antincendio
    può estenderla ad altri compartimenti.'
