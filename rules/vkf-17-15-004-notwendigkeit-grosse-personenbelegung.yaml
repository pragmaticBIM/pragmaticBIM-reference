id: pragmaticbim:rule/vkf-17-15-004-notwendigkeit-grosse-personenbelegung
code: VKF-17-15-004
sort_order: 54
name:
  de: 'Räume mit grosser Personenbelegung, Verkaufsgeschäfte: Dauerbeleuchtung der Zeichen'
  en: 'Rooms with large occupancy, shops: signs lit continuously'
  fr: 'Locaux à grande occupation, magasins : signaux éclairés en permanence'
  it: 'Locali con grande affollamento, negozi: segnali illuminati in modo permanente'
description:
  de: 'In Räumen mit grosser Personenbelegung und in Verkaufsgeschäften werden Ausgänge und Fluchtwege mit sicherheitsbeleuchteten
    Rettungszeichen gekennzeichnet. Deren Beleuchtung bleibt eingeschaltet, solange sich Personen im Raum aufhalten. Sowohl
    die Räume als auch die Fluchtwege erhalten eine Sicherheitsbeleuchtung.'
  en: 'In rooms with large occupancy and in shops, exits and escape routes are marked with escape signs on safety lighting.
    Their lighting stays on as long as people are in the room. Both the rooms and the escape routes get safety lighting.'
  fr: 'Dans les locaux à grande occupation et dans les magasins, les sorties et voies d''évacuation sont signalées par des
    signaux de sauvetage éclairés en sécurité. Leur éclairage reste allumé tant que des personnes sont présentes dans le
    local. Les locaux comme les voies d''évacuation reçoivent un éclairage de sécurité.'
  it: 'Nei locali con grande affollamento e nei negozi uscite e vie di fuga sono segnalate con segnali di salvataggio dotati
    di illuminazione di sicurezza. La loro illuminazione resta accesa finché nel locale ci sono persone. Sia i locali sia
    le vie di fuga ricevono un''illuminazione di sicurezza.'
rule_status: reviewed
severity: violation
