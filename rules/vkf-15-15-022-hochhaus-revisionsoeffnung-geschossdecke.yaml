id: pragmaticbim:rule/vkf-15-15-022-hochhaus-revisionsoeffnung-geschossdecke
code: VKF-15-15-022
sort_order: 34
name:
  de: 'Hochhäuser: Revisionsöffnungen nicht im Sicherheitstreppenhaus, Brandübertragung am Deckenrand begrenzen'
  en: 'High-rise buildings: no inspection openings in safety stairwells, limit fire spread at the slab edge'
  fr: 'Tours : pas d''ouvertures de révision dans les cages d''escalier de sécurité, limiter la propagation au bord de dalle'
  it: 'Edifici alti: nessuna apertura di ispezione nei vani scala di sicurezza, limitare la propagazione al bordo del solaio'
description:
  de: 'In Hochhäusern werden auf jedem Geschoss am Anschluss der Geschossdecke an die Aussenwand Massnahmen gegen die Brandausdehnung
    getroffen; bei Löschanlagen-Vollschutz entfallen sie. Revisionsöffnungen von Installationsschächten liegen nicht in
    Sicherheitstreppenhäusern.'
  en: 'In high-rise buildings, measures against fire spread are taken at every storey where the floor slab meets the external
    wall; they are not needed where full extinguishing-system protection is provided. Inspection openings of installation
    shafts are not located in safety stairwells.'
  fr: 'Dans les tours, des mesures limitant la propagation du feu sont prises à chaque niveau à la jonction du plancher
    et du mur extérieur ; elles ne sont pas nécessaires avec une protection intégrale par installation d''extinction. Les
    ouvertures de révision des gaines techniques ne se trouvent pas dans les cages d''escalier de sécurité.'
  it: 'Negli edifici alti a ogni piano, nel raccordo tra solaio e parete esterna, sono adottate misure contro la propagazione
    dell''incendio; con protezione integrale mediante impianto di spegnimento non sono necessarie. Le aperture di ispezione
    dei cavedi impiantistici non si trovano nei vani scala di sicurezza.'
rule_status: reviewed
severity: violation
applies_to_elements:
