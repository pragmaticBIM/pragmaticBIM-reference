id: pragmaticbim:rule/vkf-26-15-015-mittelgrosse-tanks
code: VKF-26-15-015
sort_order: 199
name:
  de: 'Mittelgrosse Tanks: bis 10''000 l Flammpunkt ≤ 60 °C im Raum EI 90, bis 250''000 l darüber im Raum EI 60'
  en: 'Medium-sized tanks: up to 10,000 l flash point ≤ 60 °C in a room EI 90, up to 250,000 l above that in a room EI 60'
  fr: 'Citernes moyennes : jusqu''à 10''000 l point d''éclair ≤ 60 °C en local EI 90, jusqu''à 250''000 l au-delà en local
    EI 60'
  it: 'Serbatoi di media grandezza: fino a 10''000 l punto d''infiammabilità ≤ 60 °C in locale EI 90, fino a 250''000 l oltre
    in locale EI 60'
description:
  de: 'Im Raum EI 90 ohne zusätzliche Brandlasten dürfen höchstens 10''000 l brennbare Flüssigkeiten mit Flammpunkt bis 60
    °C lagern; dazu sind besondere Schutzmassnahmen nötig (z. B. mechanische Lüftung, Löschanlage, Gasmeldeanlage). Im Raum
    EI 60 ohne zusätzliche Brandlasten dürfen höchstens 250''000 l brennbare Flüssigkeiten mit Flammpunkt über 60 °C lagern.
    Noch nicht prüfbar: das Modell weist Flammpunkt, Lagervolumen, Behälterart und Feuerwiderstand des Lagerraums nicht aus.'
  en: 'In a room EI 90 without additional fire loads, at most 10,000 l of combustible liquids with a flash point up to 60
    °C may be stored; special protective measures are needed (e.g. mechanical ventilation, extinguishing system, gas detection).
    In a room EI 60 without additional fire loads, at most 250,000 l of combustible liquids with a flash point above 60 °C
    may be stored. Not yet checkable: the model does not show flash point, stored volume, container type and fire resistance
    of the storage room.'
  fr: 'Dans un local EI 90 sans charges calorifiques supplémentaires, au plus 10''000 l de liquides combustibles de point
    d''éclair jusqu''à 60 °C peuvent être stockés ; des mesures de protection particulières sont nécessaires (p. ex. ventilation
    mécanique, installation d''extinction, détection de gaz). Dans un local EI 60 sans charges calorifiques supplémentaires,
    au plus 250''000 l de liquides combustibles de point d''éclair supérieur à 60 °C peuvent être stockés. Pas encore vérifiable
    : le modèle n''indique ni le point d''éclair, ni le volume stocké, ni le type de récipient, ni la résistance au feu du
    local de stockage.'
  it: 'In un locale EI 90 senza carichi d''incendio aggiuntivi possono essere stoccati al massimo 10''000 l di liquidi combustibili
    con punto d''infiammabilità fino a 60 °C; servono misure di protezione particolari (p. es. ventilazione meccanica, impianto
    di estinzione, rivelazione gas). In un locale EI 60 senza carichi d''incendio aggiuntivi possono essere stoccati al massimo
    250''000 l di liquidi combustibili con punto d''infiammabilità superiore a 60 °C. Non ancora verificabile: il modello
    non indica punto d''infiammabilità, volume stoccato, tipo di contenitore né resistenza al fuoco del locale di stoccaggio.'
