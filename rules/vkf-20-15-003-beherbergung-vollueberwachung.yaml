id: pragmaticbim:rule/vkf-20-15-003-beherbergung-vollueberwachung
code: VKF-20-15-003
sort_order: 140
name:
  de: 'Beherbergungsbetriebe: Brandmeldeanlage mit Vollüberwachung nach Kategorie, Geschosszahl und Personenzahl'
  en: 'Accommodation: fire alarm system with full monitoring by category, number of storeys and persons'
  fr: 'Hébergement : détection incendie avec surveillance totale selon catégorie, étages et nombre de personnes'
  it: 'Alloggio: rivelazione incendio con sorveglianza totale secondo categoria, piani e numero di persone'
description:
  de: 'In Beherbergungsbetrieben der Kategorie a ist eine Brandmeldeanlage mit Vollüberwachung erforderlich. In den Kategorien
    b und c gilt dies bei zwei Geschossen und mehr als 50 beherbergten Personen sowie bei drei oder mehr Geschossen und mehr
    als 30 beherbergten Personen; bei Gebäuden geringer Höhe mit Löschanlagenkonzept kann darauf verzichtet werden.'
  en: 'In accommodation of category a a fire alarm system with full monitoring is required. In categories b and c this applies
    for two storeys and more than 50 accommodated persons, and for three or more storeys and more than 30 accommodated persons;
    for low-rise buildings with an extinguishing-system concept it can be omitted.'
  fr: 'Dans les établissements d''hébergement de catégorie a, une détection incendie avec surveillance totale est exigée.
    Dans les catégories b et c, cela vaut pour deux niveaux et plus de 50 personnes hébergées, ainsi que pour trois niveaux
    ou plus et plus de 30 personnes hébergées ; pour les bâtiments de faible hauteur avec un concept d''installations d''extinction,
    on peut y renoncer.'
  it: 'Negli esercizi di alloggio di categoria a è richiesta una rivelazione incendio con sorveglianza totale. Nelle categorie
    b e c ciò vale per due piani e più di 50 persone alloggiate, nonché per tre o più piani e più di 30 persone alloggiate;
    per edifici di altezza ridotta con un concetto di impianti di estinzione si può rinunciarvi.'
rule_status: reviewed
severity: violation
