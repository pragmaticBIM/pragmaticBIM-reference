id: pragmaticbim:rule/vkf-24-15-017-lagerung-feste-brennstoffe
code: VKF-24-15-017
sort_order: 182
name:
  de: 'Feste Brennstoffe: Tagesverbrauch im Aufstellraum, Lager EI 60, höchstens 10 m³ im Heizraum'
  en: 'Solid fuels: daily consumption in the installation room, store EI 60, at most 10 m³ in the boiler room'
  fr: 'Combustibles solides : consommation journalière dans le local, dépôt EI 60, au plus 10 m³ dans le local de chauffe'
  it: 'Combustibili solidi: consumo giornaliero nel locale, deposito EI 60, al massimo 10 m³ nel locale caldaia'
description:
  de: 'Im Aufstellraum darf nur ein Tagesverbrauch lagern, abgeschirmt vom Aggregat; grössere Mengen kommen in andere Räume
    oder ins Freie. In Einfamilienhäusern sind Holz oder Kohle bis 5 m³ in Räumen beliebiger Bauart erlaubt. Ein- oder angebaute
    Lagerräume sind mit EI 60 abgetrennt. In separaten Heizräumen mit EI 60 dürfen bis 10 m³ hinter einer Abschrankung mit
    1 m Abstand zum Aggregat liegen. Leicht Entzündbares zum Anfeuern lagert nur in verschlossenen RF1-Behältern.'
  en: 'Only a day''s consumption may be stored in the installation room, shielded from the unit; larger quantities go into
    other rooms or outdoors. In single-family houses wood or coal up to 5 m³ is allowed in rooms of any construction. Built-in
    or attached storage rooms are separated with EI 60. In separate boiler rooms with EI 60, up to 10 m³ may be kept behind
    a barrier 1 m from the unit. Easily ignitable kindling is stored only in closed RF1 containers.'
  fr: 'Seule une consommation journalière peut être stockée dans le local d''installation, à l''abri de l''appareil ; les
    quantités plus grandes vont dans d''autres locaux ou à l''extérieur. Dans les maisons individuelles, bois ou charbon jusqu''à
    5 m³ sont admis dans des locaux de toute construction. Les dépôts intégrés ou accolés sont séparés par EI 60. Dans des
    locaux de chauffe séparés EI 60, jusqu''à 10 m³ peuvent être entreposés derrière une barrière à 1 m de l''appareil. Le
    matériau facilement inflammable pour allumer n''est conservé que dans des récipients fermés en RF1.'
  it: 'Nel locale di installazione può essere stoccato solo il consumo di un giorno, schermato dall''apparecchio; quantità
    maggiori vanno in altri locali o all''aperto. Nelle case unifamiliari legna o carbone fino a 5 m³ sono ammessi in locali
    di qualsiasi costruzione. I depositi integrati o addossati sono separati con EI 60. In locali caldaia separati EI 60 possono
    stare fino a 10 m³ dietro una barriera a 1 m dall''apparecchio. Il materiale facilmente infiammabile per l''accensione
    è conservato solo in contenitori chiusi in RF1.'
