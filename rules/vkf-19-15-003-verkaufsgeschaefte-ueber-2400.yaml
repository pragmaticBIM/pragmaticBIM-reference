id: pragmaticbim:rule/vkf-19-15-003-verkaufsgeschaefte-ueber-2400
code: VKF-19-15-003
sort_order: 155
name:
  de: 'Verkaufsgeschäfte über 2''400 m² Brandabschnittsfläche: Sprinkler samt Lager- und Betriebsräumen'
  en: 'Shops above 2,400 m² compartment area: sprinklers including adjoining storage and service rooms'
  fr: 'Commerces de plus de 2''400 m² de compartiment : sprinkler y compris locaux de stockage et d''exploitation attenants'
  it: 'Negozi oltre 2''400 m² di compartimento: sprinkler compresi i locali di deposito e di servizio adiacenti'
description:
  de: 'Verkaufsgeschäfte mit mehr als 2''400 m² Brandabschnittsfläche, einschliesslich der angrenzenden Lager- und Betriebsräume,
    werden mit Sprinkleranlagen geschützt und mit Handfeuermeldern ergänzt.'
  en: 'Shops with more than 2,400 m² compartment area, including the adjoining storage and service rooms, are protected by
    sprinkler systems and supplemented with manual call points.'
  fr: 'Les commerces de plus de 2''400 m² de surface de compartiment, y compris les locaux de stockage et d''exploitation
    attenants, sont protégés par des installations sprinkler et complétés par des avertisseurs manuels.'
  it: 'I negozi con più di 2''400 m² di superficie di compartimento, compresi i locali di deposito e di servizio adiacenti,
    sono protetti da impianti sprinkler e integrati da pulsanti manuali.'
rule_status: reviewed
severity: violation
