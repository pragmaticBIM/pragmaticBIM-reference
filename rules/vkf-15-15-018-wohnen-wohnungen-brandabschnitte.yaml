id: pragmaticbim:rule/vkf-15-15-018-wohnen-wohnungen-brandabschnitte
code: VKF-15-15-018
sort_order: 30
name:
  de: 'Wohnen: Wohnungen als eigene Brandabschnitte'
  en: 'Housing: dwellings as separate fire compartments'
  fr: 'Habitation : logements en compartiments coupe-feu distincts'
  it: 'Abitazione: appartamenti come compartimenti antincendio separati'
description:
  de: 'Wohnungen werden als eigene Brandabschnitte ausgebildet. Bei Einfamilienhäusern samt Untergeschossen und zugehöriger
    Einliegerwohnung gelten keine Anforderungen an den Feuerwiderstand von Tragwerk, Wänden und Decken.'
  en: 'Dwellings are built as separate fire compartments. For single-family houses including their basements and an associated
    granny flat, no fire resistance is required of structure, walls and floors.'
  fr: 'Les logements sont réalisés en compartiments coupe-feu distincts. Pour les maisons individuelles, sous-sols et logement
    indépendant attenant compris, aucune exigence de résistance au feu n''est posée à la structure porteuse, aux murs et
    aux planchers.'
  it: 'Gli appartamenti sono realizzati come compartimenti antincendio separati. Per le case unifamiliari, scantinati e
    appartamento indipendente annesso compresi, non sono posti requisiti di resistenza al fuoco a struttura portante, pareti
    e solai.'
