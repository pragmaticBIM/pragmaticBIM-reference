id: pragmaticbim:rule/vkf-18-15-013-ausloesung-kuehl-loeschanlagen
code: VKF-18-15-013
sort_order: 136
name:
  de: Auslösung spezieller Löschanlagen selbsttätig oder von Hand, mit Signal und internem Alarm
  en: Release of special extinguishing systems automatic or manual, with signal and internal alarm
  fr: Déclenchement des installations spéciales automatique ou manuel, avec signal et alarme interne
  it: Attivazione degli impianti speciali automatica o manuale, con segnale e allarme interno
description:
  de: 'Kühl- oder Löschmittel kann selbsttätig oder von Hand eingesetzt werden. Anlagen mit selbsttätiger Auslösung sind zusätzlich
    von Hand betätigbar. Das selbsttätige Ansprechen wird signalisiert und löst einen internen Alarm aus.'
  en: 'Cooling or extinguishing agent can be released automatically or by hand. Systems with automatic release can also be
    operated by hand. Automatic activation is signalled and triggers an internal alarm.'
  fr: 'L''agent de refroidissement ou d''extinction peut être libéré automatiquement ou à la main. Les installations à déclenchement
    automatique peuvent aussi être actionnées à la main. La mise en action automatique est signalée et déclenche une alarme
    interne.'
  it: 'L''agente di raffreddamento o estinguente può essere rilasciato automaticamente o a mano. Gli impianti ad attivazione
    automatica possono essere azionati anche a mano. L''intervento automatico è segnalato e fa scattare un allarme interno.'
rule_status: reviewed
severity: violation
applies_to_elements:
- pragmaticbim:element/mep-actuator
- pragmaticbim:element/mep-alarm
- pragmaticbim:element/mep-sensor
