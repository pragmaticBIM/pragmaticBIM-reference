id: pragmaticbim:rule/vkf-18-15-002-brandklassen-eignung-loeschmittel
code: VKF-18-15-002
sort_order: 125
name:
  de: Löschmittel passend zu Brandklasse und Raum, Handfeuerlöscher dort, wo Wasser nicht passt
  en: Extinguishing agent matched to fire class and room, portable extinguishers where water is unsuitable
  fr: Agent extincteur adapté à la classe de feu et au local, extincteurs portatifs là où l'eau ne convient pas
  it: Agente estinguente adatto a classe di fuoco e locale, estintori portatili dove l'acqua non è adatta
description:
  de: 'Die Eignung von Löschgeräten und Löschanlagen richtet sich nach Handhabung, Eigenschaften und Menge des Löschmittels;
    ungünstige Nebenwirkungen zählen mit. Unterschieden werden die Brandklassen A, B, C, D und F. Handfeuerlöscher stehen
    bei den Wasserlöschposten oder Raumzugängen, wo Wasser nicht überall passt, anstelle von Wasserlöschposten, wo Wasser
    nie geeignet ist, in Betrieben ohne genügenden Wasseranschluss und in kleinen Gewerbebauten sowie bei Einrichtungen mit
    besonderer Brandgefahr.'
  en: 'The suitability of extinguishers and extinguishing systems depends on handling, properties and quantity of the agent;
    adverse side effects count. Fire classes A, B, C, D and F are distinguished. Portable extinguishers are placed at the
    hose reels or room entrances where water is not suitable everywhere, instead of hose reels where water is never suitable,
    in premises without sufficient water supply and in small commercial buildings, and at equipment with particular fire hazard.'
  fr: 'L''aptitude des extincteurs et installations d''extinction dépend de la manipulation, des propriétés et de la quantité
    de l''agent ; les effets secondaires défavorables comptent. On distingue les classes de feu A, B, C, D et F. Les extincteurs
    portatifs sont placés près des postes d''eau ou des accès aux locaux là où l''eau ne convient pas partout, à la place
    des postes d''eau là où elle ne convient jamais, dans les exploitations sans raccordement d''eau suffisant et les petits
    bâtiments artisanaux, ainsi que près des équipements à danger d''incendie particulier.'
  it: 'L''idoneità di estintori e impianti di estinzione dipende da maneggio, proprietà e quantità dell''agente; contano gli
    effetti collaterali sfavorevoli. Si distinguono le classi di fuoco A, B, C, D e F. Gli estintori portatili sono collocati
    presso i posti d''acqua o gli accessi ai locali dove l''acqua non è ovunque idonea, al posto dei posti d''acqua dove non
    è mai idonea, in aziende senza sufficiente allacciamento idrico e piccoli edifici artigianali, nonché presso attrezzature
    con pericolo d''incendio particolare.'
