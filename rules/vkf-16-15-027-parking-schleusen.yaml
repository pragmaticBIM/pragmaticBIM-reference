id: pragmaticbim:rule/vkf-16-15-027-parking-schleusen
code: VKF-16-15-027
sort_order: 83
name:
  de: 'Parking: Schleusen oder Vorplätze bei Brandabschnitten über 1200 m²'
  en: 'Car parks: airlocks or forecourts for compartments above 1200 m²'
  fr: 'Parkings : sas ou parvis pour les compartiments de plus de 1200 m²'
  it: 'Parcheggi: filtri o piazzali per compartimenti oltre 1200 m²'
description:
  de: 'Führen Ausgänge eines Einstellraums in einen vertikalen Fluchtweg und beträgt die Brandabschnittsfläche mehr als 1200
    m², sind feuerwiderstandsfähige Schleusen oder Vorplätze zu erstellen. Der Feuerwiderstand der Schleusen entspricht dem
    des Tragwerks, mindestens aber EI 30. Die Türen der Schleusen zum vertikalen oder horizontalen Fluchtweg sind mit E 30
    selbstschliessend auszuführen. Der Anhang hält fest, dass abgeschlossene Zugänge von Parkings zu vertikalen Fluchtwegen
    (z. B. bei Wohnbauten) nicht als Fluchtweg anrechenbar sind. Noch nicht prüfbar: Brandabschnittsflächen und Schleusen
    sind im Modell nicht ausgewiesen.'
  en: 'If exits of a parking area lead into a vertical escape route and the fire compartment area exceeds 1200 m², fire-resistant
    airlocks or forecourts are to be provided. The fire resistance of the airlocks matches that of the load-bearing structure
    but is at least EI 30. The airlock doors to the vertical or horizontal escape route are to be self-closing with E 30.
    The appendix notes that locked accesses from car parks to vertical escape routes (e.g. in residential buildings) do not
    count as escape routes. Not yet checkable: fire compartment areas and airlocks are not identified in the model.'
  fr: 'Si les sorties d''un local de stationnement mènent dans une voie d''évacuation verticale et que la surface du compartiment
    dépasse 1200 m², il faut réaliser des sas ou parvis résistants au feu. La résistance au feu des sas correspond à celle
    de la structure porteuse, mais atteint au moins EI 30. Les portes des sas donnant sur la voie verticale ou horizontale
    sont à fermeture automatique en E 30. L''annexe précise que les accès verrouillés des parkings aux voies verticales (p.
    ex. dans les immeubles d''habitation) ne comptent pas comme voies d''évacuation. Pas encore vérifiable : les surfaces
    de compartiment et les sas ne sont pas désignés dans le modèle.'
  it: 'Se le uscite di un locale di parcheggio conducono in una via di fuga verticale e la superficie del compartimento supera
    1200 m², vanno realizzati filtri o piazzali resistenti al fuoco. La resistenza al fuoco dei filtri corrisponde a quella
    della struttura portante, ma è almeno EI 30. Le porte dei filtri verso la via verticale o orizzontale sono a chiusura
    automatica in E 30. L''allegato precisa che gli accessi chiusi a chiave dai parcheggi alle vie verticali (p. es. negli
    edifici d''abitazione) non contano come vie di fuga. Non ancora verificabile: superfici dei compartimenti e filtri non
    sono indicati nel modello.'
