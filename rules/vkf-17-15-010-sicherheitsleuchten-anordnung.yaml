id: pragmaticbim:rule/vkf-17-15-010-sicherheitsleuchten-anordnung
code: VKF-17-15-010
sort_order: 60
name:
  de: 'Sicherheitsleuchten: Bodenzone und Weg ins Freie ausleuchten'
  en: 'Safety luminaires: light the floor zone and the route to the open air'
  fr: 'Luminaires de sécurité : éclairer la zone du sol et le chemin vers l''extérieur'
  it: 'Apparecchi di sicurezza: illuminare la zona del pavimento e il percorso verso l''esterno'
description:
  de: 'In Flucht- und Rettungswegen leuchtet die Sicherheitsbeleuchtung insbesondere die Bodenzone und den Weg zum Ausgang
    ins Freie ausreichend aus. Sicherheitsleuchten in geringer Höhe über dem Boden haben einen bruchfesten Schutz. Tragbare
    Sicherheitsleuchten sind nur in Räumen zulässig, die ausschliesslich Betriebspersonal betritt, und werden danach am
    vorgesehenen Ort geladen.'
  en: 'In escape and rescue routes, safety lighting adequately lights in particular the floor zone and the way to the exit
    to the open air. Safety luminaires mounted low above the floor have an unbreakable guard. Portable safety luminaires
    are allowed only in rooms entered exclusively by operating staff, and are recharged afterwards at the intended place.'
  fr: 'Dans les voies d''évacuation et de sauvetage, l''éclairage de sécurité éclaire suffisamment en particulier la zone
    du sol et le chemin vers la sortie donnant sur l''extérieur. Les luminaires de sécurité placés à faible hauteur au-dessus
    du sol ont une protection incassable. Les luminaires de sécurité portables ne sont admis que dans des locaux n''accueillant
    que du personnel d''exploitation, et sont rechargés ensuite à l''endroit prévu.'
  it: 'Nelle vie di fuga e di salvataggio l''illuminazione di sicurezza illumina a sufficienza in particolare la zona del
    pavimento e il percorso verso l''uscita all''esterno. Gli apparecchi di sicurezza collocati a bassa altezza dal pavimento
    hanno una protezione infrangibile. Gli apparecchi di sicurezza portatili sono ammessi solo in locali frequentati esclusivamente
    dal personale di esercizio e vengono poi ricaricati nel luogo previsto.'
rule_status: reviewed
severity: violation
