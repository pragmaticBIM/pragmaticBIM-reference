id: pragmaticbim:rule/vkf-24-15-003-wohnungen-einfamilienhaeuser
code: VKF-24-15-003
sort_order: 168
name:
  de: 'Einfamilienhäuser und Wohnungen: Feuerungen für feste Brennstoffe im Raum mit EI 30'
  en: 'Single-family houses and flats: solid-fuel firing units in a room with EI 30'
  fr: 'Maisons individuelles et logements : foyers à combustible solide dans un local EI 30'
  it: 'Case unifamiliari e appartamenti: focolari a combustibile solido in un locale EI 30'
description:
  de: 'Für flüssige und gasförmige Brennstoffe sind Bauart und Ausbau des Aufstellraums beliebig. Feuerungsaggregate für feste
    Brennstoffe, die auch den Raum beheizen, dürfen in ständig benutzten Räumen wie Küche oder Wohnzimmer stehen; sonst brauchen
    sie einen Raum mit dem Feuerwiderstand der nutzungsbezogenen Brandabschnittsbildung, mindestens EI 30, mit Türen EI 30.
    Bei geringem Brandrisiko darf der Aufstellraum auch anderweitig genutzt werden.'
  en: 'For liquid and gaseous fuels the construction and finish of the installation room are unrestricted. Solid-fuel units
    that also heat the room may stand in permanently used rooms such as kitchen or living room; otherwise they need a room
    with the fire resistance of the use-related compartmentation, at least EI 30, with EI 30 doors. With low fire risk the
    installation room may also serve other purposes.'
  fr: 'Pour les combustibles liquides et gazeux, le mode de construction et l''aménagement du local sont libres. Les foyers
    à combustible solide qui chauffent aussi le local peuvent se trouver dans des locaux utilisés en permanence comme cuisine
    ou séjour ; sinon ils exigent un local avec la résistance au feu de la compartimentation liée à l''affectation, au moins
    EI 30, avec portes EI 30. En cas de risque faible, le local peut servir à d''autres usages.'
  it: 'Per combustibili liquidi e gassosi tipo di costruzione e finitura del locale sono liberi. I focolari a combustibile
    solido che riscaldano anche il locale possono stare in locali usati in permanenza come cucina o soggiorno; altrimenti
    richiedono un locale con la resistenza al fuoco della compartimentazione legata all''utilizzo, almeno EI 30, con porte
    EI 30. Con rischio d''incendio basso il locale può servire anche ad altri scopi.'
