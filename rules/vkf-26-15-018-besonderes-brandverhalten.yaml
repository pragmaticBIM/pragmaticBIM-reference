id: pragmaticbim:rule/vkf-26-15-018-besonderes-brandverhalten
code: VKF-26-15-018
sort_order: 202
name:
  de: 'Stoffe mit besonderem Brandverhalten: geschlossene RF1-Behälter, trocken, Vorrat über Bedarf separat und gekennzeichnet'
  en: 'Substances with special fire behaviour: closed RF1 containers, dry, stock above need in a separate marked room'
  fr: 'Substances au comportement au feu particulier : récipients fermés RF1, au sec, réserve au-delà du besoin dans un local
    séparé signalé'
  it: 'Sostanze con comportamento al fuoco particolare: contenitori chiusi RF1, all''asciutto, scorta oltre il fabbisogno
    in locale separato segnalato'
description:
  de: 'Selbstentzündliche Stoffe lagern in geschlossenen Behältern aus RF1 unter Luftabschluss, in Inertatmosphäre oder unter
    regelmässiger Temperaturkontrolle. Stoffe, die mit Wasser brennbare Gase bilden, werden trocken aufbewahrt und vor Nässe
    geschützt; Vorräte über dem Bedarf des ungehinderten Arbeitsablaufs kommen in separate, entsprechend ausgebaute und gekennzeichnete
    Räume.'
  en: 'Self-igniting substances are kept in closed RF1 containers excluding air, in an inert atmosphere or under regular temperature
    monitoring. Substances that form combustible gases with water are kept dry and protected from moisture; stocks above what
    an undisturbed workflow needs go into separate, suitably built and marked rooms.'
  fr: 'Les substances auto-inflammables sont conservées dans des récipients fermés en RF1 à l''abri de l''air, en atmosphère
    inerte ou sous contrôle régulier de la température. Les substances qui dégagent des gaz combustibles au contact de l''eau
    sont conservées au sec et protégées de l''humidité ; les réserves dépassant le besoin d''un déroulement de travail sans
    entrave vont dans des locaux séparés, adaptés et signalés.'
  it: 'Le sostanze autoinfiammabili sono conservate in contenitori chiusi in RF1 al riparo dall''aria, in atmosfera inerte
    o con controllo regolare della temperatura. Le sostanze che a contatto con l''acqua sviluppano gas combustibili sono conservate
    all''asciutto e protette dall''umidità; le scorte oltre il fabbisogno di un flusso di lavoro senza intralci vanno in locali
    separati, adeguati e segnalati.'
