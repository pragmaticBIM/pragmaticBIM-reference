id: pragmaticbim:rule/vkf-24-15-019-betriebsbereitschaft-wartung
code: VKF-24-15-019
sort_order: 184
name:
  de: Betriebsbereitschaft und Wartung der wärmetechnischen Anlagen
  en: Operational readiness and maintenance of heating plant
  fr: Disponibilité et entretien des installations thermiques
  it: Prontezza all'esercizio e manutenzione degli impianti termici
description:
  de: Eigentum oder Betrieb der Anlage sorgen dafür, dass wärmetechnische Anlagen bestimmungsgemäss unterhalten und jederzeit
    betriebsbereit sind.
  en: Owners or operators ensure that heating plant is maintained as intended and is ready for operation at all times.
  fr: Les propriétaires ou exploitants veillent à ce que les installations thermiques soient entretenues conformément et prêtes
    à fonctionner en tout temps.
  it: Proprietà o gestione assicurano che gli impianti termici siano mantenuti come previsto e pronti all'esercizio in ogni
    momento.
rule_status: reviewed
severity: violation
applies_to_elements:
- pragmaticbim:element/mep-boiler
- pragmaticbim:element/mep-pump
- pragmaticbim:element/mep-valve
