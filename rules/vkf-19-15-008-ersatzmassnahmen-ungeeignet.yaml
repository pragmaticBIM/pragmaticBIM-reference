id: pragmaticbim:rule/vkf-19-15-008-ersatzmassnahmen-ungeeignet
code: VKF-19-15-008
sort_order: 160
name:
  de: 'Wasser ungeeignet: Ersatzmassnahmen mit gleichwertigem Schutz im Brandschutzkonzept'
  en: 'Water unsuitable: substitute measures with equivalent protection in the fire protection concept'
  fr: 'Eau inadaptée : mesures de remplacement avec protection équivalente dans le concept de protection incendie'
  it: 'Acqua non idonea: misure sostitutive con protezione equivalente nel concetto di protezione antincendio'
description:
  de: 'Wo Wasser kein geeignetes Löschmittel ist, etwa bei Silos mit quellfähigem Inhalt, Industrieöfen und Bädern mit Gefahrenerhöhung,
    Stoffen die mit Wasser brennbare Gase bilden oder sonstigen gefährdeten Bereichen, werden im Einvernehmen mit der Brandschutzbehörde
    Ersatzmassnahmen mit gleichwertigem Schutz getroffen, etwa Inertisierung, Gaslöschanlage, Schutzhaube oder Abtrennung
    als Brandabschnitt. Bei Trockenanlagen und Zusatzmitteln darf die Ausströmverzögerung die Löschwirkung über die Nennwirkzeit
    nicht schmälern.'
  en: 'Where water is not a suitable extinguishing agent, for example for silos with swelling contents, industrial furnaces
    and baths with increased hazard, substances that form combustible gases with water, or other endangered areas, substitute
    measures with equivalent protection are taken in agreement with the fire protection authority, such as inerting, gas extinguishing
    system, protective hood or separation as a fire compartment. For dry systems and additives, the discharge delay must not
    reduce the extinguishing effect over the nominal operating time.'
  fr: 'Là où l''eau n''est pas un agent extincteur approprié, par exemple pour les silos à contenu gonflant, fours industriels
    et bains avec aggravation du danger, substances formant des gaz combustibles au contact de l''eau ou autres zones menacées,
    des mesures de remplacement offrant une protection équivalente sont prises en accord avec l''autorité de protection incendie,
    telles que l''inertage, une installation d''extinction à gaz, une hotte de protection ou la séparation en compartiment.
    Pour les installations sèches et les additifs, le retard d''écoulement ne doit pas réduire l''effet extincteur sur la
    durée d''action nominale.'
  it: 'Dove l''acqua non è un agente estinguente idoneo, ad esempio per silos con contenuto rigonfiabile, forni industriali
    e bagni con aumento del pericolo, sostanze che con l''acqua formano gas combustibili o altre zone a rischio, si adottano
    d''intesa con l''autorità di protezione antincendio misure sostitutive con protezione equivalente, come inertizzazione,
    impianto di estinzione a gas, cappa di protezione o separazione come compartimento. Per impianti a secco e additivi il
    ritardo di erogazione non deve ridurre l''effetto estinguente sulla durata d''azione nominale.'
