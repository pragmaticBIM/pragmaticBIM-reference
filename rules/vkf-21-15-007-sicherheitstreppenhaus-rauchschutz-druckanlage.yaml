id: pragmaticbim:rule/vkf-21-15-007-sicherheitstreppenhaus-rauchschutz-druckanlage
code: VKF-21-15-007
sort_order: 113
name:
  de: 'Sicherheitstreppenhäuser: Rauchschutz-Druckanlage mit Überdruck gegenüber der Schleuse'
  en: 'Safety stairwells: smoke-protection pressurization system with overpressure against the lock'
  fr: 'Cages d''escalier de sécurité : installation de surpression avec surpression par rapport au sas'
  it: 'Vani scale di sicurezza: impianto di pressurizzazione con sovrappressione rispetto alla camera di compensazione'
description:
  de: 'Treppenräume von Sicherheitstreppenhäusern, die nicht in jedem Geschoss über dauernd ins Freie offene Gänge oder Vorplätze
    erreichbar sind, erhalten eine Rauchschutz-Druckanlage. Im Treppenraum herrscht höherer Überdruck als in der Schleuse.
    Die geschützten Bereiche sind eigene Brandabschnitte; die Anlage startet über Brandmelder selbsttätig, ist von Hand ein-
    und ausschaltbar und wirkt bei Handauslösung nur im Spülbetrieb. Für Aufzugsschächte der Feuerwehr ist ein Leistungsnachweis
    nötig.'
  en: 'Stair enclosures of safety stairwells that are not reached on every storey through permanently open access balconies
    or forecourts get a smoke-protection pressurization system. The stair enclosure holds a higher overpressure than the lock.
    The protected areas are separate fire compartments; the system starts automatically on fire detectors, can be switched
    on and off by hand and acts only in purge mode when started by hand. Fire-brigade lift shafts need a performance proof.'
  fr: 'Les cages de sécurité qui ne sont pas accessibles à chaque étage par des coursives ou parvis constamment ouverts sur
    l''extérieur reçoivent une installation de surpression. La cage est à une surpression plus élevée que le sas. Les zones
    protégées forment des compartiments distincts ; l''installation démarre seule sur détecteurs d''incendie, peut être enclenchée
    et arrêtée à la main et n''agit qu''en mode balayage en cas de commande manuelle. Les gaines d''ascenseur des sapeurs-pompiers
    exigent une preuve de performance.'
  it: 'I vani scale di sicurezza non raggiungibili a ogni piano tramite ballatoi o piazzali costantemente aperti verso l''esterno
    ricevono un impianto di pressurizzazione. Nel vano vige una sovrappressione maggiore che nella camera di compensazione.
    Le zone protette sono compartimenti separati; l''impianto parte da solo su rivelatori d''incendio, può essere acceso e
    spento a mano e con comando manuale agisce solo in modalità lavaggio. Per i vani degli ascensori dei pompieri serve una
    prova di prestazione.'
