id: pragmaticbim:rule/vkf-25-15-018-explosionsgefaehrdet-aggressive-medien
code: VKF-25-15-018
sort_order: 104
name:
  de: Anlagen für explosionsgefährdete Bereiche und aggressive Medien
  en: Systems for explosion-hazard areas and aggressive media
  fr: Installations pour zones à risque d'explosion et milieux agressifs
  it: Impianti per aree a rischio di esplosione e mezzi aggressivi
description:
  de: 'Anlagen für feuer- und explosionsgefährdete Bereiche haben separate Aggregate und Leitungen; stehen die Aggregate in
    einem anderen Bereich, kommen sie in einen eigenen Raum mit dem Feuerwiderstand der Brandabschnittsbildung, mindestens
    EI 60. Aussen und bei Dachdurchführungen halten die Leitungen 0.2 m Abstand zu brennbarem Material; Ventilatoren nahe
    der Ausblasstelle erzeugen keine Funken. Bei aggressiven Medien genügt für luftführende Teile mindestens RF2; brennbare
    Leitungen liegen aussen am Gebäude oder in Schächten mit EI 60 aus RF1 (dauerwärmebeständig).'
  en: 'Systems for fire and explosion hazard areas have separate units and ducts; if the units stand in another area they
    go in their own room with the fire resistance of the compartmentation, at least EI 60. Outside and at roof penetrations
    the ducts keep 0.2 m from combustible material; fans near the discharge point produce no sparks. For aggressive media
    at least RF2 is enough for air-carrying parts; combustible ducts run outside the building or in shafts of EI 60 made of
    RF1 (heat-resistant).'
  fr: 'Les installations pour zones à risque d''incendie et d''explosion ont des centrales et conduits séparés ; si les centrales
    sont dans une autre zone, elles sont dans un local propre ayant la résistance au feu de la compartimentation, au moins
    EI 60. À l''extérieur et aux traversées de toiture, les conduits respectent 0.2 m par rapport aux matériaux combustibles
    ; les ventilateurs près du point de rejet ne produisent pas d''étincelles. Pour les milieux agressifs, RF2 au moins suffit
    pour les éléments véhiculant l''air ; les conduits combustibles sont à l''extérieur du bâtiment ou dans des gaines EI
    60 en RF1 (résistantes à la chaleur durable).'
  it: 'Gli impianti per aree a rischio d''incendio e di esplosione hanno centrali e condotti separati; se le centrali sono
    in un''altra area, stanno in un locale proprio con la resistenza al fuoco della compartimentazione, almeno EI 60. All''esterno
    e agli attraversamenti del tetto i condotti mantengono 0.2 m dai materiali combustibili; i ventilatori vicino al punto
    di scarico non producono scintille. Per i mezzi aggressivi basta almeno RF2 per le parti che veicolano l''aria; i condotti
    combustibili corrono all''esterno dell''edificio o in cavedi EI 60 in RF1 (resistente al calore).'
