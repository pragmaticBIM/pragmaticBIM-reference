id: pragmaticbim:rule/vkf-18-15-006-anordnung-einheitlich-kaesten
code: VKF-18-15-006
sort_order: 129
name:
  de: Einheitliche Anordnung, offene Bereitstellung oder Kasten ohne Schwächung des Feuerwiderstands
  en: Uniform arrangement, open placement or cabinet without weakening the fire resistance
  fr: Disposition uniforme, mise à disposition ouverte ou armoire sans affaiblir la résistance au feu
  it: Disposizione uniforme, collocazione aperta o cassetta senza indebolire la resistenza al fuoco
description:
  de: 'Bei ähnlichen Grundrissen und Raumeinteilungen werden Löschgeräte möglichst einheitlich angeordnet. Sie stehen offen
    oder in separaten Kästen; Unterputzkästen dürfen den Feuerwiderstand brandabschnittsbildender Wände nicht schwächen.'
  en: 'With similar floor plans and room layouts, extinguishers are arranged as uniformly as possible. They stand in the open
    or in separate cabinets; recessed cabinets must not weaken the fire resistance of compartment-forming walls.'
  fr: 'Pour des plans et subdivisions semblables, les extincteurs sont disposés de façon aussi uniforme que possible. Ils
    sont placés à découvert ou dans des armoires séparées ; les armoires encastrées ne doivent pas affaiblir la résistance
    au feu des murs de compartimentage.'
  it: 'Con piante e suddivisioni simili gli estintori sono disposti il più possibile in modo uniforme. Sono collocati a vista
    o in cassette separate; le cassette incassate non devono indebolire la resistenza al fuoco delle pareti di compartimentazione.'
rule_status: reviewed
severity: violation
