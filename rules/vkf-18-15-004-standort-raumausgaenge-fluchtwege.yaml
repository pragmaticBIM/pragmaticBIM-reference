id: pragmaticbim:rule/vkf-18-15-004-standort-raumausgaenge-fluchtwege
code: VKF-18-15-004
sort_order: 127
name:
  de: Löschgeräte nahe Raumausgängen von Fluchtwegen oder in Fluchtwegen
  en: Extinguishers close to room exits that serve as escape routes, or in escape routes
  fr: Extincteurs près des sorties de locaux servant de voie d'évacuation ou dans les voies d'évacuation
  it: Estintori vicino alle uscite dei locali che fungono da via di fuga o nelle vie di fuga
description:
  de: 'Innerhalb von Brandabschnitten stehen Löschgeräte in unmittelbarer Nähe von Raumausgängen, die als Fluchtweg dienen,
    oder in Fluchtwegen wie Korridoren und Vorplätzen.'
  en: 'Within fire compartments, extinguishers are placed in the immediate vicinity of room exits that serve as escape routes,
    or in escape routes such as corridors and forecourts.'
  fr: 'Dans les compartiments, les extincteurs sont placés à proximité immédiate des sorties de locaux servant de voie d''évacuation
    ou dans les voies d''évacuation telles que corridors et parvis.'
  it: 'All''interno dei compartimenti gli estintori sono collocati in prossimità immediata delle uscite dei locali che fungono
    da via di fuga o nelle vie di fuga come corridoi e piazzali.'
