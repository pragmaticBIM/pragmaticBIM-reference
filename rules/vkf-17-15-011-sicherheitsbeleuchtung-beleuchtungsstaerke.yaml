id: pragmaticbim:rule/vkf-17-15-011-sicherheitsbeleuchtung-beleuchtungsstaerke
code: VKF-17-15-011
sort_order: 61
name:
  de: 'Sicherheitsbeleuchtung in Fluchtwegen: mindestens 1 Lux'
  en: 'Safety lighting in escape routes: at least 1 lux'
  fr: 'Éclairage de sécurité dans les voies d''évacuation : au moins 1 lux'
  it: 'Illuminazione di sicurezza nelle vie di fuga: almeno 1 lux'
description:
  de: 'Die Beleuchtungsstärke der Sicherheitsbeleuchtung in Fluchtwegen beträgt mindestens 1 Lux. Geprüft wird SafetyFloorIlluminance
    (>= 1 lx) an Leuchten mit ePset_SafetyLighting.'
  en: 'The illuminance of safety lighting in escape routes is at least 1 lux. The check reads SafetyFloorIlluminance (>=
    1 lx) on luminaires with ePset_SafetyLighting.'
  fr: 'L''éclairement de l''éclairage de sécurité dans les voies d''évacuation est d''au moins 1 lux. La vérification lit
    SafetyFloorIlluminance (>= 1 lx) sur les luminaires avec ePset_SafetyLighting.'
  it: 'L''illuminamento dell''illuminazione di sicurezza nelle vie di fuga è di almeno 1 lux. La verifica legge SafetyFloorIlluminance
    (>= 1 lx) sugli apparecchi con ePset_SafetyLighting.'
rule_status: shacl_defined
severity: violation
applies_to_elements:
- pragmaticbim:element/mep-light-fixture
domain: pragmaticbim:domain/fire-protection
jurisdiction:
- ch
edition: '2015'
valid_from: '2015-01-01'
rule_source:
  regulation: pragmaticbim:regulation/vkf-17-15-2015
  source_document: VKF-Brandschutzrichtlinie 17-15 Kennzeichnung von Fluchtwegen, Sicherheitsbeleuchtung, Sicherheitsstromversorgung
    (2015)
  source_page: 6
  source_quote: VKF 17-15, Ziff. 3.2.4
  extracted_at: '2026-11-21'
reviewed_by: null
reviewed_at: null
shacl: |-
  rule:vkf-17-15-011-sicherheitsbeleuchtung-beleuchtungsstaerke-prefixes
      sh:declare
          [ sh:prefix "pbs" ; sh:namespace "https://schema.pragmaticbim.ch/"^^xsd:anyURI ] ,
          [ sh:prefix "xsd" ; sh:namespace "http://www.w3.org/2001/XMLSchema#"^^xsd:anyURI ] .

  rule:vkf-17-15-011-sicherheitsbeleuchtung-beleuchtungsstaerke a sh:NodeShape ;
      sh:name "Sicherheitsbeleuchtung in Fluchtwegen: mindestens 1 Lux"@de ,
          "Safety lighting in escape routes: at least 1 lux"@en ;
      sh:description "Die Beleuchtungsstärke der Sicherheitsbeleuchtung in Fluchtwegen beträgt mindestens 1 Lux. Geprüft wird SafetyFloorIlluminance (>= 1 lx) an Leuchten mit ePset_SafetyLighting."@de ,
          "The illuminance of safety lighting in escape routes is at least 1 lux. The check reads SafetyFloorIlluminance (>= 1 lx) on luminaires with ePset_SafetyLighting."@en ;
      sh:severity sh:Violation ;
      sh:target [
          a sh:SPARQLTarget ;
          sh:prefixes rule:vkf-17-15-011-sicherheitsbeleuchtung-beleuchtungsstaerke-prefixes ;
          sh:select """
              SELECT DISTINCT ?this WHERE {
                  ?this a pbs:Equipment .
                  ?this pbs:performance_properties ?p .
                  ?p pbs:property_key pbs:fire_property_safety_floor_illuminance ;
                     pbs:property_value_number ?lx .
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-17-15-011-sicherheitsbeleuchtung-beleuchtungsstaerke-prefixes ;
          sh:message "Sicherheitsbeleuchtung unter 1 Lux."@de ,
              "Safety lighting under 1 lux."@en ;
          sh:select """
              SELECT $this WHERE {
                  $this pbs:performance_properties ?p .
                  ?p pbs:property_key pbs:fire_property_safety_floor_illuminance ;
                     pbs:property_value_number ?lx .
                  FILTER (xsd:decimal(?lx) < 1)
              }"""
      ] .
