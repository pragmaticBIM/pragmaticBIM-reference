id: pragmaticbim:rule/vkf-25-15-015-fluchtwege-luftfuehrung-belueftung
code: VKF-25-15-015
sort_order: 101
name:
  de: 'Fluchtwege: keine offene Luftführung, Belüftung getrennt oder mit Brandschutzklappen'
  en: 'Escape routes: no open air routing, ventilation separate or with fire dampers'
  fr: 'Voies d''évacuation : pas de circulation d''air ouverte, ventilation séparée ou avec clapets coupe-feu'
  it: 'Vie di fuga: nessun passaggio d''aria aperto, ventilazione separata o con serrande tagliafuoco'
description:
  de: 'Fluchtwege ersetzen keine Lüftungsleitungen für offene Luftführung. Brandabschnittsbildende Fluchtwege werden grundsätzlich
    getrennt von anderen lufttechnischen Anlagen belüftet; sonst gehören Brandschutzklappen in die brandabschnittsbildenden
    Wände, mit geschossweiser Unterteilung, separaten Leitungen oder separaten Anlagen. Die Klappen haben Kanalrauchmelder
    oder sind an eine bestehende Brandmeldeanlage angeschlossen.'
  en: 'Escape routes do not replace ventilation ducts for open air routing. Compartment-forming escape routes are in principle
    ventilated separately from other ventilation systems; otherwise fire dampers belong in the compartment-forming walls,
    with storey-by-storey subdivision, separate ducts or separate systems. The dampers have duct smoke detectors or are connected
    to an existing fire detection system.'
  fr: 'Les voies d''évacuation ne remplacent pas des conduits de ventilation pour une circulation d''air ouverte. Les voies
    d''évacuation formant un compartiment sont en principe ventilées séparément des autres installations ; sinon des clapets
    coupe-feu sont installés dans les parois de compartimentage, avec subdivision par niveau, conduits séparés ou installations
    séparées. Les clapets ont des détecteurs de fumée de gaine ou sont raccordés à une détection d''incendie existante.'
  it: 'Le vie di fuga non sostituiscono i condotti di ventilazione per un passaggio d''aria aperto. Le vie di fuga che formano
    un compartimento sono di norma ventilate separatamente dagli altri impianti; altrimenti le serrande tagliafuoco vanno
    nelle pareti di compartimentazione, con suddivisione per piano, condotti separati o impianti separati. Le serrande hanno
    rilevatori di fumo da canale o sono collegate a un impianto di rivelazione incendi esistente.'
