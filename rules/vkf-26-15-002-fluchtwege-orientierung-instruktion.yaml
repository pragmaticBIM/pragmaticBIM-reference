id: pragmaticbim:rule/vkf-26-15-002-fluchtwege-orientierung-instruktion
code: VKF-26-15-002
sort_order: 186
name:
  de: Gefährliche Stoffe nicht in Fluchtwegen und vor Ausgängen; Orientierung, Instruktion, Anpassung bei Änderungen
  en: No hazardous substances in escape routes or in front of exits; on-site overview, instruction, adaptation on change
  fr: Pas de substances dangereuses dans les voies d'évacuation ni devant les issues ; orientation, instruction, adaptation
    en cas de changement
  it: Nessuna sostanza pericolosa nelle vie di fuga e davanti alle uscite; orientamento, istruzione, adeguamento in caso di
    modifica
description:
  de: 'Gefährliche Stoffe dürfen weder in Durchgängen oder Durchfahrten, noch in horizontalen und vertikalen Fluchtwegen,
    noch vor Ein- und Ausgängen aufbewahrt werden. Der Betreiber sorgt dafür, dass vor Ort jederzeit erkennbar ist, welche
    Stoffe in welcher Menge wo lagern, instruiert das Personal über Brandgefahren, Verhalten im Brandfall und Alarmierung
    und stellt sicher, dass es Löschgeräte einsetzen kann. Führen Nutzungs-, Lagergut- oder Mengenänderungen zu höherem Risiko,
    werden die Massnahmen angepasst. Noch nicht prüfbar: das Modell weist Stoffklassierung, Lagermenge, Lagerart und Lagerort
    gefährlicher Stoffe nicht aus.'
  en: 'Hazardous substances must not be kept in passages or drive-throughs, in horizontal or vertical escape routes, or in
    front of entrances and exits. The operator ensures that type, quantity and location of substances are recognisable on
    site at all times, instructs staff on fire hazards, behaviour in a fire and alerting, and ensures they can use extinguishing
    equipment. If changes of use, stored goods or quantity raise the risk, the measures are adapted. Not yet checkable: the
    model does not show substance classification, stored quantity, type and location of hazardous substances.'
  fr: 'Les substances dangereuses ne doivent être entreposées ni dans les passages ou passages carrossables, ni dans les voies
    d''évacuation horizontales et verticales, ni devant les entrées et sorties. L''exploitant veille à ce que le type, la
    quantité et l''emplacement des substances soient reconnaissables sur place en tout temps, instruit le personnel sur les
    dangers d''incendie, le comportement en cas d''incendie et l''alarme, et s''assure qu''il sait utiliser les moyens d''extinction.
    Si des changements d''affectation, de marchandises ou de quantités augmentent le risque, les mesures sont adaptées. Pas
    encore vérifiable : le modèle n''indique ni la classification des substances, ni la quantité stockée, ni le mode et le
    lieu de stockage des substances dangereuses.'
  it: 'Le sostanze pericolose non devono essere conservate in passaggi o transiti carrabili, in vie di fuga orizzontali e
    verticali né davanti a entrate e uscite. Il gestore assicura che tipo, quantità e ubicazione delle sostanze siano riconoscibili
    sul posto in ogni momento, istruisce il personale su pericoli d''incendio, comportamento in caso d''incendio e allarme
    e garantisce che sappia usare i mezzi di estinzione. Se cambiamenti di destinazione, merce o quantità aumentano il rischio,
    le misure sono adeguate. Non ancora verificabile: il modello non indica classificazione delle sostanze, quantità stoccata
    né tipo e luogo di stoccaggio delle sostanze pericolose.'
