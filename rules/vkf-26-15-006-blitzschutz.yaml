id: pragmaticbim:rule/vkf-26-15-006-blitzschutz
code: VKF-26-15-006
sort_order: 190
name:
  de: 'Blitzschutz: Gase über 1''000 kg, brennbare Flüssigkeiten über 2''000 l, Reifenlager, Pyrotechnik-Grosslager'
  en: 'Lightning protection: gases above 1,000 kg, combustible liquids above 2,000 l, tyre stores, large pyrotechnic stores'
  fr: 'Protection contre la foudre : gaz au-delà de 1''000 kg, liquides combustibles au-delà de 2''000 l, dépôts de pneus,
    grands dépôts pyrotechniques'
  it: 'Protezione contro i fulmini: gas oltre 1''000 kg, liquidi combustibili oltre 2''000 l, depositi di pneumatici, grandi
    depositi pirotecnici'
description:
  de: 'Bauten und Anlagen mit gefährlichen Stoffen werden gegen Zündgefahr durch Blitzschlag geschützt. Brennbare Gase: bis
    450 kg netto keine Massnahmen, bis 1''000 kg Erdung oder Potenzialausgleich leitender Teile, darüber ein Blitzschutzsystem.
    Brennbare Flüssigkeiten mit Flammpunkt bis 60 °C: bis 450 l nichts, bis 2''000 l Erdung oder Potenzialausgleich, darüber
    ein Blitzschutzsystem. Gebäude mit Reifenlager über 60 t oder 600 m² und Grosslager pyrotechnischer Gegenstände über 300
    kg sind gegen Blitzschlag geschützt.'
  en: 'Buildings and plant holding hazardous substances are protected against ignition by lightning. Combustible gases: up
    to 450 kg net no measures, up to 1,000 kg earthing or equipotential bonding of conductive parts, above that a lightning
    protection system. Combustible liquids with a flash point up to 60 °C: up to 450 l nothing, up to 2,000 l earthing or
    equipotential bonding, above that a lightning protection system. Buildings with a tyre store above 60 t or 600 m² and
    large stores of pyrotechnic articles above 300 kg are protected against lightning.'
  fr: 'Les bâtiments et installations contenant des substances dangereuses sont protégés contre le risque d''inflammation
    par la foudre. Gaz combustibles : jusqu''à 450 kg net aucune mesure, jusqu''à 1''000 kg mise à la terre ou liaison équipotentielle
    des parties conductrices, au-delà un système de protection contre la foudre. Liquides combustibles de point d''éclair
    jusqu''à 60 °C : jusqu''à 450 l rien, jusqu''à 2''000 l mise à la terre ou liaison équipotentielle, au-delà un système
    de protection contre la foudre. Les bâtiments avec dépôt de pneus de plus de 60 t ou 600 m² et les grands dépôts d''articles
    pyrotechniques de plus de 300 kg sont protégés contre la foudre.'
  it: 'Edifici e impianti con sostanze pericolose sono protetti contro il rischio d''innesco da fulmine. Gas combustibili:
    fino a 450 kg netti nessuna misura, fino a 1''000 kg messa a terra o collegamento equipotenziale delle parti conduttrici,
    oltre un sistema di protezione contro i fulmini. Liquidi combustibili con punto d''infiammabilità fino a 60 °C: fino a
    450 l nulla, fino a 2''000 l messa a terra o collegamento equipotenziale, oltre un sistema di protezione contro i fulmini.
    Gli edifici con deposito di pneumatici oltre 60 t o 600 m² e i grandi depositi di articoli pirotecnici oltre 300 kg sono
    protetti contro i fulmini.'
