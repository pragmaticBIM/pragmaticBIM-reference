id: pragmaticbim:rule/vkf-16-15-007-anzahl-vertikale-fluchtwege
code: VKF-16-15-007
sort_order: 7
name:
  de: Anzahl Treppen als vertikale Fluchtwege nach Geschossfläche
  en: Number of stairs as vertical escape routes by floor area
  fr: Nombre d'escaliers comme voies d'évacuation verticales selon la surface d'étage
  it: Numero di scale come vie di fuga verticali secondo la superficie di piano
description:
  de: 'Hat ein Geschoss keine genügenden ebenerdigen Ausgänge ins Freie, braucht es bis 900 m² Geschossfläche mindestens
    einen vertikalen Fluchtweg, bei mehr als 900 m² mindestens zwei. Räume für über 100 Personen sind ebenfalls
    an zwei vertikale Fluchtwege anzuschliessen, falls keine ausreichenden ebenerdigen Ausgänge bestehen. Prüfbarer
    Teil: Räume mit peak_occupancy über 100 brauchen auf demselben Geschoss mindestens zwei Treppenläufe mit
    quantity_type_clear_width.'
  en: 'A storey without sufficient ground-level exits to the outside needs at least one vertical escape route up
    to 900 m² of floor area and at least two above 900 m². Rooms for more than 100 people also need two vertical
    escape routes unless sufficient ground-level exits exist. Checkable part: spaces with peak_occupancy over 100
    need at least two stair flights with quantity_type_clear_width on the same storey.'
  fr: 'Un étage sans sorties suffisantes de plain-pied vers l''extérieur requiert au moins une voie d''évacuation
    verticale jusqu''à 900 m² de surface d''étage et au moins deux au-delà. Les locaux de plus de 100 personnes
    doivent aussi être reliés à deux voies verticales, faute de sorties suffisantes de plain-pied. Partie vérifiable :
    les locaux avec peak_occupancy supérieur à 100 nécessitent au moins deux volées avec quantity_type_clear_width
    sur le même étage.'
  it: 'Un piano senza uscite sufficienti a livello del terreno verso l''esterno richiede almeno una via di fuga
    verticale fino a 900 m² di superficie di piano e almeno due oltre. Anche i locali per più di 100 persone devono
    essere collegati a due vie verticali, se mancano uscite sufficienti a livello del terreno. Parte verificabile:
    locali con peak_occupancy oltre 100 richiedono almeno due rampe con quantity_type_clear_width sullo stesso piano.'
rule_status: shacl_defined
severity: violation
applies_to_elements:
- pragmaticbim:element/storey
- pragmaticbim:element/architecture-stair
- pragmaticbim:element/spaces-interior
domain: pragmaticbim:domain/fire-protection
jurisdiction:
- ch
edition: '2015'
valid_from: '2015-01-01'
rule_source:
  regulation: pragmaticbim:regulation/vkf-16-15-2015
  source_document: VKF-Brandschutzrichtlinie 16-15 Flucht- und Rettungswege (2015)
  source_page: 6
  source_quote: VKF 16-15, Ziff. 2.4.2
  extracted_at: '2026-11-11'
reviewed_by: simon.dilhas@abstract.build
reviewed_at: '2026-11-11'
shacl: |-
  rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes
      sh:declare
          [ sh:prefix "pbs" ; sh:namespace "https://schema.pragmaticbim.ch/"^^xsd:anyURI ] ,
          [ sh:prefix "xsd" ; sh:namespace "http://www.w3.org/2001/XMLSchema#"^^xsd:anyURI ] .

  rule:vkf-16-15-007-anzahl-vertikale-fluchtwege a sh:NodeShape ;
      sh:name "Anzahl Treppen als vertikale Fluchtwege nach Geschossfläche"@de ,
          "Number of stairs as vertical escape routes by floor area"@en ;
      sh:description "Räume für über 100 Personen brauchen zwei vertikale Fluchtwege, falls keine ausreichenden ebenerdigen Ausgänge bestehen. Prüfbarer Teil: peak_occupancy über 100 und mindestens zwei Treppenläufe mit quantity_type_clear_width auf demselben Geschoss."@de ,
          "Rooms for more than 100 people need two vertical escape routes unless sufficient ground-level exits exist. Checkable part: peak_occupancy over 100 and at least two stair flights with quantity_type_clear_width on the same storey."@en ;
      sh:severity sh:Violation ;
      sh:target [
          a sh:SPARQLTarget ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:select """
              SELECT DISTINCT ?this WHERE {
                  ?this a pbs:Space ;
                        pbs:parent_level ?lvl ;
                        pbs:performance_properties ?p .
                  ?p pbs:property_key pbs:indoor_environment_peak_occupancy ;
                     pbs:property_value_number ?n .
                  FILTER (xsd:decimal(?n) > 100)
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:message "Raum für mehr als 100 Personen ohne zwei Treppenläufe auf dem Geschoss."@de ,
              "Space for more than 100 people without two stair flights on the storey."@en ;
          sh:select """
              SELECT $this WHERE {
                  $this a pbs:Space ; pbs:parent_level ?lvl .
                  FILTER NOT EXISTS {
                      ?s1 a pbs:PhysicalElement ; pbs:parent_level ?lvl ; pbs:quantity_values ?q1 .
                      ?q1 pbs:quantity_type pbs:quantity_type_clear_width .
                      ?s2 a pbs:PhysicalElement ; pbs:parent_level ?lvl ; pbs:quantity_values ?q2 .
                      ?q2 pbs:quantity_type pbs:quantity_type_clear_width .
                      FILTER (?s1 != ?s2)
                  }
              }"""
      ] .
