id: pragmaticbim:rule/vkf-16-15-007-anzahl-vertikale-fluchtwege
code: VKF-16-15-007
sort_order: 7
name:
  de: Anzahl Treppen als vertikale Fluchtwege nach Geschossfläche
  en: Number of stairs as vertical escape routes by floor area
  fr: Nombre d'escaliers comme voies d'évacuation verticales selon la surface d'étage
  it: Numero di scale come vie di fuga verticali secondo la superficie di piano
description:
  de: 'Hat ein Geschoss keine genügenden ebenerdigen Ausgänge ins Freie, braucht es bis 900 m² Geschossfläche mindestens
    einen vertikalen Fluchtweg, bei mehr als 900 m² mindestens zwei. Räume für über 100 Personen sind ebenfalls
    an zwei vertikale Fluchtwege anzuschliessen, falls keine ausreichenden ebenerdigen Ausgänge bestehen. Die Prüfung
    liest die Geschossfläche am Geschoss (IfcQuantityArea) und zählt Treppen (IfcStair) je Geschoss; bei PeakOccupancy
    über 100 verlangt sie zwei Treppen. Ob ebenerdige Ausgänge genügen, prüft die Regel nicht.'
  en: 'A storey without sufficient ground-level exits to the outside needs at least one vertical escape route up
    to 900 m² of floor area and at least two above 900 m². Rooms for more than 100 people also need two vertical
    escape routes unless sufficient ground-level exits exist. The check reads the storey floor area (IfcQuantityArea)
    and counts stairs (IfcStair) per storey; for PeakOccupancy above 100 it requires two stairs. It does not judge
    whether ground-level exits are enough.'
  fr: 'Un étage sans sorties suffisantes de plain-pied vers l''extérieur requiert au moins une voie d''évacuation
    verticale jusqu''à 900 m² de surface d''étage et au moins deux au-delà. Les locaux de plus de 100 personnes
    doivent aussi être reliés à deux voies verticales, faute de sorties suffisantes de plain-pied. La vérification
    lit la surface d''étage (IfcQuantityArea) et compte les escaliers (IfcStair) par étage ; au-delà d''un PeakOccupancy
    de 100, elle exige deux escaliers. Elle ne juge pas si les sorties de plain-pied suffisent.'
  it: 'Un piano senza uscite sufficienti a livello del terreno verso l''esterno richiede almeno una via di fuga
    verticale fino a 900 m² di superficie di piano e almeno due oltre. Anche i locali per più di 100 persone devono
    essere collegati a due vie verticali, se mancano uscite sufficienti a livello del terreno. La verifica legge
    la superficie di piano (IfcQuantityArea) e conta le scale (IfcStair) per piano; con PeakOccupancy superiore a
    100 richiede due scale. Non valuta se le uscite a livello del terreno bastano.'
rule_status: shacl_defined
severity: violation
applies_to_elements:
- pragmaticbim:element/storey
- pragmaticbim:element/architecture-stair
domain: pragmaticbim:domain/fire-protection
jurisdiction:
- ch
edition: '2015'
valid_from: '2015-01-01'
rule_source:
  regulation: pragmaticbim:regulation/vkf-16-15-2015
  source_document: VKF-Brandschutzrichtlinie 16-15 Flucht- und Rettungswege (2015)
  source_page: 6
  source_quote: VKF 16-15, Ziff. 2.4.2
  extracted_at: '2026-11-11'
reviewed_by: simon.dilhas@abstract.build
reviewed_at: '2026-11-11'
shacl: |-
  rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes
      sh:declare
          [ sh:prefix "pbs" ; sh:namespace "https://schema.pragmaticbim.ch/"^^xsd:anyURI ] ,
          [ sh:prefix "xsd" ; sh:namespace "http://www.w3.org/2001/XMLSchema#"^^xsd:anyURI ] ,
          [ sh:prefix "ifc" ; sh:namespace "https://w3id.org/ifc/IFC4_ADD2#"^^xsd:anyURI ] .

  rule:vkf-16-15-007-anzahl-vertikale-fluchtwege a sh:NodeShape ;
      sh:name "Anzahl Treppen als vertikale Fluchtwege nach Geschossfläche"@de ,
          "Number of stairs as vertical escape routes by floor area"@en ;
      sh:description "Hat ein Geschoss keine genügenden ebenerdigen Ausgänge ins Freie, braucht es bis 900 m² Geschossfläche mindestens einen vertikalen Fluchtweg, bei mehr als 900 m² mindestens zwei. Räume für über 100 Personen sind ebenfalls an zwei vertikale Fluchtwege anzuschliessen, falls keine ausreichenden ebenerdigen Ausgänge bestehen. Die Prüfung liest die Geschossfläche am Geschoss (IfcQuantityArea) und zählt Treppen (IfcStair) je Geschoss; bei PeakOccupancy über 100 verlangt sie zwei Treppen. Ob ebenerdige Ausgänge genügen, prüft die Regel nicht."@de ,
          "A storey without sufficient ground-level exits to the outside needs at least one vertical escape route up to 900 m² of floor area and at least two above 900 m². Rooms for more than 100 people also need two vertical escape routes unless sufficient ground-level exits exist. The check reads the storey floor area (IfcQuantityArea) and counts stairs (IfcStair) per storey; for PeakOccupancy above 100 it requires two stairs. It does not judge whether ground-level exits are enough."@en ;
      sh:severity sh:Violation ;
      sh:target [
          a sh:SPARQLTarget ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:select """
              SELECT DISTINCT ?this WHERE {
                  { ?this a pbs:LevelContext }
                  UNION
                  {
                      ?this a pbs:Space .
                      ?this pbs:performance_properties ?p .
                      ?p pbs:property_key pbs:indoor_environment_peak_occupancy ;
                         pbs:property_value_number ?occ .
                      FILTER (xsd:decimal(?occ) > 100)
                  }
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:message "Geschoss über 900 m² mit weniger als zwei Treppen als vertikalen Fluchtwegen."@de ,
              "Storey above 900 m² with fewer than two stairs as vertical escape routes."@en ;
          sh:select """
              SELECT $this WHERE {
                  $this a pbs:LevelContext ;
                      pbs:quantity_values ?qv .
                  ?qv pbs:quantity_type ifc:IfcQuantityArea ;
                      pbs:quantity_value ?areaRaw .
                  BIND (xsd:decimal(?areaRaw) AS ?area)
                  FILTER (?area > 900)
                  FILTER NOT EXISTS {
                      ?s1 pbs:connection_physical_type ifc:IfcStair ; pbs:parent_level $this .
                      ?s2 pbs:connection_physical_type ifc:IfcStair ; pbs:parent_level $this .
                      FILTER (?s1 != ?s2)
                  }
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:message "Geschoss bis 900 m² ohne Treppe als vertikalen Fluchtweg."@de ,
              "Storey up to 900 m² without a stair as vertical escape route."@en ;
          sh:select """
              SELECT $this WHERE {
                  $this a pbs:LevelContext ;
                      pbs:quantity_values ?qv .
                  ?qv pbs:quantity_type ifc:IfcQuantityArea ;
                      pbs:quantity_value ?areaRaw .
                  BIND (xsd:decimal(?areaRaw) AS ?area)
                  FILTER (?area > 0 && ?area <= 900)
                  FILTER NOT EXISTS {
                      ?s1 pbs:connection_physical_type ifc:IfcStair ; pbs:parent_level $this .
                  }
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-16-15-007-anzahl-vertikale-fluchtwege-prefixes ;
          sh:message "Raum für mehr als 100 Personen ohne zwei Treppen im Geschoss."@de ,
              "Space for more than 100 people without two stairs on the storey."@en ;
          sh:select """
              SELECT $this WHERE {
                  $this a pbs:Space ;
                      pbs:parent_level ?level ;
                      pbs:performance_properties ?p .
                  ?p pbs:property_key pbs:indoor_environment_peak_occupancy ;
                     pbs:property_value_number ?occ .
                  FILTER (xsd:decimal(?occ) > 100)
                  FILTER NOT EXISTS {
                      ?s1 pbs:connection_physical_type ifc:IfcStair ; pbs:parent_level ?level .
                      ?s2 pbs:connection_physical_type ifc:IfcStair ; pbs:parent_level ?level .
                      FILTER (?s1 != ?s2)
                  }
              }"""
      ] .
