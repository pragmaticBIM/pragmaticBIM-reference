id: pragmaticbim:rule/wbs-2015-009-privater-aussenbereich
code: WBS-2015-009
sort_order: 9
name:
  de: Wohnung verfügt über privaten Aussenbereich nach WBS
  fr: Le logement dispose d'un espace extérieur privé selon le WBS
  it: L'alloggio dispone di spazio esterno privato secondo il WBS
  en: Dwelling has private outdoor area per WBS
description:
  de: 'Der Wohnung sind privat nutzbare Aussenflächen zugeordnet (Balkon, Terrasse, Garten,
    Loggia) mit mindestens der Grundausstattung je Zimmerzahl (3 bis 6 m²). Geprüft wird die
    der UsageUnitReference zugeordnete Aussenfläche.'
  fr: 'Des surfaces extérieures à usage privé (balcon, terrasse, jardin, loggia) sont rattachées
    au logement avec au moins l''équipement de base selon le nombre de pièces (3 à 6 m²). On
    additionne les surfaces extérieures liées à la même UsageUnitReference.'
  it: 'All''alloggio sono assegnate superfici esterne a uso privato (balcone, terrazza, giardino,
    loggia) con almeno la dotazione di base per numero di locali (da 3 a 6 m²). Si sommano le
    superfici esterne con la stessa UsageUnitReference.'
  en: 'The dwelling has privately usable outdoor areas (balcony, terrace, garden, loggia) at
    least at Grundausstattung levels by room count (3 to 6 m²). Sum outdoor areas tied to the
    same UsageUnitReference.'
rule_status: reviewed
severity: violation
applies_to_elements:
- pragmaticbim:element/spaces-interior
- pragmaticbim:element/spaces-exterior
domain: pragmaticbim:domain/architecture
jurisdiction:
