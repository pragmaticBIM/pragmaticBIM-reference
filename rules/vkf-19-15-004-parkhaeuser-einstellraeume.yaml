id: pragmaticbim:rule/vkf-19-15-004-parkhaeuser-einstellraeume
code: VKF-19-15-004
sort_order: 156
name:
  de: 'Parkhäuser und Einstellräume: Sprinkler ab 4''800, 2''400 bzw. 9''600 m² und bei Kompaktparkieren über 50 Fahrzeugen'
  en: 'Car parks and garages: sprinklers from 4,800, 2,400 or 9,600 m² and for compact parking above 50 vehicles'
  fr: 'Parkings et garages : sprinkler dès 4''800, 2''400 resp. 9''600 m² et pour stationnement compact de plus de 50 véhicules'
  it: 'Autorimesse e locali di parcheggio: sprinkler da 4''800, 2''400 risp. 9''600 m² e per parcheggio compatto di oltre
    50 veicoli'
description:
  de: 'Unterirdische Einstellräume brauchen Sprinkler ab 4''800 m² Brandabschnittsfläche je Geschoss, bei mehrgeschossigen
    mit offenen Verbindungen ab 2''400 m². Oberirdische geschlossene Einstellräume brauchen sie ab 4''800 m², teilweise offene
    (Umfassung mit 25 % unverschliessbaren Öffnungen) ab 9''600 m² je Geschoss. Anlagen mit mechanischem Kompaktparkieren
    für mehr als 50 Fahrzeuge brauchen immer eine Sprinkleranlage.'
  en: 'Underground garages need sprinklers from 4,800 m² compartment area per storey, multi-storey ones with open connections
    from 2,400 m². Closed above-ground garages need them from 4,800 m², partly open ones (enclosure with 25 % non-closable
    openings) from 9,600 m² per storey. Installations with mechanical compact parking for more than 50 vehicles always need
    a sprinkler system.'
  fr: 'Les garages souterrains exigent des sprinklers dès 4''800 m² de compartiment par étage, ceux à plusieurs niveaux avec
    liaisons ouvertes dès 2''400 m². Les garages fermés hors sol les exigent dès 4''800 m², les garages partiellement ouverts
    (enveloppe avec 25 % d''ouvertures non obturables) dès 9''600 m² par étage. Les installations de stationnement compact
    mécanique pour plus de 50 véhicules exigent toujours une installation sprinkler.'
  it: 'Le autorimesse interrate richiedono sprinkler da 4''800 m² di compartimento per piano, quelle a più piani con collegamenti
    aperti da 2''400 m². Quelle chiuse fuori terra li richiedono da 4''800 m², quelle parzialmente aperte (involucro con 25
    % di aperture non chiudibili) da 9''600 m² per piano. Gli impianti di parcheggio compatto meccanico per più di 50 veicoli
    richiedono sempre un impianto sprinkler.'
