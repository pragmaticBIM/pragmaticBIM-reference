id: pragmaticbim:rule/vkf-21-15-004-abstroemoeffnung-flaeche-bedienung
code: VKF-21-15-004
sort_order: 110
name:
  de: 'Abströmöffnung am Treppenraum: 0.5 m² frei, von der Eingangsebene bedienbar'
  en: 'Stairwell exhaust opening: 0.5 m² free, operable from the entrance level'
  fr: 'Ouverture d''évacuation de la cage d''escalier : 0.5 m² libre, commandable depuis le niveau d''entrée'
  it: 'Apertura di evacuazione del vano scale: 0.5 m² libera, azionabile dal piano d''ingresso'
description:
  de: 'Die freie geometrische Lüftungsfläche der Abströmöffnung am vertikalen Fluchtweg beträgt mindestens 0.5 m². Sie lässt
    sich von der Eingangsebene aus in Betrieb setzen, und die Betriebsbereitschaft besteht auch bei Stromausfall.'
  en: 'The free geometric ventilation area of the exhaust opening at a vertical escape route is at least 0.5 m². It can be
    put into operation from the entrance level, and it stays operational during a power failure.'
  fr: 'La surface de ventilation géométrique libre de l''ouverture d''évacuation d''une voie d''évacuation verticale est d''au
    moins 0.5 m². Elle peut être mise en service depuis le niveau d''entrée et reste opérationnelle en cas de coupure de courant.'
  it: 'La superficie di ventilazione geometrica libera dell''apertura di evacuazione di una via di fuga verticale è di almeno
    0.5 m². Può essere messa in funzione dal piano d''ingresso e resta operativa anche in caso di interruzione dell''alimentazione.'
rule_status: reviewed
severity: violation
