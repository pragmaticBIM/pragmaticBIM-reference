id: pragmaticbim:rule/vkf-15-15-012-rohrleitungen-abschottungssystem
code: VKF-15-15-012
sort_order: 24
name:
  de: 'Rohrleitungen durch Brandabschnitte: anerkanntes Abschottungssystem'
  en: 'Pipes through compartment components: recognized firestop system'
  fr: 'Conduites à travers les compartiments : système d''obturation reconnu'
  it: 'Tubazioni attraverso i compartimenti: sistema di sigillatura riconosciuto'
description:
  de: 'Wo Rohrleitungen Bauteile durchdringen, die Brandabschnitte bilden, kommt ein VKF-anerkanntes Abschottungssystem
    zum Einsatz, z. B. eine Brandschutzmanschette. Ausnahmen gelten unter anderem für Leitungen aus RF1-Baustoffen, für
    Leitungen in und an feuerwiderstandsfähigen Installationsschächten, für einzelne Rohre bis 50 mm Aussendurchmesser,
    in Bauten geringer und mittlerer Höhe für einzelne Rohre bis 120 mm ohne erhöhte Gefährdung durch Rauch, für hohlraumfrei
    gefüllte Vorwandsysteme der Sanitärinstallation und zwischen Räumen mit Löschanlage. Noch nicht prüfbar: Rohrdurchmesser
    und Leitungsmaterial sind im Modell meist nicht festgelegt.'
  en: 'Where pipes pass through components that form fire compartments, a VKF-recognized firestop system is used, e.g. a
    fire collar. Exceptions apply among others to pipes made of RF1 materials, to pipes entering, leaving or running inside
    fire-resistant installation shafts, to single pipes up to 50 mm outer diameter, in low and medium-height buildings to
    single pipes up to 120 mm where smoke causes no increased risk to people, to cavity-free filled sanitary pre-wall systems,
    and between rooms protected by an extinguishing system. Not yet checkable: pipe diameter and material are mostly not
    defined in the model.'
  fr: 'Lorsque des conduites traversent des éléments formant des compartiments coupe-feu, on utilise un système d''obturation
    reconnu par l''AEAI, p. ex. un collier coupe-feu. Des exceptions valent notamment pour les conduites en matériaux RF1,
    pour les conduites entrant dans, sortant de ou passant à l''intérieur de gaines techniques résistant au feu, pour les
    tuyaux isolés jusqu''à 50 mm de diamètre extérieur, dans les bâtiments de faible et moyenne hauteur pour les tuyaux
    isolés jusqu''à 120 mm sans danger accru dû à la fumée, pour les installations sanitaires préfabriquées remplies sans
    vide, et entre locaux protégés par une installation d''extinction. Pas encore vérifiable : le diamètre et le matériau
    des conduites ne sont généralement pas définis dans le modèle.'
  it: 'Dove le tubazioni attraversano elementi che formano compartimenti antincendio si impiega un sistema di sigillatura
    riconosciuto dall''AICAA, p. es. un collare antincendio. Eccezioni valgono tra l''altro per tubazioni in materiali RF1,
    per tubazioni che entrano, escono o corrono all''interno di cavedi impiantistici resistenti al fuoco, per tubi singoli
    fino a 50 mm di diametro esterno, negli edifici di altezza ridotta e media per tubi singoli fino a 120 mm senza maggior
    pericolo per le persone dovuto al fumo, per prestazioni sanitarie a parete riempite senza vuoti e tra locali protetti
    da un impianto di spegnimento. Non ancora verificabile: diametro e materiale delle tubazioni di solito non sono definiti
    nel modello.'
