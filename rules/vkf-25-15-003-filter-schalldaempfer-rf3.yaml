id: pragmaticbim:rule/vkf-25-15-003-filter-schalldaempfer-rf3
code: VKF-25-15-003
sort_order: 89
name:
  de: Filter und Schalldämpfer mindestens RF3, Filterflüssigkeit Flammpunkt über 160 °C
  en: Filters and silencers at least RF3, filter liquid with flash point above 160 °C
  fr: Filtres et silencieux au moins RF3, liquide de filtre avec point d'éclair supérieur à 160 °C
  it: Filtri e silenziatori almeno RF3, liquido filtrante con punto di infiammabilità superiore a 160 °C
description:
  de: 'Filter und Schalldämpfer bestehen mindestens aus Baustoffen der RF3. Filterflüssigkeiten haben einen Flammpunkt über
    160 °C.'
  en: 'Filters and silencers are made of at least RF3 materials. Filter liquids have a flash point above 160 °C.'
  fr: 'Les filtres et silencieux sont réalisés au moins en matériaux RF3. Les liquides de filtre ont un point d''éclair supérieur
    à 160 °C.'
  it: 'Filtri e silenziatori sono realizzati almeno con materiali RF3. I liquidi filtranti hanno un punto di infiammabilità
    superiore a 160 °C.'
rule_status: reviewed
severity: violation
