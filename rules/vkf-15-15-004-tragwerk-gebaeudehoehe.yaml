id: pragmaticbim:rule/vkf-15-15-004-tragwerk-gebaeudehoehe
code: VKF-15-15-004
sort_order: 13
name:
  de: 'Tragwerk: Feuerwiderstand nach Gebäudehöhe'
  en: 'Structure: fire resistance by building height'
  fr: 'Structure porteuse : résistance au feu selon la hauteur du bâtiment'
  it: 'Struttura portante: resistenza al fuoco secondo l''altezza dell''edificio'
description:
  de: 'Tragende Bauteile brauchen je nach Gebäudehöhe mindestens: geringe Höhe R 30, mittlere Höhe R 60, Hochhaus
    R 90. Mit Sprinkleranlage gelten: geringe Höhe keine Anforderung, mittlere Höhe R 30, Hochhaus R 60. Im obersten
    Geschoss entfällt die Anforderung bei geringer und mittlerer Höhe; bei Hochhäusern sinkt sie dort um 30 Minuten.
    Es sind die tiefsten Werte der Tabellen (z. B. Wohnen, Büro, Schule); andere Nutzungen verlangen teils mehr.
    Ausgenommen sind eingeschossige Bauten, Einfamilienhäuser und Gebäude mit geringen Abmessungen. Die Höhenkategorie
    leitet die Prüfung aus der höchsten Geschosskote ab (über 11 m mittlere Höhe, über 30 m Hochhaus), den Sprinklerschutz
    aus Pset_BuildingCommon.SprinklerProtection; oberstes Geschoss ist das höchste Geschoss mit Räumen.'
  en: 'Load-bearing elements need at least, by building height: low R 30, medium R 60, high-rise R 90. With sprinklers:
    low no requirement, medium R 30, high-rise R 60. In the top storey the requirement falls away for low and medium
    height; in high-rises it drops there by 30 minutes. These are the lowest values of the tables (e.g. housing,
    office, school); other uses partly require more. Single-storey buildings, single-family houses and buildings
    of small dimensions are exempt. The check derives the height category from the highest storey elevation (above
    11 m medium height, above 30 m high-rise) and sprinkler protection from Pset_BuildingCommon.SprinklerProtection;
    the top storey is the highest storey with spaces.'
  fr: 'Les éléments porteurs exigent au moins, selon la hauteur : faible hauteur R 30, hauteur moyenne R 60, tour
    R 90. Avec sprinklers : faible hauteur aucune exigence, hauteur moyenne R 30, tour R 60. À l''étage supérieur,
    l''exigence tombe pour les faibles et moyennes hauteurs ; dans les tours, elle y baisse de 30 minutes. Ce sont
    les valeurs les plus basses des tableaux (p. ex. habitation, bureau, école) ; d''autres affectations exigent
    parfois davantage. Les bâtiments à un niveau, maisons individuelles et bâtiments de faibles dimensions sont
    exemptés. La vérification déduit la catégorie de hauteur de la cote d''étage la plus élevée (plus de 11 m hauteur
    moyenne, plus de 30 m tour) et la protection sprinkler de Pset_BuildingCommon.SprinklerProtection ; l''étage
    supérieur est le plus haut étage comportant des locaux.'
  it: 'Gli elementi portanti richiedono almeno, secondo l''altezza: altezza ridotta R 30, altezza media R 60, edificio
    alto R 90. Con sprinkler: altezza ridotta nessun requisito, altezza media R 30, edificio alto R 60. All''ultimo
    piano il requisito decade per altezza ridotta e media; negli edifici alti vi si riduce di 30 minuti. Sono i
    valori più bassi delle tabelle (p. es. abitazione, ufficio, scuola); altri utilizzi richiedono talvolta di più.
    Sono esclusi gli edifici a un piano, le case unifamiliari e gli edifici di dimensioni ridotte. La verifica deduce
    la categoria d''altezza dalla quota di piano più alta (oltre 11 m altezza media, oltre 30 m edificio alto) e
    la protezione sprinkler da Pset_BuildingCommon.SprinklerProtection; il piano superiore è il piano più alto con
    locali.'
rule_status: shacl_defined
severity: violation
applies_to_elements:
- pragmaticbim:element/structural-wall
- pragmaticbim:element/structural-column
- pragmaticbim:element/structural-beam
- pragmaticbim:element/structural-slab-floor
- pragmaticbim:element/architecture-wall-interior-loadbearing
- pragmaticbim:element/architecture-slab-floor
performance_property_keys:
- pbs:fire_property_resistance_rating
domain: pragmaticbim:domain/fire-protection
jurisdiction:
- CH
rule_source:
  source_document: VKF-Brandschutzrichtlinie 15-15 Brandschutzabstände, Tragwerke, Brandabschnitte (2015)
  source_page: 11
  source_quote: VKF 15-15, Ziff. 3.7.1
  extracted_at: '2026-11-11'
reviewed_by: simon.dilhas@abstract.build
reviewed_at: '2026-11-11'
shacl: |-
  rule:vkf-15-15-004-tragwerk-gebaeudehoehe-prefixes
      sh:declare
          [ sh:prefix "pbs" ; sh:namespace "https://schema.pragmaticbim.ch/"^^xsd:anyURI ] ,
          [ sh:prefix "xsd" ; sh:namespace "http://www.w3.org/2001/XMLSchema#"^^xsd:anyURI ] ,
          [ sh:prefix "ifc" ; sh:namespace "https://w3id.org/ifc/IFC4_ADD2#"^^xsd:anyURI ] .

  rule:vkf-15-15-004-tragwerk-gebaeudehoehe a sh:NodeShape ;
      sh:name "Tragwerk: Feuerwiderstand nach Gebäudehöhe"@de ,
          "Structure: fire resistance by building height"@en ;
      sh:description "Tragende Bauteile brauchen je nach Gebäudehöhe mindestens: geringe Höhe R 30, mittlere Höhe R 60, Hochhaus R 90. Mit Sprinkleranlage gelten: geringe Höhe keine Anforderung, mittlere Höhe R 30, Hochhaus R 60. Im obersten Geschoss entfällt die Anforderung bei geringer und mittlerer Höhe; bei Hochhäusern sinkt sie dort um 30 Minuten. Es sind die tiefsten Werte der Tabellen (z. B. Wohnen, Büro, Schule); andere Nutzungen verlangen teils mehr. Ausgenommen sind eingeschossige Bauten, Einfamilienhäuser und Gebäude mit geringen Abmessungen. Die Höhenkategorie leitet die Prüfung aus der höchsten Geschosskote ab (über 11 m mittlere Höhe, über 30 m Hochhaus), den Sprinklerschutz aus Pset_BuildingCommon.SprinklerProtection; oberstes Geschoss ist das höchste Geschoss mit Räumen."@de ,
          "Load-bearing elements need at least, by building height: low R 30, medium R 60, high-rise R 90. With sprinklers: low no requirement, medium R 30, high-rise R 60. In the top storey the requirement falls away for low and medium height; in high-rises it drops there by 30 minutes. These are the lowest values of the tables (e.g. housing, office, school); other uses partly require more. Single-storey buildings, single-family houses and buildings of small dimensions are exempt. The check derives the height category from the highest storey elevation (above 11 m medium height, above 30 m high-rise) and sprinkler protection from Pset_BuildingCommon.SprinklerProtection; the top storey is the highest storey with spaces."@en ;
      sh:severity sh:Violation ;
      sh:target [
          a sh:SPARQLTarget ;
          sh:prefixes rule:vkf-15-15-004-tragwerk-gebaeudehoehe-prefixes ;
          sh:select """
              SELECT DISTINCT ?this WHERE {
                  ?this pbs:performance_properties ?lb .
                  ?lb pbs:property_key pbs:structural_property_load_bearing ; pbs:property_value_boolean true .
                  {
                      ?this a pbs:SeparatorWall .
                  } UNION {
                      ?this a pbs:SeparatorSlab .
                      FILTER NOT EXISTS { ?this pbs:separator_slab_type <https://w3id.org/ifc/IFC4_ADD2#IfcSlabTypeEnum.BASESLAB> }
                  } UNION {
                      ?this pbs:connection_physical_type ?type .
                      FILTER (?type IN (ifc:IfcBeam, ifc:IfcColumn))
                  }
              }"""
      ] ;
      sh:sparql [
          a sh:SPARQLConstraint ;
          sh:prefixes rule:vkf-15-15-004-tragwerk-gebaeudehoehe-prefixes ;
          sh:message "Tragendes Bauteil mit Feuerwiderstand {?ratingDe}; erforderlich mindestens R {?required} ({?categoryDe}{?concept})."@de ,
          "Load-bearing element with fire resistance {?rating}; required at least R {?required} ({?categoryEn}{?concept})."@en ;
          sh:select """
              SELECT $this ?rating ?ratingDe ?required ?categoryDe ?categoryEn ?concept WHERE {
                  $this pbs:parent_level ?level .
                  ?level pbs:elevation ?elevation .
                  { SELECT (MAX(?le) AS ?maxElevation) (MIN(?le) AS ?minElevation) WHERE { ?l a pbs:LevelContext ; pbs:elevation ?le } }
                  OPTIONAL { SELECT (MAX(?se) AS ?topSpaceElevation) WHERE { ?s a pbs:Space ; pbs:parent_level ?sl . ?sl pbs:elevation ?se } }
                  BIND (EXISTS {
                      ?b a pbs:BuildingContext ; pbs:metadata ?bm .
                      ?bm pbs:metadata_key "Pset_BuildingCommon.SprinklerProtection" ; pbs:metadata_value ?bv .
                      FILTER (LCASE(STR(?bv)) = "true")
                  } AS ?sprinkler)
                  BIND (COALESCE(?topSpaceElevation, ?maxElevation) AS ?topStorey)
                  BIND (IF(?maxElevation > 30, 3, IF(?maxElevation > 11, 2, 1)) AS ?category)
                  BIND (IF(?category = 3, "Hochhaus", IF(?category = 2, "mittlere Höhe", "geringe Höhe")) AS ?categoryDe)
                  BIND (IF(?category = 3, "high-rise", IF(?category = 2, "medium height", "low height")) AS ?categoryEn)
                  BIND (IF(?sprinkler, ", Sprinkler", "") AS ?concept)
                  BIND (?elevation >= ?topStorey AS ?isTop)
                  FILTER (?elevation > ?minElevation || NOT EXISTS { $this a pbs:SeparatorSlab })
                  BIND (IF(?isTop, IF(?category = 3, IF(?sprinkler, 30, 60), 0), IF(?category = 3, IF(?sprinkler, 60, 90), IF(?category = 2, IF(?sprinkler, 30, 60), IF(?sprinkler, 0, 30)))) AS ?required)
                  FILTER (?required > 0)
                  OPTIONAL {
                      $this pbs:performance_properties ?f .
                      ?f pbs:property_key pbs:fire_property_resistance_rating ; pbs:property_value_string ?r .
                      FILTER (REGEX(?r, "^(R|RE|REI|F)[0-9]+$"))
                  }
                  BIND (IF(BOUND(?r), xsd:integer(REPLACE(?r, "^[A-Z]+", "")), 0) AS ?minutes)
                  FILTER (?minutes < ?required)
                  BIND (COALESCE(?r, "none") AS ?rating)
                  BIND (COALESCE(?r, "keine Angabe") AS ?ratingDe)
              }"""
      ] .
