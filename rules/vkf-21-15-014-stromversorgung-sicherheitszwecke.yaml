id: pragmaticbim:rule/vkf-21-15-014-stromversorgung-sicherheitszwecke
code: VKF-21-15-014
sort_order: 120
name:
  de: Stromversorgung für Sicherheitszwecke unabhängig vom allgemeinen Netz
  en: Power supply for safety purposes independent of the general supply
  fr: Alimentation de sécurité indépendante du réseau général
  it: Alimentazione di sicurezza indipendente dalla rete generale
description:
  de: 'Rauch- und Wärmeabzugsanlagen und Rauchschutz-Druckanlagen werden an geeignete Stromquellen angeschlossen, die von
    der allgemeinen Stromversorgung unabhängig sind.'
  en: 'Smoke and heat exhaust systems and smoke-protection pressurization systems are connected to suitable power sources
    that are independent of the general power supply.'
  fr: 'Les installations d''évacuation de fumée et de chaleur et les installations de surpression sont raccordées à des sources
    d''énergie appropriées, indépendantes de l''alimentation générale.'
  it: 'Gli impianti di evacuazione di fumo e calore e gli impianti di pressurizzazione sono collegati a fonti di energia idonee,
    indipendenti dall''alimentazione generale.'
rule_status: reviewed
severity: violation
