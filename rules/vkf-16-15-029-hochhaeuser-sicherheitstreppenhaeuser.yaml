id: pragmaticbim:rule/vkf-16-15-029-hochhaeuser-sicherheitstreppenhaeuser
code: VKF-16-15-029
sort_order: 85
name:
  de: 'Hochhäuser: Sicherheitstreppenhäuser mit Schleusen'
  en: 'High-rise buildings: safety stairwells with airlocks'
  fr: 'Immeubles de grande hauteur : cages d''escalier de sécurité avec sas'
  it: 'Edifici alti: vani scale di sicurezza con filtri'
description:
  de: 'In Hochhäusern werden Geschosse über Terrain mit Sicherheitstreppenhäusern erschlossen. Das sind vertikale Fluchtwege,
    die gegen das Eindringen von Rauch und Feuer besonders geschützt sind (Rauchschutz-Druckanlage). Die Dachfläche muss von
    einem Sicherheitstreppenhaus aus zugänglich sein. Innenliegende Sicherheitstreppenhäuser werden auf jedem Geschoss über
    eine unmittelbar vorgelagerte Schleuse mit Grundrissmassen von mindestens 1.2 m × 2.4 m betreten, deren Türen selbstschliessend
    sind. Bei Erschliessung über ständig ins Freie offene Vorplätze oder Gänge braucht es keine Schleuse. Mit Feuerwehraufzug
    muss die Schleuse oder der Vorplatz davor gemäss Anhang mindestens 2.4 m × 2.4 m messen.'
  en: 'In high-rise buildings, storeys above ground are served by safety stairwells. These are vertical escape routes specially
    protected against the entry of smoke and fire (pressurized smoke control system). The roof must be accessible from a safety
    stairwell. Internal safety stairwells are entered on every storey through an airlock directly in front with a plan size
    of at least 1.2 m × 2.4 m, whose doors are self-closing. No airlock is needed where access is through forecourts or corridors
    permanently open to the outside. With a firefighters'' lift, the airlock or forecourt in front of it must, according to
    the appendix, measure at least 2.4 m × 2.4 m.'
  fr: 'Dans les immeubles de grande hauteur, les étages hors sol sont desservis par des cages d''escalier de sécurité. Il
    s''agit de voies d''évacuation verticales particulièrement protégées contre la pénétration de fumée et de feu (installation
    de surpression). La toiture doit être accessible depuis une cage d''escalier de sécurité. Les cages d''escalier de sécurité
    intérieures s''abordent à chaque étage par un sas situé immédiatement devant, d''au moins 1,2 m × 2,4 m en plan, dont
    les portes sont à fermeture automatique. Un accès par des parvis ou couloirs en permanence ouverts sur l''extérieur ne
    nécessite pas de sas. Avec un ascenseur pompiers, le sas ou le parvis devant celui-ci doit, selon l''annexe, mesurer au
    moins 2,4 m × 2,4 m.'
  it: 'Negli edifici alti i piani fuori terra sono serviti da vani scale di sicurezza. Si tratta di vie di fuga verticali
    particolarmente protette contro l''ingresso di fumo e fuoco (impianto di sovrapressione). Il tetto deve essere accessibile
    da un vano scale di sicurezza. I vani scale di sicurezza interni si raggiungono a ogni piano tramite un filtro posto immediatamente
    davanti, con dimensioni in pianta di almeno 1,2 m × 2,4 m, le cui porte sono a chiusura automatica. Se l''accesso avviene
    tramite piazzali o corridoi permanentemente aperti verso l''esterno, non serve il filtro. Con un ascensore antincendio
    il filtro o il piazzale davanti a esso deve, secondo l''allegato, misurare almeno 2,4 m × 2,4 m.'
