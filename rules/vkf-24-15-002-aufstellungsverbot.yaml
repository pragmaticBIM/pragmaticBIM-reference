id: pragmaticbim:rule/vkf-24-15-002-aufstellungsverbot
code: VKF-24-15-002
sort_order: 167
name:
  de: Aufstellungsverbot für Wärmeerzeuger in Fluchtwegen, explosionsgefährdeten Räumen und Räumen mit grosser Brandbelastung
  en: Ban on installing heat generators in escape routes, explosion-hazard rooms and rooms with high fire load
  fr: Interdiction d'installer des générateurs de chaleur dans les voies d'évacuation, locaux explosifs et locaux à forte
    charge calorifique
  it: Divieto di installare generatori di calore in vie di fuga, locali a rischio di esplosione e locali con alto carico d'incendio
description:
  de: 'Wärmeerzeugungsaggregate dürfen nicht in Fluchtwegen, in feuer- oder explosionsgefährdeten Räumen und Zonen sowie in
    Räumen mit grosser und sehr grosser Brandbelastung aufgestellt werden.'
  en: 'Heat generators must not be installed in escape routes, in rooms and zones with fire or explosion hazard, or in rooms
    with large and very large fire load.'
  fr: 'Les générateurs de chaleur ne doivent pas être installés dans les voies d''évacuation, dans les locaux et zones présentant
    un danger d''incendie ou d''explosion, ni dans les locaux à charge calorifique grande ou très grande.'
  it: 'I generatori di calore non devono essere installati in vie di fuga, in locali e zone con pericolo d''incendio o di
    esplosione né in locali con carico d''incendio grande o molto grande.'
