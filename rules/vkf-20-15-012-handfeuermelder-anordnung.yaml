id: pragmaticbim:rule/vkf-20-15-012-handfeuermelder-anordnung
code: VKF-20-15-012
sort_order: 149
name:
  de: Handfeuermelder in Fluchtwegen und gefährdeten Bereichen, gut sichtbar, Montagehöhe etwa 1.5 m
  en: Manual call points in escape routes and hazardous areas, clearly visible, mounting height about 1.5 m
  fr: Avertisseurs manuels dans les voies d'évacuation et zones à risque, bien visibles, hauteur de montage env. 1.5 m
  it: Pulsanti manuali nelle vie di fuga e nelle zone a rischio, ben visibili, altezza di montaggio circa 1.5 m
description:
  de: 'Handfeuermelder werden in Fluchtwegen, etwa bei Ausgängen, Durchgängen, vertikalen Fluchtwegen und Löschgeräten, und
    in besonders gefährdeten Bereichen gut sichtbar angebracht. Sie sind nicht mit Lichtschaltern oder Liftknöpfen zu verwechseln,
    vor mechanischer Beschädigung geschützt und etwa 1.5 m hoch montiert; bei zu erwartendem Missbrauch ist ein plombierbarer,
    transparenter Deckel möglich.'
  en: 'Manual call points are fitted clearly visibly in escape routes, for example at exits, passages, vertical escape routes
    and extinguishers, and in particularly hazardous areas. They cannot be mistaken for light switches or lift buttons, are
    protected from mechanical damage and are mounted about 1.5 m high; where misuse is expected a sealable transparent cover
    is possible.'
  fr: 'Les avertisseurs manuels sont placés bien visibles dans les voies d''évacuation, par exemple près des sorties, passages,
    voies verticales et extincteurs, et dans les zones particulièrement exposées. Ils ne peuvent pas être confondus avec des
    interrupteurs ou boutons d''ascenseur, sont protégés contre les dommages mécaniques et montés à env. 1.5 m de hauteur
    ; en cas d''abus prévisible, un couvercle transparent plombable est possible.'
  it: 'I pulsanti manuali sono collocati ben visibili nelle vie di fuga, ad esempio presso uscite, passaggi, vie di fuga verticali
    ed estintori, e nelle zone particolarmente a rischio. Non possono essere confusi con interruttori della luce o pulsanti
    dell''ascensore, sono protetti da danni meccanici e montati a circa 1.5 m di altezza; dove si prevede un uso improprio
    è possibile un coperchio trasparente piombabile.'
