id: pragmaticbim:rule/vkf-26-15-010-kryobehaelter-fluessiggas
code: VKF-26-15-010
sort_order: 194
name:
  de: Kryobehälter im Freien mit 5 m Schutzbereich EI 60; Flüssiggas nicht in Untergeschossen
  en: Cryogenic tanks outdoors with a 5 m protected zone EI 60; liquefied petroleum gas not in basements
  fr: Réservoirs cryogéniques à l'extérieur avec zone de protection de 5 m EI 60 ; gaz liquéfié pas en sous-sol
  it: Serbatoi criogenici all'aperto con zona di protezione di 5 m EI 60; gas liquefatto non nei piani interrati
description:
  de: 'Kryobehälter (vakuumisolierte Behälter für tiefkalt verflüssigte oxidierende oder erstickende Gase) stehen im Freien
    und nicht in Vertiefungen. Im Umkreis von 5 m um Kryobehälter mit oxidierenden Gasen sind Gebäudefassaden öffnungslos,
    standfest und mindestens EI 60 aus Baustoffen der RF1, und es liegen keine brennbaren Materialien; eine geeignete Schirmmauer
    kann den Abstand verringern. Flüssiggas (LPG) wird nicht in Untergeschossen gelagert.'
  en: 'Cryogenic tanks (vacuum-insulated tanks for deep-cooled liquefied oxidising or asphyxiant gases) stand outdoors and
    not in depressions. Within 5 m of cryogenic tanks with oxidising gases, building facades are free of openings, stable
    and at least EI 60 of RF1 materials, and no combustible materials are present; a suitable screen wall can reduce the distance.
    Liquefied petroleum gas (LPG) is not stored in basement storeys.'
  fr: 'Les réservoirs cryogéniques (réservoirs isolés sous vide pour gaz comburants ou asphyxiants liquéfiés à basse température)
    sont installés à l''extérieur et pas dans des dépressions. Dans un rayon de 5 m autour des réservoirs de gaz comburants,
    les façades sont sans ouverture, stables et au moins EI 60 en matériaux RF1, et aucun matériau combustible n''est présent
    ; un mur écran approprié peut réduire la distance. Le gaz liquéfié (GPL) n''est pas stocké en sous-sol.'
  it: 'I serbatoi criogenici (serbatoi isolati sotto vuoto per gas comburenti o asfissianti liquefatti a bassa temperatura)
    stanno all''aperto e non in avvallamenti. Entro 5 m dai serbatoi con gas comburenti le facciate sono prive di aperture,
    stabili e almeno EI 60 in materiali RF1 e non vi sono materiali combustibili; un idoneo muro schermo può ridurre la distanza.
    Il gas liquefatto (GPL) non è stoccato nei piani interrati.'
