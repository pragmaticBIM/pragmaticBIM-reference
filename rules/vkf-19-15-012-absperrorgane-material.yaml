id: pragmaticbim:rule/vkf-19-15-012-absperrorgane-material
code: VKF-19-15-012
sort_order: 164
name:
  de: Absperrorgane nur in der Sprinklerzentrale; geprüfte Komponenten
  en: Shut-off valves only in the sprinkler control room; tested components
  fr: Organes d'arrêt uniquement dans la centrale sprinkler ; composants contrôlés
  it: Organi di intercettazione solo nella centrale sprinkler; componenti verificati
description:
  de: 'Alle Anlageteile bestehen aus geeigneten Werkstoffen und halten den Beanspruchungen stand; verwendet werden nur Sprinklerkomponenten
    mit Leistungserklärung oder VKF-Technischer Auskunft. Zusatzmittel im Löschwasser brauchen neben der Brandschutz- auch
    eine Gewässerschutzbewilligung. Ausserhalb der Sprinklerzentrale werden grundsätzlich keine Absperrorgane eingebaut; mit
    Einwilligung der Behörde sind sie zulässig, wenn Fehlmanipulation ausgeschlossen ist und der geschlossene Zustand auf
    der Brandmeldeanlage sichtbar ist. Noch nicht prüfbar: das Modell enthält keine Sprinkleranlage als System mit Schutzumfang,
    Kontrollstation und Wasserversorgung.'
  en: 'All plant parts are made of suitable materials and withstand the stresses; only sprinkler components with a declaration
    of performance or VKF technical information are used. Additives in the extinguishing water need a water-protection approval
    in addition to the fire protection one. Outside the sprinkler control room no shut-off valves are installed in principle;
    with the authority''s consent they are permitted if mis-operation is excluded and the closed state is visible on the fire
    alarm system. Not yet checkable: the model holds no sprinkler system with protected extent, control station and water
    supply.'
  fr: 'Tous les éléments sont en matériaux appropriés et résistent aux sollicitations ; seuls des composants sprinkler avec
    déclaration des performances ou renseignement technique de l''AEAI sont utilisés. Les additifs dans l''eau d''extinction
    exigent, outre l''autorisation de protection incendie, une autorisation de protection des eaux. En dehors de la centrale
    sprinkler, aucun organe d''arrêt n''est en principe installé ; avec l''accord de l''autorité, ils sont admis si une fausse
    manœuvre est exclue et que l''état fermé est visible sur la détection incendie. Pas encore vérifiable : le modèle ne contient
    aucune installation sprinkler avec étendue de protection, poste de contrôle ni alimentation en eau.'
  it: 'Tutte le parti sono di materiali idonei e resistono alle sollecitazioni; si usano solo componenti sprinkler con dichiarazione
    di prestazione o informazione tecnica AICAA. Gli additivi nell''acqua di estinzione richiedono, oltre all''autorizzazione
    antincendio, un''autorizzazione di protezione delle acque. Fuori dalla centrale sprinkler di principio non si installano
    organi di intercettazione; con il consenso dell''autorità sono ammessi se è escluso un errore di manovra e lo stato chiuso
    è visibile sulla rivelazione incendio. Non ancora verificabile: il modello non contiene alcun impianto sprinkler con estensione
    di protezione, stazione di controllo e alimentazione idrica.'
