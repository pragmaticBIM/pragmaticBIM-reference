id: pragmaticbim:rule/vkf-25-15-010-durchfuehrung-abschottung
code: VKF-25-15-010
sort_order: 96
name:
  de: 'Leitungsdurchführung durch brandabschnittsbildende Bauteile: Abschottung EI 30 oder RF1-Verschluss'
  en: 'Duct penetration through compartment-forming components: firestop EI 30 or RF1 filling'
  fr: 'Traversée de conduits dans les éléments de compartimentage : obturation EI 30 ou remplissage RF1'
  it: 'Passaggio di condotti attraverso elementi di compartimentazione: sigillatura EI 30 o riempimento RF1'
description:
  de: 'Die Aussparung zwischen Lüftungsleitung und brandabschnittsbildendem Bauteil wird unter Berücksichtigung der Wärmedehnung
    entweder dicht mit RF1-Baustoffen (z. B. Mörtel, Gips) gefüllt oder mit einem Abschottungssystem verschlossen, das bei
    brandabschnittsbildenden Wänden und Decken EI 30 erreicht. Bei Räumen oder Brandabschnitten mit grosser Brandbelastung
    oder Brandgefahr hat das Abschottungssystem denselben Feuerwiderstand wie die umgebenden Wände und Decken.'
  en: 'The recess between the ventilation duct and the compartment-forming component is, allowing for thermal expansion, either
    filled tightly with RF1 materials (e.g. mortar, plaster) or closed with a firestop system that reaches EI 30 in compartment-forming
    walls and floors. For rooms or compartments with a high fire load or fire hazard, the firestop system has the same fire
    resistance as the surrounding walls and floors.'
  fr: 'L''évidement entre le conduit de ventilation et l''élément de compartimentage est, compte tenu de la dilatation thermique,
    soit comblé de manière étanche avec des matériaux RF1 (p. ex. mortier, plâtre), soit fermé par un système d''obturation
    atteignant EI 30 dans les murs et planchers de compartimentage. Pour les locaux ou compartiments à forte charge ou danger
    d''incendie, le système d''obturation a la même résistance au feu que les murs et planchers environnants.'
  it: 'Il vano tra il condotto di ventilazione e l''elemento di compartimentazione è, tenendo conto della dilatazione termica,
    riempito a tenuta con materiali RF1 (p. es. malta, gesso) oppure chiuso con un sistema di sigillatura che raggiunge EI
    30 in pareti e solai di compartimentazione. Per locali o compartimenti con elevato carico o pericolo d''incendio il sistema
    di sigillatura ha la stessa resistenza al fuoco delle pareti e dei solai circostanti.'
