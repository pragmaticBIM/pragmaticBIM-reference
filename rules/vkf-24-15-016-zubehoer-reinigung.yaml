id: pragmaticbim:rule/vkf-24-15-016-zubehoer-reinigung
code: VKF-24-15-016
sort_order: 181
name:
  de: Explosionsklappen, Abgasventilatoren und Reinigungsöffnungen
  en: Explosion flaps, flue fans and cleaning openings
  fr: Clapets d'explosion, ventilateurs de fumées et ouvertures de nettoyage
  it: Serrande antiscoppio, ventilatori fumi e aperture di pulizia
description:
  de: 'Bei Brennstoffen, die zu Verpuffungen neigen, etwa feinkörniger Kohle oder Holzspänen, gehören Explosionsklappen in
    die Abgasanlage, im Heizraum nahe der Verbindungsrohreinführung und mindestens im Querschnitt der Abgasanlage. Abgasventilatoren
    erzeugen nur dann Überdruck, wenn die Anlage dafür anerkannt ist. Abgasanlagen haben Öffnungen für Kontrolle und Reinigung,
    Zubehör ist dafür leicht entfernbar; in feuer- oder explosionsgefährdeten Räumen sind solche Öffnungen nicht zulässig.'
  en: 'For fuels prone to deflagration, such as fine-grained coal or wood chips, explosion flaps belong in the flue system,
    in the boiler room close to the connecting pipe entry and at least the cross-section of the flue. Flue fans create positive
    pressure only if the system is approved for it. Flue systems have openings for inspection and cleaning, accessories can
    be removed easily; in rooms with fire or explosion hazard such openings are not permitted.'
  fr: 'Pour les combustibles enclins aux déflagrations, comme le charbon fin ou les copeaux de bois, des clapets d''explosion
    sont posés dans l''installation, dans le local de chauffe près de l''entrée du tuyau de raccordement et au moins de la
    section du conduit. Les ventilateurs de fumées ne créent une surpression que si l''installation y est reconnue. Les conduits
    ont des ouvertures de contrôle et de nettoyage, les accessoires sont facilement démontables ; dans les locaux à danger
    d''incendie ou d''explosion, de telles ouvertures ne sont pas admises.'
  it: 'Per combustibili inclini a deflagrazioni, come carbone fine o trucioli di legno, nell''impianto vanno serrande antiscoppio,
    nel locale caldaia vicino all''ingresso del tubo di raccordo e almeno della sezione dell''impianto. I ventilatori fumi
    creano sovrappressione solo se l''impianto è riconosciuto per questo. Gli impianti hanno aperture per controllo e pulizia,
    gli accessori sono facilmente rimovibili; nei locali a pericolo d''incendio o d''esplosione tali aperture non sono ammesse.'
