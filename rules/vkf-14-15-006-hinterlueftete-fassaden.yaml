id: pragmaticbim:rule/vkf-14-15-006-hinterlueftete-fassaden
code: VKF-14-15-006
sort_order: 41
name:
  de: 'Hinterlüftete Fassaden: anerkannte Konstruktion, Unterkonstruktion RF3, Befestigungen RF2'
  en: 'Ventilated facades: recognized construction, substructure RF3, fixings RF2'
  fr: 'Façades ventilées : construction reconnue, sous-construction RF3, fixations RF2'
  it: 'Facciate ventilate: costruzione riconosciuta, sottostruttura RF3, fissaggi RF2'
description:
  de: 'Hinterlüftete Fassaden an Gebäuden mittlerer Höhe, deren Bekleidung oder Dämmung im Hinterlüftungsbereich brennbar
    ist, sind VKF-anerkannte oder gleichwertige Konstruktionen. An Gebäuden geringer und mittlerer Höhe genügen stabförmige
    Unterkonstruktionen aus RF3-Baustoffen. Punktuelle Befestigungen und Rückverankerungen innerhalb der Dämmung bestehen
    bei allen Gebäudehöhen mindestens aus RF2-Baustoffen.'
  en: 'Ventilated facades on medium-height buildings whose cladding or insulation in the ventilated cavity is combustible
    are VKF-recognized or equivalent constructions. On low and medium-height buildings, rod-shaped substructures made of
    RF3 materials suffice. Point fixings and back-anchorages inside the insulation are made of at least RF2 materials at
    all building heights.'
  fr: 'Les façades ventilées de bâtiments de hauteur moyenne dont le revêtement ou l''isolation dans la lame d''air est
    combustible sont des constructions reconnues par l''AEAI ou équivalentes. Sur les bâtiments de faible et moyenne hauteur,
    des sous-constructions linéaires en matériaux RF3 suffisent. Les fixations ponctuelles et ancrages dans l''isolation
    sont en matériaux RF2 au moins, à toutes les hauteurs de bâtiment.'
  it: 'Le facciate ventilate di edifici di altezza media, il cui rivestimento o isolamento nell''intercapedine è combustibile,
    sono costruzioni riconosciute dall''AICAA o equivalenti. Su edifici di altezza ridotta e media bastano sottostrutture
    lineari in materiali RF3. I fissaggi puntuali e gli ancoraggi all''interno dell''isolamento sono in materiali almeno
    RF2 a tutte le altezze.'
