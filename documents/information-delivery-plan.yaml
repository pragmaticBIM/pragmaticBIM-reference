id: pragmaticbim:document/information-delivery-plan
code: LFP
sort_order: 130
name:
  de: Lieferplan / IDP
  fr: Plan de livraison / IDP
  it: Piano di consegna / IDP
  en: Delivery plan / IDP
definition:
  de: Steuerungsinstrument der Projektleitung. Es hält fest, welche Information in welchem Container, in welcher Form, von wem und bis wann geliefert wird. Die ISO 19650 nennt ihn Information Delivery Plan (IDP).
  fr: Instrument de pilotage de la direction de projet. Il fixe quelle information est livrée dans quel conteneur, sous quelle forme, par qui et pour quand. L'ISO 19650 l'appelle Information Delivery Plan (IDP).
  it: Strumento di gestione della direzione di progetto. Stabilisce quale informazione viene consegnata in quale contenitore, in quale forma, da chi e entro quando. La ISO 19650 lo chiama Information Delivery Plan (IDP).
  en: A management instrument of project management. It sets which information is delivered in which container, in what form, by whom, and by when. ISO 19650 calls it an Information Delivery Plan (IDP).
description:
  de: |-
    - Container je Lieferung
    - Anwendungsfall, der die Lieferung verwendet
    - Verantwortlicher Fachbereich
    - Termin oder Meilenstein
    - Format, bei Modellen mit Bezug zu Elementen und Attributen
    - Prüfgrundlage sowie Versions- und Abgleichstand
  fr: |-
    - Conteneur par livraison
    - Cas d'application qui utilise la livraison
    - Discipline responsable
    - Échéance ou jalon
    - Format, pour les modèles avec lien aux éléments et aux attributs
    - Base de contrôle ainsi qu'état de version et d'alignement
  it: |-
    - Contenitore per consegna
    - Caso d'applicazione che utilizza la consegna
    - Disciplina responsabile
    - Scadenza o traguardo
    - Formato, per i modelli con riferimento a elementi e attributi
    - Base di verifica nonché stato di versione e di allineamento
  en: |-
    - Container for each delivery
    - Use case that uses the delivery
    - Responsible discipline
    - Date or milestone
    - Format, and for models the link to elements and attributes
    - Check basis, together with version and alignment status
file_name:
