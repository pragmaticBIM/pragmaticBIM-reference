id: pragmaticbim:document/usage-concept
code: NZK
sort_order: 127
name:
  de: Nutzungskonzept
  fr: Concept d'utilisation
  it: Concetto d'uso
  en: Usage concept
definition:
  de: Nutzungskonzept mit priorisierten Nutzungsszenarien, prüfbaren Akzeptanzkriterien und Betriebsannahmen. Verbindliche Grundlage für Testplanung, Raumprogramm sowie Abnahme von Planung und Bau.
  fr: Concept d'utilisation avec scénarios d'utilisation priorisés, critères de réception vérifiables et hypothèses d'exploitation. Base contraignante pour l'étude test, le programme des locaux ainsi que la réception des études et de la réalisation.
  it: Concetto d'uso con scenari d'uso priorizzati, criteri di accettazione verificabili e ipotesi operative. Base vincolante per lo studio di fattibilità, il programma dei locali nonché il collaudo di progettazione e costruzione.
  en: Usage concept with prioritized usage scenarios, verifiable acceptance criteria, and operational assumptions. Binding basis for test planning, the room programme, and acceptance of design and construction.
description:
  de: |-
    - Nutzerrollen bzw. Nutzergruppen
    - Nutzungsszenarien aus Sicht der Nutzenden, mit gewählter Variante und Menge
    - Prüfbare Akzeptanzkriterien je Nutzungsszenario
    - Priorisierung der Nutzungsszenarien
    - Betriebsabläufe und erforderliche Funktionsbeziehungen bzw. Trennungen
    - Version und Freigabestand
  fr: |-
    - Rôles ou groupes d'usagers
    - Scénarios d'utilisation du point de vue des usagers, avec la variante choisie et la quantité
    - Critères de réception vérifiables par scénario d'utilisation
    - Priorisation des scénarios d'utilisation
    - Processus d'exploitation et relations ou séparations fonctionnelles requises
    - Version et état de validation
  it: |-
    - Ruoli o gruppi di utenti
    - Scenari d'uso dal punto di vista degli utenti, con la variante scelta e la quantità
    - Criteri di accettazione verificabili per ogni scenario d'uso
    - Prioritizzazione degli scenari d'uso
    - Processi operativi e relazioni o separazioni funzionali necessarie
    - Versione e stato di approvazione
  en: |-
    - User roles or user groups
    - Usage scenarios from the users' point of view, with the chosen variant and quantity
    - Verifiable acceptance criteria per usage scenario
    - Prioritization of the usage scenarios
    - Operational processes and required functional relationships or separations
    - Version and approval status
file_name:
  de: '{Projektnummer}_PRO-NZK_{Freitext}.{ext}'
  fr: '{NumeroProjet}_PRO-NZK_{Libre}.{ext}'
  it: '{NumeroProgetto}_PRO-NZK_{Libero}.{ext}'
  en: '{ProjectNumber}_PRO-NZK_{FreeText}.{ext}'
status: active
domain: pragmaticbim:domain/architecture
scheduled_milestones:
  - "11:M"
  - "21:M"
comment: >-
  Nutzungsszenarien entsprechen den User Stories aus dem Software-Engineering
  («Als X brauche ich Y, um Z zu machen») mit Akzeptanzkriterien. Dient als Abnahmegrundlage für Planung und Bau,
  nicht als Raumliste – diese bleibt im Raumprogramm.
